<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen 1 Pokémon Cry Synthesizer (Web Audio API)</title>
    <style>
        :root {
            --gb-darkest: #0f380f;
            --gb-dark: #306230;
            --gb-light: #8bac0f;
            --gb-lightest: #9bbc0f;
            --pokedex-red: #dc0a2d;
            --pokedex-dark-red: #8b0000;
            --pokedex-accent: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #1a1a1a;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pokedex {
            background-color: var(--pokedex-red);
            border: 4px solid var(--pokedex-dark-red);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 3px solid var(--pokedex-dark-red);
            padding-bottom: 15px;
        }

        .blue-lens {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #00d2ff, #004080);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }

        .leds {
            display: flex;
            gap: 8px;
        }

        .led {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid #000;
        }

        .led.red { background-color: #ff0000; }
        .led.yellow { background-color: #ffff00; }
        .led.green { background-color: #00ff00; }

        .main-screen-container {
            background-color: #dedede;
            border-radius: 10px 10px 10px 40px;
            padding: 20px;
            border: 3px solid #999;
        }

        .lcd-screen {
            background-color: var(--gb-lightest);
            border: 4px solid var(--gb-darkest);
            border-radius: 5px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .visualizer-container {
            height: 80px;
            background-color: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--gb-darkest);
            background-color: var(--gb-light);
            color: var(--gb-darkest);
            font-weight: bold;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--gb-dark);
        }

        .btn {
            background-color: var(--gb-dark);
            color: var(--gb-lightest);
            border: 2px solid var(--gb-darkest);
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--gb-darkest);
            color: var(--gb-light);
        }

        .grid-container {
            height: 350px;
            overflow-y: auto;
            border: 2px solid var(--gb-darkest);
            background-color: var(--gb-light);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        /* Custom Scrollbar for GB screen */
        .grid-container::-webkit-scrollbar {
            width: 8px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: var(--gb-light);
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: var(--gb-dark);
        }

        .pokemon-card {
            background-color: var(--gb-lightest);
            border: 2px solid var(--gb-darkest);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .pokemon-card:hover {
            background-color: var(--gb-dark);
            color: var(--gb-lightest);
        }

        .pokemon-card.active {
            outline: 3px solid var(--gb-darkest);
            background-color: var(--gb-dark);
            color: var(--gb-lightest);
        }

        .pokemon-number {
            font-size: 10px;
            font-weight: bold;
        }

        .pokemon-name {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .synth-params {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            background-color: var(--gb-light);
            padding: 10px;
            border: 2px solid var(--gb-darkest);
            font-size: 12px;
            color: var(--gb-darkest);
            font-weight: bold;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .param-group label {
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            accent-color: var(--gb-darkest);
        }
    </style>
</head>
<body>

<div class="pokedex">
    <div class="header">
        <div class="blue-lens"></div>
        <div class="leds">
            <div class="led red"></div>
            <div class="led yellow"></div>
            <div class="led green"></div>
        </div>
    </div>

    <div class="main-screen-container">
        <div class="lcd-screen">
            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="controls-row">
                <input type="text" id="search" placeholder="SEARCH POKÉMON..." />
                <button class="btn" id="play-btn">PLAY CRY</button>
                <button class="btn" id="random-btn">RANDOM</button>
            </div>

            <div class="synth-params">
                <div class="param-group">
                    <label>PITCH OFFSET <span id="pitch-val">0</span></label>
                    <input type="range" id="pitch-offset" min="-12" max="12" value="0" step="1">
                </div>
                <div class="param-group">
                    <label>SPEED SCALER <span id="speed-val">1.0x</span></label>
                    <input type="range" id="speed-scale" min="0.5" max="2.0" value="1.0" step="0.1">
                </div>
                <div class="param-group">
                    <label>VIBRATO DEPTH <span id="vib-val">1.0x</span></label>
                    <input type="range" id="vibrato-scale" min="0" max="2.0" value="1.0" step="0.1">
                </div>
            </div>

            <div class="grid-container" id="pokemon-grid"></div>
        </div>
    </div>
</div>
