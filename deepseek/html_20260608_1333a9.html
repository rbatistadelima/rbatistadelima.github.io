<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ Kaori TTS — Modo Síncrono (Zero Intervalo)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #fff;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .status-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .status-badge {
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .dot.green { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
        .dot.yellow { background: #eab308; animation: pulse 1s infinite; }
        .dot.gray { background: #64748b; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #2a2a35;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #ec4899);
            transition: width 0.3s;
        }
        
        .phrase-container {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .phrase-item {
            background: #121214;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #64748b;
            transition: all 0.3s;
        }
        
        .phrase-item.active {
            border-left-color: #a78bfa;
            background: rgba(139,92,246,0.1);
        }
        
        .phrase-item.ready {
            border-left-color: #22c55e;
        }
        
        .phrase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .phrase-name {
            font-weight: bold;
            font-size: 1rem;
        }
        
        .phrase-status {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
        }
        
        .phrase-status.loaded { background: #22c55e; color: #fff; }
        .phrase-status.loading { background: #eab308; color: #fff; }
        .phrase-status.pending { background: #64748b; color: #fff; }
        .phrase-status.playing { background: #a78bfa; color: #fff; animation: pulse 1s infinite; }
        
        .phrase-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .input-group input {
            flex: 1;
            background: #0f0f12;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.8rem;
        }
        
        button {
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }
        
        .btn-play {
            padding: 12px 28px;
            font-size: 1rem;
            margin-right: 12px;
        }
        
        .btn-cancel {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .karaoke {
            background: #121214;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            border-left: 3px solid #a78bfa;
            min-height: 70px;
            text-align: center;
        }
        
        .timer-display {
            font-family: monospace;
            font-size: 0.8rem;
            color: #22c55e;
            margin-top: 8px;
        }
        
        .sync-status {
            background: #121214;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 20px;">🎙️ Kaori TTS - Modo Síncrono</h2>
            
            <div class="status-row">
                <div class="status-badge">
                    <div class="dot" id="modelDot"></div>
                    <span id="modelText">Carregando...</span>
                </div>
                <div class="status-badge">
                    <div class="dot" id="syncDot"></div>
                    <span>Modo Síncrono</span>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="font-size: 0.7rem; text-align: center; margin-top: 8px;" id="progressMsg">Inicializando...</div>
        </div>
        
        <div class="phrase-container">
            <div class="phrase-item" id="phrase1">
                <div class="phrase-header">
                    <span class="phrase-name">🎙️ Primeira Frase</span>
                    <span class="phrase-status" id="status1">pending</span>
                </div>
                <div class="phrase-text" id="text1">Carregando...</div>
                <div class="input-group">
                    <input type="text" id="input1" placeholder="Digite a primeira frase...">
                </div>
            </div>
            
            <div class="phrase-item" id="phrase2">
                <div class="phrase-header">
                    <span class="phrase-name">🎙️ Segunda Frase</span>
                    <span class="phrase-status" id="status2">pending</span>
                </div>
                <div class="phrase-text" id="text2">Carregando...</div>
                <div class="input-group">
                    <input type="text" id="input2" placeholder="Digite a segunda frase...">
                </div>
            </div>
        </div>
        
        <div class="karaoke" id="karaoke">
            💬 Aguardando...
        </div>
        
        <div style="display: flex; gap: 12px; justify-content: center;">
            <button id="playBtn" class="btn-play" disabled>▶ TOCAR (Síncrono)</button>
            <button id="cancelBtn" class="btn-cancel" disabled>⏹️ CANCELAR</button>
        </div>
        
        <div class="sync-status" id="syncStatus">
            ✅ Aguardando modelo carregar...
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.js"
            }
        }
    </script>

    <script type="module">
        import { pipeline } from '@huggingface/transformers';
        
        // ============================================
        // KAORI MODO SÍNCRONO - TOCA QUANDO AMBAS PRONTAS
        // ============================================
        
        class KaoriSync {
            constructor() {
                this.pipeline = null;
                this.ready = false;
                this.ctx = null;
                this.isPlaying = false;
                
                // Frases
                this.phrase1 = "Olá! Eu sou a Kaori. Esta é a primeira frase do teste síncrono.";
                this.phrase2 = "Esta é a segunda frase. Ela foi pré-carregada e vai tocar imediatamente após a primeira, sem nenhum intervalo!";
                
                // Áudios pré-carregados
                this.audio1 = null;
                this.audio2 = null;
                
                this.init();
            }
            
            async init() {
                await this.loadModel();
                this.setupAudio();
                this.render();
                this.attachEvents();
                
                // Ativa AudioContext no primeiro clique
                document.body.addEventListener('click', async () => {
                    if (this.ctx && this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                        console.log('🎵 AudioContext ativado');
                    }
                }, { once: true });
            }
            
            async loadModel() {
                const modelDot = document.getElementById('modelDot');
                const progressFill = document.getElementById('progressFill');
                const progressMsg = document.getElementById('progressMsg');
                
                try {
                    modelDot.className = 'dot yellow';
                    progressMsg.innerHTML = 'Baixando modelo Kaori (300MB)...';
                    
                    this.pipeline = await pipeline(
                        'text-to-speech',
                        'Xenova/mms-tts-por',
                        {
                            progress_callback: (p) => {
                                const percent = Math.round(p.progress * 100);
                                progressFill.style.width = `${percent}%`;
                                if (p.status === 'downloading') {
                                    progressMsg.innerHTML = `Baixando: ${percent}%`;
                                } else if (p.status === 'loading') {
                                    progressMsg.innerHTML = `Carregando: ${percent}%`;
                                }
                            }
                        }
                    );
                    
                    progressMsg.innerHTML = 'Aquecendo modelo...';
                    await this.pipeline("Aquecimento.");
                    
                    this.ready = true;
                    modelDot.className = 'dot green';
                    progressMsg.innerHTML = '✅ Kaori pronta! Modo síncrono ativado.';
                    progressFill.style.width = '100%';
                    
                    document.getElementById('playBtn').disabled = false;
                    document.getElementById('cancelBtn').disabled = false;
                    document.getElementById('syncStatus').innerHTML = '✅ Modelo pronto. Clique em "Tocar" para começar.';
                    
                    console.log('✅ Kaori pronto');
                    
                } catch (err) {
                    console.error(err);
                    modelDot.className = 'dot gray';
                    progressMsg.innerHTML = '❌ Erro ao carregar. Recarregue a página.';
                }
            }
            
            setupAudio() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            render() {
                document.getElementById('input1').value = this.phrase1;
                document.getElementById('input2').value = this.phrase2;
                document.getElementById('text1').innerHTML = this.phrase1;
                document.getElementById('text2').innerHTML = this.phrase2;
            }
            
            attachEvents() {
                // Salva mudanças nas frases
                document.getElementById('input1').addEventListener('input', (e) => {
                    this.phrase1 = e.target.value;
                    document.getElementById('text1').innerHTML = this.phrase1;
                    this.audio1 = null; // Limpa cache
                });
                
                document.getElementById('input2').addEventListener('input', (e) => {
                    this.phrase2 = e.target.value;
                    document.getElementById('text2').innerHTML = this.phrase2;
                    this.audio2 = null; // Limpa cache
                });
                
                document.getElementById('playBtn').onclick = () => this.playSync();
                document.getElementById('cancelBtn').onclick = () => this.cancel();
            }
            
            async preloadBoth() {
                const syncDot = document.getElementById('syncDot');
                const syncStatus = document.getElementById('syncStatus');
                
                syncDot.className = 'dot yellow';
                syncStatus.innerHTML = '⏳ Pré-carregando AMBAS as frases... Aguarde...';
                
                // Atualiza status UI
                this.updatePhraseStatus(1, 'loading');
                this.updatePhraseStatus(2, 'loading');
                
                const start = performance.now();
                
                // PRÉ-CARREGA AS DUAS FRASES SIMULTANEAMENTE
                const [audioData1, audioData2] = await Promise.all([
                    this.generateAudio(this.phrase1),
                    this.generateAudio(this.phrase2)
                ]);
                
                this.audio1 = audioData1;
                this.audio2 = audioData2;
                
                const elapsed = ((performance.now() - start) / 1000).toFixed(1);
                
                syncDot.className = 'dot green';
                syncStatus.innerHTML = `✅ Ambas prontas em ${elapsed}s! Tocando agora sem intervalo...`;
                
                this.updatePhraseStatus(1, 'loaded');
                this.updatePhraseStatus(2, 'loaded');
                
                console.log(`✅ Ambas pré-carregadas em ${elapsed}s`);
            }
            
            async generateAudio(text) {
                if (!this.ready || !text) return null;
                
                console.log(`🎤 Gerando: "${text.substring(0, 40)}..."`);
                const start = performance.now();
                
                const output = await this.pipeline(text);
                
                const time = (performance.now() - start).toFixed(0);
                console.log(`✅ Gerado em ${time}ms`);
                
                return output;
            }
            
            async playAudio(audioData, phraseNum) {
                if (!audioData) return;
                
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume();
                }
                
                const buffer = this.ctx.createBuffer(1, audioData.audio.length, audioData.sampling_rate);
                buffer.copyToChannel(audioData.audio, 0);
                
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                source.start();
                
                this.updatePhraseStatus(phraseNum, 'playing');
                
                return new Promise((resolve) => {
                    source.onended = () => {
                        this.updatePhraseStatus(phraseNum, 'loaded');
                        resolve();
                    };
                });
            }
            
            async playSync() {
                if (!this.ready || this.isPlaying) return;
                
                this.isPlaying = true;
                const playBtn = document.getElementById('playBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const karaoke = document.getElementById('karaoke');
                const syncStatus = document.getElementById('syncStatus');
                
                playBtn.disabled = true;
                playBtn.textContent = '⏳ PRÉ-CARREGANDO...';
                cancelBtn.disabled = false;
                
                // PASSO 1: PRÉ-CARREGA AS DUAS FRASES
                await this.preloadBoth();
                
                if (!this.audio1 || !this.audio2) {
                    syncStatus.innerHTML = '❌ Erro ao pré-carregar as frases.';
                    playBtn.disabled = false;
                    playBtn.textContent = '▶ TOCAR (Síncrono)';
                    this.isPlaying = false;
                    return;
                }
                
                playBtn.textContent = '🎵 TOCANDO...';
                syncStatus.innerHTML = '🎵 Executando sequência síncrona...';
                
                const startTime = performance.now();
                
                // PASSO 2: TOCA PRIMEIRA FRASE
                karaoke.innerHTML = `<b>📢 Primeira Frase:</b><br>${this.phrase1}`;
                await this.playAudio(this.audio1, 1);
                
                // ZERO INTERVALO - SEGUNDA JÁ ESTÁ PRONTA!
                const gap = (performance.now() - startTime) - (this.audio1.audio.length / this.audio1.sampling_rate * 1000);
                console.log(`📊 Gap entre frases: ${gap.toFixed(0)}ms`);
                
                // PASSO 3: TOCA SEGUNDA FRASE IMEDIATAMENTE
                karaoke.innerHTML = `<b>📢 Segunda Frase:</b><br>${this.phrase2}`;
                await this.playAudio(this.audio2, 2);
                
                const totalTime = ((performance.now() - startTime) / 1000).toFixed(1);
                
                // Finaliza
                karaoke.innerHTML = `✅ <b>COMPLETO!</b><br>Duas frases executadas em ${totalTime}s sem intervalo!`;
                syncStatus.innerHTML = `✅ Finalizado em ${totalTime}s! Gap entre frases: ZERO!`;
                
                playBtn.disabled = false;
                playBtn.textContent = '▶ TOCAR (Síncrono)';
                cancelBtn.disabled = true;
                this.isPlaying = false;
                
                // Reseta status
                this.updatePhraseStatus(1, 'loaded');
                this.updatePhraseStatus(2, 'loaded');
            }
            
            updatePhraseStatus(phraseNum, status) {
                const statusEl = document.getElementById(`status${phraseNum}`);
                const phraseEl = document.getElementById(`phrase${phraseNum}`);
                
                statusEl.className = `phrase-status ${status}`;
                
                switch(status) {
                    case 'loading':
                        statusEl.innerHTML = '⏳ Gerando...';
                        phraseEl.style.borderLeftColor = '#eab308';
                        break;
                    case 'loaded':
                        statusEl.innerHTML = '✅ Pronta';
                        phraseEl.style.borderLeftColor = '#22c55e';
                        break;
                    case 'playing':
                        statusEl.innerHTML = '🎵 Tocando';
                        phraseEl.style.borderLeftColor = '#a78bfa';
                        break;
                    default:
                        statusEl.innerHTML = '⏸ Aguardando';
                        phraseEl.style.borderLeftColor = '#64748b';
                }
            }
            
            cancel() {
                this.isPlaying = false;
                this.updatePhraseStatus(1, 'loaded');
                this.updatePhraseStatus(2, 'loaded');
                
                document.getElementById('karaoke').innerHTML = '⏸️ Cancelado pelo usuário';
                document.getElementById('syncStatus').innerHTML = '⏸️ Execução cancelada.';
                
                const playBtn = document.getElementById('playBtn');
                playBtn.disabled = false;
                playBtn.textContent = '▶ TOCAR (Síncrono)';
                
                console.log('Cancelado');
            }
        }
        
        // Inicia
        window.app = new KaoriSync();
    </script>
</body>
</html>
