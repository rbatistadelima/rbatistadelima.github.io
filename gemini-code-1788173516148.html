<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beck - Sound & Vision 360 Player (12 Simultaneous Videos)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
            cursor: default;
        }
        body.playing {
            cursor: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            cursor: default;
        }
        #drop-zone.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .drop-box {
            border: 3px dashed #fff;
            padding: 40px 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            max-width: 600px;
        }
        button {
            background: #fff;
            border: none;
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #ccc;
        }
        .file-status {
            color: #aaa;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="drop-zone">
        <div class="drop-box">
            <h1>Drop 12 Videos & 1 Audio Track</h1>
            <p>Select or drag and drop up to 12 video files (.mp4) and 1 master audio file (.mp3/.wav) together.</p>
            <input type="file" id="file-input" accept="video/*,audio/*" multiple style="display: none;">
            <button id="browse-btn">Browse Files</button>
            <div class="file-status" id="drop-status">Waiting for files (0/12 videos loaded)...</div>
        </div>
    </div>

    <div id="webgl-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let videos = [];
        let videoTextures = [];
        let audio;
        let audioCtx, audioSourceNode, leftGainNode, rightGainNode;
        let lon = 0, lat = 0;

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Create a hidden canvas element to dynamically blend all 12 videos into a single 4x3 mosaic texture grid
            // This maintains high performance by only requiring 1 WebGL texture update loop instead of 12 distinct texture bindings.
            const canvas = document.createElement('canvas');
            canvas.width = 3840; // 4 columns * 960px
            canvas.height = 2160; // 3 rows * 720px
            const ctx = canvas.getContext('2d');

            const compositeTexture = new THREE.CanvasTexture(canvas);
            compositeTexture.minFilter = THREE.LinearFilter;
            compositeTexture.magFilter = THREE.LinearFilter;
            compositeTexture.generateMipmaps = false;

            // Map the mosaic texture to a custom shader material that slices the UV map into 12 sections across the sphere
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const material = new THREE.MeshBasicMaterial({ map: compositeTexture });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Initialize 12 video wrapper elements
            for (let i = 0; i < 12; i++) {
                const v = document.createElement('video');
                v.crossOrigin = 'anonymous';
                v.loop = true;
                v.muted = true;
                v.playsInline = true;
                videos.push(v);
            }

            audio = document.createElement('audio');
            audio.crossOrigin = 'anonymous';
            audio.loop = true;

            // Update canvas loop for rendering all active video frames simultaneously
            function updateVideoGrid() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const colWidth = canvas.width / 4;
                const rowHeight = canvas.height / 3;

                for (let i = 0; i < 12; i++) {
                    if (videos[i].readyState >= videos[i].HAVE_CURRENT_DATA) {
                        const col = i % 4;
                        const row = Math.floor(i / 4);
                        ctx.drawImage(videos[i], col * colWidth, row * rowHeight, colWidth, rowHeight);
                    }
                }
                compositeTexture.needsUpdate = true;
                requestAnimationFrame(updateVideoGrid);
            }
            requestAnimationFrame(updateVideoGrid);

            // Pointer Lock & Mouse Look Controls
            renderer.domElement.addEventListener('click', () => {
                if (!document.getElementById('drop-zone').classList.contains('hidden')) return;
                renderer.domElement.requestPointerLock();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === renderer.domElement) {
                    const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;
                    lon += movementX * 0.15;
                    lat -= movementY * 0.15;
                }
            });

            // File Loading and Multi-Drop Handlers
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const browseBtn = document.getElementById('browse-btn');
            const dropStatus = document.getElementById('drop-status');

            browseBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });

            function setupCrossfadeAudio() {
                if (audioCtx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                audioSourceNode = audioCtx.createMediaElementSource(audio);
                const splitter = audioCtx.createChannelSplitter(2);
                const merger = audioCtx.createChannelMerger(2);
                
                leftGainNode = audioCtx.createGain();
                rightGainNode = audioCtx.createGain();

                leftGainNode.gain.value = 0.7;
                rightGainNode.gain.value = 0.7;

                audioSourceNode.connect(splitter);
                splitter.connect(leftGainNode, 0);
                leftGainNode.connect(merger, 0, 0);
                splitter.connect(rightGainNode, 1);
                rightGainNode.connect(merger, 0, 1);
                merger.connect(audioCtx.destination);
            }

            function handleFiles(files) {
                let videoCount = 0;

                for (let file of files) {
                    const fileURL = URL.createObjectURL(file);

                    if (file.type.startsWith('video/') && videoCount < 12) {
                        videos[videoCount].src = fileURL;
                        videos[videoCount].load();
                        videoCount++;
                    } else if (file.type.startsWith('audio/')) {
                        audio.src = fileURL;
                        audio.load();
                    }
                }

                dropStatus.textContent = `Loaded ${videoCount}/12 videos. Starting simultaneous playback...`;

                if (audio.src) setupCrossfadeAudio();

                // Play all loaded video streams simultaneously with master sync alignment
                const playPromises = videos.map(v => v.src ? v.play() : Promise.resolve());
                if (audio.src) playPromises.push(audio.play());

                Promise.all(playPromises).then(() => {
                    dropZone.classList.add('hidden');
                    document.body.classList.add('playing');
                    renderer.domElement.requestPointerLock();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                }).catch(err => {
                    console.error("Autoplay constraint or stream error:", err);
                    dropZone.classList.add('hidden');
                    document.body.classList.add('playing');
                });
            }

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            lat = Math.max(-85, Math.min(85, lat));
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.x = 500 * Math.sin(phi) * Math.cos(theta);
            target.y = 500 * Math.cos(phi);
            target.z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(target);

            // Smooth crossfading spatial audio movement based on camera view position
            if (leftGainNode && rightGainNode && audioCtx) {
                const rad = THREE.MathUtils.degToRad(lon);
                const leftVol = Math.max(0.15, 0.5 * (1 + Math.cos(rad)));
                const rightVol = Math.max(0.15, 0.5 * (1 - Math.cos(rad)));

                try {
                    leftGainNode.gain.setTargetAtTime(leftVol, audioCtx.currentTime, 0.03);
                    rightGainNode.gain.setTargetAtTime(rightVol, audioCtx.currentTime, 0.03);
                } catch (e) {
                    leftGainNode.gain.value = leftVol;
                    rightGainNode.gain.value = rightVol;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
