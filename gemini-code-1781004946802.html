<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo Visual de Stories - Gramore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; /* Mantém a tela travada sem scrolldown */
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen flex flex-col justify-between p-4 gap-4">

    <!-- Header Fixo -->
    <header class="bg-gray-900 rounded-2xl px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 border border-gray-800 shrink-0 shadow-xl">
        <div>
            <h1 class="text-lg font-black text-white tracking-wide uppercase flex items-center gap-2">
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                Fluxo de Postagens (Gráfico de Linha)
            </h1>
            <p class="text-xs text-gray-400 mt-0.5">Tempo Vertical (De cima para baixo) • Curva de Impacto Horizontal</p>
        </div>
        
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <select id="patternSelect" class="bg-gray-950 border border-gray-700 text-emerald-400 font-bold text-xs rounded-xl focus:ring-2 focus:ring-emerald-500 p-3 cursor-pointer transition-all w-full sm:w-72 shadow-inner">
                <option value="abertura">Padrão: Abertura Rápida (Foco Início/Sinal)</option>
                <option value="comercial">Padrão: Comercial (Picos de Venda)</option>
                <option value="continuo">Padrão: Contínuo (Linear de 1h em 1h)</option>
            </select>
        </div>
    </header>

    <!-- Main Workspace com o Gráfico de Linha Invertido -->
    <main class="flex-grow bg-gray-900 rounded-2xl border border-gray-800 p-6 flex flex-col justify-center relative shadow-2xl overflow-hidden">
        
        <!-- Legenda de Mídias Customizada -->
        <div class="absolute top-4 right-6 flex gap-4 text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-emerald-500 rounded-full"></span> Linha de Cronograma</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-gray-700 rounded-sm"></span> Passe o mouse nos pontos para ver o roteiro</div>
        </div>

        <!-- Container do Canvas -->
        <div class="w-full h-full relative min-h-0">
            <canvas id="fullscreenLineChart"></canvas>
        </div>
    </main>

    <!-- Footer Fixo -->
    <footer class="flex justify-between items-center text-[10px] text-gray-600 px-2 shrink-0 font-medium">
        <div>Estande #A2-003 • Rua A/2 • Distrito Anhembi</div>
        <div class="tracking-wider uppercase text-emerald-600 font-bold">Gramore • Cultive o que te faz bem</div>
    </footer>

    <!-- Lógica do Gráfico de Linha com Eixo Invertido -->
    <script>
        const ctx = document.getElementById('fullscreenLineChart').getContext('2d');
        let chartInstance;

        // Base de dados das estratégias
        const datasets = {
            abertura: {
                labels: ["20:00 - Fim do Dia", "19:30 - Depoimento", "18:45 - Equipe", "18:00 - Consultores", "16:45 - Plataforma", "15:30 - Catálogo", "14:15 - Estande", "13:00 - Produto", "10:30 - Convite Diretores", "10:15 - A Caminho", "10:00 - Começo"],
                impact: [3, 7, 4, 8, 9, 5, 4, 8, 9, 9, 5], // Posição horizontal na curva
                tips: [
                    "Vídeo: Luzes do estande baixando e equipe acenando tchau. (Formato: Vídeo/Captura)",
                    "Vídeo 15s: Entrevista rápida no celular com cliente que comprou. (Formato: Vídeo/Captura)",
                    "Foto: Time Gramore unido e sorrindo no estande. (Formato: Foto/Arte)",
                    "Bastidores: Mesas de negociação cheias com clientes. (Formato: Vídeo/Captura)",
                    "Tela Gravada: Mão mexendo no aplicativo da Gramore na feira. (Formato: Tela Digital)",
                    "Vídeo Curto: Consultor folheando o catálogo físico/tablet. (Formato: Vídeo/Captura)",
                    "Foto/Take: Foco nos laudos técnicos e controle de lote sobre a mesa. (Formato: Foto/Arte)",
                    "Vídeo Macro: Close-up estético com foco nas texturas de grãos e temperos. (Formato: Vídeo/Captura)",
                    "Vídeo: Diretor (Francisco ou Eric) falando direto do estande. (Formato: Vídeo/Captura)",
                    "Vídeo POV: Caminhada rápida da entrada da feira até a Rua A/2. (Formato: Vídeo/Captura)",
                    "Foto ou Arte: Equipe reunida com o estande limpo pronto para abrir. (Formato: Foto/Arte)"
                ]
            },
            comercial: {
                labels: ["20:00 - Fim do Dia", "19:30 - Depoimento", "19:00 - Equipe", "18:15 - Consultores", "17:30 - Plataforma", "17:00 - Catálogo", "14:30 - Estande", "13:15 - Produto", "12:30 - Convite Diretores", "12:00 - A Caminho", "10:00 - Começo"],
                impact: [3, 6, 4, 8, 8, 6, 4, 8, 9, 8, 5],
                tips: [
                    "Foto: Métricas simbólicas do sucesso e metas batidas no dia. (Formato: Foto/Arte)",
                    "Vídeo: Cliente segurando sacola institucional e elogiando o mix. (Formato: Vídeo/Captura)",
                    "Foto: Integração corporativa do time no balcão principal. (Formato: Foto/Arte)",
                    "Take Dinâmico: Consultores sorrindo e apertando mãos de parceiros. (Formato: Vídeo/Captura)",
                    "Screenshot: Demonstração rápida da aba 'Meus Pedidos' do app. (Formato: Tela Digital)",
                    "Vídeo: Mostrando a espessura física e variedade do catálogo. (Formato: Vídeo/Captura)",
                    "Foto: Selos de qualidade impressos e banners de destaque. (Formato: Foto/Arte)",
                    "Vídeo Estético: Detalhe do derramamento de sementes e grãos. (Formato: Vídeo/Captura)",
                    "Vídeo: Francisco Bilac detalhando soluções para novos negócios. (Formato: Vídeo/Captura)",
                    "Vídeo Acelerado: Caminhada rápida cortando os corredores principais. (Formato: Vídeo/Captura)",
                    "Arte: Contagem regressiva finalizada postada logo cedo. (Formato: Foto/Arte)"
                ]
            },
            continuo: {
                labels: ["20:00 - Fim do Dia", "19:00 - Depoimento", "18:00 - Equipe", "17:00 - Consultores", "16:00 - Plataforma", "15:00 - Catálogo", "14:00 - Estande", "13:00 - Produto", "12:00 - Convite Diretores", "11:00 - A Caminho", "10:00 - Começo"],
                impact: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6], // Linha reta vertical
                tips: [
                    "Foto: Equipe dando tchau e organizando o espaço para o dia seguinte. (Formato: Foto/Arte)",
                    "Vídeo: Cliente relatando agilidade e facilidade nas entregas diárias. (Formato: Vídeo/Captura)",
                    "Vídeo Grupo: Cumprimento ou grito de guerra motivacional do time. (Formato: Vídeo/Captura)",
                    "Foto: Consultor mostrando amostras físicas de temperos ao cliente. (Formato: Foto/Arte)",
                    "Vídeo Curto: Navegação rápida no painel digital de faturamento do cliente. (Formato: Vídeo/Captura)",
                    "Foto: Mix de temperos coloridos organizados em displays limpos. (Formato: Foto/Arte)",
                    "Vídeo: Foco macro no selo de rastreabilidade impresso na embalagem. (Formato: Vídeo/Captura)",
                    "Foto: Visão limpa e panorâmica das estantes de exposição. (Formato: Foto/Arte)",
                    "Vídeo Diretor: Mensagem focada em quem busca abrir lojas de naturais. (Formato: Vídeo/Captura)",
                    "Vídeo Corredor: Enquadramento tático da esquina da rua A/2. (Formato: Vídeo/Captura)",
                    "Foto: Estande perfeitamente arrumado e brilhando antes do público entrar. (Formato: Foto/Arte)"
                ]
            }
        };

        function updateChart(pattern) {
            const selected = datasets[pattern];

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: selected.labels, // Eixo Y (Tempo Vertical)
                    datasets: [{
                        data: selected.impact, // Eixo X (Avanço Horizontal da Linha)
                        borderColor: '#10b981', // Verde Esmeralda vibrante
                        backgroundColor: 'rgba(16, 185, 129, 0.05)',
                        borderWidth: 4,
                        tension: 0.3, // Curva suave na linha
                        pointBackgroundColor: '#059669',
                        pointBorderColor: '#34d399',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        fill: true
                    }]
                },
                options: {
                    indexAxis: 'y', // Inversão crucial: Transforma o gráfico em vertical
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#111827',
                            titleColor: '#34d399',
                            bodyColor: '#e5e7eb',
                            titleFont: { size: 12, weight: 'bold' },
                            bodyFont: { size: 12 },
                            padding: 14,
                            cornerRadius: 12,
                            displayColors: false,
                            borderWidth: 1,
                            borderColor: '#374151',
                            callbacks: {
                                label: function(context) {
                                    return " Roteiro: " + selected.tips[context.dataIndex];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1f2937' },
                            ticks: { display: false }, // Esconde dados numéricos para manter visual limpo
                            min: 0,
                            max: 11
                        },
                        y: {
                            grid: { color: '#1f2937' },
                            ticks: {
                                color: '#f3f4f6',
                                font: { size: 11, weight: 'bold' }
                            }
                        }
                    }
                }
            });
        }

        // Event Listener do Dropdown
        document.getElementById('patternSelect').addEventListener('change', (e) => {
            updateChart(e.target.value);
        });

        // Inicialização do Painel
        updateChart('abertura');
    </script>
</body>
</html>
