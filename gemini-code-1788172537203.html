<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beck - Sound & Vision 360 Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .drop-box {
            border: 3px dashed #fff;
            padding: 40px 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: #fff;
            border: none;
            color: #000;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #ccc;
        }
        #file-info {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="drop-zone">
        <div class="drop-box">
            <h1>Drop your 360 Video Here</h1>
            <p>Drag and drop your MP4 file to begin playback</p>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
            <button id="browse-btn">Browse File</button>
        </div>
    </div>

    <div id="webgl-container"></div>

    <div id="ui-overlay">
        <button id="playPauseBtn">Play / Pause</button>
        <span id="file-info">No video loaded</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, video, videoTexture, controls;

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            video = document.createElement('video');
            video.crossOrigin = 'anonymous';
            video.loop = true;
            video.muted = false;
            video.playsInline = true;

            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.generateMipmaps = false;

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            const material = new THREE.MeshBasicMaterial({ map: videoTexture });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls setup
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = true;
            controls.enablePan = false;
            controls.rotateSpeed = -0.5;

            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const browseBtn = document.getElementById('browse-btn');
            const fileInfo = document.getElementById('file-info');
            const playPauseBtn = document.getElementById('playPauseBtn');

            browseBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            function handleFile(file) {
                if (!file.type.startsWith('video/')) {
                    alert('Please drop a valid video file.');
                    return;
                }

                const fileURL = URL.createObjectURL(file);
                video.src = fileURL;
                video.load();
                
                video.play().then(() => {
                    // Completely remove drop zone from layout flow & mouse interaction
                    dropZone.style.display = 'none';
                    playPauseBtn.textContent = "Pause";
                    fileInfo.textContent = file.name;
                }).catch(err => {
                    console.error("Playback error:", err);
                    dropZone.style.display = 'none';
                });
            }

            playPauseBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    playPauseBtn.textContent = "Pause";
                } else {
                    video.pause();
                    playPauseBtn.textContent = "Play";
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Keep controls active
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
