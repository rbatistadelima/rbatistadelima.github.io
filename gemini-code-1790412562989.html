<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Editor Pro</title>
    <!-- WaveSurfer.js for Audio Waveform -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #475569;
            --word-bg: #334155;
            --word-hover: #475569;
            --btn-secondary: #475569;
            --btn-secondary-hover: #64748b;
            --yellow-color: #fde047;
            --unmerge-color: #f43f5e;
            --unmerge-hover: #e11d48;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { flex-shrink: 0; }
        
        .toolbar {
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            gap: 8px;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        .toolbar::-webkit-scrollbar { display: none; }
        
        #waveform {
            width: 100%;
            height: 35px;
            min-height: 35px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        button, label.btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        button:hover, label.btn:hover { background-color: var(--accent-hover); }
        
        button.secondary, label.btn.secondary {
            background-color: var(--btn-secondary);
            color: var(--text-color);
        }
        button.secondary:hover, label.btn.secondary:hover { background-color: var(--btn-secondary-hover); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="file"] { display: none; }
        
        .input-group { display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 0.8rem; }
        input[type="number"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 6px;
            border-radius: 4px;
            width: 45px;
        }
        
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
        }
        
        .preview-container {
            width: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        #mediaPlayer {
            width: 100%;
            height: 180px;
            background: #000;
            object-fit: contain;
            outline: none;
        }
        #mediaPlayer::-webkit-media-controls {
            display: none !important;
        }
        
        #subtitleOverlay {
            width: 100%;
            min-height: 50px;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 15px;
            box-sizing: border-box;
            color: white;
            font-size: 1.25rem;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
            flex-direction: column;
        }
        
        .overlay-active-word {
            color: var(--yellow-color); 
        }

        #editor-container {
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #editor-container::-webkit-scrollbar { width: 6px; }
        #editor-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .subtitle-row {
            padding: 10px;
            display: grid;
            grid-template-columns: 35px 115px 1fr 85px 45px;
            gap: 10px;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: background 0.1s;
        }

        .subtitle-row.active-sub {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent-color);
        }

        .subtitle-row.drag-target-hover {
            background: rgba(56, 189, 248, 0.2);
            outline: 1px dashed var(--accent-color);
        }
        
        .sub-index { font-size: 0.8rem; color: #94a3b8; font-weight: bold; }
        
        .sub-time {
            font-size: 0.75rem; color: #cbd5e1; font-family: monospace;
            cursor: pointer; text-decoration: underline dotted;
            padding: 4px 6px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            text-align: center;
            border: 1px dashed var(--border-color);
        }
        .sub-time:hover { color: var(--accent-color); border-color: var(--accent-color); }
        
        .sub-time.drag-target-hover {
            background: rgba(253, 224, 71, 0.2);
            border: 1px dashed var(--yellow-color);
            color: var(--yellow-color);
        }
        
        .words-container {
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            min-height: 26px;
        }

        .sub-line-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }

        .word-chip {
            background-color: var(--word-bg); color: var(--text-color);
            padding: 3px 7px; border-radius: 4px; font-size: 0.95rem;
            cursor: grab; user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.1s, opacity 0.2s;
        }
        .word-chip:active { cursor: grabbing; }
        .word-chip:hover { background-color: var(--word-hover); border-color: var(--border-color); }
        .word-chip.dragging { opacity: 0.3; }

        .word-chip.drag-over-word {
            border-left: 2px solid var(--yellow-color);
        }

        .word-chip[contenteditable="true"] {
            background-color: var(--bg-color);
            border: 1px dashed var(--accent-color);
            outline: none;
            cursor: text;
            user-select: text;
        }

        .word-chip.active-word {
            color: var(--yellow-color);
            font-weight: 500;
        }

        .merge-btn {
            background: var(--btn-secondary);
            font-size: 0.75rem;
            padding: 4px 8px;
        }
        .merge-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .unmerge-btn {
            background: var(--unmerge-color);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 8px;
        }
        .unmerge-btn:hover {
            background: var(--unmerge-hover);
        }

        .char-count { font-size: 0.75rem; color: #94a3b8; text-align: right; font-weight: 500; }
        .hidden { display: none !important; }
        
        textarea.raw-editor {
            width: 100%; height: 100%; background: var(--bg-color);
            color: var(--text-color); border: none; padding: 12px;
            font-family: monospace; box-sizing: border-box; resize: none; outline: none;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="toolbar">
        <label class="btn secondary" for="audioFileInput" title="Load Media">📁 Media</label>
        <input type="file" id="audioFileInput" accept="audio/*,video/*">
        <button id="playPauseBtn" class="secondary" title="Play / Pause">▶</button>

        <div style="width: 1px; height: 20px; background: var(--border-color); flex-shrink: 0;"></div>

        <label class="btn" for="srtFileInput" title="Load SRT">Load SRT</label>
        <input type="file" id="srtFileInput" accept=".srt">
        <button id="undoBtn" class="secondary" disabled>Undo</button>
        <button id="redoBtn" class="secondary" disabled>Redo</button>
        
        <div style="width: 1px; height: 20px; background: var(--border-color); flex-shrink: 0;"></div>

        <div class="input-group">
            <label for="charLimitInput">Limit:</label>
            <input type="number" id="charLimitInput" value="16" min="5" max="250">
            <button id="autoMergeBtn" title="Auto-Merge Lines keeping breaks">Auto-Merge</button>
        </div>

        <div style="width: 1px; height: 20px; background: var(--border-color); flex-shrink: 0;"></div>

        <button id="toggleViewBtn" class="secondary">Switch to Raw SRT</button>

        <button id="exportBtn" style="margin-left: auto;">Export SRT</button>
    </div>
    
    <div id="waveform"></div>
</div>

<div class="workspace">
    <div id="interactiveView" style="display: flex; flex-direction: column; height: 100%;">
        
        <div class="preview-container">
            <video id="mediaPlayer"></video>
            <div id="subtitleOverlay"></div>
        </div>

        <div id="editor-container">
            <p style="color: #64748b; text-align: center; margin-top: 20px;">Load an SRT file to start editing.</p>
        </div>
    </div>

    <div id="rawView" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
        <textarea id="rawSrtArea" class="raw-editor" placeholder="Raw SRT content..."></textarea>
        <div style="padding: 8px; background: var(--card-bg); border-top: 1px solid var(--border-color);">
            <button id="updateFromRawBtn">Apply Raw Changes</button>
        </div>
    </div>
</div>

<script>
    let subtitles = [];
    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 50;
    let lastActiveIndex = -1;
    let draggedInfo = null;

    const mediaPlayer = document.getElementById('mediaPlayer');
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        media: mediaPlayer, 
        waveColor: '#38bdf8',
        progressColor: '#0ea5e9',
        cursorColor: '#e2e8f0',
        height: 35,
        normalize: true,
        barWidth: 2,
        barRadius: 2
    });

    document.getElementById('audioFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        mediaPlayer.src = url;
        wavesurfer.load(url);
    });

    const playPauseBtn = document.getElementById('playPauseBtn');
    playPauseBtn.addEventListener('click', () => {
        if (mediaPlayer.paused) {
            mediaPlayer.play();
        } else {
            mediaPlayer.pause();
        }
    });

    mediaPlayer.addEventListener('play', () => { 
        playPauseBtn.innerText = '⏸'; 
        startSyncLoop();
    });
    mediaPlayer.addEventListener('pause', () => { playPauseBtn.innerText = '▶'; });
    mediaPlayer.addEventListener('ended', () => { playPauseBtn.innerText = '▶'; });
    mediaPlayer.addEventListener('seeked', () => { updateSubtitlesState(mediaPlayer.currentTime * 1000); });

    function saveState() {
        undoStack.push(JSON.parse(JSON.stringify(subtitles)));
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
    }

    function updateHistoryButtons() {
        document.getElementById('undoBtn').disabled = undoStack.length === 0;
        document.getElementById('redoBtn').disabled = redoStack.length === 0;
    }

    function timeToMs(timeStr) {
        if (!timeStr) return 0;
        const [h, m, sMs] = timeStr.trim().split(':');
        const [s, ms] = sMs.split(',');
        return parseInt(h) * 3600000 + parseInt(m) * 60000 + parseInt(s) * 1000 + parseInt(ms);
    }

    function msToTime(ms) {
        const pad = (n, z = 2) => String(n).padStart(z, '0');
        const h = Math.floor(ms / 3600000);
        ms %= 3600000;
        const m = Math.floor(ms / 60000);
        ms %= 60000;
        const s = Math.floor(ms / 1000);
        const mill = ms % 1000;
        return `\({pad(h)}:\){pad(m)}:\({pad(s)},\){pad(mill, 3)}`;
    }

    function parseSRT(text) {
        const blocks = text.trim().replace(/\r\n/g, '\n').split(/\n\s*\n/);
        const parsed = [];
        for (let block of blocks) {
            const lines = block.split('\n');
            if (lines.length >= 3) {
                const index = parseInt(lines[0].trim());
                const timeMatch = lines[1].match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
                if (!timeMatch) continue;

                const startMs = timeToMs(timeMatch[1]);
                const endMs = timeToMs(timeMatch[2]);
                
                const textLines = lines.slice(2);
                let allTokens = [];
                
                textLines.forEach((lineText, lineIdx) => {
                    const wordsInLine = lineText.trim().split(/\s+/).filter(w => w.length > 0);
                    wordsInLine.forEach(w => {
                        allTokens.push({ text: w, isBreak: false });
                    });
                    if (lineIdx < textLines.length - 1 && wordsInLine.length > 0) {
                        allTokens.push({ text: '\n', isBreak: true });
                    }
                });

                const totalWordsCount = allTokens.filter(t => !t.isBreak).length;
                const timePerWord = Math.max(endMs - startMs, 100) / Math.max(totalWordsCount, 1);
                
                let wordCounter = 0;
                const processedWords = allTokens.map(token => {
                    if (token.isBreak) {
                        return { text: '\n', isBreak: true };
                    } else {
                        const wObj = {
                            text: token.text,
                            isBreak: false,
                            startMs: Math.round(startMs + (wordCounter * timePerWord)),
                            endMs: Math.round(startMs + ((wordCounter + 1) * timePerWord))
                        };
                        wordCounter++;
                        return wObj;
                    }
                });

                parsed.push({
                    index,
                    startTime: timeMatch[1],
                    endTime: timeMatch[2],
                    words: processedWords
                });
            }
        }
        return parsed;
    }

    function generateSRT(subs) {
        return subs.filter(sub => sub.words.some(w => !w.isBreak)).map((sub, idx) => {
            let activeWords = sub.words.filter(w => !w.isBreak);
            if (activeWords.length === 0) return '';
            let startMs = Math.min(...activeWords.map(w => w.startMs));
            let endMs = Math.max(...activeWords.map(w => w.endMs));
            
            let currentLineText = '';
            let srtLines = [];
            sub.words.forEach(w => {
                if (w.isBreak) {
                    srtLines.push(currentLineText.trim());
                    currentLineText = '';
                } else {
                    currentLineText += (currentLineText ? ' ' : '') + w.text;
                }
            });
            if (currentLineText.trim()) {
                srtLines.push(currentLineText.trim());
            }

            return `\({idx + 1}\n\){msToTime(startMs)} --> \({msToTime(endMs)}\n\){srtLines.join('\n')}`;
        }).filter(Boolean).join('\n\n');
    }

    function mergeWithNextRow(subIdx) {
        if (subIdx >= subtitles.length - 1) return;
        saveState();
        
        const currentSub = subtitles[subIdx];
        const nextSub = subtitles[subIdx + 1];
        
        if (currentSub.words.length > 0 && !currentSub.words[currentSub.words.length - 1].isBreak) {
            currentSub.words.push({ text: '\n', isBreak: true });
        }
        
        currentSub.words.push(...nextSub.words);
        subtitles.splice(subIdx + 1, 1);
        
        renderEditor();
        updateRawView();
    }

    function unmergeRow(subIdx) {
        const sub = subtitles[subIdx];
        const breakIndex = sub.words.findIndex(w => w.isBreak);
        if (breakIndex === -1) return;

        saveState();

        const firstPartWords = sub.words.slice(0, breakIndex);
        const secondPartWords = sub.words.slice(breakIndex + 1);

        sub.words = firstPartWords;

        const activeSecond = secondPartWords.filter(w => !w.isBreak);
        let startMs = activeSecond.length > 0 ? Math.min(...activeSecond.map(w => w.startMs)) : 0;
        let endMs = activeSecond.length > 0 ? Math.max(...activeSecond.map(w => w.endMs)) : 0;

        const newSub = {
            index: 0,
            startTime: msToTime(startMs),
            endTime: msToTime(endMs),
            words: secondPartWords
        };

        subtitles.splice(subIdx + 1, 0, newSub);

        renderEditor();
        updateRawView();
    }

    function renderEditor() {
        const container = document.getElementById('editor-container');
        const savedScroll = container.scrollTop;

        if (subtitles.length === 0) {
            container.innerHTML = '<p style="color: #64748b; text-align: center; margin-top: 20px;">No subtitles loaded.</p>';
            return;
        }

        container.innerHTML = '';

        subtitles.forEach((sub, subIdx) => {
            const activeWords = sub.words.filter(w => !w.isBreak);
            if (activeWords.length === 0) return; 

            const row = document.createElement('div');
            row.className = 'subtitle-row';
            row.dataset.subIndex = subIdx;

            const startMs = Math.min(...activeWords.map(w => w.startMs));
            const endMs = Math.max(...activeWords.map(w => w.endMs));
            const fullText = activeWords.map(w => w.text).join(' ');

            const hasInternalBreak = sub.words.some(w => w.isBreak);

            row.innerHTML = `
                <div class="sub-index">${subIdx + 1}</div>
                <div class="sub-time" title="Solte aqui para criar nova linha / Clique para tocar">
                    \({msToTime(startMs).slice(3, 12)}➔\){msToTime(endMs).slice(6, 12)}
                </div>
                <div class="words-container" data-sub-index="${subIdx}"></div>
                <button class="\({hasInternalBreak ? 'unmerge-btn' : 'merge-btn'}" title="\){hasInternalBreak ? 'Unmerge line' : 'Merge with next line'}">
                    ${hasInternalBreak ? '✂️ Unmerge' : '🔗 Merge'}
                </button>
                <div class="char-count">${fullText.length}c</div>
            `;

            const timeCol = row.querySelector('.sub-time');
            timeCol.addEventListener('click', () => {
                if(mediaPlayer.duration) mediaPlayer.currentTime = startMs / 1000;
            });

            timeCol.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedInfo) return;
                timeCol.classList.add('drag-target-hover');
            });
            timeCol.addEventListener('dragleave', () => timeCol.classList.remove('drag-target-hover'));
            timeCol.addEventListener('drop', (e) => {
                e.preventDefault();
                timeCol.classList.remove('drag-target-hover');
                if (!draggedInfo) return;

                saveState();
                const sourceSub = subtitles[draggedInfo.subIndex];
                const wordToMove = sourceSub.words.splice(draggedInfo.wordIndex, 1)[0];

                const newSub = {
                    index: 0,
                    startTime: msToTime(wordToMove.startMs || startMs),
                    endTime: msToTime(wordToMove.endMs || endMs),
                    words: [wordToMove]
                };

                subtitles.splice(subIdx, 0, newSub);
                subtitles = subtitles.filter(s => s.words.some(w => !w.isBreak));

                renderEditor();
                updateRawView();
            });

            row.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedInfo) return;
                row.classList.add('drag-target-hover');
            });
            row.addEventListener('dragleave', () => row.classList.remove('drag-target-hover'));
            row.addEventListener('drop', (e) => {
                e.preventDefault();
                row.classList.remove('drag-target-hover');
                if (!draggedInfo) return;

                if (e.target.classList.contains('sub-time')) return;

                saveState();
                const sourceSub = subtitles[draggedInfo.subIndex];
                const wordToMove = sourceSub.words.splice(draggedInfo.wordIndex, 1)[0];

                subtitles[subIdx].words.push(wordToMove);
                subtitles = subtitles.filter(s => s.words.some(w => !w.isBreak));

                renderEditor();
                updateRawView();
            });

            const actionBtn = row.querySelector('.merge-btn, .unmerge-btn');
            if (hasInternalBreak) {
                actionBtn.onclick = () => unmergeRow(subIdx);
            } else {
                if (subIdx === subtitles.length - 1) {
                    actionBtn.style.opacity = '0.3';
                    actionBtn.disabled = true;
                } else {
                    actionBtn.onclick = () => mergeWithNextRow(subIdx);
                }
            }

            const wordsContainer = row.querySelector('.words-container');
            
            let subLineGroups = [];
            let currentGroup = [];
            
            sub.words.forEach((word) => {
                if (word.isBreak) {
                    subLineGroups.push(currentGroup);
                    currentGroup = [];
                } else {
                    currentGroup.push(word);
                }
            });
            subLineGroups.push(currentGroup);

            subLineGroups.forEach((groupWords) => {
                const lineGroupDiv = document.createElement('div');
                lineGroupDiv.className = 'sub-line-group';

                groupWords.forEach((word) => {
                    const currentWordIdxInSub = subtitles[subIdx].words.indexOf(word);

                    const chip = document.createElement('div');
                    chip.className = 'word-chip';
                    chip.innerText = word.text;
                    chip.dataset.start = word.startMs;
                    chip.dataset.end = word.endMs;
                    chip.draggable = true;

                    chip.addEventListener('dragstart', (e) => {
                        draggedInfo = { subIndex: subIdx, wordIndex: currentWordIdxInSub };
                        e.dataTransfer.setData('text/plain', word.text);
                        setTimeout(() => chip.classList.add('dragging'), 0);
                    });

                    chip.addEventListener('dragend', () => {
                        chip.classList.remove('dragging');
                        draggedInfo = null;
                    });

                    chip.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (!draggedInfo) return;
                        chip.classList.add('drag-over-word');
                    });
                    chip.addEventListener('dragleave', () => chip.classList.remove('drag-over-word'));
                    chip.addEventListener('drop', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        chip.classList.remove('drag-over-word');
                        if (!draggedInfo) return;

                        saveState();
                        const sourceSub = subtitles[draggedInfo.subIndex];
                        const wordToMove = sourceSub.words.splice(draggedInfo.wordIndex, 1)[0];

                        const targetSub = subtitles[subIdx];
                        const targetWordIdx = targetSub.words.indexOf(word);
                        targetSub.words.splice(targetWordIdx, 0, wordToMove);

                        subtitles = subtitles.filter(s => s.words.some(w => !w.isBreak));
                        renderEditor();
                        updateRawView();
                    });

                    chip.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        chip.contentEditable = true;
                        chip.focus();
                        
                        const selection = window.getSelection();
                        const range = document.createRange();
                        range.selectNodeContents(chip);
                        selection.removeAllRanges();
                        selection.addRange(range);

                        const finishEdit = () => {
                            chip.contentEditable = false;
                            const newText = chip.innerText.replace(/[\r\n]+/g, '').trim();
                            if (!newText) {
                                chip.innerText = word.text;
                                return;
                            }
                            if (newText !== word.text) {
                                saveState();
                                word.text = newText;
                                updateRawView();
                                renderEditor();
                            }
                        };

                        chip.addEventListener('blur', finishEdit, { once: true });
                        chip.addEventListener('keydown', (evt) => {
                            if (evt.key === 'Enter') {
                                evt.preventDefault();
                                chip.blur();
                            } else if (evt.key === 'Escape') {
                                chip.innerText = word.text;
                                chip.blur();
                            }
                        });
                    });

                    lineGroupDiv.appendChild(chip);
                });

                wordsContainer.appendChild(lineGroupDiv);
            });

            container.appendChild(row);
        });

        container.scrollTop = savedScroll;
    }

    function updateRawView() {
        document.getElementById('rawSrtArea').value = generateSRT(subtitles);
    }

    function updateSubtitlesState(currentMs) {
        const rows = document.querySelectorAll('.subtitle-row');
        let foundIndex = -1;
        let overlayLinesHTML = [''];

        rows.forEach((row) => {
            const subIdx = parseInt(row.dataset.subIndex);
            const sub = subtitles[subIdx];
            if (!sub) return;
            
            const activeWords = sub.words.filter(w => !w.isBreak);
            if (activeWords.length === 0) return;

            const startMs = Math.min(...activeWords.map(w => w.startMs));
            const endMs = Math.max(...activeWords.map(w => w.endMs));

            if (currentMs >= startMs && currentMs <= endMs) {
                row.classList.add('active-sub');
                foundIndex = subIdx;

                const chips = row.querySelectorAll('.word-chip');
                let chipIndex = 0;
                let currentLineWords = [];
                let lines = [];

                sub.words.forEach(w => {
                    if (w.isBreak) {
                        lines.push(currentLineWords.join(' '));
                        currentLineWords = [];
                    } else {
                        const chip = chips[chipIndex];
                        if (chip) {
                            const wStart = parseInt(chip.dataset.start);
                            const wEnd = parseInt(chip.dataset.end);
                            let wordText = chip.innerText;
                            if (currentMs >= wStart && currentMs <= wEnd) {
                                chip.classList.add('active-word');
                                currentLineWords.push(`<span class="overlay-active-word">${wordText}</span>`);
                            } else {
                                chip.classList.remove('active-word');
                                currentLineWords.push(wordText);
                            }
                        }
                        chipIndex++;
                    }
                });
                lines.push(currentLineWords.join(' '));
                overlayLinesHTML = lines;

            } else {
                row.classList.remove('active-sub');
                row.querySelectorAll('.active-word').forEach(c => c.classList.remove('active-word'));
            }
        });

        document.getElementById('subtitleOverlay').innerHTML = overlayLinesHTML.join('<br>');

        if (foundIndex !== -1 && foundIndex !== lastActiveIndex) {
            lastActiveIndex = foundIndex;
            const activeElement = document.querySelector(`.subtitle-row[data-sub-index="${foundIndex}"]`);
            if (activeElement) {
                activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }

    function startSyncLoop() {
        if (mediaPlayer.paused || mediaPlayer.ended) return;
        updateSubtitlesState(mediaPlayer.currentTime * 1000);
        requestAnimationFrame(startSyncLoop);
    }

    document.getElementById('charLimitInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('autoMergeBtn').click();
        }
    });

    document.getElementById('autoMergeBtn').addEventListener('click', () => {
        const limit = parseInt(document.getElementById('charLimitInput').value) || 16;
        let allTokens = [];
        subtitles.forEach(sub => {
            sub.words.forEach(w => {
                if (!w.isBreak) allTokens.push(w);
            });
        });

        if (allTokens.length === 0) return;

        saveState();
        const newSubs = [];
        let currentGroup = [allTokens[0]];
        let currentLength = allTokens[0].text.length;

        for (let i = 1; i < allTokens.length; i++) {
            const word = allTokens[i];
            const addedLength = word.text.length + 1;

            if (currentLength + addedLength <= limit) {
                currentGroup.push(word);
                currentLength += addedLength;
            } else {
                newSubs.push({ words: [...currentGroup] });
                currentGroup = [word];
                currentLength = word.text.length;
            }
        }
        if (currentGroup.length > 0) newSubs.push({ words: currentGroup });

        subtitles = newSubs;
        renderEditor();
        updateRawView();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (undoStack.length === 0) return;
        redoStack.push(JSON.parse(JSON.stringify(subtitles)));
        subtitles = undoStack.pop();
        renderEditor();
        updateRawView();
        updateHistoryButtons();
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
        if (redoStack.length === 0) return;
        undoStack.push(JSON.parse(JSON.stringify(subtitles)));
        subtitles = redoStack.pop();
        renderEditor();
        updateRawView();
        updateHistoryButtons();
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) document.getElementById('redoBtn').click();
            else document.getElementById('undoBtn').click();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault();
            document.getElementById('redoBtn').click();
        }
    });

    document.getElementById('srtFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            undoStack = [];
            redoStack = [];
            subtitles = parseSRT(event.target.result);
            renderEditor();
            updateRawView();
            updateHistoryButtons();
        };
        reader.readAsText(file);
    });

    const toggleViewBtn = document.getElementById('toggleViewBtn');
    toggleViewBtn.addEventListener('click', () => {
        const interactiveView = document.getElementById('interactiveView');
        const rawView = document.getElementById('rawView');
        
        if (interactiveView.classList.contains('hidden')) {
            interactiveView.classList.remove('hidden');
            rawView.classList.add('hidden');
            toggleViewBtn.innerText = 'Switch to Raw SRT';
        } else {
            interactiveView.classList.add('hidden');
            rawView.classList.remove('hidden');
            toggleViewBtn.innerText = 'Switch to Interactive';
            updateRawView();
        }
    });

    document.getElementById('updateFromRawBtn').addEventListener('click', () => {
        saveState();
        subtitles = parseSRT(document.getElementById('rawSrtArea').value);
        renderEditor();
        alert('Applied changes from raw text.');
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([generateSRT(subtitles)], { type: 'text/srt;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'edited_subtitles.srt';
        a.click();
        URL.revokeObjectURL(url);
    });
</script>
</body>
</html>
