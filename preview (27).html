<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kaori AudioKernel (Real Audio)</title>

<style>
body {
  font-family: system-ui, Arial;
  background: #0f1115;
  color: #e8e8e8;
  padding: 20px;
}

button {
  padding: 10px 14px;
  margin-right: 6px;
  cursor: pointer;
}

textarea {
  width: 100%;
  height: 140px;
  margin-top: 10px;
}

.card {
  background: #1a1d25;
  padding: 12px;
  border-radius: 10px;
}

.status {
  margin-top: 10px;
  font-weight: bold;
  color: #9ef0a0;
}
</style>
</head>

<body>

<h2>🧠 Kaori AudioKernel (REAL WebAudio)</h2>

<div class="card">
  <div id="status" class="status">Inicializando...</div>

  <button id="playBtn" disabled>▶ Play Queue</button>
  <button id="stopBtn">⛔ Stop</button>

  <textarea id="input">
kaori|Olá, eu sou Kaori.
kaori|Agora estou usando áudio real via WebAudio.
kaori|Fila sequencial funcionando sem interrupções.
kaori|Sem fallback, sem concorrência.
  </textarea>
</div>

<script>

/* =========================
   KAORI ENGINE (REAL AUDIO)
========================= */

class KaoriEngine {
  constructor() {
    this.ready = false;
    this.ctx = null;
  }

  async preload() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

    // resolve autoplay policy
    await this.ctx.resume();

    // simula load do modelo (substituir por Transformers.js depois)
    await new Promise(r => setTimeout(r, 1500));

    this.ready = true;
  }

  speak(text, onStart, onEnd) {
    if (!this.ready) throw new Error("Kaori not ready");

    const ctx = this.ctx;

    onStart?.();

    // duração baseada no texto
    const duration = Math.max(0.8, Math.min(6, text.length * 0.06));

    const sampleRate = ctx.sampleRate;
    const frameCount = Math.floor(sampleRate * duration);

    const buffer = ctx.createBuffer(1, frameCount, sampleRate);
    const data = buffer.getChannelData(0);

    // waveform simples (substituto de voz)
    let phase = 0;
    for (let i = 0; i < frameCount; i++) {
      data[i] = Math.sin(phase) * 0.08;
      phase += 0.03;
    }

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);

    source.onended = () => {
      onEnd?.();
    };

    source.start();
  }
}

/* =========================
   AUDIO KERNEL (STRICT FIFO)
========================= */

class AudioKernel {
  constructor() {
    this.queue = [];
    this.busy = false;

    this.kaori = new KaoriEngine();
  }

  async init() {
    this.setStatus("Carregando Kaori (WebAudio + modelo)...");

    await this.kaori.preload();

    this.setStatus("Kaori pronta ✔");
    document.getElementById("playBtn").disabled = false;
  }

  setStatus(t) {
    document.getElementById("status").innerText = t;
  }

  enqueue(tasks) {
    this.queue.push(...tasks);
    this.process();
  }

  stop() {
    this.queue = [];
    this.busy = false;

    // hard stop áudio atual
    this.kaori.ctx?.close();
    this.kaori.ready = false;

    this.setStatus("Parado ⛔ (recarregue página para reiniciar)");
    document.getElementById("playBtn").disabled = true;
  }

  async process() {
    if (this.busy) return;

    this.busy = true;

    while (this.queue.length > 0) {
      const task = this.queue.shift();
      await this.runTask(task);
    }

    this.busy = false;
  }

  runTask(task) {
    return new Promise((resolve) => {
      this.kaori.speak(
        task.text,

        () => this.setStatus("🎤 Kaori falando..."),

        () => resolve()
      );
    });
  }
}

/* =========================
   BOOT
========================= */

const kernel = new AudioKernel();

document.getElementById("playBtn").onclick = () => {
  const lines = document.getElementById("input").value.trim().split("\n");

  const tasks = lines.map(l => {
    const [voice, ...text] = l.split("|");

    return {
      voice,
      text: text.join("|").trim()
    };
  }).filter(t => t.text.length > 0);

  kernel.enqueue(tasks);
};

document.getElementById("stopBtn").onclick = () => {
  kernel.stop();
};

(async () => {
  await kernel.init();
})();

</script>

</body>
</html>
