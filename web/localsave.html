<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Line Copy Editor</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 40vh;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    .lines {
      margin-top: 16px;
      border: 1px solid #ccc;
      max-height: 40vh;
      overflow-y: auto;
    }
    .line {
      padding: 6px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      white-space: pre-wrap;
    }
    .line:hover {
      background: #f0f0f0;
    }
    .status {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

<h2>Auto-Save Line Copy Editor</h2>

<textarea id="editor" placeholder="Each line below is clickable…"></textarea>

<div class="lines" id="lines"></div>
<div class="status" id="status">Saved locally</div>

<script>
const KEY = 'autosave_lines';
const editor = document.getElementById('editor');
const linesEl = document.getElementById('lines');
const status = document.getElementById('status');

// Load saved text
editor.value = localStorage.getItem(KEY) || '';
renderLines();

// Auto-save + render
let timeout;
editor.addEventListener('input', () => {
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    localStorage.setItem(KEY, editor.value);
    renderLines();
    status.textContent = 'Saved ✔';
  }, 300);
});

// Render clickable lines
function renderLines() {
  linesEl.innerHTML = '';
  const lines = editor.value.split('\n');

  lines.forEach((text, i) => {
    if (text.trim() === '') return;

    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = text;

    div.onclick = async () => {
      await navigator.clipboard.writeText(text);
      status.textContent = `Copied line ${i + 1} ✔`;
    };

    linesEl.appendChild(div);
  });
}
</script>

</body>
</html>
