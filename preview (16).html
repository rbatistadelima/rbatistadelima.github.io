<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ TTS Lab — Kaori IA com Loading</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<script src="https://code.responsivevoice.org/responsivevoice.js"></script>

<style>
html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}

textarea{
  width:90%;max-width:980px;height:140px;
  background:#121214;color:#fff;border:0;padding:10px;
}

.karaoke{
  width:90%;max-width:980px;background:#141417;
  padding:14px;border-radius:8px;min-height:120px;
}

/* ---------------- LOADING UI ---------------- */

.loaderBox{
  width:90%;
  max-width:980px;
  background:#141417;
  padding:14px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.bar{
  width:100%;
  height:10px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
}

.bar > div{
  height:100%;
  width:0%;
  background:#10b981;
  transition:width .2s;
}

.status{
  font-size:0.9rem;
  color:#aaa;
}

button{
  background:#222;color:#fff;border:0;
  padding:10px;border-radius:8px;cursor:pointer;
}
</style>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

let ttsKaori = null;

/* ---------------- LOADING STATE ---------------- */

function setProgress(pct, text){
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("status").innerText = text;
}

/* ---------------- KAORI INIT ---------------- */

async function initKaori(){

  if(ttsKaori) return ttsKaori;

  setProgress(5, "Conectando ao motor de IA...");

  await new Promise(r=>setTimeout(r,400));

  setProgress(15, "Inicializando WebAssembly...");

  await new Promise(r=>setTimeout(r,600));

  setProgress(30, "Baixando modelo de voz (MMS PT-BR)...");

  // hook de progresso fake + real UX
  let fake = 30;
  const interval = setInterval(()=>{
    fake += Math.random()*4;
    if(fake < 85){
      setProgress(fake, "Baixando pesos do modelo neural...");
    }
  }, 400);

  ttsKaori = await pipeline(
    "text-to-speech",
    "Xenova/mms-tts-por"
  );

  clearInterval(interval);

  setProgress(90, "Carregando encoder de áudio...");

  await new Promise(r=>setTimeout(r,500));

  setProgress(100, "Kaori pronta! IA carregada.");

  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  }, 800);

  return ttsKaori;
}

/* ---------------- EXPOSE KAORI ---------------- */

window.Kaori = {
  speak: async (text)=>{
    const pipe = await initKaori();

    const out = await pipe(text);

    const ctx = new AudioContext();
    const buf = ctx.createBuffer(1, out.sampling_rate, out.sampling_rate);
    buf.copyToChannel(out.audio,0);

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start();

    return new Promise(r=>src.onended=r);
  }
};

</script>
</head>

<body>

<div class="loaderBox" id="loader">
  <div class="status" id="status">Preparando IA...</div>
  <div class="bar"><div id="barFill"></div></div>
</div>

<textarea id="texto">
Daniel: Olá!
Maria: Voz normal.
Kaori: Agora estou sendo carregada com barra de progresso.
Regina: Google TTS.
Ana: ResponsiveVoice.
</textarea>

<div class="karaoke" id="karaoke"></div>

<button onclick="start()">▶ Play</button>

<script>
let synth = speechSynthesis;
let voices = speechSynthesis.getVoices();

function pickFemale(){
  return voices.find(v=>/female|luciana|google/i.test(v.name))
    || voices.find(v=>v.lang?.includes("pt"))
    || voices[0];
}

function speak(text, voice){
  return new Promise(r=>{
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang="pt-BR";
    u.onend=r;
    synth.speak(u);
  });
}

function google(text){
  const a = new Audio(
    "https://translate.google.com/translate_tts?ie=UTF-8&q="
    + encodeURIComponent(text) +
    "&tl=pt-BR&client=tw-ob"
  );
  return new Promise(r=>{
    a.onended=r;
    a.play().catch(r);
  });
}

function rv(text){
  return new Promise(r=>{
    responsiveVoice.speak(text,"Brazilian Portuguese Female",{onend:r});
  });
}

async function speakRouter(name,text){

  if(name.toLowerCase().includes("kaori")){
    document.getElementById("karaoke").innerHTML =
      "<b>Kaori (IA):</b> " + text;

    return Kaori.speak(text);
  }

  if(name==="Ana") return rv(text);
  if(name==="Regina") return google(text);

  return speak(text,pickFemale());
}

async function start(){
  const lines = document.getElementById("texto").value.split("\n").filter(Boolean);

  for(const l of lines){
    const m = l.match(/^([^:]+):\s*(.*)$/);
    if(!m) continue;

    const name=m[1];
    const text=m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speakRouter(name,text);
  }
}

</script>

</body>
</html>
