<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Syllable Formant Studio</title>
    <style>
        :root {
            --primary: #39c5bb; /* Hatsune Miku Teal */
            --dark: #1f2326;
            --light: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: #2a2f35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border-top: 6px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #a0aab2;
            margin-bottom: 25px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            background: #1f2326;
            border: 1px solid #404852;
            color: white;
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 16px;
            height: 70px;
            resize: none;
        }

        .engine-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .control-box {
            background: #333940;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #404852;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--primary);
            font-weight: bold;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            background: #1f2326;
        }

        .label-val {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aab2;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background: #2eb0a7;
            box-shadow: 0 0 12px rgba(57, 197, 187, 0.3);
        }

        .status {
            margin-top: 15px;
            background: #1f2326;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-size: 13px;
            color: #7e8b96;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Clear Syllable Formant Studio</h1>
    <p class="subtitle">3-Band Formant Synthesis coupled with Transient Noise Burst Articulation.</p>

    <label for="lyrics">Enter Syllables (Space Separated)</label>
    <textarea id="lyrics">Do Re Mi Fa Sol La Si Do</textarea>

    <div class="engine-controls">
        <div class="control-box">
            <div class="label-val"><span>Consonant Sharpness (Noise Trigger)</span><span id="noise-val">75%</span></div>
            <input type="range" id="noiseVolume" min="0" max="100" value="75">
        </div>
        <div class="control-box">
            <div class="label-val"><span>Vibrato Depth</span><span id="vib-val">50%</span></div>
            <input type="range" id="vibrato" min="0" max="100" value="50">
        </div>
    </div>

    <button id="singBtn">Synthesize Clear Phrases</button>
    <div class="status" id="statusBox">Engine Ready. Click button to render waveform lines.</div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Generate a reusable 1-second white noise buffer for consonants
    function createNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; // Pure random static noise
        }
        return buffer;
    }
    const noiseBuffer = createNoiseBuffer();

    // Map words to accurate acoustic formant values (F1, F2, F3)
    function getFormants(word) {
        const txt = word.toLowerCase();
        if (txt.includes('mi') || txt.includes('si') || txt.includes('i')) return { f1: 270, f2: 2290, f3: 3010, type: 'plosive' };
        if (txt.includes('re') || txt.includes('e')) return { f1: 530, f2: 1840, f3: 2480, type: 'lingual' };
        if (txt.includes('do') || txt.includes('sol') || txt.includes('o')) return { f1: 570, f2: 840, f3: 2410, type: 'dental' };
        return { f1: 730, f2: 1090, f3: 2440, type: 'open' }; // Default "Ah" sound (Fa, La)
    }

    const scalePitches = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

    function runEngine() {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const words = document.getElementById('lyrics').value.split(/\s+/).filter(w => w.length > 0);
        if (words.length === 0) return;

        let startTime = audioCtx.currentTime + 0.05;
        const duration = 0.45; // Individual note duration
        const noiseSetting = parseFloat(document.getElementById('noiseVolume').value) / 100;
        const vibratoSetting = parseFloat(document.getElementById('vibrato').value) / 12;

        document.getElementById('statusBox').innerText = "🔊 Synthesizing audio channels...";

        words.forEach((word, index) => {
            const targetFreq = scalePitches[index % scalePitches.length];
            const identity = getFormants(word);

            // --- ENGINE PART A: THE CORE VOCAL TONE ---
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(targetFreq, startTime);

            // Add Vibrato Modulation
            if (vibratoSetting > 0) {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = 6.2;
                lfoGain.gain.value = vibratoSetting;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(startTime + 0.05);
                lfo.stop(startTime + duration);
            }

            // 3-Band Formant Filter Array
            const f1 = audioCtx.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 8; f1.frequency.setValueAtTime(identity.f1, startTime);
            const f2 = audioCtx.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 10; f2.frequency.setValueAtTime(identity.f2, startTime);
            const f3 = audioCtx.createBiquadFilter(); f3.type = 'bandpass'; f3.Q.value = 12; f3.frequency.setValueAtTime(identity.f3, startTime);

            const vocalGain = audioCtx.createGain();
            vocalGain.gain.setValueAtTime(0, startTime);
            // Slight delay in vocal tone attack lets the consonant lead the word naturally
            vocalGain.gain.linearRampToValueAtTime(0.18, startTime + 0.04); 
            vocalGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(f1); osc.connect(f2); osc.connect(f3);
            f1.connect(vocalGain); f2.connect(vocalGain); f3.connect(vocalGain);
            vocalGain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);


            // --- ENGINE PART B: THE CONSONANT ARTIFACT (NEW) ---
            if (noiseSetting > 0) {
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;

                // Highpass filter makes the noise sound like a crisp dental sound (D/R/F) rather than deep roar static
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.setValueAtTime(identity.type === 'dental' ? 3000 : 1500, startTime);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0, startTime);
                // Fast spike of noise right at the front of the syllable window
                noiseGain.gain.linearRampToValueAtTime(noiseSetting * 0.22, startTime + 0.005);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.04); // Fades in 40ms flat

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noiseSource.start(startTime);
                noiseSource.stop(startTime + 0.05);
            }

            // Move pointer forward to schedule next word block
            startTime += duration + 0.04;
        });

        setTimeout(() => {
            document.getElementById('statusBox').innerText = "✅ Track processing complete.";
        }, (startTime - audioCtx.currentTime) * 1000);
    }

    document.getElementById('singBtn').addEventListener('click', runEngine);
    document.getElementById('noiseVolume').addEventListener('input', (e) => document.getElementById('noise-val').innerText = e.target.value + '%');
    document.getElementById('vibrato').addEventListener('input', (e) => document.getElementById('vib-val').innerText = e.target.value + '%');
</script>

</body>
</html>
