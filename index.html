<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Index - GitHub Pages</title>
    <style>
        :root {
            --primary-color: #0366d6;
            --bg-color: #ffffff;
            --text-color: #24292e;
            --border-color: #e1e4e8;
            --hover-color: #f6f8fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .description {
            color: #586069;
            font-size: 18px;
        }

        .file-list {
            list-style: none;
            padding: 0;
        }

        .file-item {
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .file-link {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        .file-link:hover {
            color: var(--primary-color);
        }

        .file-icon {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .no-files {
            text-align: center;
            padding: 40px;
            color: #586069;
            font-style: italic;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: #586069;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .file-link {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Project Index</h1>
        <p class="description">All HTML pages in this directory</p>
    </header>

    <main>
        <ul class="file-list" id="fileList">
            <li class="no-files">Loading files...</li>
        </ul>
    </main>

    <footer>
        <p>Generated automatically for GitHub Pages</p>
    </footer>

    <script>
        const USERNAME = 'rbatistadelima';
        const REPO = 'rbatistadelima.github.io';
        
        // Function to get all HTML files in the repository using the GitHub API
        async function getHtmlFiles() {
            try {
                const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch contents from GitHub API');
                }
                
                const contents = await response.json();
                
                // Filter out non-HTML files, subdirectories, and index.html itself
                return contents
                    .filter(item => 
                        item.type === 'file' && 
                        item.name.endsWith('.html') && 
                        item.name.toLowerCase() !== 'index.html'
                    )
                    .map(file => ({
                        name: file.name,
                        displayName: formatFileName(file.name)
                    }));
            } catch (error) {
                console.error('Error fetching files:', error);
                return [];
            }
        }

        // Format file name for display
        function formatFileName(fileName) {
            let displayName = fileName.replace('.html', '');
            displayName = displayName.replace(/[-_]/g, ' ');
            return displayName.replace(/\b\w/g, l => l.toUpperCase());
        }

        // Display the list of HTML files
        async function displayFileList() {
            const fileList = document.getElementById('fileList');
            const files = await getHtmlFiles();
            
            if (files.length === 0) {
                fileList.innerHTML = '<li class="no-files">No HTML files found in this repository.</li>';
                return;
            }
            
            fileList.innerHTML = '';
            
            files.forEach(file => {
                const listItem = document.createElement('li');
                listItem.className = 'file-item';
                
                const link = document.createElement('a');
                link.className = 'file-link';
                link.href = file.name;
                link.innerHTML = `
                    <span class="file-icon">📄</span>
                    ${file.displayName}
                `;
                
                listItem.appendChild(link);
                fileList.appendChild(listItem);
            });
        }

        document.addEventListener('DOMContentLoaded', displayFileList);
    </script>
</body>
</html>
