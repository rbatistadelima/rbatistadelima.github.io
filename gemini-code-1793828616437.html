<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen 1 Pokémon Cry Synthesizer + Signal Bar Sequencer</title>
    <style>
        :root {
            --gb-darkest: #0f380f;
            --gb-dark: #306230;
            --gb-light: #8bac0f;
            --gb-lightest: #9bbc0f;
            --pokedex-red: #dc0a2d;
            --pokedex-dark: #8b0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #121212; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .pokedex {
            background: var(--pokedex-red);
            border: 4px solid var(--pokedex-dark);
            border-radius: 15px;
            width: 100%; max-width: 950px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; gap: 15px;
        }

        .screen-container {
            background: #dcdcdc;
            border-radius: 10px 10px 10px 30px;
            padding: 15px;
            border: 3px solid #777;
        }

        .lcd-screen {
            background: var(--gb-lightest);
            border: 3px solid var(--gb-darkest);
            border-radius: 5px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .viz-box {
            height: 60px;
            background: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .status-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--gb-lightest); font-size: 11px; font-weight: bold; pointer-events: none;
        }

        .controls { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 8px; border: 2px solid var(--gb-darkest);
            background: var(--gb-light); color: var(--gb-darkest); font-weight: bold; outline: none;
        }
        .btn {
            background: var(--gb-dark); color: var(--gb-lightest);
            border: 2px solid var(--gb-darkest); padding: 8px 12px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn:hover { background: var(--gb-darkest); color: var(--gb-light); }

        /* Sequencer & Signal Bar Panel */
        .note-editor {
            background: var(--gb-light);
            border: 2px solid var(--gb-darkest);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .top-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--gb-darkest);
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-group select, .control-group input[type="range"] {
            padding: 2px;
            border: 2px solid var(--gb-darkest);
            background: var(--gb-lightest);
            color: var(--gb-darkest);
            font-weight: bold;
            font-size: 10px;
            outline: none;
            cursor: pointer;
        }

        /* Signal Bars Grid Layout */
        .signal-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            padding: 12px;
            height: 180px;
            gap: 6px;
        }

        .signal-column {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .signal-column.playing .bar-wrapper {
            outline: 2px solid var(--gb-lightest);
            box-shadow: 0 0 8px var(--gb-lightest);
        }

        .note-val-label {
            font-size: 9px;
            font-weight: bold;
            color: var(--gb-lightest);
            text-align: center;
        }

        /* Phone Signal Style Bar Visual */
        .bar-wrapper {
            width: 100%;
            height: 110px;
            background: rgba(48, 98, 48, 0.3);
            border: 1px solid var(--gb-dark);
            display: flex;
            align-items: flex-end;
            position: relative;
            cursor: pointer;
        }

        .bar-fill {
            width: 100%;
            background: var(--gb-lightest);
            border-top: 2px solid #fff;
            transition: height 0.05s ease-out;
        }

        .signal-column.playing .bar-fill {
            background: #ffffff;
        }

        /* Hidden vertical pitch slider overlaying each signal bar */
        input[type="range"].pitch-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: ns-resize;
            margin: 0;
            z-index: 5;
        }

        .grid {
            height: 200px; overflow-y: auto;
            border: 2px solid var(--gb-darkest); background: var(--gb-light);
            padding: 8px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background: var(--gb-dark); }

        .card {
            background: var(--gb-lightest); border: 2px solid var(--gb-darkest);
            padding: 6px; text-align: center; cursor: pointer; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card:hover, .card.active { background: var(--gb-dark); color: var(--gb-lightest); }
        .num { font-size: 9px; font-weight: bold; }
        .name { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
    </style>
</head>
<body>

<div class="pokedex">
    <div class="screen-container">
        <div class="lcd-screen">
            <div class="viz-box">
                <canvas id="canvas"></canvas>
                <div class="status-text" id="status">CLICK ANY CONTROL OR POKÉMON TO PLAY</div>
            </div>

            <div class="controls">
                <input type="text" id="search" placeholder="SEARCH POKÉMON..." />
                <button class="btn" id="play-btn">PLAY</button>
                <button class="btn" id="rand-btn">RANDOM</button>
            </div>

            <!-- Signal Bar Pitch Sequencer -->
            <div class="note-editor">
                <div class="top-controls-bar">
                    <div class="control-group">
                        <label for="note-count-slider">NOTES (1-8):</label>
                        <input type="range" id="note-count-slider" min="1" max="8" value="5" step="1">
                        <span id="note-count-val">5</span>
                    </div>

                    <div class="control-group">
                        <label for="scale-select">SCALE:</label>
                        <select id="scale-select"></select>
                    </div>

                    <button class="btn" id="reset-notes-btn" style="padding: 2px 6px; font-size: 9px;">RESET BARS</button>
                </div>

                <!-- Signal Bars Box -->
                <div class="signal-container" id="signal-container"></div>
            </div>

            <div class="grid" id="grid"></div>
        </div>
    </div>
</div>
