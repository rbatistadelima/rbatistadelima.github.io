<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grid Text Editor - iOS 8+ Compatible</title>
    <!-- Importando fontes monospace modernas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=JetBrains+Mono:wght@500&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1f1f23;
            --primary-color: #6366f1;
            --accent-color: #22c55e;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --cell-border: #374151;
            --cell-active: #312e81;
            --cell-size: 32px;
            --current-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        header {
            background-color: var(--surface-color);
            padding: 8px 12px;
            border-bottom: 1px solid var(--cell-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .controls-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--cell-border);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--cell-border);
            color: var(--text-color);
        }

        /* Container do Grid */
        .grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #09090b;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .spreadsheet-grid {
            display: grid;
            grid-template-columns: repeat(20, var(--cell-size));
            grid-auto-rows: var(--cell-size);
            gap: 1px;
            background-color: var(--cell-border);
            border: 1px solid var(--cell-border);
            width: max-content;
        }

        .cell {
            background-color: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: var(--current-font);
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.1s;
        }

        .cell.active {
            background-color: var(--cell-active);
            box-shadow: inset 0 0 0 2px var(--primary-color);
            z-index: 2;
        }

        /* Painel Inferior: Controles & Sugestões */
        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--cell-border);
            display: flex;
            flex-direction: column;
            max-height: 40vh;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--cell-border);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .gestures-hint {
            display: flex;
            gap: 8px;
        }

        .suggestions-panel {
            padding: 10px 12px;
            overflow-y: auto;
            max-height: 120px;
        }

        .suggestions-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .suggestion-item {
            background-color: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--primary-color);
            padding: 6px 10px;
            border-radius: 0 6px 6px 0;
            font-size: 0.8rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Input Invisível para capturar teclado no iOS sem zoom indesejado */
        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>GridCell</h1>
        <div class="controls-group">
            <select id="font-selector" onchange="changeFont(this.value)">
                <option value="'Courier New', Courier, monospace">Courier New</option>
                <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                <option value="'Fira Code', monospace">Fira Code</option>
                <option value="'Source Code Pro', monospace">Source Code Pro</option>
                <option value="Menlo, Monaco, monospace">Menlo / Monaco</option>
                <option value="Consolas, monospace">Consolas</option>
                <option value="ui-monospace, SFMono-Regular, monospace">iOS System Mono</option>
            </select>
            <button class="secondary" onclick="clearGrid()">Limpar</button>
            <button onclick="focusInput()">Digitar</button>
        </div>
    </header>

    <div class="grid-container" id="grid-container">
        <div class="spreadsheet-grid" id="grid"></div>
    </div>

    <footer>
        <div class="toolbar">
            <span id="status-info">Pos: (0, 0)</span>
            <div class="gestures-hint">
                <span>👆 Toque</span>
                <span>↔️ Swipe</span>
            </div>
        </div>
        <div class="suggestions-panel" id="suggestions-panel">
            <div class="suggestions-title">Sugestões</div>
            <div id="suggestions-list">
                <div class="suggestion-item">Comece a digitar no grid...</div>
            </div>
        </div>
    </footer>

    <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <script>
        const COLS = 20;
        const ROWS = 30;
        let activeRow = 0;
        let activeCol = 0;
        
        let gridData = Array(ROWS).fill().map(() => Array(COLS).fill(''));

        const gridEl = document.getElementById('grid');
        const hiddenInput = document.getElementById('hidden-input');
        const statusInfo = document.getElementById('status-info');
        const suggestionsList = document.getElementById('suggestions-list');
        const gridContainer = document.getElementById('grid-container');

        function initGrid() {
            gridEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.textContent = gridData[r][c];
                    
                    cell.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        selectCell(r, c);
                        focusInput();
                    });

                    gridEl.appendChild(cell);
                }
            }
            updateActiveVisual();
        }

        function changeFont(fontFamily) {
            document.documentElement.style.setProperty('--current-font', fontFamily);
            focusInput();
        }

        function selectCell(r, c) {
            if (r < 0) r = 0;
            if (r >= ROWS) r = ROWS - 1;
            if (c < 0) c = 0;
            if (c >= COLS) c = COLS - 1;
            
            activeRow = r;
            activeCol = c;
            updateActiveVisual();
            updateStatus();
        }

        function updateActiveVisual() {
            const cells = gridEl.children;
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                if (parseInt(cell.dataset.row) === activeRow && parseInt(cell.dataset.col) === activeCol) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                }
            }
        }

        function updateStatus() {
            const val = gridData[activeRow][activeCol];
            statusInfo.textContent = `Pos: (${activeCol}, ${activeRow}) | "${val || 'vazio'}"`;
            analyzeText();
        }

        function focusInput() {
            hiddenInput.focus();
        }

        hiddenInput.addEventListener('input', (e) => {
            const char = e.target.value.slice(-1);
            if (char) {
                gridData[activeRow][activeCol] = char;
                renderCell(activeRow, activeCol);
                
                if (activeCol < COLS - 1) {
                    selectCell(activeRow, activeCol + 1);
                } else if (activeRow < ROWS - 1) {
                    selectCell(activeRow + 1, 0);
                }
            }
            hiddenInput.value = '';
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                if (gridData[activeRow][activeCol] !== '') {
                    gridData[activeRow][activeCol] = '';
                } else {
                    if (activeCol > 0) {
                        selectCell(activeRow, activeCol - 1);
                    } else if (activeRow > 0) {
                        selectCell(activeRow - 1, COLS - 1);
                    }
                    gridData[activeRow][activeCol] = '';
                }
                renderCell(activeRow, activeCol);
                updateStatus();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                selectCell(activeRow, activeCol - 1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                selectCell(activeRow, activeCol + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectCell(activeRow - 1, activeCol);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectCell(activeRow + 1, activeCol);
            }
        });

        function renderCell(r, c) {
            const index = r * COLS + c;
            const cell = gridEl.children[index];
            if (cell) {
                cell.textContent = gridData[r][c];
            }
            updateStatus();
        }

        function clearGrid() {
            if (confirm("Deseja limpar todo o texto do grid?")) {
                gridData = Array(ROWS).fill().map(() => Array(COLS).fill(''));
                initGrid();
                selectCell(0, 0);
            }
        }

        let touchStartX = 0;
        let touchStartY = 0;
        const minSwipeDistance = 30;

        gridContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        gridContainer.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const deltaX = e.changedTouches[0].clientX - touchStartX;
                const deltaY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(deltaX) > minSwipeDistance || Math.abs(deltaY) > minSwipeDistance) {
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX > 0) {
                            selectCell(activeRow, activeCol - 1);
                        } else {
                            selectCell(activeRow, activeCol + 1);
                        }
                    } else {
                        if (deltaY > 0) {
                            selectCell(activeRow - 1, activeCol);
                        } else {
                            selectCell(activeRow + 1, activeCol);
                        }
                    }
                    focusInput();
                }
            }
        }, { passive: true });

        function getFullText() {
            return gridData.map(row => row.join('')).join('').trim();
        }

        function analyzeText() {
            const text = getFullText();
            suggestionsList.innerHTML = '';

            if (text.length === 0) {
                suggestionsList.innerHTML = '<div class="suggestion-item">Comece a digitar no grid para ver análises.</div>';
                return;
            }

            let suggestions = [];

            if (text.length > 0 && text[0] !== text[0].toUpperCase()) {
                suggestions.push({ text: "Sugerir letra maiúscula inicial." });
            }

            const words = text.split(/\s+/).filter(Boolean).length;
            suggestions.push({ text: `Estatísticas: ${text.length} chars | ${words} palavras.` });

            suggestions.forEach(s => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerHTML = `<div>${s.text}</div>`;
                suggestionsList.appendChild(item);
            });
        }

        initGrid();
        selectCell(0, 0);
    </script>
</body>
</html>
