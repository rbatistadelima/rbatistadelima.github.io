<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Cloud Chat</title>
    <!-- GunDB Decentralized Database & WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 12px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div class="status-row">
            <span id="status-text">Connecting to network...</span>
            <div id="identity-display">You: Loading...</div>
        </div>
        <div class="status-row" id="room-controls">
            <span>Room: <strong id="room-display">...</strong></span>
            <button onclick="newRoom()">New Room</button>
        </div>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message and press Enter..." onkeypress="handleKeyPress(event)" autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Composite Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    const myUid = 'u_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    document.getElementById('room-display').textContent = roomName;

    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const statusText = document.getElementById('status-text');

    const seenMsgIds = new Set();

    // Initialize Gun DB with multiple public WebSocket relays
    const gun = Gun({
        peers: [
            'https://gun-manhattan.herokuapp.com/gun',
            'https://peer.walla.app/gun'
        ]
    });

    const roomNode = gun.get('anonymous_chat_rooms_v1').get(roomName);

    function getTimeString(timestamp) {
        const date = timestamp ? new Date(timestamp) : new Date();
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initChat() {
        statusText.textContent = "Online (P2P Relay Connected)";

        // Listen for new messages & load online historical log
        roomNode.map().once((data, id) => {
            if (!data || seenMsgIds.has(id)) return;
            seenMsgIds.add(id);

            const isSelf = data.uid === myUid || data.sender === myName;
            const time = getTimeString(data.timestamp);

            appendMessageToDOM(data.sender, data.text, time, isSelf ? 'sent' : 'received');
        });
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const timestamp = Date.now();
        const msgId = 'msg_' + timestamp + '_' + Math.random().toString(36).substring(2, 6);

        const payload = {
            sender: myName,
            uid: myUid,
            text: text,
            timestamp: timestamp
        };

        // Write directly to decentralized mesh graph
        roomNode.get(msgId).put(payload);

        messageInput.value = '';
        messageInput.focus();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function newRoom() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="msg-header">
                <span>${sender}</span>
                <span class="msg-time">${time}</span>
            </div>
            <div>${text}</div>
        `;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.onload = initChat;
</script>

</body>
</html>
