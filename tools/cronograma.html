<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Interativo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Chart.js Drag Data Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-dragdata@2.2.4/dist/chartjs-plugin-dragdata.min.js"></script>
    <!-- HTML5 Sortable -->
    <script src="https://cdn.jsdelivr.net/npm/html5sortable@0.13.0/dist/html5sortable.min.js"></script>
    <!-- Dom-to-Image-More -->
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.1.6/dist/dom-to-image-more.min.js"></script>
</head>
<body class="bg-[#ffffff] text-[#1a1a1a] h-screen w-screen flex flex-col justify-between p-3 gap-3 select-none">

    <!-- Cabeçalho Técnico -->
    <header class="bg-[#ffffff] px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-3 border-2 border-[#1a1a1a] shrink-0">
        <div>
            <h1 class="text-sm font-bold tracking-tight text-[#1a1a1a]">
                Cronograma
            </h1>
        </div>
        
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
                <label for="patternSelect" class="text-xs font-semibold text-[#1a1a1a]">Configuração Ativa:</label>
                <select id="patternSelect" class="bg-[#ffffff] border-2 border-[#1a1a1a] text-[#1a1a1a] font-medium text-xs focus:outline-none p-1.5 cursor-pointer min-w-[200px]">
                    <optgroup label="Fábrica" id="systemGroup">
                        <option value="instagram">Instagram Picos</option>
                        <option value="abertura">Abertura Rápida</option>
                        <option value="continuo">Distribuição Linear</option>
                    </optgroup>
                    <optgroup label="Customizados" id="customGroup">
                    </optgroup>
                </select>
                <button id="savePatternBtn" class="bg-[#1a1a1a] text-[#ffffff] hover:bg-[#333333] px-3 py-1.5 text-xs font-medium transition-colors">
                    [+] Salvar Nova Config
                </button>
                <button id="resetPatternBtn" class="bg-[#ffffff] border-2 border-[#1a1a1a] text-[#1a1a1a] hover:bg-[#f3f4f6] px-3 py-1.5 text-xs font-medium transition-colors">
                    Resetar
                </button>
            </div>
        </div>
    </header>

    <!-- Área de Trabalho -->
    <main id="dashboardMain" class="flex-grow grid grid-cols-12 gap-3 min-h-0 bg-white p-1">
        
        <!-- Bloco do Gráfico -->
        <section class="col-span-8 bg-[#ffffff] border-2 border-[#1a1a1a] p-3 flex flex-col justify-between relative overflow-hidden">
            <div class="flex justify-between items-center pb-2 border-b border-[#f0f0f0] shrink-0">
                <button id="toggleChartModeBtn" class="bg-[#ffffff] text-[#1a1a1a] border-2 border-[#1a1a1a] hover:bg-[#f3f4f6] font-semibold text-xs px-3 py-1 transition-colors cursor-pointer">
                    Visualização: Intervalo
                </button>
                <button id="captureScreenBtn" class="bg-[#ffffff] text-xs font-semibold text-gray-600 hover:text-black border border-gray-300 hover:border-black px-2 py-1 transition-colors flex items-center gap-1 cursor-pointer">
                    📷 Salvar como Imagem (Tudo)
                </button>
            </div>
            <div class="flex-grow relative w-full h-full min-h-0 mt-2">
                <canvas id="syncLineChart"></canvas>
            </div>
        </section>

        <!-- Bloco de Dados da Tabela -->
        <section class="col-span-4 bg-[#ffffff] border-2 border-[#1a1a1a] p-3 flex flex-col justify-between overflow-hidden">
            
            <div class="flex justify-end items-center pb-2 border-b-2 border-[#1a1a1a] shrink-0">
                <button id="exportTextBtn" class="bg-[#ffffff] text-[#1a1a1a] border-2 border-[#1a1a1a] hover:bg-[#f3f4f6] font-semibold text-xs px-3 py-1 transition-colors cursor-pointer">
                    Copiar Dados
                </button>
            </div>
            
            <div class="flex-grow flex flex-col min-h-0 mt-2">
                <div id="tableContainer" class="w-full flex-grow flex flex-col justify-between border-t border-l border-[#1a1a1a]">
                    <!-- Elementos injetados via JavaScript -->
                </div>
            </div>

            <div class="mt-2 shrink-0">
                <button id="addMediaBtn" class="w-full bg-[#1a1a1a] hover:bg-[#333333] text-[#ffffff] font-semibold text-xs py-2 transition-colors tracking-wide">
                    [+] Inserir Item
                </button>
            </div>
        </section>

    </main>

    <footer class="h-0.5 shrink-0"></footer>

    <script>
        const ctx = document.getElementById('syncLineChart').getContext('2d');
        let chartInstance;
        let currentChartMode = 'intervalos'; 

        // Escala estendida até as 20h em passos de 15 minutos
        const timeSlots = [
            "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45",
            "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45",
            "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45",
            "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45",
            "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00"
        ];

        function timeToMinutes(slotIdx) {
            return slotIdx * 15;
        }

        // Padrões recalibrados cobrindo a faixa até as 20h com inteligência de engajamento
        const basePatterns = {
            instagram: [
                ["id_0", 0, "Chegada"],               // 10:00
                ["id_1", 2, "Convite"],              // 10:30 (+30m)
                ["id_2", 5, "Climinha do evento"],    // 11:15 (+45m)
                ["id_3", 10, "Detalhes de produto"],  // 12:30 (+1h15m) - Vale Tarde
                ["id_4", 16, "Explicação simples"],   // 14:00 (+1h30m)
                ["id_5", 22, "Diferencial da feira"],  // 15:30 (+1h30m)
                ["id_6", 28, "Pequena fala"],         // 17:00 (+1h30m)
                ["id_7", 32, "Pessoas passando"],     // 18:00 (+1h) - Entrada no Pico da Noite
                ["id_8", 34, "Resumo da Tarde"],      // 18:30 (+30m) - Densidade Máxima
                ["id_9", 36, "Últimos Destaques"],    // 19:00 (+30m)
                ["id_10", 38, "Movimento Encerramento"],// 19:30 (+30m)
                ["id_11", 40, "Agradecimento Final"]  // 20:00 (+30m)
            ],
            abertura:  [
                ["id_0",0,"Chegada"], ["id_1",2,"Convite"], ["id_2",4,"Climinha do evento"], ["id_3",8,"Detalhes de produto"], ["id_4",12,"Explicação simples"], ["id_5",16,"Diferencial da feira"], ["id_6",20,"Pequena fala"], ["id_7",24,"Pessoas passando"], ["id_8",28,"Resumo"], ["id_9",32,"Agradecimento"], ["id_10",36,"Extra 1"], ["id_11",40,"Encerramento"]
            ],
            continuo:  [
                ["id_0",0,"Chegada"], ["id_1",3,"Convite"], ["id_2",6,"Climinha do evento"], ["id_3",9,"Detalhes de produto"], ["id_4",12,"Explicação simples"], ["id_5",15,"Diferencial da feira"], ["id_6",18,"Pequena fala"], ["id_7",21,"Pessoas passando"], ["id_8",24,"Resumo"], ["id_9",27,"Agradecimento"], ["id_10",33,"Extra 1"], ["id_11",40,"Encerramento"]
            ]
        };

        let currentSequenceState = [];

        function getActivePatternKey() {
            return document.getElementById('patternSelect').value;
        }

        function getCustomPatterns() {
            const saved = localStorage.getItem('c_custom_configs_v18');
            return saved ? JSON.parse(saved) : {};
        }

        function updateDropdown() {
            const customGroup = document.getElementById('customGroup');
            customGroup.innerHTML = '';
            const customs = getCustomPatterns();
            Object.keys(customs).forEach(key => {
                const opt = document.createElement('option');
                opt.value = `custom_${key}`;
                opt.textContent = key;
                customGroup.appendChild(opt);
            });
        }

        function loadState() {
            const key = getActivePatternKey();
            if (key.startsWith('custom_')) {
                const cleanKey = key.replace('custom_', '');
                const customs = getCustomPatterns();
                currentSequenceState = customs[cleanKey] || JSON.parse(JSON.stringify(basePatterns['instagram']));
            } else {
                const saved = localStorage.getItem(`c_data_v18_${key}`);
                if (saved) {
                    currentSequenceState = JSON.parse(saved);
                } else {
                    currentSequenceState = JSON.parse(JSON.stringify(basePatterns[key]));
                }
            }
        }

        function autoSaveState() {
            const key = getActivePatternKey();
            if (!key.startsWith('custom_')) {
                localStorage.setItem(`c_data_v18_${key}`, JSON.stringify(currentSequenceState));
            } else {
                const cleanKey = key.replace('custom_', '');
                const customs = getCustomPatterns();
                customs[cleanKey] = currentSequenceState;
                localStorage.setItem('c_custom_configs_v18', JSON.stringify(customs));
            }
        }

        function formatIntervalText(minutes) {
            if (minutes < 0) return "⚠️ RETROATIVO";
            if (minutes === 0) return "Mesmo horário";
            if (minutes < 60) return `+${minutes}m`;
            const hrs = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins > 0 ? `+${hrs}h${mins}m` : `+${hrs}h`;
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '';

            currentSequenceState.forEach((item, index) => {
                const mediaId = item[0];
                const currentTimeSlotIdx = item[1];
                const currentTitle = item[2];

                let stringIntervalo = 'START';
                let isRetrograde = false;

                if (index > 0) {
                    const previousTimeSlotIdx = currentSequenceState[index - 1][1];
                    const intervalMinutes = timeToMinutes(currentTimeSlotIdx) - timeToMinutes(previousTimeSlotIdx);
                    stringIntervalo = formatIntervalText(intervalMinutes);
                    if (intervalMinutes < 0) isRetrograde = true;
                }

                const displayNum = String(index + 1).padStart(2, '0');

                const row = document.createElement('div');
                row.className = `sortable-row flex flex-grow flex-shrink items-center border-b border-r border-[#1a1a1a] min-h-0 h-full text-xs transition-colors ${
                    isRetrograde ? 'bg-red-50 border-l-4 border-l-red-500' : 'bg-white hover:bg-[#f9f9f9]'
                }`;
                row.setAttribute('data-id', mediaId);
                row.setAttribute('id', `row-idx-${index}`);

                let selectOptions = '';
                timeSlots.forEach((time, slotIdx) => {
                    selectOptions += `<option value="${slotIdx}" ${slotIdx === currentTimeSlotIdx ? 'selected' : ''}>${time}</option>`;
                });

                row.innerHTML = `
                    <div class="cursor-grab text-[#1a1a1a] font-bold px-2 flex items-center justify-center border-r border-[#1a1a1a] h-full select-none text-[11px] bg-[#f5f5f5] gap-1 min-w-[45px]">
                        <span class="text-[#a1a1a1]">☰</span> ${displayNum}
                    </div>
                    <div class="flex-grow h-full px-2 flex items-center border-r border-[#1a1a1a] min-w-0">
                        <input type="text" data-index="${index}" class="media-title-input bg-transparent border-none focus:outline-none font-bold text-[#1a1a1a] w-full truncate py-0" value="${currentTitle}">
                    </div>
                    <div class="w-20 h-full flex items-center justify-center border-r border-[#1a1a1a] px-1">
                        <select data-index="${index}" class="time-table-select bg-transparent text-[#1a1a1a] text-[11px] font-semibold cursor-pointer focus:outline-none w-full text-center ${isRetrograde ? 'text-red-600 font-bold' : ''}">
                            ${selectOptions}
                        </select>
                    </div>
                    <div class="w-24 h-full flex items-center justify-center text-[10px] font-medium px-1 text-center ${isRetrograde ? 'text-red-600 font-bold bg-red-100' : 'bg-[#fdfdfd] text-[#555555]' || 'START'}">
                        ${stringIntervalo}
                    </div>
                    <div class="w-7 h-full flex items-center justify-center border-l border-[#1a1a1a]">
                        <button data-index="${index}" class="delete-item-btn text-[#a1a1a1] hover:text-red-600 text-sm font-bold w-full h-full flex items-center justify-center" title="Remover">
                            ×
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            // Handlers de input e alteração da tabela
            document.querySelectorAll('.media-title-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    currentSequenceState[idx][2] = e.target.value;
                    renderChart();
                    autoSaveState();
                });
            });

            document.querySelectorAll('.delete-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idxToDelete = parseInt(e.target.getAttribute('data-index'), 10);
                    currentSequenceState.splice(idxToDelete, 1);
                    renderChart();
                    renderTable();
                    autoSaveState();
                });
            });

            document.querySelectorAll('.time-table-select').forEach(el => {
                el.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    currentSequenceState[idx][1] = parseInt(e.target.value, 10);
                    renderChart();
                    renderTable();
                    autoSaveState();
                });
            });

            if(currentSequenceState.length > 0) {
                sortable('#tableContainer', {
                    items: '.sortable-row',
                    placeholderClass: 'sortable-placeholder'
                })[0].addEventListener('sortupdate', function() {
                    const rows = container.querySelectorAll('.sortable-row');
                    const newSequence = [];
                    rows.forEach((row) => {
                        const id = row.getAttribute('data-id');
                        const currentItem = currentSequenceState.find(d => d[0] === id);
                        if(currentItem) newSequence.push(currentItem);
                    });
                    currentSequenceState = newSequence;
                    renderChart();
                    renderTable();
                    autoSaveState();
                });
            }
        }

        function renderChart() {
            if (chartInstance) chartInstance.destroy();

            let targetDatasetData = [];
            let dynamicXLabels = [];
            let configYScale = {};

            if (currentChartMode === 'horarios') {
                dynamicXLabels = currentSequenceState.map((_, index) => `${index + 1}`);
                targetDatasetData = currentSequenceState.map(item => item[1]);
                
                configYScale = {
                    min: 0,
                    max: timeSlots.length - 1,
                    grid: { display: true, color: '#f0f0f0' },
                    ticks: {
                        color: '#1a1a1a',
                        font: { size: 10, weight: '500' },
                        stepSize: 4,
                        callback: function(value) { return timeSlots[value]; }
                    }
                };
            } else {
                // Rótulo dinâmico do eixo X com os horários reais de publicação
                for (let i = 1; i < currentSequenceState.length; i++) {
                    const targetHourStr = timeSlots[currentSequenceState[i][1]];
                    dynamicXLabels.push(targetHourStr); 
                    
                    const diffMinutes = timeToMinutes(currentSequenceState[i][1]) - timeToMinutes(currentSequenceState[i - 1][1]);
                    targetDatasetData.push(diffMinutes);
                }

                configYScale = {
                    min: -30, 
                    max: 180, 
                    reverse: true, // Curva Invertida (Picos altos = intervalos curtos)
                    grid: { display: true, color: '#f0f0f0' },
                    ticks: {
                        color: '#1a1a1a',
                        font: { size: 10, weight: '500' },
                        stepSize: 30,
                        callback: function(value) {
                            if (value < 0) return `Recuo ${Math.abs(value)}m`;
                            if (value === 0) return "0m";
                            if (value < 60) return `${value} min`;
                            const hrs = Math.floor(value / 60);
                            const mins = value % 60;
                            return mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
                        }
                    }
                };
            }

            const pointColors = targetDatasetData.map(() => '#ffffff');
            const pointBorderColors = targetDatasetData.map(() => '#1a1a1a');
            const pointRadii = targetDatasetData.map(() => 6);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dynamicXLabels, 
                    datasets: [{
                        data: targetDatasetData,
                        borderColor: '#1a1a1a',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.1, 
                        pointBackgroundColor: pointColors,
                        pointBorderColor: pointBorderColors,
                        pointBorderWidth: 2,
                        pointRadius: pointRadii,
                        pointHoverRadius: 9,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, 
                    plugins: {
                        legend: { display: false },
                        dragData: {
                            round: 0,
                            showTooltip: true,
                            onDragStart: function (e, datasetIndex, index) {
                                chartInstance.data.datasets[0].pointBackgroundColor[index] = '#1a1a1a';
                                chartInstance.data.datasets[0].pointBorderColor[index] = '#3b82f6';
                                chartInstance.data.datasets[0].pointRadius[index] = 9;
                                chartInstance.update();

                                const tableTargetIdx = (currentChartMode === 'horarios') ? index : index + 1;
                                const targetRow = document.getElementById(`row-idx-${tableTargetIdx}`);
                                if(targetRow) targetRow.classList.add('bg-blue-50', 'ring-2', 'ring-blue-500');
                            },
                            onDrag: function (e, datasetIndex, index, value) {
                                if (currentChartMode === 'horarios') {
                                    if (value < 0) value = 0;
                                    if (value > timeSlots.length - 1) value = timeSlots.length - 1;
                                    currentSequenceState[index][1] = value;
                                    
                                    const selectEl = document.querySelector(`select[data-index="${index}"]`);
                                    if(selectEl) selectEl.value = value;
                                } else {
                                    const targetItemIdx = index + 1;
                                    const basePreviousMinutes = timeToMinutes(currentSequenceState[targetItemIdx - 1][1]);
                                    const targetMinutes = basePreviousMinutes + value;
                                    let targetSlotIdx = Math.round(targetMinutes / 15);
                                    
                                    if (targetSlotIdx < 0) targetSlotIdx = 0;
                                    if (targetSlotIdx > timeSlots.length - 1) targetSlotIdx = timeSlots.length - 1;
                                    
                                    currentSequenceState[targetItemIdx][1] = targetSlotIdx;

                                    const selectEl = document.querySelector(`select[data-index="${targetItemIdx}"]`);
                                    if(selectEl) selectEl.value = targetSlotIdx;
                                }
                            },
                            onDragEnd: function (e, datasetIndex, index, value) {
                                renderTable();
                                renderChart(); 
                                autoSaveState();
                            }
                        },
                        tooltip: {
                            backgroundColor: '#ffffff',
                            titleColor: '#1a1a1a',
                            bodyColor: '#444444',
                            borderColor: '#1a1a1a',
                            borderWidth: 2,
                            titleFont: { size: 12, weight: 'bold' },
                            bodyFont: { size: 11 },
                            padding: 8,
                            cornerRadius: 4,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    const idx = context[0].dataIndex;
                                    if (currentChartMode === 'horarios') {
                                        const displayNum = String(idx + 1).padStart(2, '0');
                                        return `${displayNum}: ${currentSequenceState[idx][2]}`;
                                    } else {
                                        return `Janela: Item ${idx+1} para Item ${idx+2}`;
                                    }
                                },
                                label: function(context) {
                                    const idx = context.dataIndex;
                                    if (currentChartMode === 'horarios') {
                                        const currentHour = timeSlots[currentSequenceState[idx][1]];
                                        if (idx === 0) return `${currentHour} | START`;
                                        const diff = timeToMinutes(currentSequenceState[idx][1]) - timeToMinutes(currentSequenceState[idx-1][1]);
                                        return `${currentHour} | Intervalo: ${formatIntervalText(diff)}`;
                                    } else {
                                        const targetItemIdx = idx + 1;
                                        const currentHour = timeSlots[currentSequenceState[targetItemIdx][1]];
                                        const diff = timeToMinutes(currentSequenceState[targetItemIdx][1]) - timeToMinutes(currentSequenceState[targetItemIdx-1][1]);
                                        return `De: ${currentSequenceState[targetItemIdx-1][2]} ➔ Para: ${currentSequenceState[targetItemIdx][2]}\nIntervalo: ${formatIntervalText(diff)} (Postado às ${currentHour})`;
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            grid: { display: true, color: '#f0f0f0' }, 
                            ticks: { 
                                color: '#1a1a1a', 
                                font: { size: 11, weight: 'bold' },
                                padding: 10
                            } 
                        },
                        y: configYScale
                    }
                }
            });
        }

        // Alternador de Visualização
        document.getElementById('toggleChartModeBtn').addEventListener('click', (e) => {
            if(currentChartMode === 'horarios') {
                currentChartMode = 'intervalos';
                e.target.textContent = "Visualização: Intervalo";
            } else {
                currentChartMode = 'horarios';
                e.target.textContent = "Visualização: Horário";
            }
            renderChart();
        });

        // Captura de Tela Unificada (Gráfico + Tabela)
        document.getElementById('captureScreenBtn').addEventListener('click', () => {
            const node = document.getElementById('dashboardMain');
            const btn = document.getElementById('captureScreenBtn');
            
            btn.innerText = "Processando...";
            btn.disabled = true;

            domtoimage.toPng(node, { bgcolor: '#ffffff', quality: 1.0 })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = 'cronograma-completo.png';
                    link.href = dataUrl;
                    link.click();
                    
                    btn.innerText = "📷 Salvar como Imagem (Tudo)";
                    btn.disabled = false;
                })
                .catch(function (error) {
                    console.error('Erro ao gerar imagem:', error);
                    btn.innerText = "📷 Salvar como Imagem (Tudo)";
                    btn.disabled = false;
                });
        });

        // Copiar dados textuais
        document.getElementById('exportTextBtn').addEventListener('click', () => {
            if (currentSequenceState.length === 0) return;
            const textLines = currentSequenceState.map((item, index) => {
                const time = timeSlots[item[1]];
                let intervalStr = " (START)";
                if (index > 0) {
                    const diff = timeToMinutes(item[1]) - timeToMinutes(currentSequenceState[index - 1][1]);
                    intervalStr = ` (${formatIntervalText(diff)})`;
                }
                return `${index + 1}. ${time} - ${item[2]}${intervalStr}`;
            });
            navigator.clipboard.writeText(textLines.join('\n'));
        });

        // Adicionar novo item
        document.getElementById('addMediaBtn').addEventListener('click', () => {
            const nextIndex = currentSequenceState.length + 1;
            const uniqueId = 'id_' + Date.now();
            const lastTime = currentSequenceState.length > 0 ? currentSequenceState[currentSequenceState.length - 1][1] : 0;
            
            currentSequenceState.push([uniqueId, lastTime, `Item ${nextIndex}`]);

            renderChart();
            renderTable();
            autoSaveState();
        });

        // Salvar Nova Configuração Customizada
        document.getElementById('savePatternBtn').addEventListener('click', () => {
            const name = prompt("Defina o nome da nova configuração:");
            if (!name || !name.trim()) return;
            const cleanName = name.trim();

            const customs = getCustomPatterns();
            customs[cleanName] = currentSequenceState;
            localStorage.setItem('c_custom_configs_v18', JSON.stringify(customs));

            updateDropdown();
            document.getElementById('patternSelect').value = `custom_${cleanName}`;
            autoSaveState();
        });

        // Resetar Padrão Ativo
        document.getElementById('resetPatternBtn').addEventListener('click', () => {
            const key = getActivePatternKey();
            if (key.startsWith('custom_')) {
                if(confirm("Deseja deletar essa configuração customizada?")) {
                    const cleanKey = key.replace('custom_', '');
                    const customs = getCustomPatterns();
                    delete customs[cleanKey];
                    localStorage.setItem('c_custom_configs_v18', JSON.stringify(customs));
                    updateDropdown();
                    document.getElementById('patternSelect').value = 'instagram';
                    loadState();
                }
            } else {
                localStorage.removeItem(`c_data_v18_${key}`);
                loadState();
            }
            renderChart();
            renderTable();
            autoSaveState();
        });

        document.getElementById('patternSelect').addEventListener('change', () => {
            loadState();
            renderChart();
            renderTable();
        });

        // Inicialização técnica estável
        updateDropdown();
        loadState();
        renderChart();
        renderTable();
    </script>
</body>
</html>
