const SPEED=100;

// AUDIO ENGINE

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

document.addEventListener("click",()=>{
    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
},{once:true});


const melodies={

system:[
523,659,784
],

battle:[
880,660,440
],

capture:[
523,659,784,1046
],

level:[
659,784,988,1318
],

],

523,659,523
]

};


function playMelody(type){

    if(audioCtx.state!=="running")
        return;

    const notes=melodies[type] || melodies.system;


    notes.forEach((freq,i)=>{

        setTimeout(()=>{

            const osc=audioCtx.createOscillator();
            const gain=audioCtx.createGain();


            osc.type="square";
            osc.frequency.value=freq;


            gain.gain.setValueAtTime(
                0.04,
                audioCtx.currentTime
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioCtx.currentTime+0.08
            );


            osc.connect(gain);
            gain.connect(audioCtx.destination);


            osc.start();

            osc.stop(
                audioCtx.currentTime+0.08
            );


        },i*90);

    });
}



// WORKER

const workerCode=`

const logs=${JSON.stringify(logs)};
const SPEED=${SPEED};

let line=0;
let pos=0;
let icon=0;


function tick(){

    const text=logs[line][0];
    const type=logs[line][1];


    postMessage({

        title:text.substring(pos)||text,

        icon:icon,

        line:line,

        type:type

    });


    icon++;

    if(icon>=2)
        icon=0;


    pos++;


    if(pos>text.length){

        line++;

        if(line>=logs.length)
            line=0;

        pos=0;

    }


    setTimeout(tick,SPEED);

}


tick();

`;



const worker=new Worker(

    URL.createObjectURL(

        new Blob(

            [workerCode],

            {type:"application/javascript"}

        )

    )

);



let lastLine=-1;



worker.onmessage=e=>{


    document.title=e.data.title;


    favicon.href=faviconFrames[e.data.icon];



    if(e.data.line!==lastLine){

        lastLine=e.data.line;

        playMelody(e.data.type);

    }


};
