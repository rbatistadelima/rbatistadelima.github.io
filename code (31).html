<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ID Face Aligner</title>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2"></script>
<style>
body { font-family: sans-serif; text-align: center; background: #fafafa; padding: 20px; }
#dropzone { border: 3px dashed #bbb; padding: 40px; border-radius: 20px; background: #fff; margin: 20px auto; width: 80%; }
canvas { margin: 5px; border-radius: 10px; box-shadow: 0 0 6px rgba(0,0,0,0.2); }
</style>
</head>
<body ondrop="handleDrop(event)" ondragover="event.preventDefault()">
<h1>🪪 ID Photo Aligner</h1>
<div id="status">Loading models...</div>
<div id="dropzone">Drop face photos here</div>
<div id="gallery"></div>

<script>
async function loadModels() {
  const modelUrl = "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights";
  await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(modelUrl);
  document.getElementById("status").textContent = "✅ Models loaded. Drop photos.";
}
loadModels();

async function handleDrop(e) {
  e.preventDefault();
  const files = e.dataTransfer.files;
  const gallery = document.getElementById("gallery");
  document.getElementById("status").textContent = "Aligning faces...";
  gallery.innerHTML = "";

  for (const file of files) {
    const img = await fileToImage(file);
    const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true);
    if (!det) continue;

    const aligned = await makeIDPhoto(img, det);
    gallery.appendChild(aligned);
  }
  document.getElementById("status").textContent = "✅ Done.";
}

function fileToImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(file);
  });
}

async function makeIDPhoto(img, det) {
  const landmarks = det.landmarks;
  const leftEye = landmarks.getLeftEye();
  const rightEye = landmarks.getRightEye();
  const nose = landmarks.getNose();

  const eyeCenterX = (leftEye[0].x + rightEye[3].x) / 2;
  const eyeCenterY = (leftEye[0].y + rightEye[3].y) / 2;
  const dx = rightEye[3].x - leftEye[0].x;
  const dy = rightEye[3].y - leftEye[0].y;
  const angle = Math.atan2(dy, dx);
  const scale = 160 / dx; // zoom to fit head
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const size = 512;
  canvas.width = canvas.height = size;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, size, size);
  ctx.translate(size/2, size/2);
  ctx.rotate(-angle);
  ctx.scale(scale, scale);
  ctx.drawImage(img, -eyeCenterX, -eyeCenterY);

  return canvas;
}
</script>
</body>
</html>
