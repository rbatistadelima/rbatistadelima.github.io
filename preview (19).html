<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ TTS Lab — Stable Queue + Preloaded Kaori</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<script src="https://code.responsivevoice.org/responsivevoice.js"></script>

<style>
html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}

textarea{
  width:90%;max-width:980px;height:140px;
  background:#121214;color:#fff;border:0;padding:10px;
}

.karaoke{
  width:90%;max-width:980px;
  background:#141417;padding:14px;
  border-radius:8px;min-height:120px;
}

button{
  background:#222;color:#fff;border:0;
  padding:10px;border-radius:8px;cursor:pointer;
}

button:disabled{
  opacity:0.5;
}

.status{
  font-size:0.9rem;
  color:#aaa;
}
</style>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

/* ---------------- GLOBAL LOCK (CRITICAL FIX) ---------------- */

let audioLock = Promise.resolve();

/* garante execução 100% serial */
function lock(fn){
  audioLock = audioLock.then(fn);
  return audioLock;
}

/* ---------------- KAORI PRELOAD ---------------- */

let kaoriPipeline = null;
let kaoriReady = false;

async function preloadKaori(){

  document.getElementById("status").innerText =
    "Pré-carregando Kaori (IA)...";

  // start immediately (no blocking UI)
  kaoriPipeline = await pipeline(
    "text-to-speech",
    "Xenova/mms-tts-por"
  );

  // warmup (reduz delay no first speak)
  await kaoriPipeline("ok");

  kaoriReady = true;

  document.getElementById("status").innerText =
    "Kaori pronta ✔";
}

window.addEventListener("DOMContentLoaded", preloadKaori);

/* ---------------- KAORI SPEAK ---------------- */

async function kaoriSpeak(text){

  const out = await kaoriPipeline(text);

  const ctx = new AudioContext();

  const buf = ctx.createBuffer(1, out.sampling_rate, out.sampling_rate);
  buf.copyToChannel(out.audio, 0);

  const src = ctx.createBufferSource();
  src.buffer = buf;

  src.connect(ctx.destination);
  src.start();

  return new Promise(r => (src.onended = r));
}

/* ---------------- VOICES ---------------- */

let voices = speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

function pickFemale(){
  return voices.find(v=>/female|luciana|google/i.test(v.name))
    || voices.find(v=>v.lang?.includes("pt"))
    || voices[0];
}

function pickMale(){
  return voices.find(v=>/male|daniel/i.test(v.name))
    || voices.find(v=>v.lang?.includes("pt"))
    || voices[0];
}

/* ---------------- SYNTH (LOCKED) ---------------- */

function speakBrowser(text, voice){
  return lock(() => new Promise(r => {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = "pt-BR";

    u.onend = r;
    u.onerror = r;

    speechSynthesis.speak(u);
  }));
}

/* ---------------- OTHER SERVICES ---------------- */

function googleTTS(text){
  return lock(() => new Promise(r => {
    const a = new Audio(
      "https://translate.google.com/translate_tts?ie=UTF-8&q=" +
      encodeURIComponent(text) +
      "&tl=pt-BR&client=tw-ob"
    );
    a.onended = r;
    a.play().catch(r);
  }));
}

function rv(text){
  return lock(() => new Promise(r => {
    responsiveVoice.speak(text, "Brazilian Portuguese Female", {
      onend: r
    });
  }));
}

/* ---------------- ROUTER (NO INTERRUPTION FIX) ---------------- */

function speak(name,text){

  const n = name.toLowerCase();

  if(n.includes("kaori")){
    return lock(async () => {
      // wait preload guaranteed
      while(!kaoriReady){
        await new Promise(r => setTimeout(r,50));
      }
      await kaoriSpeak(text);
    });
  }

  if(n==="ana") return rv(text);
  if(n==="regina") return googleTTS(text);

  if(n==="daniel") return speakBrowser(text, pickMale());

  return speakBrowser(text, pickFemale());
}

/* ---------------- FLOW ---------------- */

async function start(){

  const lines = document.getElementById("texto")
    .value.split("\n").filter(Boolean);

  for(const line of lines){

    const m = line.match(/^([^:]+):\s*(.*)$/);
    if(!m) continue;

    const name = m[1];
    const text = m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speak(name,text);
  }
}

window.start = start;

</script>
</head>

<body>

<div class="status" id="status">Inicializando...</div>

<textarea id="texto">
Daniel: Eu não devo mais interromper Kaori.
Maria: Voz estável.
Regina: Google TTS sincronizado.
Ana: ResponsiveVoice ativo.
Kaori: Agora eu já estou pré-carregada no boot.
Daniel: Agora está tudo em fila correta.
</textarea>

<div class="karaoke" id="karaoke"></div>

<button onclick="start()">▶ Play</button>

</body>
</html>
