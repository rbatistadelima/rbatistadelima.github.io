<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beck - Sound & Vision 360 Player (Stereo Pan Fix)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
            cursor: default;
        }
        body.playing {
            cursor: none;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            cursor: default;
        }
        #drop-zone.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .drop-box {
            border: 3px dashed #fff;
            padding: 40px 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            max-width: 500px;
        }
        button {
            background: #fff;
            border: none;
            color: #000;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #ccc;
        }
        .file-status {
            color: #aaa;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="drop-zone">
        <div class="drop-box">
            <h1>Drop 360 Video & Audio</h1>
            <p>Drag and drop your video file (.mp4) and audio file (.mp3/.wav) here together, or browse.</p>
            <input type="file" id="file-input" accept="video/*,audio/*" multiple style="display: none;">
            <button id="browse-btn">Browse Files</button>
            <div class="file-status" id="drop-status">Waiting for files...</div>
        </div>
    </div>

    <div id="webgl-container
