<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dungeon Crawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 800px;
            height: 500px;
            position: relative;
            perspective: 800px;
            margin-bottom: 20px;
        }

        .dungeon-view {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateY(0deg);
            transition: transform 0.3s;
        }

        /* Floor and ceiling */
        .floor, .ceiling {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background: 
                repeating-linear-gradient(
                    90deg,
                    #222,
                    #222 50px,
                    #333 50px,
                    #333 100px
                ),
                repeating-linear-gradient(
                    0deg,
                    #222,
                    #222 50px,
                    #333 50px,
                    #333 100px
                );
            background-blend-mode: multiply;
            transform-origin: center;
        }

        .floor {
            bottom: -500px;
            transform: rotateX(90deg);
        }

        .ceiling {
            top: -500px;
            transform: rotateX(-90deg);
            background: #111;
        }

        /* Walls */
        .wall {
            position: absolute;
            width: 200px;
            height: 200px;
            background: 
                linear-gradient(0deg, #333, #555, #333),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 49px,
                    #666 49px,
                    #666 50px
                );
            background-blend-mode: overlay;
            transform-origin: center;
            border: 1px solid #444;
        }

        /* Position walls to form a simple maze */
        .wall.front { transform: translateZ(100px); }
        .wall.back { transform: translateZ(-100px) rotateY(180deg); }
        .wall.left { transform: translateX(-100px) rotateY(-90deg); }
        .wall.right { transform: translateX(100px) rotateY(90deg); }

        /* Additional walls for maze */
        .wall.middle-front { transform: translateZ(50px) translateX(-50px); width: 100px; }
        .wall.middle-back { transform: translateZ(-50px) translateX(50px) rotateY(180deg); width: 100px; }
        .wall.middle-left { transform: translateX(-150px) translateZ(50px) rotateY(-90deg); height: 100px; }
        .wall.middle-right { transform: translateX(150px) translateZ(-50px) rotateY(90deg); height: 100px; }

        /* Player */
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #f00;
            border-radius: 50%;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 200px;
            margin-top: 20px;
        }

        .control-btn {
            background: #222;
            border: 2px solid #0f0;
            color: #0f0;
            font-size: 24px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        .control-btn:active {
            background: #0f0;
            color: #000;
        }

        .forward { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .back { grid-column: 2; grid-row: 3; }

        /* Status display */
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
        }

        /* Instructions */
        .instructions {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        /* Pseudo 3D effect with CSS gradients for walls */
        .wall::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.3) 100%);
        }
    </style>
</head>
<body>
    <h1>CSS Dungeon Crawler</h1>
    
    <div class="game-container">
        <div class="dungeon-view">
            <div class="ceiling"></div>
            <div class="floor"></div>
            
            <!-- Walls -->
            <div class="wall front"></div>
            <div class="wall back"></div>
            <div class="wall left"></div>
            <div class="wall right"></div>
            
            <!-- Maze walls -->
            <div class="wall middle-front"></div>
            <div class="wall middle-back"></div>
            <div class="wall middle-left"></div>
            <div class="wall middle-right"></div>
            
            <div class="player"></div>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn forward">↑</div>
        <div class="control-btn left">←</div>
        <div class="control-btn right">→</div>
        <div class="control-btn back">↓</div>
    </div>
    
    <div class="status">
        Position: (0, 0) | Facing: North
    </div>
    
    <div class="instructions">
        Use arrow buttons to navigate the dungeon
    </div>

    <script>
        // Simple JavaScript to handle movement
        document.addEventListener('DOMContentLoaded', function() {
            const dungeonView = document.querySelector('.dungeon-view');
            const status = document.querySelector('.status');
            let rotationY = 0;
            let positionX = 0;
            let positionZ = 0;
            
            // Direction names based on rotation
            const directions = ['North', 'East', 'South', 'West'];
            
            function updateView() {
                dungeonView.style.transform = `rotateX(60deg) rotateY(${rotationY}deg)`;
                
                // Update status
                const directionIndex = Math.round((rotationY % 360) / 90);
                const direction = directions[(directionIndex + 4) % 4];
                status.textContent = `Position: (${positionX}, ${positionZ}) | Facing: ${direction}`;
            }
            
            // Button event handlers
            document.querySelector('.forward').addEventListener('click', function() {
                // Move forward based on current rotation
                const rad = rotationY * Math.PI / 180;
                positionX += Math.sin(rad) * 20;
                positionZ += Math.cos(rad) * 20;
                updateView();
            });
            
            document.querySelector('.back').addEventListener('click', function() {
                // Move backward based on current rotation
                const rad = rotationY * Math.PI / 180;
                positionX -= Math.sin(rad) * 20;
                positionZ -= Math.cos(rad) * 20;
                updateView();
            });
            
            document.querySelector('.left').addEventListener('click', function() {
                rotationY += 15;
                updateView();
            });
            
            document.querySelector('.right').addEventListener('click', function() {
                rotationY -= 15;
                updateView();
            });
            
            // Keyboard controls
            document.addEventListener('keydown', function(e) {
                switch(e.key) {
                    case 'ArrowUp':
                        document.querySelector('.forward').click();
                        break;
                    case 'ArrowDown':
                        document.querySelector('.back').click();
                        break;
                    case 'ArrowLeft':
                        document.querySelector('.left').click();
                        break;
                    case 'ArrowRight':
                        document.querySelector('.right').click();
                        break;
                }
            });
            
            // Initialize
            updateView();
        });
    </script>
</body>
</html>
