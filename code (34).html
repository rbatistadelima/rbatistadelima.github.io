<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ID Photo Face Aligner</title>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  text-align: center;
  margin: 20px;
}
#dropzone {
  border: 3px dashed #bbb;
  background: #fff;
  padding: 40px;
  border-radius: 20px;
  margin-bottom: 20px;
}
#gallery canvas {
  margin: 6px;
  border-radius: 12px;
  box-shadow: 0 0 6px rgba(0,0,0,0.2);
}
button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
</style>
</head>
<body ondrop="handleDrop(event)" ondragover="event.preventDefault()">
<h1>🪪 ID Photo Face Aligner</h1>
<div id="status">Loading models...</div>
<div id="dropzone">Drop portraits here (up to 200)</div>
<button onclick="downloadAll()">⬇️ Download All as ZIP</button>
<div id="gallery"></div>

<script>
let zip = new JSZip();

async function loadModels() {
  const url = "https://cdn.jsdelivr.net/npm/face-api.js/models";
  await faceapi.nets.tinyFaceDetector.loadFromUri(url);
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(url);
  document.getElementById("status").textContent = "✅ Models loaded. Drop your images below.";
}
window.addEventListener("DOMContentLoaded", loadModels);

async function handleDrop(e) {
  e.preventDefault();
  const files = e.dataTransfer.files;
  document.getElementById("status").textContent = "Aligning faces...";
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  zip = new JSZip();

  for (const file of files) {
    const img = await loadImage(file);
    const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true);
    if (!det) continue;
    const aligned = await alignAsIDPhoto(img, det);
    gallery.appendChild(aligned.canvas);
    const blob = await new Promise(r => aligned.canvas.toBlob(r, "image/jpeg"));
    zip.file(`${file.name.replace(/\.[^/.]+$/, "")}_id.jpg`, blob);
  }

  document.getElementById("status").textContent = "✅ All faces aligned like ID photos.";
}

function loadImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(file);
  });
}

async function alignAsIDPhoto(img, det) {
  const landmarks = det.landmarks;
  const leftEye = landmarks.getLeftEye();
  const rightEye = landmarks.getRightEye();
  const jaw = landmarks.getJawOutline();

  const eyeCenterX = (leftEye[0].x + rightEye[3].x) / 2;
  const eyeCenterY = (leftEye[0].y + rightEye[3].y) / 2;
  const chinY = jaw[8].y;
  const headTopY = Math.min(...landmarks.positions.map(p => p.y));

  const dx = rightEye[3].x - leftEye[0].x;
  const dy = rightEye[3].y - leftEye[0].y;
  const angle = Math.atan2(dy, dx);
  const faceHeight = chinY - headTopY;
  const desiredFaceHeight = 400; // pixels of head height
  const scale = desiredFaceHeight / faceHeight;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const width = 480, height = 640;
  canvas.width = width; canvas.height = height;

  ctx.translate(width / 2, height / 2);
  ctx.rotate(-angle);
  ctx.scale(scale, scale);
  ctx.drawImage(img, -eyeCenterX, -eyeCenterY);

  // shift to make eyes ~60% from top
  const eyeOffsetY = height * 0.6 - height / 2;
  const tmp = document.createElement("canvas");
  tmp.width = width; tmp.height = height;
  const tmpCtx = tmp.getContext("2d");
  tmpCtx.drawImage(canvas, 0, eyeOffsetY);
  return {canvas: tmp};
}

async function downloadAll() {
  const blob = await zip.generateAsync({type: "blob"});
  saveAs(blob, "id_faces.zip");
}
</script>
</body>
</html>
