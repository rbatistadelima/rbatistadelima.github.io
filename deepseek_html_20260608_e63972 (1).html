<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TTS Lab — Kaori Opcional + Fila Instantânea</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .status-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            font-size: 0.875rem;
        }
        
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .led.ready { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .led.loading { background: #eab308; animation: pulse 1s infinite; }
        .led.idle { background: #64748b; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        textarea {
            width: 100%;
            background: #121214;
            color: #fff;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .karaoke {
            background: #121214;
            border-radius: 12px;
            padding: 20px;
            min-height: 80px;
            font-size: 1rem;
            border-left: 3px solid #8b5cf6;
            margin-bottom: 16px;
        }
        
        .karaoke b { color: #8b5cf6; }
        
        button {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 12px;
        }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        
        .btn-secondary { background: linear-gradient(135deg, #64748b, #475569); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .queue-status {
            background: #121214;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 12px;
        }
        
        .engine-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px;
            background: #121214;
            border-radius: 12px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #475569;
            transition: 0.3s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #8b5cf6;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .badge-kaori { background: #8b5cf6; }
        .badge-fallback { background: #64748b; }
        
        .timer {
            font-family: monospace;
            font-size: 0.8rem;
            color: #22c55e;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="margin-bottom: 16px;">🎙️ TTS Multi-personagem</h2>
            
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="led" id="kaoriLed"></div>
                    <span>Kaori (Neural)</span>
                </div>
                <div class="status-indicator">
                    <div class="led" id="engineLed"></div>
                    <span id="engineStatus">Fallback Rápido</span>
                </div>
            </div>
            
            <div class="engine-toggle">
                <span>🤖 Usar Kaori (mais lento, 200-500ms por frase)</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="kaoriToggle">
                    <span class="slider"></span>
                </label>
                <span>⚡ Fallback Instantâneo (Web Speech)</span>
            </div>
            
            <textarea id="texto" rows="8">Kaori: Olá, eu sou a voz neural.
Daniel: Teste de fallback rápido.
Kaori: Segunda frase da Kaori.
Maria: Voz feminina padrão.
Kaori: Último teste de performance!</textarea>
            
            <div class="karaoke" id="karaoke">
                💬 Clique em Play
            </div>
            
            <div>
                <button id="playBtn">▶ Play Sequencial</button>
                <button id="cancelBtn" class="btn-danger">🛑 Cancelar</button>
                <button id="testBtn" class="btn-secondary">⚡ Teste Velocidade</button>
            </div>
            
            <div class="queue-status" id="queueStatus">
                ✅ Pronto
            </div>
        </div>
    </div>
    
    <script>
        // ============================================
        // ENGINE PRINCIPAL COM FALLAZY LOAD
        // ============================================
        
        class FastTTS {
            constructor() {
                this.audioLock = Promise.resolve();
                this.kaoriPipeline = null;
                this.kaoriReady = false;
                this.kaoriLoading = false;
                this.useKaori = false;
                this.audioContext = null;
                
                this.init();
            }
            
            async init() {
                this.loadVoices();
                this.attachEvents();
                
                // Pré-carrega vozes do sistema
                if (window.speechSynthesis) {
                    window.speechSynthesis.getVoices();
                }
                
                // Marca fallback como pronto
                document.getElementById('engineLed').className = 'led ready';
                document.getElementById('engineStatus').innerHTML = '⚡ Fallback Rápido';
                document.getElementById('kaoriLed').className = 'led idle';
            }
            
            loadVoices() {
                if (typeof speechSynthesis !== 'undefined') {
                    this.voices = speechSynthesis.getVoices();
                    speechSynthesis.onvoiceschanged = () => {
                        this.voices = speechSynthesis.getVoices();
                    };
                }
            }
            
            attachEvents() {
                const toggle = document.getElementById('kaoriToggle');
                toggle.addEventListener('change', async (e) => {
                    this.useKaori = e.target.checked;
                    
                    if (this.useKaori && !this.kaoriReady && !this.kaoriLoading) {
                        await this.loadKaori();
                    }
                    
                    const status = this.useKaori ? 
                        (this.kaoriReady ? '🎙️ Kaori Neural' : '⏳ Carregando Kaori...') : 
                        '⚡ Fallback Rápido';
                    
                    document.getElementById('engineStatus').innerHTML = status;
                    document.getElementById('kaoriLed').className = 
                        this.kaoriReady ? 'led ready' : (this.kaoriLoading ? 'led loading' : 'led idle');
                });
            }
            
            async loadKaori() {
                if (this.kaoriLoading || this.kaoriReady) return;
                
                this.kaoriLoading = true;
                document.getElementById('kaoriLed').className = 'led loading';
                document.getElementById('engineStatus').innerHTML = '⏳ Baixando Kaori (300MB)...';
                
                try {
                    // Importa dinamicamente apenas se necessário
                    const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.js');
                    
                    this.kaoriPipeline = await pipeline(
                        'text-to-speech',
                        'Xenova/mms-tts-por'
                    );
                    
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.kaoriReady = true;
                    
                    document.getElementById('kaoriLed').className = 'led ready';
                    document.getElementById('engineStatus').innerHTML = '🎙️ Kaori Neural';
                    
                    console.log('✅ Kaori carregada');
                    
                } catch (error) {
                    console.error('Erro Kaori:', error);
                    this.kaoriReady = false;
                    document.getElementById('kaoriLed').className = 'led idle';
                    document.getElementById('engineStatus').innerHTML = '⚠️ Kaori falhou, usando fallback';
                    this.useKaori = false;
                    document.getElementById('kaoriToggle').checked = false;
                } finally {
                    this.kaoriLoading = false;
                }
            }
            
            // Lock para execução serial
            lock(fn) {
                this.audioLock = this.audioLock.then(fn).catch(console.error);
                return this.audioLock;
            }
            
            // Fallback RÁPIDO (Web Speech)
            speakFallback(text, voiceType = 'female') {
                return new Promise((resolve) => {
                    if (!window.speechSynthesis) {
                        resolve();
                        return;
                    }
                    
                    // Cancela anterior para evitar acúmulo
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 0.95;
                    utterance.pitch = voiceType === 'female' ? 1.1 : 0.9;
                    
                    // Tenta encontrar voz melhor
                    if (this.voices && this.voices.length) {
                        const voice = this.voices.find(v => 
                            voiceType === 'female' ? 
                            (v.name.includes('Google') || v.name.includes('Microsoft') || v.name.includes('Samantha')) :
                            (v.name.includes('Daniel') || v.name.includes('Google') && v.lang === 'pt-BR')
                        );
                        if (voice) utterance.voice = voice;
                    }
                    
                    utterance.onend = () => resolve();
                    utterance.onerror = () => resolve();
                    
                    window.speechSynthesis.speak(utterance);
                });
            }
            
            // Kaori (lento, mas neural)
            async speakKaori(text) {
                if (!this.kaoriReady || !this.kaoriPipeline) {
                    throw new Error('Kaori não pronta');
                }
                
                const output = await this.kaoriPipeline(text);
                
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                const audioBuffer = this.audioContext.createBuffer(
                    1, output.audio.length, output.sampling_rate
                );
                audioBuffer.copyToChannel(output.audio, 0);
                
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(this.audioContext.destination);
                source.start();
                
                return new Promise((resolve) => {
                    source.onended = resolve;
                });
            }
            
            async speak(name, text) {
                return this.lock(async () => {
                    this.updateDisplay(name, text);
                    
                    const startTime = performance.now();
                    const isKaoriChar = name.toLowerCase().includes('kaori');
                    const useNeural = this.useKaori && this.kaoriReady && isKaoriChar;
                    
                    if (useNeural) {
                        await this.speakKaori(text);
                    } else {
                        const voiceType = name.toLowerCase().includes('daniel') ? 'male' : 'female';
                        await this.speakFallback(text, voiceType);
                    }
                    
                    const elapsed = (performance.now() - startTime).toFixed(0);
                    this.showTimer(elapsed, useNeural);
                    
                    // Pausa mínima
                    await new Promise(r => setTimeout(r, 50));
                });
            }
            
            updateDisplay(name, text) {
                const karaoke = document.getElementById('karaoke');
                const isKaori = name.toLowerCase().includes('kaori');
                const badge = `<span class="badge ${isKaori && this.useKaori && this.kaoriReady ? 'badge-kaori' : 'badge-fallback'}">${isKaori && this.useKaori && this.kaoriReady ? '🎙️ Kaori' : '⚡ Fallback'}</span>`;
                karaoke.innerHTML = `<b>${name}:</b> ${text} ${badge}`;
            }
            
            showTimer(ms, isKaori) {
                const queueStatus = document.getElementById('queueStatus');
                const icon = isKaori ? '🎙️' : '⚡';
                queueStatus.innerHTML = `${icon} Falou em ${ms}ms`;
                setTimeout(() => {
                    if (queueStatus.innerHTML.includes(`${ms}ms`)) {
                        queueStatus.innerHTML = '✅ Pronto';
                    }
                }, 1500);
            }
            
            async playAll() {
                const playBtn = document.getElementById('playBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const textarea = document.getElementById('texto');
                
                playBtn.disabled = true;
                playBtn.textContent = '⏳ Tocando...';
                cancelBtn.disabled = false;
                
                const lines = textarea.value.split('\n').filter(l => l.trim());
                
                try {
                    for (let i = 0; i < lines.length; i++) {
                        const match = lines[i].match(/^([^:]+):\s*(.*)$/);
                        if (!match) continue;
                        
                        const name = match[1].trim();
                        const text = match[2].trim();
                        
                        document.getElementById('queueStatus').innerHTML = `📢 Falando: ${name} (${i+1}/${lines.length})`;
                        await this.speak(name, text);
                    }
                    
                    document.getElementById('queueStatus').innerHTML = '✅ Sequência completa!';
                    
                } catch (error) {
                    document.getElementById('queueStatus').innerHTML = '❌ Erro na execução';
                } finally {
                    playBtn.disabled = false;
                    playBtn.textContent = '▶ Play Sequencial';
                    cancelBtn.disabled = true;
                }
            }
            
            cancel() {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                this.audioLock = Promise.resolve();
                document.getElementById('queueStatus').innerHTML = '⏸️ Cancelado';
                document.getElementById('playBtn').disabled = false;
                document.getElementById('playBtn').textContent = '▶ Play Sequencial';
            }
            
            async testSpeed() {
                const results = [];
                
                // Teste Fallback
                for (let i = 0; i < 3; i++) {
                    const start = performance.now();
                    await this.speakFallback("Teste de velocidade");
                    results.push(performance.now() - start);
                }
                
                const fallbackAvg = (results.reduce((a,b) => a+b, 0) / 3).toFixed(0);
                
                let kaoriAvg = 'N/A';
                if (this.kaoriReady) {
                    const kaoriResults = [];
                    for (let i = 0; i < 2; i++) {
                        const start = performance.now();
                        await this.speakKaori("Teste neural");
                        kaoriResults.push(performance.now() - start);
                    }
                    kaoriAvg = (kaoriResults.reduce((a,b) => a+b, 0) / 2).toFixed(0);
                }
                
                document.getElementById('queueStatus').innerHTML = `⚡ Fallback: ${fallbackAvg}ms | 🎙️ Kaori: ${kaoriAvg === 'N/A' ? 'Não carregado' : kaoriAvg + 'ms'}`;
            }
        }
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        
        const app = new FastTTS();
        
        document.getElementById('playBtn').onclick = () => app.playAll();
        document.getElementById('cancelBtn').onclick = () => app.cancel();
        document.getElementById('testBtn').onclick = () => app.testSpeed();
        
        // Ativa AudioContext na primeira interação
        document.body.addEventListener('click', async () => {
            if (app.audioContext && app.audioContext.state === 'suspended') {
                await app.audioContext.resume();
            }
        });
        
        console.log('✅ App pronto - Fallback instantâneo ativo');
    </script>
</body>
</html>
