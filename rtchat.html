<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous Cloud IRC Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (min-width: 481px) {
            #chat-container {
                height: 100vh;
                box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            }
        }
        #status-bar {
            padding: 10px 14px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 11px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fafafa;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 9px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 10px 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 16px; /* Prevents auto-zoom on iPhone 8 */
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 8px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div class="status-row">
            <span id="status-text">Connecting to cloud highscore log...</span>
            <div id="identity-display">You: Loading...</div>
        </div>
        <div class="status-row" id="room-controls">
            <span>Room: <strong id="room-display">...</strong></span>
            <button onclick="newRoom()">New Room</button>
        </div>
    </div>
    
    <div id="messages"></div>
    
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    const myUniqueId = 'u_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    document.getElementById('room-display').textContent = roomName;

    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const statusText = document.getElementById('status-text');

    // Free public JSON storage bin endpoint mapped dynamically to your room hash
    const STORAGE_URL = `https://json.extendsclass.com/bin/irc_room_${roomName}`;

    let cachedMessages = [];
    let isSyncing = false;

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function fetchCloudLog() {
        if (isSyncing) return;
        isSyncing = true;
        try {
            const response = await fetch(STORAGE_URL, { cache: 'no-store' });
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data) && JSON.stringify(data) !== JSON.stringify(cachedMessages)) {
                    cachedMessages = data;
                    renderChatHistory(data);
                }
                statusText.textContent = `Online (Synced)`;
            } else if (response.status === 404) {
                // If room bin doesn't exist yet, initialize it
                await initializeBin();
            }
        } catch(e) {
            statusText.textContent = `Offline (Using Local Log)`;
            // Fallback to local storage if network drops
            const local = localStorage.getItem('fallback_log_' + roomName);
            if (local && cachedMessages.length === 0) {
                cachedMessages = JSON.parse(local);
                renderChatHistory(cachedMessages);
            }
        } finally {
            isSyncing = false;
        }
    }

    async function initializeBin() {
        try {
            await fetch(STORAGE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([])
            });
        } catch(e) {}
    }

    async function postMessageToCloud(text) {
        const time = getTimeString();
        const newMsg = { sender: myName, uid: myUniqueId, text: text, time: time };
        
        cachedMessages.push(newMsg);
        if (cachedMessages.length > 100) cachedMessages.shift(); // Keep last 100 messages like a high-score table

        renderChatHistory(cachedMessages);
        localStorage.setItem('fallback_log_' + roomName, JSON.stringify(cachedMessages));
        
        messageInput.value = '';
        messageInput.blur(); // Dismisses virtual keyboard smoothly on iPhone 8

        try {
            // Push updated message array to the online JSON storage bin
            await fetch(STORAGE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cachedMessages)
            });
        } catch(e) {
            statusText.textContent = `Cloud sync pending...`;
        }
    }

    function renderChatHistory(messages) {
        const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 60;
        messagesContainer.innerHTML = '';

        messages.forEach(msg => {
            const div = document.createElement('div');
            const isSelf = msg.uid === myUniqueId;
            div.className = `message ${isSelf ? 'sent' : 'received'}`;
            div.innerHTML = `
                <div class="msg-header">
                    <span>${msg.sender}</span>
                    <span class="msg-time">${msg.time}</span>
                </div>
                <div>${msg.text}</div>
            `;
            messagesContainer.appendChild(div);
        });

        if (isAtBottom || messages.length <= 5) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
            postMessageToCloud(text);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function newRoom() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    }

    window.onload = () => {
        fetchCloudLog();
        // Poll every 2.5 seconds to pull new entries from other users/devices automatically
        setInterval(fetchCloudLog, 2500);
    };
</script>

</body>
</html>
