<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinite Grid ASCII Text Editor - Monochrome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=JetBrains+Mono:wght@500&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --surface-color: #000000;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #ffffff;
            --cell-border: #333333;
            --cell-active-bg: #ffffff;
            --cell-active-text: #000000;
            --cell-in-rect-bg: #222222;
        }

        :root[data-theme="light"] {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #777777;
            --border-color: #000000;
            --cell-border: #dddddd;
            --cell-active-bg: #000000;
            --cell-active-text: #ffffff;
            --cell-in-rect-bg: #eeeeee;
        }

        :root {
            --cell-width: 14px;
            --cell-height: 20px;
            --current-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        h1 {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls-group {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 8px;
            border-radius: 0px;
            font-size: 0.75rem;
            outline: none;
            white-space: nowrap;
            cursor: pointer;
            font-family: monospace;
            text-transform: uppercase;
        }

        button.btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            font-weight: 700;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
            cursor: grab;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .grid-world {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transform-origin: 0 0;
        }

        .cell {
            position: absolute;
            width: var(--cell-width);
            height: var(--cell-height);
            border-right: 1px dotted var(--cell-border);
            border-bottom: 1px dotted var(--cell-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 20px;
            font-weight: 500;
            font-family: var(--current-font);
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            background-color: transparent;
        }

        .cell.active {
            background-color: var(--cell-active-bg);
            color: var(--cell-active-text);
            z-index: 2;
        }

        .cell.in-rect {
            background-color: var(--cell-in-rect-bg);
        }

        #keyboard-interceptor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 30px;
            opacity: 0.01;
            z-index: 999;
            font-size: 16px;
            background: transparent;
            border: none;
            outline: none;
            pointer-events: auto;
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 6px 16px;
            border-radius: 0px;
            font-size: 0.8rem;
            font-family: monospace;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 100;
            text-transform: uppercase;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body onclick="keepFocus()">

    <header>
        <h1>GridCell</h1>
        <div class="controls-group">
            <button id="btn-theme" title="Alternar Tema">Tema</button>
            <button id="btn-font" title="Ciclar Fonte">Fonte</button>
            <button class="btn-primary" id="btn-copy">Copiar</button>
            <button id="btn-clear">Limpar</button>
            <button id="btn-undo" disabled>Desfazer</button>
        </div>
    </header>

    <div class="viewport" id="viewport">
        <div class="grid-world" id="grid-world"></div>
    </div>

    <textarea id="keyboard-interceptor" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <div class="toast" id="toast">Texto copiado!</div>

    <script>
        const CELL_WIDTH = 14;
        const CELL_HEIGHT = 20;
        const gridData = new Map();
        const cellElements = new Map();
        let clearedBackup = null;

        // Lista de fontes monospace para ciclar ao clicar no botão
        const fonts = [
            { name: "Courier", value: "'Courier New', Courier, monospace" },
            { name: "JetBrains", value: "'JetBrains Mono', monospace" },
            { name: "Fira Code", value: "'Fira Code', monospace" },
            { name: "Source Code", value: "'Source Code Pro', monospace" },
            { name: "Menlo", value: "Menlo, Monaco, monospace" },
            { name: "SF Mono", value: "ui-monospace, SFMono-Regular, monospace" }
        ];
        let currentFontIndex = 0;

        let activeRow = 0;
        let activeCol = 0;

        let cameraX = window.innerWidth / 2 - CELL_WIDTH / 2;
        let cameraY = window.innerHeight / 3 - CELL_HEIGHT / 2;

        const viewport = document.getElementById('viewport');
        const gridWorld = document.getElementById('grid-world');
        const interceptor = document.getElementById('keyboard-interceptor');
        const btnFont = document.getElementById('btn-font');
        const btnTheme = document.getElementById('btn-theme');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const toastEl = document.getElementById('toast');

        function updateTransform() {
            gridWorld.style.transform = `translate3d(${cameraX}px, ${cameraY}px, 0)`;
        }
        updateTransform();

        function getKey(r, c) {
            return `${r},${c}`;
        }

        function ensureCellElement(r, c) {
            const key = getKey(r, c);
            if (cellElements.has(key)) return cellElements.get(key);

            const el = document.createElement('div');
            el.className = 'cell';
            el.style.left = `${c * CELL_WIDTH}px`;
            el.style.top = `${r * CELL_HEIGHT}px`;
            el.style.fontFamily = fonts[currentFontIndex].value;
            el.dataset.row = r;
            el.dataset.col = c;
            
            gridWorld.appendChild(el);
            cellElements.set(key, el);
            return el;
        }

        // Insere caractere com comportamento de "push" (desloca para a direita)
        function insertCharWithPush(r, c, char) {
            // Desloca caracteres existentes na linha para a direita
            let currentCol = c;
            let currentChar = char;
            
            while (currentChar !== '') {
                const key = getKey(r, currentCol);
                const nextChar = gridData.get(key) || '';
                
                if (currentChar) {
                    gridData.set(key, currentChar);
                    const el = ensureCellElement(r, currentCol);
                    el.textContent = currentChar;
                }
                
                currentChar = nextChar;
                currentCol++;
                if (currentCol > c + 200) break; // Limite de segurança de linha
            }
            updateAnalysis();
        }

        function setCellChar(r, c, char) {
            const key = getKey(r, c);
            if (!char) {
                gridData.delete(key);
                if (cellElements.has(key)) {
                    cellElements.get(key).textContent = '';
                }
            } else {
                gridData.set(key, char);
                const el = ensureCellElement(r, c);
                el.textContent = char;
            }
            updateAnalysis();
        }

        function setActiveCell(r, c) {
            const oldKey = getKey(activeRow, activeCol);
            if (cellElements.has(oldKey)) {
                cellElements.get(oldKey).classList.remove('active');
            }

            activeRow = r;
            activeCol = c;

            const newEl = ensureCellElement(r, c);
            newEl.classList.add('active');
        }

        function keepFocus() {
            if (document.activeElement !== interceptor) {
                interceptor.focus({ preventScroll: true });
            }
        }

        window.addEventListener('touchstart', () => {
            keepFocus();
        }, { passive: true });

        // --- DRAG / PAN CANVAS ---
        let isDragging = false;
        let startX = 0, startY = 0;
        let initialCamX = 0, initialCamY = 0;
        let hasDragged = false;

        function onPointerDown(e) {
            isDragging = true;
            hasDragged = false;
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            initialCamX = cameraX;
            initialCamY = cameraY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const dx = currentX - startX;
            const dy = currentY - startY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                hasDragged = true;
                cameraX = initialCamX + dx;
                cameraY = initialCamY + dy;
                updateTransform();
            }
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;

            if (!hasDragged && e.target) {
                const rect = gridWorld.getBoundingClientRect();
                const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

                if (clientX !== undefined && clientY !== undefined) {
                    const localX = clientX - rect.left;
                    const localY = clientY - rect.top;
                    const c = Math.floor(localX / CELL_WIDTH);
                    const r = Math.floor(localY / CELL_HEIGHT);
                    setActiveCell(r, c);
                }
            }
            keepFocus();
        }

        viewport.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        viewport.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        // --- TECLADO ---
        interceptor.addEventListener('input', (e) => {
            const val = interceptor.value;
            if (val.length > 0) {
                const char = val[val.length - 1];
                insertCharWithPush(activeRow, activeCol, char);
                setActiveCell(activeRow, activeCol + 1);
                interceptor.value = '';
            }
        });

        interceptor.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                const currentKey = getKey(activeRow, activeCol);
                if (gridData.has(currentKey)) {
                    setCellChar(activeRow, activeCol, '');
                } else {
                    setActiveCell(activeRow, activeCol - 1);
                    setCellChar(activeRow, activeCol, '');
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol - 1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setActiveCell(activeRow - 1, activeCol);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                setActiveCell(activeRow + 1, activeCol);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                setActiveCell(activeRow + 1, 0);
            }
        });

        function getBoundingRect() {
            if (gridData.size === 0) return null;

            let minR = Infinity, maxR = -Infinity;
            let minC = Infinity, maxC = -Infinity;

            for (const key of gridData.keys()) {
                const [r, c] = key.split(',').map(Number);
                if (r < minR) minR = r;
                if (r > maxR) maxR = r;
                if (c < minC) minC = c;
                if (c > maxC) maxC = c;
            }

            return { minR, maxR, minC, maxC };
        }

        function highlightRectBounds(rect) {
            cellElements.forEach(el => el.classList.remove('in-rect'));
            if (!rect) return;

            for (let r = rect.minR; r <= rect.maxR; r++) {
                for (let c = rect.minC; c <= rect.maxC; c++) {
                    const el = ensureCellElement(r, c);
                    el.classList.add('in-rect');
                }
            }
        }

        btnCopy.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = getBoundingRect();
            if (!rect) {
                showToast("Grid vazio!");
                keepFocus();
                return;
            }

            highlightRectBounds(rect);

            let resultLines = [];
            for (let r = rect.minR; r <= rect.maxR; r++) {
                let line = '';
                for (let c = rect.minC; c <= rect.maxC; c++) {
                    const char = gridData.get(getKey(r, c)) || ' ';
                    line += char;
                }
                resultLines.push(line);
            }

            const fullText = resultLines.join('\n');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(() => showToast("Copiado!"));
            } else {
                interceptor.value = fullText;
                interceptor.select();
                document.execCommand('copy');
                interceptor.value = '';
                showToast("Copiado!");
            }
            keepFocus();
        });

        btnClear.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gridData.size === 0) return;

            clearedBackup = new Map(gridData);
            btnUndo.disabled = false;

            gridData.clear();
            cellElements.forEach(el => el.textContent = '');
            highlightRectBounds(null);
            setActiveCell(0, 0);
            showToast("Limpo!");
            keepFocus();
        });

        btnUndo.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!clearedBackup) return;

            gridData.clear();
            cellElements.forEach(el => el.textContent = '');

            clearedBackup.forEach((char, key) => {
                const [r, c] = key.split(',').map(Number);
                setCellChar(r, c, char);
            });

            clearedBackup = null;
            btnUndo.disabled = true;
            showToast("Restaurado!");
            keepFocus();
        });

        // Clica para ciclar a fonte instantaneamente e atualizar todas as células ativas
        btnFont.addEventListener('click', (e) => {
            e.stopPropagation();
            currentFontIndex = (currentFontIndex + 1) % fonts.length;
            const newFont = fonts[currentFontIndex];
            btnFont.textContent = newFont.name;
            
            document.documentElement.style.setProperty('--current-font', newFont.value);
            cellElements.forEach(el => {
                el.style.fontFamily = newFont.value;
            });
            showToast(newFont.name);
            keepFocus();
        });

        btnTheme.addEventListener('click', (e) => {
            e.stopPropagation();
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            keepFocus();
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1200);
        }

        function updateAnalysis() {
            const rect = getBoundingRect();
            highlightRectBounds(rect);
        }

        setActiveCell(0, 0);
        setTimeout(keepFocus, 200);
    </script>
</body>
</html>
