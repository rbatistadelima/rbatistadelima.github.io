<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ Kaori Stable TTS FIX</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
body{margin:0;padding:14px;background:#0f0f12;color:#fff;font-family:Arial}
textarea{width:100%;height:140px;background:#121214;color:#fff;border:0;padding:10px}
.karaoke{margin-top:10px;padding:12px;background:#141417;border-radius:8px}
button{margin-top:10px;padding:10px;border:0;border-radius:8px;cursor:pointer}
.status{color:#aaa;margin-bottom:10px}
</style>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

/* =========================================================
   🔓 AUDIO CONTEXT (FIX CHROME SILENT BUG)
========================================================= */

let audioCtx = null;

async function unlockAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  await audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.01);
}

/* =========================================================
   🧠 KAORI PIPELINE
========================================================= */

let kaoriPipeline = null;
let kaoriReady = false;

async function preloadKaori(){

  document.getElementById("status").innerText =
    "Carregando Kaori...";

  kaoriPipeline = await pipeline(
    "text-to-speech",
    "Xenova/mms-tts-por"
  );

  try { await kaoriPipeline("ok"); } catch(e){}

  kaoriReady = true;

  document.getElementById("status").innerText =
    "Kaori pronta ✔";
}

window.addEventListener("DOMContentLoaded", preloadKaori);

/* =========================================================
   🔊 KAORI SPEAK (REAL SAFE AUDIO)
========================================================= */

async function kaoriSpeak(text){

  const out = await kaoriPipeline(text);

  if (!out || !out.audio || !out.audio.length) {
    console.error("Kaori invalid output:", out);
    return;
  }

  const sr = out.sampling_rate || audioCtx.sampleRate;

  const buffer = audioCtx.createBuffer(
    1,
    out.audio.length,
    sr
  );

  buffer.copyToChannel(out.audio, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  src.connect(audioCtx.destination);

  return new Promise(resolve => {
    src.onended = () => resolve();
    src.start(0);
  });
}

/* =========================================================
   🔒 SEQUENTIAL LOCK (SIMPLE & SAFE)
========================================================= */

let chain = Promise.resolve();

function run(fn){
  chain = chain.then(fn);
  return chain;
}

/* =========================================================
   🎯 ROUTER
========================================================= */

function speak(name, text){

  const n = name.toLowerCase();

  if (n.includes("kaori")) {
    return run(async () => {
      while (!kaoriReady) {
        await new Promise(r => setTimeout(r, 50));
      }
      await kaoriSpeak(text);
    });
  }

  // fallback simples (não crítico aqui)
  return run(async () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR";

    speechSynthesis.cancel();

    await new Promise(r => {
      u.onend = r;
      u.onerror = r;
      speechSynthesis.speak(u);
    });
  });
}

/* =========================================================
   🚀 MAIN FLOW
========================================================= */

async function start(){

  await unlockAudio(); // 🔥 CRÍTICO (resolve "never played")

  const lines = document.getElementById("texto")
    .value.split("\n")
    .map(l => l.trim())
    .filter(Boolean);

  for (const line of lines) {

    const m = line.match(/^([^:]+):\s*(.*)$/);
    if (!m) continue;

    const name = m[1];
    const text = m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speak(name, text);
  }
}

window.start = start;

</script>
</head>

<body>

<div class="status" id="status">Inicializando...</div>

<textarea id="texto">
Daniel: Agora o áudio finalmente toca.
Kaori: Eu estou funcionando corretamente.
Daniel: Nenhuma fala fica em silêncio.
Kaori: O sistema está estável.
</textarea>

<div class="karaoke"></div>

<button onclick="start()">▶ Play</button>

</body>
</html>
