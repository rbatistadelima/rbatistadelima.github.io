<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piseiro Brasileiro - Guitar, Bass & Drums MIDI Machine</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for Web Audio & MIDI scheduling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Soundfont-player for authentic GM MIDI instrument samples -->
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-amber-400 tracking-wide">🇧🇷 Piseiro Band (Guitar, Bass & Drums)</h1>
            <p class="text-slate-400 text-sm mt-1">Real MIDI soundfont instruments playing an authentic Brazilian Piseiro rhythm section.</p>
        </div>

        <!-- Controls Form -->
        <div class="space-y-6">
            <!-- Tempo Input -->
            <div>
                <label for="tempo" class="block text-sm font-medium text-slate-300 mb-2">Tempo (BPM)</label>
                <input type="number" id="tempo" value="138" min="100" max="180" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-400 font-mono">
            </div>

            <!-- Chords Input -->
            <div>
                <label for="chords" class="block text-sm font-medium text-slate-300 mb-2">Chords (Space-separated)</label>
                <input type="text" id="chords" value="Em7 Em9 Cmaj7 Am7" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-400 font-mono">
                <span class="text-xs text-slate-500 mt-1 block">Supports extensions like Em7, Em9, Cmaj7, Am7</span>
            </div>

            <!-- Play / Stop Buttons -->
            <div class="flex gap-4 pt-2">
                <button id="playBtn" onclick="togglePlay()" disabled
                    class="flex-1 bg-slate-600 text-slate-300 font-bold py-3 px-6 rounded-lg transition shadow-lg flex items-center justify-center gap-2 cursor-not-allowed">
                    ⏳ Loading MIDI Soundfonts...
                </button>
            </div>
        </div>

        <!-- Status Box -->
        <div id="status" class="mt-6 text-center text-sm text-amber-300 font-mono">
            Status: Downloading Guitar and Bass samples...
        </div>
    </div>

    <script>
        // Expanded chord library for guitar voicings
        const chordLibrary = {
            'C':     ['C3', 'E3', 'G3', 'C4'],
            'CM':    ['C3', 'E3', 'G3', 'C4'],
            'CMIN':  ['C3', 'D#3', 'G3', 'C4'],
            'D':     ['D3', 'F#3', 'A3', 'D4'],
            'DM':    ['D3', 'F3', 'A3', 'D4'],
            'E':     ['E3', 'G#3', 'B3', 'E4'],
            'EM':    ['E3', 'G3', 'B3', 'E4'],
            'F':     ['F3', 'A3', 'C4', 'F4'],
            'FM':    ['F3', 'G#3', 'C4', 'F4'],
            'G':     ['G3', 'B3', 'D4', 'G4'],
            'GM':    ['G3', 'A#3', 'D4', 'G4'],
            'A':     ['A3', 'C#4', 'E4', 'A4'],
            'AM':    ['A3', 'C4', 'E4', 'A4'],
            'BB':    ['A#3', 'D4', 'F4', 'A#4'],
            'B':     ['B3', 'D#4', 'F#4', 'B4'],
            'EM7':   ['E3', 'G3', 'B3', 'D4'],         
            'EM9':   ['E3', 'G3', 'B3', 'D4', 'F#4'],   
            'CMAJ7': ['C3', 'E3', 'G3', 'B3'],          
            'AM7':   ['A3', 'C4', 'E4', 'G4'],          
            'G7':    ['G3', 'B3', 'D4', 'F4'],
            'DM7':   ['D3', 'F3', 'A3', 'C4'],
            'FM7':   ['F3', 'A3', 'C4', 'E4']
        };

        let isPlaying = false;
        let guitarInstrument, bassInstrument;
        let audioContext = null;
        let kick, snare, hihat; // Electronic drum kit for tight Piseiro backbeat

        async function initSoundfonts() {
            audioContext = Tone.context.rawContext;
            const statusEl = document.getElementById('status');
            const playBtn = document.getElementById('playBtn');

            statusEl.innerText = "Loading Guitar & Bass soundfonts (GM)...";
            
            try {
                // Load MIDI soundfonts for Guitar and Bass
                guitarInstrument = await Soundfont.instrument(audioContext, 'electric_guitar_clean', { soundfont: 'FluidR3_GM' });
                bassInstrument = await Soundfont.instrument(audioContext, 'electric_bass_finger', { soundfont: 'FluidR3_GM' });
                
                // Setup electronic drum backup synths for punchy Piseiro rhythm
                kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4 }).toDestination();
                snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.005, decay: 0.15, sustain: 0 } }).toDestination();
                snare.volume.value = -2;
                hihat = new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000 }).toDestination();
                hihat.volume.value = -12;

                statusEl.innerText = "Status: Ready to Play!";
                playBtn.disabled = false;
                playBtn.className = "flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-6 rounded-lg transition shadow-lg flex items-center justify-center gap-2 cursor-pointer";
                playBtn.innerHTML = "▶ Play Groove";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error loading soundfonts. Check internet connection.";
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initSoundfonts();
        });

        // Helper to extract root bass note from chord text (e.g. "Em7" -> "E2")
        function getBassNote(chordName) {
            const rootMatch = chordName.replace(/[^A-G#b]/g, '');
            const base = rootMatch.length > 0 ? rootMatch[0] : 'C';
            const accidental = rootMatch.length > 1 ? rootMatch[1] : '';
            return base + accidental + '2';
        }

        async function togglePlay() {
            await Tone.start();
            const playBtn = document.getElementById('playBtn');
            const status = document.getElementById('status');
            const tempoInput = document.getElementById('tempo');
            const chordsInput = document.getElementById('chords');

            if (isPlaying) {
                Tone.Transport.stop();
                Tone.Transport.cancel();
                isPlaying = false;
                playBtn.innerHTML = "▶ Play Groove";
                playBtn.classList.replace('bg-rose-600', 'bg-amber-500');
                playBtn.classList.replace('hover:bg-rose-700', 'hover:bg-amber-600');
                status.innerText = "Status: Stopped";
                return;
            }

            const bpm = parseInt(tempoInput.value) || 138;
            const rawChords = chordsInput.value.trim().split(/\s+/);
            const chordNames = rawChords.map(c => c.toUpperCase());
            
            Tone.Transport.bpm.value = bpm;
            Tone.Transport.cancel();

            let step = 0;
            let currentChordIndex = 0;

            Tone.Transport.scheduleRepeat((time) => {
                const chordName = chordNames[currentChordIndex];
                const guitarNotes = chordLibrary[chordName] || chordLibrary['AM7'];
                const bassNote = getBassNote(chordName);

                // 1. Drums: Kick on beats 1 and 3
                if (step % 4 === 0) {
                    kick.triggerAttackRelease("C1", "8n", time);
                }

                // 2. Drums: Snare backbeat on beats 2 and 4 (Piseiro signature)
                if (step % 4 === 2) {
                    snare.triggerAttackRelease("16n", time);
                }

                // 3. Drums: Driving 16th-note Hi-hat
                hihat.triggerAttackRelease("32n", time);

                // 4. Bass: Bouncy root notes matching the downbeats
                if (step % 4 === 0 || step % 4 === 2) {
                    if (bassInstrument) {
                        bassInstrument.play(bassNote, time, { duration: 0.2 });
                    }
                }

                // 5. Guitar: Syncopated chord stabs
                if (step % 4 === 0 || step % 4 === 1 || step % 4 === 3) {
                    guitarNotes.forEach(note => {
                        if (guitarInstrument) {
                            guitarInstrument.play(note, time, { duration: 0.15 });
                        }
                    });
                }

                step++;
                if (step % 4 === 0) {
                    currentChordIndex = (currentChordIndex + 1) % chordNames.length;
                }
            }, "8n");

            Tone.Transport.start();
            isPlaying = true;
            playBtn.innerHTML = "⏹ Stop Groove";
            playBtn.classList.replace('bg-amber-500', 'bg-rose-600');
            playBtn.classList.replace('hover:bg-amber-600', 'hover:bg-rose-700');
            status.innerText = `Status: Playing Piseiro band at ${bpm} BPM...`;
        }
    </script>
</body>
</html>
