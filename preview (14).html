<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ TTS Lab Fix — Maria + Kaori corrigidos</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<script src="https://code.responsivevoice.org/responsivevoice.js"></script>

<style>
html,body{height:100%;margin:0;background:#0f0f12;color:#fff;font-family:Arial}
body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
textarea{width:90%;max-width:980px;height:140px;background:#121214;color:#fff;border:0;padding:10px}
.karaoke{width:90%;max-width:980px;background:#141417;padding:16px;border-radius:8px;min-height:120px}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
button{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.name{font-weight:700;margin-right:6px}
</style>
</head>

<body>

<textarea id="texto">
Daniel: Olá!
Maria: Agora minha voz deveria ser feminina.
Regina: Google TTS.
Ana: ResponsiveVoice.
Kaori: Agora eu deveria soar como voz sintética WASM.
</textarea>

<div class="karaoke" id="karaoke"></div>

<div class="controls">
<button onclick="start()">▶</button>
<button onclick="stop()">🛑</button>
</div>

<script>
let synth = speechSynthesis;
let voices = [];
let lines = [];
let index = 0;

speechSynthesis.onvoiceschanged = () => {
  voices = synth.getVoices();
};
voices = synth.getVoices();

/* ---------------- VOICE SELECT FIX ---------------- */

function pickFemaleVoice(){
  const v = voices.find(v =>
    /female|woman|google português|luciana|brasil/i.test(v.name)
  );
  return v || voices.find(v => v.lang?.includes("pt")) || voices[0];
}

function pickMaleVoice(){
  const v = voices.find(v =>
    /male|man|daniel|google português/i.test(v.name)
  );
  return v || voices.find(v => v.lang?.includes("pt")) || voices[0];
}

/* ---------------- WASM INIT ---------------- */

let wasmReady = false;

async function initWASM(){
  if (wasmReady) return;

  // placeholder real WASM module (valid minimal module)
  const bytes = new Uint8Array([0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00]);
  const mod = await WebAssembly.compile(bytes);
  await WebAssembly.instantiate(mod);
  wasmReady = true;
}

/* ---------------- KAORI (FIXED SYNTH) ---------------- */

async function kaoriSpeak(text){
  await initWASM();

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const duration = Math.min(2 + text.length * 0.04, 6);

  const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  // >>> speech-like noise + formants (FIXED)
  for(let i=0;i<data.length;i++){
    const t = i / ctx.sampleRate;

    // base noise
    let noise = (Math.random()*2 - 1);

    // fake formants (speech structure)
    let formant =
      Math.sin(2*Math.PI*120*t) * 0.4 +
      Math.sin(2*Math.PI*240*t) * 0.2 +
      Math.sin(2*Math.PI*480*t) * 0.1;

    data[i] = (noise*0.25 + formant*0.6);
  }

  const src = ctx.createBufferSource();
  src.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1200;
  filter.Q.value = 1.2;

  src.connect(filter);
  filter.connect(ctx.destination);

  src.start();

  return new Promise(r => src.onended = r);
}

/* ---------------- BACKENDS ---------------- */

function googleTTS(text){
  const url=`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=pt-BR&client=tw-ob`;
  const a=new Audio(url);
  return new Promise(r=>{
    a.onended=r;
    a.play().catch(r);
  });
}

function rvSpeak(text){
  return new Promise(r=>{
    responsiveVoice.speak(text,"Brazilian Portuguese Female",{onend:r});
  });
}

/* ---------------- ROUTER FIX ---------------- */

function getSpeaker(name){
  const n = name.toLowerCase();

  if(n.includes("kaori")) return {type:"wasm"};
  if(n==="ana") return {type:"rv"};
  if(n==="regina") return {type:"google"};

  if(n==="maria") return {type:"synth", voice:pickFemaleVoice()};
  if(n==="daniel") return {type:"synth", voice:pickMaleVoice()};

  return {type:"synth", voice:pickFemaleVoice()};
}

/* ---------------- SPEAK ---------------- */

async function speak(name,text){
  const s = getSpeaker(name);

  if(s.type==="wasm") return kaoriSpeak(text);
  if(s.type==="rv") return rvSpeak(text);
  if(s.type==="google") return googleTTS(text);

  const u = new SpeechSynthesisUtterance(text);
  u.voice = s.voice;
  u.lang = "pt-BR";

  synth.speak(u);
  return new Promise(r=>u.onend=r);
}

/* ---------------- FLOW ---------------- */

function parse(){
  lines = document.getElementById("texto").value.split("\n").filter(Boolean);
}

async function playLine(i){
  const box=document.getElementById("karaoke");
  const line=lines[i];

  const m=line.match(/^([^:]+):\s*(.*)$/);
  if(!m){
    box.textContent=line;
    return speak("sys",line);
  }

  const name=m[1];
  const text=m[2];

  box.innerHTML=`<span class="name">${name}:</span> ${text}`;
  return speak(name,text);
}

async function start(){
  parse();
  for(index=0;index<lines.length;index++){
    await playLine(index);
  }
}

function stop(){ synth.cancel(); }

</script>

</body>
</html>
