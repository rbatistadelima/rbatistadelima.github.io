<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Person Dungeon Crawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            color: #e6e6e6;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 800px;
            height: 500px;
            position: relative;
            overflow: hidden;
            border: 4px solid #4a4a6d;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        /* First-person view */
        .first-person-view {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 800px;
            transform-style: preserve-3d;
        }

        /* Sky/ceiling */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #0f1a30, #1a2c42);
            z-index: 1;
        }

        /* Floor */
        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: 
                radial-gradient(circle at 20% 80%, #3a2819, #2a1c12 70%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 30px,
                    rgba(90, 60, 30, 0.2) 30px,
                    rgba(90, 60, 30, 0.2) 60px
                );
            z-index: 2;
        }

        /* Walls */
        .wall {
            position: absolute;
            bottom: 30%;
            width: 100px;
            height: 200px;
            background: 
                linear-gradient(to bottom, #4a3a2a, #3a2a1a 20%, #5a4a3a 80%, #4a3a2a),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 9px,
                    rgba(100, 80, 60, 0.4) 9px,
                    rgba(100, 80, 60, 0.4) 10px
                );
            background-blend-mode: overlay;
            transform-origin: bottom;
            border-left: 2px solid #2a1a0a;
            border-right: 2px solid #2a1a0a;
            z-index: 3;
        }

        /* Wall positioning */
        .wall.left {
            left: 30%;
            transform: rotateY(70deg) skewY(-5deg);
        }

        .wall.right {
            right: 30%;
            transform: rotateY(-70deg) skewY(5deg);
        }

        .wall.front-left {
            left: 40%;
            transform: rotateY(30deg) skewY(-2deg);
            width: 80px;
            height: 220px;
        }

        .wall.front-right {
            right: 40%;
            transform: rotateY(-30deg) skewY(2deg);
            width: 80px;
            height: 220px;
        }

        .wall.distant-left {
            left: 20%;
            transform: rotateY(80deg) skewY(-8deg);
            width: 60px;
            height: 180px;
            opacity: 0.7;
        }

        .wall.distant-right {
            right: 20%;
            transform: rotateY(-80deg) skewY(8deg);
            width: 60px;
            height: 180px;
            opacity: 0.7;
        }

        /* End wall */
        .end-wall {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 200px;
            background: 
                linear-gradient(to bottom, #5a4a3a, #4a3a2a 20%, #6a5a4a 80%, #5a4a3a),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 14px,
                    rgba(120, 100, 80, 0.4) 14px,
                    rgba(120, 100, 80, 0.4) 15px
                );
            background-blend-mode: overlay;
            z-index: 4;
            border: 2px solid #3a2a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .door {
            width: 60px;
            height: 120px;
            background: linear-gradient(to right, #3a2a1a, #5a3a2a, #3a2a1a);
            border: 4px solid #2a1a0a;
            position: relative;
        }

        .door::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 10px;
            width: 8px;
            height: 8px;
            background: #8a7a6a;
            border-radius: 50%;
            transform: translateY(-50%);
        }

        /* Torch effect */
        .torch {
            position: absolute;
            top: 40%;
            width: 10px;
            height: 40px;
            background: linear-gradient(to bottom, #8a5a2a, #5a3a1a);
            z-index: 5;
        }

        .torch::after {
            content: '';
            position: absolute;
            top: -20px;
            left: -10px;
            width: 30px;
            height: 40px;
            background: radial-gradient(ellipse at center, #ffaa00, #ff5500 30%, transparent 70%);
            border-radius: 50%;
            animation: flicker 1.5s infinite alternate;
        }

        .torch.left {
            left: 35%;
        }

        .torch.right {
            right: 35%;
        }

        @keyframes flicker {
            0% { opacity: 0.7; transform: scale(1); }
            25% { opacity: 0.8; transform: scale(1.05); }
            50% { opacity: 0.9; transform: scale(0.95); }
            75% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 200px;
            margin-top: 20px;
        }

        .control-btn {
            background: linear-gradient(to bottom, #4a4a6d, #3a3a5d);
            border: none;
            color: #e6e6e6;
            font-size: 24px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            user-select: none;
            border-radius: 5px;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #2a2a4d;
        }

        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2a2a4d;
        }

        .forward { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .back { grid-column: 2; grid-row: 3; }

        /* Status display */
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            width: 800px;
        }

        /* Instructions */
        .instructions {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: #8a8aaa;
            width: 800px;
        }

        /* Game title */
        h1 {
            margin-bottom: 20px;
            text-align: center;
            color: #e6e6e6;
            text-shadow: 0 0 10px #00aaff;
            font-size: 36px;
        }

        /* Decorative elements */
        .cobblestone {
            position: absolute;
            bottom: 30%;
            width: 30px;
            height: 15px;
            background: #5a4a3a;
            border-radius: 3px;
            z-index: 2;
        }

        /* Animation for moving forward */
        @keyframes moveForward {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .moving-forward {
            animation: moveForward 0.5s ease-out;
        }
    </style>
</head>
<body>
    <h1>Dungeon Crawler</h1>
    
    <div class="game-container">
        <div class="first-person-view">
            <div class="sky"></div>
            <div class="floor"></div>
            
            <!-- Distant walls -->
            <div class="wall distant-left"></div>
            <div class="wall distant-right"></div>
            
            <!-- Side walls -->
            <div class="wall left"></div>
            <div class="wall right"></div>
            
            <!-- Front walls -->
            <div class="wall front-left"></div>
            <div class="wall front-right"></div>
            
            <!-- End wall with door -->
            <div class="end-wall">
                <div class="door"></div>
            </div>
            
            <!-- Torches -->
            <div class="torch left"></div>
            <div class="torch right"></div>
            
            <!-- Cobblestones on floor -->
            <div class="cobblestone" style="left: 45%; bottom: 45%;"></div>
            <div class="cobblestone" style="left: 50%; bottom: 50%;"></div>
            <div class="cobblestone" style="left: 55%; bottom: 55%;"></div>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-btn forward">↑</div>
        <div class="control-btn left">←</div>
        <div class="control-btn right">→</div>
        <div class="control-btn back">↓</div>
    </div>
    
    <div class="status">
        Position: Chamber 1 | Torches: 2 | Health: 100%
    </div>
    
    <div class="instructions">
        Use arrow buttons or keyboard arrows to move through the dungeon
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firstPersonView = document.querySelector('.first-person-view');
            const status = document.querySelector('.status');
            const controlButtons = document.querySelectorAll('.control-btn');
            
            // Game state
            let position = 1;
            let health = 100;
            let torches = 2;
            
            // Update status display
            function updateStatus() {
                status.textContent = `Position: Chamber ${position} | Torches: ${torches} | Health: ${health}%`;
            }
            
            // Movement functions
            function moveForward() {
                if (position < 5) {
                    position++;
                    firstPersonView.classList.add('moving-forward');
                    setTimeout(() => {
                        firstPersonView.classList.remove('moving-forward');
                    }, 500);
                }
                updateStatus();
            }
            
            function moveBackward() {
                if (position > 1) {
                    position--;
                }
                updateStatus();
            }
            
            function turnLeft() {
                // In a more advanced version, this would change the view angle
                firstPersonView.style.transform = 'perspective(800px) rotateY(5deg)';
                setTimeout(() => {
                    firstPersonView.style.transform = 'perspective(800px) rotateY(0deg)';
                }, 200);
            }
            
            function turnRight() {
                // In a more advanced version, this would change the view angle
                firstPersonView.style.transform = 'perspective(800px) rotateY(-5deg)';
                setTimeout(() => {
                    firstPersonView.style.transform = 'perspective(800px) rotateY(0deg)';
                }, 200);
            }
            
            // Button event handlers
            controlButtons.forEach(button => {
                button.addEventListener('click', function() {
                    if (this.classList.contains('forward')) moveForward();
                    if (this.classList.contains('back')) moveBackward();
                    if (this.classList.contains('left')) turnLeft();
                    if (this.classList.contains('right')) turnRight();
                });
            });
            
            // Keyboard controls
            document.addEventListener('keydown', function(e) {
                switch(e.key) {
                    case 'ArrowUp':
                        moveForward();
                        break;
                    case 'ArrowDown':
                        moveBackward();
                        break;
                    case 'ArrowLeft':
                        turnLeft();
                        break;
                    case 'ArrowRight':
                        turnRight();
                        break;
                }
            });
            
            // Initialize
            updateStatus();
        });
    </script>
</body>
</html>
