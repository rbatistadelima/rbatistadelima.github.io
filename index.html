
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>project index</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px;
    background: #f4f4f4;
    color: #222;
    font-family: Arial, sans-serif;
}

h1 {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 30px;
    text-transform: lowercase;
}

#fileList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    padding: 0;
    margin: 0;
    list-style: none;
}

.project {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 12px #0000000d;
    display: flex;
    flex-direction: column;
}

.preview {
    width: 100%;
    height: 190px;
    background: #e8e8e8;
    overflow: hidden;
    position: relative;
}

.preview iframe {
    width: 200%;
    height: 200%;
    border: 0;
    transform: scale(.5);
    transform-origin: top left;
    pointer-events: none;
}

.preview-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #999;
    font-size: 13px;
}

.project-info {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.project h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 10px;
    text-transform: lowercase;
}

.project p {
    font-size: 13px;
    line-height: 1.6;
    color: #777;
    margin: 0 0 18px;
    flex: 1;
}

.project a {
    display: inline-block;
    align-self: flex-start;
    background: #222;
    color: white;
    padding: 9px 15px;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
}

.project a:hover {
    background: #555;
}

.status {
    color: #888;
    font-size: 14px;
}

@media(max-width: 600px) {
    body {
        padding: 20px;
    }

    #fileList {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>project index</h1>

<ul id="fileList">
    <li class="status">loading projects...</li>
</ul>

<script>
const USERNAME = 'rbatistadelima';
const REPO = 'rbatistadelima.github.io';

async function getHtmlFiles() {
    const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/`;

    try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
            throw new Error('failed to fetch repository');
        }

        const contents = await response.json();

        return contents.filter(item =>
            item.type === 'file' &&
            item.name.toLowerCase().endsWith('.html') &&
            item.name.toLowerCase() !== 'index.html'
        );

    } catch (error) {
        console.error(error);
        return [];
    }
}

function formatFileName(fileName) {
    return fileName
        .replace(/\.html$/i, '')
        .replace(/[-_]/g, ' ')
        .toLowerCase();
}

async function getDescription(url) {
    try {
        const response = await fetch(url);

        if (!response.ok) {
            return 'no description available.';
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        const description =
            doc.querySelector('meta[name="description"]')?.content ||
            doc.querySelector('meta[property="og:description"]')?.content ||
            doc.querySelector('meta[name="twitter:description"]')?.content;

        return description || 'no description available.';

    } catch (error) {
        return 'description unavailable.';
    }
}

async function createProjectCard(file) {
    const url = file.name;
    const title = formatFileName(file.name);

    const li = document.createElement('li');
    li.className = 'project';

    const preview = document.createElement('div');
    preview.className = 'preview';

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.loading = 'lazy';
    iframe.title = title + ' preview';

    preview.appendChild(iframe);

    const info = document.createElement('div');
    info.className = 'project-info';

    const heading = document.createElement('h2');
    heading.textContent = title;

    const description = document.createElement('p');
    description.textContent = 'loading description...';

    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'open project';

    info.appendChild(heading);
    info.appendChild(description);
    info.appendChild(link);

    li.appendChild(preview);
    li.appendChild(info);

    getDescription(url).then(text => {
        description.textContent = text;
    });

    return li;
}

async function displayFileList() {
    const fileList = document.getElementById('fileList');
    const files = await getHtmlFiles();

    fileList.innerHTML = '';

    if (files.length === 0) {
        fileList.innerHTML =
            '<li class="status">no html files found.</li>';
        return;
    }

    for (const file of files) {
        const card = await createProjectCard(file);
        fileList.appendChild(card);
    }
}

document.addEventListener('DOMContentLoaded', displayFileList);
</script>

</body>
</html>
