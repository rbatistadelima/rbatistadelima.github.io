<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Art Coloring App</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1e1e1e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    canvas {
      image-rendering: pixelated;
      border: 2px solid #555;
      margin-top: 12px;
      cursor: crosshair;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="color"], button {
      height: 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🎨 Pixel Art Coloring App</h2>

  <input type="file" id="upload" accept="image/*" />

  <canvas id="canvas" width="256" height="256"></canvas>

  <div class="controls">
    <label>Color <input type="color" id="colorPicker" value="#ff0000" /></label>
    <button id="clear">Reset</button>
    <button id="save">Save PNG</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const upload = document.getElementById('upload');
    const colorPicker = document.getElementById('colorPicker');
    const clearBtn = document.getElementById('clear');
    const saveBtn = document.getElementById('save');

    let baseImageData = null;

    upload.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        baseImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      };
      img.src = URL.createObjectURL(file);
    });

    canvas.addEventListener('click', e => {
      if (!baseImageData) return;

      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) * canvas.width / rect.width);
      const y = Math.floor((e.clientY - rect.top) * canvas.height / rect.height);

      floodFill(x, y, hexToRgba(colorPicker.value));
    });

    clearBtn.onclick = () => {
      if (baseImageData)
        ctx.putImageData(baseImageData, 0, 0);
    };

    saveBtn.onclick = () => {
      const a = document.createElement('a');
      a.download = 'pixel-coloring.png';
      a.href = canvas.toDataURL();
      a.click();
    };

    function floodFill(startX, startY, fillColor) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const w = imgData.width;
      const h = imgData.height;

      const idx = (startY * w + startX) * 4;
      const targetColor = data.slice(idx, idx + 4);

      if (colorsMatch(targetColor, fillColor)) return;

      const stack = [[startX, startY]];

      while (stack.length) {
        const [x, y] = stack.pop();
        if (x < 0 || y < 0 || x >= w || y >= h) continue;

        const i = (y * w + x) * 4;
        if (!colorsMatch(data.slice(i, i + 4), targetColor)) continue;

        data[i] = fillColor[0];
        data[i + 1] = fillColor[1];
        data[i + 2] = fillColor[2];
        data[i + 3] = 255;

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function colorsMatch(a, b) {
      return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
    }

    function hexToRgba(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
    }
  </script>
</body>
</html>
