<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Vocal Synth Studio</title>
    <style>
        :root {
            --primary: #39c5bb; /* Hatsune Miku Teal */
            --dark: #1f2326;
            --light: #f4f6f9;
            --accent: #e51c60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #2a2f35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border-top: 6px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: #a0aab2;
            margin-bottom: 30px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .control-panel { grid-template-columns: 1fr; }
        }

        .panel-block {
            background: #333940;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #404852;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

        textarea, select, input[type="range"] {
            width: 100%;
            background: #1f2326;
            border: 1px solid #404852;
            color: white;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
            font-family: monospace;
            font-size: 16px;
        }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group div {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aab2;
            margin-bottom: 4px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #2eb0a7;
            box-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .visualizer-box {
            height: 80px;
            background: #1f2326;
            border-radius: 8px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #404852;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: var(--primary);
            margin: 0 2px;
            border-radius: 2px;
            transition: height 0.1s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Web-Vocaloid JS Sandbox</h1>
    <p class="subtitle">A client-side Web Audio synthesis playground replicating retro electronic singing styles.</p>

    <div class="control-panel">
        <div class="panel-block">
            <div class="slider-group">
                <label for="lyrics">Lyrics / Notes Sequence</label>
                <textarea id="lyrics">Do Re Mi Fa Sol La Si Do</textarea>
                <small style="color:#7e8b96; font-size:11px;">Space-separated words dictate note triggers.</small>
            </div>

            <div class="slider-group">
                <label for="basePitch">Base Scale / Key Start</label>
                <select id="basePitch">
                    <option value="261.63">C4 (Default)</option>
                    <option value="293.66">D4</option>
                    <option value="329.63">E4</option>
                    <option value="349.23">F4</option>
                    <option value="392.00">G4</option>
                    <option value="440.00">A4 (High Tuning)</option>
                </select>
            </div>
        </div>

        <div class="panel-block">
            <div class="slider-group">
                <div><span>Vibrato Depth</span><span id="vib-val">50%</span></div>
                <input type="range" id="vibrato" min="0" max="100" value="50">
            </div>

            <div class="slider-group">
                <div><span>Portamento (Pitch Glide)</span><span id="glide-val">40ms</span></div>
                <input type="range" id="glide" min="0" max="200" value="40">
            </div>

            <div class="slider-group">
                <div><span>Timbre Filter (Formant Simulation)</span><span id="formant-val">Nasal / Bright</span></div>
                <input type="range" id="formant" min="500" max="3000" value="1800">
            </div>
        </div>
    </div>

    <button id="playBtn">Synthesize & Play</button>

    <div class="visualizer-box" id="visualizer">
        <span style="color:#57626c;" id="vis-text">Idle - Press Play to Start Audio Context</span>
    </div>
</div>
