<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TTS Lab — 100% WebAssembly + Fila Estrita</title>
    <style>
        html,body{margin:0;width:450px;min-height:500px;background:#0f0f12;color:#fff;font-family:Arial;padding:14px;box-sizing:border-box;}
        body{display:flex;flex-direction:column;align-items:center;gap:12px}
        textarea{width:100%;height:140px;background:#121214;color:#fff;border:0;padding:10px;border-radius:4px;resize:vertical;font-family:monospace;box-sizing:border-box;}
        .karaoke{width:100%;background:#141417;padding:14px;border-radius:8px;min-height:100px;box-sizing:border-box;}
        button{background:#007bff;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1rem;width:100%;}
        button:hover{background:#0056b3;}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .status{font-size:0.9rem;color:#d97706;font-weight:bold;text-align:center;}
    </style>
</head>
<body>

    <div class="status" id="status">Carregando permissões de Extensão...</div>
    <textarea id="texto">Daniel: Eu sou o Daniel e rodo através do sintetizador nativo do navegador.
Kaori: E eu sou a Kaori, processada via IA com WebAssembly real sem travamento de rede.
Daniel: Sincronia perfeita executada de forma sequencial.</textarea>
    <div class="karaoke" id="karaoke"></div>
    <button id="btn-play" disabled>▶ Play</button>

    <script type="module">
        import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

        // Configuração para Extensão do Chrome
        env.allowLocalModels = false; 
        env.useBrowserCache = true; // Salva o modelo no IndexedDB da extensão após o primeiro download

        /* ---------------- SEMÁFORO GLOBAL DE ÁUDIO (MUTEX) ---------------- */
        let audioTimelineLock = Promise.resolve();
        function queueScheduler(fn) {
            audioTimelineLock = audioTimelineLock.then(fn);
            return audioTimelineLock;
        }

        /* ---------------- CONTEXTO DE ÁUDIO ---------------- */
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        /* ---------------- ENGINE 1: KAORI (WEBASSEMBLY REAL) ---------------- */
        let kaoriPipeline = null;
        let isKaoriReady = false;

        async function bootKaoriWasm() {
            const statusIndicator = document.getElementById("status");
            statusIndicator.innerText = "Baixando modelo Kaori (MMS WASM)... Pode demorar no 1º boot.";
            
            try {
                // Como estamos rodando no contexto de Extensão, o Fetch para o Hugging Face é liberado
                kaoriPipeline = await pipeline("text-to-speech", "Xenova/mms-1b-por", {
                    quantized: true
                });

                // Aquecimento obrigatório da RAM e do compilador WASM
                await kaoriPipeline("aquecer");

                isKaoriReady = true;
                statusIndicator.innerText = "Kaori WebAssembly Ativa ✔";
                statusIndicator.style.color = "#28a745";
                document.getElementById("btn-play").disabled = false;
            } catch (error) {
                console.error(error);
                statusIndicator.innerText = "Falha no carregamento do WebAssembly: " + error.message;
                statusIndicator.style.color = "#dc3545";
            }
        }
        window.addEventListener("DOMContentLoaded", bootKaoriWasm);

        async function executeKaoriSpeech(text) {
            const rawAudioOutput = await kaoriPipeline(text);
            const ctx = getAudioContext();

            if (ctx.state === 'suspended') await ctx.resume();

            return new Promise((resolve) => {
                const audioBuffer = ctx.createBuffer(1, rawAudioOutput.audio.length, rawAudioOutput.sampling_rate);
                audioBuffer.getChannelData(0).set(rawAudioOutput.audio);

                const sourceNode = ctx.createBufferSource();
                sourceNode.buffer = audioBuffer;
                sourceNode.connect(ctx.destination);

                sourceNode.onended = () => {
                    sourceNode.disconnect();
                    resolve(); // Libera o semáforo da fila apenas após o áudio terminar fisicamente
                };

                logger("Kaori", text);
                sourceNode.start(0);
            });
        }

        /* ---------------- ENGINE 2: DANIEL (SPEECH SYNTHESIS NATIVO) ---------------- */
        let systemVoices = [];
        function populateVoices() {
            if (typeof speechSynthesis !== 'undefined') systemVoices = speechSynthesis.getVoices();
        }
        populateVoices();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function executeDanielSpeech(text) {
            return new Promise((resolve) => {
                if (typeof speechSynthesis === 'undefined') return resolve();

                speechSynthesis.cancel(); // Limpa travas e buffers de hardware

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "pt-BR";

                if (systemVoices.length > 0) {
                    utterance.voice = systemVoices.find(v => /male|daniel/i.test(v.name)) 
                                      || systemVoices.find(v => v.lang.includes("pt")) 
                                      || systemVoices[0];
                }

                // Watchdog de segurança contra travamento silencioso do Chrome
                const timeoutWatchdog = setTimeout(() => { resolve(); }, (text.length * 85) + 2000);

                utterance.onend = () => { clearTimeout(timeoutWatchdog); resolve(); };
                utterance.onerror = () => { clearTimeout(timeoutWatchdog); resolve(); };

                speechSynthesis.speak(utterance);
            });
        }

        /* ---------------- CENTRAL SCHEDULER ROUTER ---------------- */
        function processSpeaker(name, text) {
            const targetName = name.toLowerCase();

            return queueScheduler(async () => {
                if (targetName.includes("kaori")) {
                    while (!isKaoriReady) {
                        await new Promise(r => setTimeout(r, 50));
                    }
                    await executeKaoriSpeech(text);
                } else {
                    await executeDanielSpeech(text);
                }
            });
        }

        function logger(name, text) {
            document.getElementById("karaoke").innerHTML = `<b>${name}:</b> ${text}`;
        }

        async function startEnginePipeline(){
            document.getElementById("btn-play").disabled = true;
            
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') await ctx.resume();

            const inputLines = document.getElementById("texto").value.split("\n").filter(Boolean);
            
            for(const rawLine of inputLines){
                const matchPattern = rawLine.match(/^([^:]+):\s*(.*)$/);    
                if(!matchPattern) continue;
                
                const characterName = matchPattern[1].trim();    
                const spokenText = matchPattern[2].trim();    
                
                logger(characterName, "Processando...");
                await processSpeaker(characterName, spokenText);  
                
                await new Promise(r => setTimeout(r, 200)); // Delay sutil anti-overlap
            }
            
            document.getElementById("btn-play").disabled = false;
        }
        
        document.getElementById("btn-play").addEventListener("click", startEnginePipeline);
    </script>
</body>
</html>
