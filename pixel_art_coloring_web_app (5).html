<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coloring Book Timelapse – Brush Scribble</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    canvas {
      image-rendering: pixelated;
      border: 2px solid #444;
      background: #fff;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <h2>🖌️ Coloring Book Timelapse (Brush Scribble)</h2>

  <input type="file" id="upload" accept="image/*" />

  <canvas id="canvas"></canvas>

  <div class="controls">
    <label>Speed <input type="range" id="speed" min="1" max="20" value="3" /></label>
    <label>Brush <input type="range" id="brush" min="2" max="8" value="4" /></label>
    <button id="play">Play</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const upload = document.getElementById('upload');
    const playBtn = document.getElementById('play');
    const resetBtn = document.getElementById('reset');
    const speedInput = document.getElementById('speed');
    const brushInput = document.getElementById('brush');

    let original, lineart;
    let regions = [];
    let regionIndex = 0;
    let paths = [];
    let pathIndex = 0;
    let animId;

    upload.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);
        original = ctx.getImageData(0, 0, canvas.width, canvas.height);

        lineart = makeLineArt(original);
        regions = extractRegions(original, lineart);

        // build scribble paths per region
        paths = regions.map(r => buildBrushPath(r.pixels));
        regionIndex = 0;
        pathIndex = 0;

        ctx.putImageData(lineart, 0, 0);
      };
      img.src = URL.createObjectURL(file);
    });

    playBtn.onclick = () => {
      if (!paths.length) return;
      cancelAnimationFrame(animId);
      animate();
    };

    resetBtn.onclick = () => {
      cancelAnimationFrame(animId);
      ctx.putImageData(lineart, 0, 0);
      regionIndex = 0;
      pathIndex = 0;
    };

    function animate() {
      const steps = Number(speedInput.value);

      for (let s = 0; s < steps; s++) {
        if (regionIndex >= regions.length) return;

        const region = regions[regionIndex];
        const path = paths[regionIndex];
        const p = path[pathIndex++];

        ctx.fillStyle = `rgb(${region.color[0]},${region.color[1]},${region.color[2]})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, brushInput.value, 0, Math.PI * 2);
        ctx.fill();

        if (pathIndex >= path.length) {
          regionIndex++;
          pathIndex = 0;
        }
      }

      animId = requestAnimationFrame(animate);
    }

    function makeLineArt(imgData) {
      const out = new ImageData(imgData.width, imgData.height);
      const d = imgData.data;
      const o = out.data;

      for (let i = 0; i < d.length; i += 4) {
        const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (d[i + 3] > 0 && lum < 60) {
          o[i] = o[i + 1] = o[i + 2] = 0;
          o[i + 3] = 255;
        } else {
          o[i] = o[i + 1] = o[i + 2] = 255;
          o[i + 3] = 255;
        }
      }
      return out;
    }

    function extractRegions(source, lineart) {
      const w = source.width;
      const h = source.height;
      const s = source.data;
      const l = lineart.data;
      const visited = new Uint8Array(w * h);
      const regions = [];
      const isOutline = i => l[i] === 0 && l[i + 1] === 0 && l[i + 2] === 0;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;
          if (visited[idx] || isOutline(i)) continue;

          const stack = [[x, y]];
          const pixels = [];
          visited[idx] = 1;
          const color = [s[i], s[i + 1], s[i + 2]];

          while (stack.length) {
            const [cx, cy] = stack.pop();
            pixels.push({ x: cx, y: cy });
            for (const [nx, ny] of [[1,0],[-1,0],[0,1],[0,-1]].map(d => [cx + d[0], cy + d[1]])) {
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              const nIdx = ny * w + nx;
              const ni = nIdx * 4;
              if (visited[nIdx] || isOutline(ni)) continue;
              visited[nIdx] = 1;
              stack.push([nx, ny]);
            }
          }

          regions.push({ pixels, color });
        }
      }
      return regions;
    }

    function buildBrushPath(pixels) {
      // random walk through region pixels (scribble)
      const shuffled = pixels.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
  </script>
</body>
</html>
