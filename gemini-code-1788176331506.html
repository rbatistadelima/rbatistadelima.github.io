<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beck 360 - True 3D Sphere Multi-Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .screen-overlay { opacity: 0; transition: opacity 0.2s ease; }
        div:hover > .screen-overlay { opacity: 1; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between overflow-hidden bg-black" ondragover="allowDrop(event)" ondrop="handleGlobalDrop(event)">

    <main class="flex-1 grid grid-cols-2 grid-rows-2 w-full h-full">
        
        <div class="relative w-full h-full overflow-hidden bg-black" ondragover="allowDrop(event)" ondrop="dropFile(event, 1)">
            <div class="screen-overlay absolute top-3 right-3 z-20 bg-black/70 backdrop-blur px-2.5 py-1 rounded flex items-center gap-2 border border-zinc-700/50">
                <span class="text-[10px] text-zinc-300 tracking-wider">H-ROTATE</span>
                <input type="range" min="-180" max="180" value="0" step="1" oninput="setManualRotation(1, this.value)" class="w-20 accent-amber-500 bg-zinc-800 rounded h-1 cursor-pointer">
                <button onclick="resetRotation(1)" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Reset</button>
            </div>
            <div id="container-1" class="w-full h-full cursor-grab active:cursor-grabbing flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none drop-zone-text z-10">
                    <span class="text-xs text-zinc-500 bg-black/80 px-3 py-1.5 rounded border border-zinc-800">Drop 360° Video 1 Here</span>
                </div>
            </div>
        </div>

        <div class="relative w-full h-full overflow-hidden bg-black" ondragover="allowDrop(event)" ondrop="dropFile(event, 2)">
            <div class="screen-overlay absolute top-3 right-3 z-20 bg-black/70 backdrop-blur px-2.5 py-1 rounded flex items-center gap-2 border border-zinc-700/50">
                <span class="text-[10px] text-zinc-300 tracking-wider">H-ROTATE</span>
                <input type="range" min="-180" max="180" value="0" step="1" oninput="setManualRotation(2, this.value)" class="w-20 accent-amber-500 bg-zinc-800 rounded h-1 cursor-pointer">
                <button onclick="resetRotation(2)" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Reset</button>
            </div>
            <div id="container-2" class="w-full h-full cursor-grab active:cursor-grabbing flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none drop-zone-text z-10">
                    <span class="text-xs text-zinc-500 bg-black/80 px-3 py-1.5 rounded border border-zinc-800">Drop 360° Video 2 Here</span>
                </div>
            </div>
        </div>

        <div class="relative w-full h-full overflow-hidden bg-black" ondragover="allowDrop(event)" ondrop="dropFile(event, 3)">
            <div class="screen-overlay absolute top-3 right-3 z-20 bg-black/70 backdrop-blur px-2.5 py-1 rounded flex items-center gap-2 border border-zinc-700/50">
                <span class="text-[10px] text-zinc-300 tracking-wider">H-ROTATE</span>
                <input type="range" min="-180" max="180" value="0" step="1" oninput="setManualRotation(3, this.value)" class="w-20 accent-amber-500 bg-zinc-800 rounded h-1 cursor-pointer">
                <button onclick="resetRotation(3)" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 px-1 py-0.5 rounded text-zinc-300">Reset</button>
            </div>
            <div id="container-3" class="w-full h-full cursor-grab active:cursor-grabbing flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none drop-zone-text z-10">
                    <span class="text-xs text-zinc-500 bg-black/80 px-3 py-1.5 rounded border border-zinc-800">Drop 360° Video 3 Here</span>
                </div>
            </div>
        </div>

        <div class="relative w-full h-full overflow-hidden bg-black" ondragover="allowDrop(event)" ondrop="dropFile(event, 4)">
            <div class="w-full h-full flex items-center justify-center overflow-hidden">
                <video id="vid-4" src="" loop muted playsinline class="object-contain"></video>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none drop-zone-text">
                    <span class="text-xs text-zinc-500 bg-black/80 px-3 py-1.5 rounded border border-zinc-800">Drop Standard Video Here</span>
                </div>
            </div>
        </div>

    </main>

    <footer class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-30 bg-black/75 backdrop-blur-md px-5 py-2.5 rounded-xl border border-zinc-800/80 flex items-center gap-4 text-xs text-zinc-300 shadow-2xl">
        <audio id="master-audio" preload="auto"></audio>
        
        <button onclick="togglePlay()" id="play-btn" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-4 py-1.5 rounded transition-colors text-xs">
            Play / Pause
        </button>

        <div class="flex items-center gap-2">
            <span id="current-time">0:00</span>
            <input type="range" id="seek-bar" value="0" max="100" step="0.1" class="w-32 accent-amber-500 bg-zinc-700 rounded h-1 cursor-pointer">
            <span id="duration">0:00</span>
        </div>

        <div class="border-l border-zinc-700 pl-4 flex items-center gap-1.5">
            <span class="text-zinc-400">Audio:</span>
            <span id="audio-filename" class="text-amber-400 font-medium truncate max-w-[120px]">Drop Audio Anywhere</span>
        </div>
    </footer>

    <script>
        // Track Three.js scenes, cameras, and video items for 1, 2, 3
        const sphereViewers = {};

        function initSphereViewer(id, videoElement) {
            const container = document.getElementById(`container-${id}`);
            container.innerHTML = ''; // Clear fallback text

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); // Flip inside out

            const texture = new THREE.VideoTexture(videoElement);
            texture.minFilter = THREE.LinearFilter;
            texture.format = THREE.RGBAFormat;

            const material = new THREE.MeshBasicMaterial({ map: texture });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Interaction state
            let isDragging = false;
            let lon = 0, lat = 0;
            let savedX = 0, savedY = 0;

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                savedX = e.clientX;
                savedY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - savedX;
                const deltaY = e.clientY - savedY;
                savedX = e.clientX;
                savedY = e.clientY;

                lon -= deltaX * 0.2;
                lat = Math.max(-85, Math.min(85, lat + deltaY * 0.2));
                updateCameraRotation(id, lon, lat);
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // Window resize handler
            window.addEventListener('resize', () => {
                if (!container.clientWidth) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            sphereViewers[id] = { camera, sphere, lon: 0, lat: 0 };
        }

        function updateCameraRotation(id, lon, lat) {
            const viewer = sphereViewers[id];
            if (!viewer) return;
            viewer.lon = lon;
            viewer.lat = lat;

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            const target = new THREE.Vector3();
            target.x = Math.sin(phi) * Math.cos(theta);
            target.y = Math.cos(phi);
            target.z = Math.sin(phi) * Math.sin(theta);

            viewer.camera.lookAt(target);

            // Update UI slider if available
            const screenEl = document.querySelectorAll('.grid > div')[id - 1];
            const slider = screenEl.querySelector('input[type="range"]');
            if (slider) slider.value = Math.max(-180, Math.min(180, lon));
        }

        function setManualRotation(id, val) {
            if (!sphereViewers[id]) return;
            updateCameraRotation(id, parseFloat(val), sphereViewers[id].lat);
        }

        function resetRotation(id) {
            if (!sphereViewers[id]) return;
            updateCameraRotation(id, 0, 0);
        }

        function allowDrop(ev) { ev.preventDefault(); }

        // Global drop handler for audio anywhere on page
        function handleGlobalDrop(ev) {
            ev.preventDefault();
            const file = ev.dataTransfer.files[0];
            if (!file) return;

            if (file.type.startsWith('audio/')) {
                loadAudioFile(file);
                // Auto play elements upon audio drop
                setTimeout(togglePlay, 300);
            }
        }

        function dropFile(ev, screenNum) {
            ev.stopPropagation();
            ev.preventDefault();
            const file = ev.dataTransfer.files[0];
            if (!file) return;

            if (screenNum <= 3 && file.type.startsWith('video/')) {
                // Create invisible source video element for Three.js texture pipeline
                let vid = document.getElementById(`hidden-vid-${screenNum}`);
                if (!vid) {
                    vid = document.createElement('video');
                    vid.id = `hidden-vid-${screenNum}`;
                    vid.loop = true;
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.crossOrigin = 'anonymous';
                    document.body.appendChild(vid);
                }
                vid.src = URL.createObjectURL(file);
                vid.load();
                
                initSphereViewer(screenNum, vid);
            } else if (screenNum === 4 && file.type.startsWith('video/')) {
                const vid = document.getElementById('vid-4');
                vid.src = URL.createObjectURL(file);
                vid.load();
                const dropText = ev.currentTarget.querySelector('.drop-zone-text');
                if (dropText) dropText.style.display = 'none';
            }
        }

        function loadAudioFile(file) {
            if (!file) return;
            const audioURL = URL.createObjectURL(file);
            const audioElement = document.getElementById('master-audio');
            audioElement.src = audioURL;
            document.getElementById('audio-filename').innerText = file.name;
        }

        const masterAudio = document.getElementById('master-audio');
        const playBtn = document.getElementById('play-btn');
        const seekBar = document.getElementById('seek-bar');

        function togglePlay() {
            const hiddenVids = [1, 2, 3].map(id => document.getElementById(`hidden-vid-${id}`)).filter(Boolean);
            const standardVid = document.getElementById('vid-4');
            const allVids = [...hiddenVids, standardVid].filter(v => v && v.src);

            if (masterAudio.paused) {
                masterAudio.play().catch(e => console.log("Audio unlock required"));
                allVids.forEach(v => v.play().catch(e => {}));
                playBtn.innerText = "Pause";
            } else {
                masterAudio.pause();
                allVids.forEach(v => v.pause());
                playBtn.innerText = "Play";
            }
        }

        masterAudio.addEventListener('loadedmetadata', () => {
            document.getElementById('duration').innerText = formatTime(masterAudio.duration);
            seekBar.max = masterAudio.duration;
        });

        masterAudio.addEventListener('timeupdate', () => {
            seekBar.value = masterAudio.currentTime;
            document.getElementById('current-time').innerText = formatTime(masterAudio.currentTime);
            
            const hiddenVids = [1, 2, 3].map(id => document.getElementById(`hidden-vid-${id}`)).filter(Boolean);
            const standardVid = document.getElementById('vid-4');
            const allVids = [...hiddenVids, standardVid].filter(v => v && v.src);

            allVids.forEach(v => {
                if (Math.abs(v.currentTime - masterAudio.currentTime) > 0.3) {
                    v.currentTime = masterAudio.currentTime;
                }
            });
        });

        seekBar.addEventListener('input', (e) => {
            const time = parseFloat(e.target.value);
            masterAudio.currentTime = time;
            
            const hiddenVids = [1, 2, 3].map(id => document.getElementById(`hidden-vid-${id}`)).filter(Boolean);
            const standardVid = document.getElementById('vid-4');
            const allVids = [...hiddenVids, standardVid].filter(v => v && v.src);

            allVids.forEach(v => { v.currentTime = time; });
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
