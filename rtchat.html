<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetplayJS Text Chat</title>
    <!-- Load NetplayJS from unpkg CDN -->
    <script src="https://unpkg.com/netplayjs@0.4.1/dist/netplay.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Connecting to NetplayJS...</div>
            <div id="identity-display">You: Generating...</div>
        </div>
        <button id="next-btn" onclick="nextStranger()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    let netplayConn = null;

    // NetplayJS Matchmaking Connection Setup
    function initNetplay() {
        statusText.textContent = "Searching for peer...";
        
        // NetplayJS PeerConnection handles public WebRTC room matching and signaling automatically
        netplayConn = new netplay.PeerConnection({
            gameID: "auto-text-chat-room",
            isHost: Math.random() > 0.5
        });

        netplayConn.on("open", () => {
            statusText.textContent = "Connected!";
            appendSystemMessage("Connected to a stranger via NetplayJS WebRTC.");
            toggleInputs(true);
            
            // Transmit composite name to partner upon connection
            netplayConn.send({ type: "name", name: myName });
        });

        netplayConn.on("data", (data) => {
            if (typeof data === "object" && data.type === "name") {
                appendSystemMessage(`Stranger's Name: ${data.name}`);
            } else if (typeof data === "string") {
                appendMessage(data, "received");
            }
        });

        netplayConn.on("close", () => {
            appendSystemMessage("Stranger has disconnected.");
            statusText.textContent = "Disconnected.";
            toggleInputs(false);
            // Auto search for new partner after 2 seconds
            setTimeout(nextStranger, 2000);
        });

        netplayConn.on("error", (err) => {
            console.error("NetplayJS Error:", err);
            statusText.textContent = "Connection error. Retrying...";
            setTimeout(nextStranger, 3000);
        });
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && netplayConn) {
            netplayConn.send(text);
            appendMessage(text, "sent");
            messageInput.value = "";
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function nextStranger() {
        if (netplayConn) {
            try { netplayConn.close(); } catch(e){}
            netplayConn = null;
        }
        toggleInputs(false);
        initNetplay();
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Initialize application when DOM and scripts are ready
    window.onload = initNetplay;
</script>

</body>
</html>
