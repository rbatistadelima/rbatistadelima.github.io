<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Group WebRTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 12px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div class="status-row">
            <span id="status-text">Connecting...</span>
            <div id="identity-display">You: Loading...</div>
        </div>
        <div class="status-row" id="room-controls">
            <span>Room: <strong id="room-display">...</strong></span>
            <button onclick="newRoom()">New Room</button>
        </div>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message and press Enter..." onkeypress="handleKeyPress(event)" autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    // Short ID generation (4 random alphanumeric characters)
    const shortId = Math.random().toString(36).substring(2, 6);
    
    let peer = null;
    let isHub = false;
    const activeConnections = new Map(); // peerId -> { conn, name }

    const statusText = document.getElementById('status-text');
    const roomDisplay = document.getElementById('room-display');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');

    const rtcConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    roomDisplay.textContent = roomName;

    function loadChatHistory() {
        const saved = localStorage.getItem('webrtc_' + roomName + '_history');
        if (saved) {
            try {
                JSON.parse(saved).forEach(item => appendMessageToDOM(item.sender, item.text, item.time, item.type));
            } catch(e) {}
        }
    }

    function saveMessageToStorage(sender, text, time, type) {
        try {
            const key = 'webrtc_' + roomName + '_history';
            const saved = localStorage.getItem(key);
            const history = saved ? JSON.parse(saved) : [];
            history.push({ sender, text, time, type });
            if (history.length > 150) history.shift();
            localStorage.setItem(key, JSON.stringify(history));
        } catch(e) {}
    }

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initPeer() {
        loadChatHistory();
        statusText.textContent = 'Connecting to room...';

        // Try to claim the Hub ID for this room: e.g. "room_jqdhre_hub"
        const hubId = `${roomName}_hub`;
        peer = new Peer(hubId, rtcConfig);

        peer.on('open', () => {
            isHub = true;
            statusText.textContent = 'Room created (Hub active). Waiting for peers...';
            setupPeerListeners();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // Hub already exists! Join as a client with a short ID: e.g. "jqdhre_ab12"
                peer.destroy();
                const clientId = `${roomName.replace('room_', '')}_${shortId}`;
                peer = new Peer(clientId, rtcConfig);

                peer.on('open', () => {
                    isHub = false;
                    statusText.textContent = 'Connected to room. Joining...';
                    setupPeerListeners();
                    // Automatically connect to the room Hub
                    const hubConn = peer.connect(hubId, { reliable: true });
                    setupConnection(hubConn);
                });

                peer.on('error', (e) => {
                    statusText.textContent = 'Connection error: ' + e.type;
                });
            } else {
                statusText.textContent = 'Error: ' + err.type;
            }
        });
    }

    function setupPeerListeners() {
        peer.on('connection', (incomingConn) => {
            setupConnection(incomingConn);

            // If we are the Hub, broadcast the new peer list to everyone so they form a full mesh
            if (isHub) {
                setTimeout(() => {
                    const peerList = Array.from(activeConnections.keys());
                    activeConnections.forEach(({ conn }) => {
                        if (conn && conn.open) {
                            conn.send({ type: 'peer_list', peers: peerList });
                        }
                    });
                }, 500);
            }
        });
    }

    function setupConnection(connection) {
        const remoteId = connection.peer;

        connection.on('open', () => {
            activeConnections.set(remoteId, { conn: connection, name: "Peer" });
            statusText.textContent = `Connected peers: ${activeConnections.size}`;
            appendSystemMessage(`Participant joined.`);

            // Send our name
            connection.send({ type: 'name', name: myName });
        });

        connection.on('data', (data) => {
            try {
                if (typeof data === 'object') {
                    if (data.type === 'name') {
                        const p = activeConnections.get(remoteId);
                        if (p) {
                            p.name = data.name;
                            appendSystemMessage(`${data.name} entered.`);
                        }
                        return;
                    }
                    if (data.type === 'peer_list' && !isHub) {
                        // Clients connect to any new peers announced by the Hub to maintain mesh
                        data.peers.forEach(peerId => {
                            if (peerId !== peer.id && !activeConnections.has(peerId)) {
                                const newConn = peer.connect(peerId, { reliable: true });
                                setupConnection(newConn);
                            }
                        });
                        return;
                    }
                }
            } catch(e) {}

            // Broadcast text message to other connected nodes if we are hub, or process incoming text
            const p = activeConnections.get(remoteId);
            const senderName = p ? p.name : "Peer";
            const time = getTimeString();

            appendMessageToDOM(senderName, data, time, 'received');
            saveMessageToStorage(senderName, data, time, 'received');

            // If we are hub, relay text message to all other connected peers
            if (isHub) {
                activeConnections.forEach((val, id) => {
                    if (id !== remoteId && val.conn && val.conn.open) {
                        val.conn.send(data);
                    }
                });
            }
        });

        connection.on('close', () => handleDisconnect(remoteId));
        connection.on('error', () => handleDisconnect(remoteId));
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && activeConnections.size > 0) {
            activeConnections.forEach(({ conn }) => {
                if (conn && conn.open) {
                    conn.send(text);
                }
            });

            const time = getTimeString();
            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(myName, text, time, 'sent');
            messageInput.value = '';
            messageInput.focus();
        } else if (activeConnections.size === 0) {
            alert('Waiting for someone else to join the room...');
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function handleDisconnect(remoteId) {
        const p = activeConnections.get(remoteId);
        const name = p ? p.name : "Peer";
        activeConnections.delete(remoteId);

        appendSystemMessage(`${name} left.`);
        statusText.textContent = activeConnections.size > 0 ? `Connected peers: ${activeConnections.size}` : 'Waiting for peers...';
    }

    function newRoom() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        if (type === 'system') {
            div.textContent = text;
        } else {
            div.innerHTML = `
                <div class="msg-header">
                    <span>${sender}</span>
                    <span class="msg-time">${time}</span>
                </div>
                <div>${text}</div>
            `;
        }
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const time = getTimeString();
        appendMessageToDOM('System', text, time, 'system');
        saveMessageToStorage('System', text, time, 'system');
    }

    window.onload = initPeer;
</script>

</body>
</html>
