<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Initializing...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findNextPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Unique Composite Animal Name Generation
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;
    const myId = 'user_' + Math.random().toString(36).substring(2, 9);

    let ws = null;
    let pc = null;
    let dataChannel = null;
    let targetPeerId = null;
    let isConnected = false;
    let searchTimeout = null;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
        ]
    };

    function initSignaling() {
        statusText.textContent = 'Connecting to network...';
        ws = new WebSocket('wss://socketsbay.com/wss/v2/2/demo/');

        ws.onopen = () => {
            startSearching();
        };

        ws.onmessage = async (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.sender === myId) return;

                // Matchmaking handshake
                if (msg.type === 'find-partner' && !isConnected && !targetPeerId) {
                    if (myId > msg.sender) { // Master / Caller determination
                        targetPeerId = msg.sender;
                        if (searchTimeout) clearTimeout(searchTimeout);
                        statusText.textContent = 'Connecting to stranger...';
                        startCall();
                    }
                }

                // WebRTC Signaling data exchange
                if (msg.target === myId) {
                    if (!pc) createPeerConnection();

                    if (msg.type === 'offer') {
                        if (searchTimeout) clearTimeout(searchTimeout);
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify({ type: 'answer', answer, target: msg.sender, sender: myId }));
                    } else if (msg.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
                    } else if (msg.type === 'candidate' && msg.candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } catch (e) {
                            console.error('ICE candidate error', e);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
            }
        };

        ws.onerror = () => {
            statusText.textContent = 'Signaling error. Reconnecting...';
        };

        ws.onclose = () => {
            setTimeout(initSignaling, 3000);
        };
    }

    function startSearching() {
        if (isConnected) return;
        cleanupConnection();
        statusText.textContent = 'Searching for partner...';
        nextBtn.disabled = false;

        // Broadcast presence
        broadcastPresence();

        // Fallback: If no partner found in 4 seconds, become the host room waiting node
        if (searchTimeout) clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            if (!isConnected) {
                statusText.textContent = 'Waiting for stranger to join...';
            }
        }, 4000);
    }

    function broadcastPresence() {
        if (ws && ws.readyState === WebSocket.OPEN && !isConnected) {
            ws.send(JSON.stringify({ type: 'find-partner', sender: myId }));
        }
    }

    // Ping search interval if unmatched
    setInterval(() => {
        if (!isConnected && !targetPeerId) broadcastPresence();
    }, 2500);

    function createPeerConnection() {
        pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (event) => {
            if (event.candidate && targetPeerId) {
                ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate, target: targetPeerId, sender: myId }));
            }
        };

        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannel();
        };
    }

    async function startCall() {
        createPeerConnection();
        dataChannel = pc.createDataChannel('chat');
        setupDataChannel();

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', offer, target: targetPeerId, sender: myId }));
        } catch (err) {
            console.error('Offer generation error', err);
        }
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            isConnected = true;
            statusText.textContent = 'Connected!';
            appendSystemMessage('Connected to a stranger.');
            toggleInputs(true);
            
            // Send composite name immediately
            dataChannel.send(JSON.stringify({ type: 'name', name: myName }));
        };

        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'name') {
                    appendSystemMessage(`You are chatting with: ${data.name}`);
                }
            } catch {
                appendMessage(event.data, 'received');
            }
        };

        dataChannel.onclose = () => {
            handleDisconnect();
        };
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(text);
            appendMessage(text, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(startSearching, 1500);
    }

    function findNextPartner() {
        cleanupConnection();
        startSearching();
    }

    function cleanupConnection() {
        isConnected = false;
        targetPeerId = null;
        if (searchTimeout) clearTimeout(searchTimeout);
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (pc) { pc.close(); pc = null; }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.onload = initSignaling;
</script>

</body>
</html>
