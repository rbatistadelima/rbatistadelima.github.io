<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG ASCII - Sistema Modular</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RPG ASCII - Sistema Modular</h1>
        </div>
        
        <div class="painel-jogo">
            <!-- Conteúdo do jogo será carregado dinamicamente -->
            <div id="log-eventos">
                <p>Carregando sistemas...</p>
            </div>
        </div>
        
        <div class="controles">
            <button id="btn-iniciar" disabled>Iniciar Jogo</button>
        </div>
    </div>

    <!-- Carregar o sistema de módulos primeiro -->
    <script src="loader.js"></script>
    
    <!-- Carregar a configuração dos módulos -->
    <script src="config.js"></script>
    
    <!-- Carregar o script principal por último -->
    <script src="main.js"></script>
</body>
</html>
