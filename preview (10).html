<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🌍 10 Idiomas lendo Português</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
textarea{width:90%;max-width:980px;height:160px;background:#121214;color:#fff;border:0;border-radius:8px;padding:10px}
.karaoke{width:90%;max-width:980px;background:#141417;padding:14px;border-radius:8px;min-height:120px}
button{background:#222;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(0,0,0,.6);padding:8px;border-radius:10px}
.name{font-weight:bold;margin-right:6px}
</style>
</head>

<body>

<textarea id="texto">
Português BR: Bom dia!
Português PT: Bom dia!
Espanhol ES: Bom dia!
Espanhol MX: Bom dia!
Francês: Bom dia!
Italiano: Bom dia!
Alemão: Bom dia!
Holandês: Bom dia!
Sueco: Bom dia!
Romeno: Bom dia!
Polonês: Bom dia!
</textarea>

<div class="karaoke" id="karaoke">...</div>

<div class="controls">
<button onclick="start()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="resume()">▶⏯</button>
<button onclick="stop()">🛑</button>
</div>

<script>
let synth = window.speechSynthesis;
let voices = [];
let lines = [];

speechSynthesis.onvoiceschanged = () => {
  voices = synth.getVoices();
};
voices = synth.getVoices();

/* 🎯 pega voz por idioma */
function getVoice(lang){
  lang = lang.toLowerCase();

  const match = voices.find(v =>
    v.lang?.toLowerCase().startsWith(lang)
  );

  return match || voices[0];
}

/* 🌍 MAPA DE 10 IDIOMAS */
function speaker(name){
  name = name.toLowerCase();

  switch(name){

    case "português br":
      return {lang:"pt-BR"};

    case "português pt":
      return {lang:"pt-PT"};

    case "espanhol es":
      return {lang:"es-ES"};

    case "espanhol mx":
      return {lang:"es-MX"};

    case "francês":
      return {lang:"fr-FR"};

    case "italiano":
      return {lang:"it-IT"};

    case "alemão":
      return {lang:"de-DE"};

    case "holandês":
      return {lang:"nl-NL"};

    case "sueco":
      return {lang:"sv-SE"};

    case "romeno":
      return {lang:"ro-RO"};

    case "polonês":
      return {lang:"pl-PL"};

    default:
      return {lang:"pt-BR"};
  }
}

/* 🔊 SPEECH */
async function say(name,text){
  const s = speaker(name);

  const u = new SpeechSynthesisUtterance(text);
  u.lang = s.lang;
  u.voice = getVoice(s.lang);

  u.rate = 1;
  u.pitch = 1;

  synth.speak(u);

  await new Promise(r => u.onend = r);
}

/* 📜 FLOW */
async function line(i){
  const l = lines[i];
  const m = l.match(/^([^:]+):\s*(.+)$/);
  const box = document.getElementById("karaoke");

  if(!m){
    box.textContent = l;
    return;
  }

  box.innerHTML = `<span class="name">${m[1]}:</span> ${m[2]}`;
  await say(m[1], m[2]);
}

async function start(){
  lines = document.getElementById("texto")
    .value.split("\n")
    .filter(l => l.trim());

  for(let i=0;i<lines.length;i++){
    await line(i);
  }
}

function pause(){ synth.pause(); }
function resume(){ synth.resume(); }
function stop(){ synth.cancel(); }
</script>

</body>
</html>
