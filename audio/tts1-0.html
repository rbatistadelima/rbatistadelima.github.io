<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ Laboratório TTS — Regina fix</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
html,body{height:100%;margin:0;background:#0f0f12;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
#voiceNames{display:flex;gap:8px}
#voiceNames input{background:#141415;border:1px solid #222;color:#fff;padding:6px 8px;border-radius:6px}
textarea{width:90%;max-width:980px;height:140px;border-radius:8px;padding:10px;background:#121214;border:0;color:#fff;resize:vertical}
.karaoke{width:90%;max-width:980px;padding:18px;border-radius:8px;background:#141417;min-height:120px;font-size:1.15rem;white-space:pre-wrap}
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:rgba(10,10,10,0.6);padding:8px;border-radius:12px;display:flex;gap:8px;opacity:0;transition:opacity .18s}
body.show-controls:hover .controls{opacity:1}
button{background:#222;border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.name{font-weight:700;margin-right:8px}
.small{font-size:12px;color:#9aa0a6}
.immersive #texto, .immersive #voiceNames { display:none; }
</style>
</head>
<body class="show-controls">

<div id="voiceNames">
  <label>Daniel: <input id="nameDaniel" value="Daniel"></label>
  <label>Maria: <input id="nameMaria" value="Maria"></label>
  <label>Regina: <input id="nameRegina" value="Regina"></label>
</div>

<textarea id="texto" spellcheck="false">
Daniel: Bom dia, Regina! Como vai?
Regina: **Tudo ótimo!** E você?
Maria: //Parece que vocês dormiram pouco hoje...//
Daniel: Haha, talvez um pouco! Mas animado para o dia!
Regina: Que bom! //Hoje teremos gravações importantes...//
</textarea>

<div class="karaoke" id="karaoke">Legenda aparecerá aqui...</div>

<div class="controls" role="toolbar" aria-label="Controles TTS">
  <button onclick="startScript()">▶ Ler</button>
  <button onclick="pauseSpeech()">⏸</button>
  <button onclick="resumeSpeech()">⏯</button>
  <button onclick="prevLine()">⏮</button>
  <button onclick="nextLine()">⏭</button>
  <button onclick="stopAll()">🛑</button>
  <button onclick="toggleImmersive()">🕶️ Modo Imersivo</button>
</div>

<script>
let synth = window.speechSynthesis;
let voices = [];
let lines = [];
let currentIndex = 0;
let isPaused = false;
let immersiveMode = false;

const colors = { Daniel:'#ff6b6b', Maria:'#7bed9f', Regina:'#7ea2ff' };

function refreshVoices(){ voices = synth.getVoices() || []; }
if(typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = refreshVoices;
refreshVoices();

function equalsIgnoreCase(a,b){ if(!a||!b) return false; return a.trim().toLowerCase()===b.trim().toLowerCase(); }
function includesIgnoreCase(a,b){ if(!a||!b) return false; return a.toLowerCase().includes(b.toLowerCase()); }

function findPtVoice(preferContains){
  if(!voices || !voices.length) return null;
  if(preferContains){
    const v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('pt') && includesIgnoreCase(v.name, preferContains));
    if(v) return v;
  }
  const vpt = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('pt'));
  if(vpt) return vpt;
  return voices[0] || null;
}

function processarMarcacoes(texto){
  const regex = /(\*\*[^*]+\*\*|\/\/[^/]+\/\/)/g;
  let partes = []; let lastIndex=0; let match;
  while((match = regex.exec(texto))!==null){
    if(match.index>lastIndex) partes.push({texto:texto.substring(lastIndex, match.index), efeito:'normal'});
    const parte = match[0];
    if(parte.startsWith('**')) partes.push({texto:parte.slice(2,-2), efeito:'negrito'});
    if(parte.startsWith('//')) partes.push({texto:parte.slice(2,-2), efeito:'devagar'});
    lastIndex = regex.lastIndex;
  }
  if(lastIndex<texto.length) partes.push({texto:texto.substring(lastIndex), efeito:'normal'});
  return partes;
}

function falarComGoogleTranslate(texto, rate=1, volume=1){
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(texto)}&tl=pt-BR&client=tw-ob`;
  const audio = new Audio(url);
  audio.playbackRate = Math.max(0.5, Math.min(2, rate));
  audio.volume = Math.max(0, Math.min(1, volume));
  return new Promise(resolve=>{
    audio.onended = ()=>resolve({ok:true, source:'google'});
    audio.onerror = ()=>{ console.warn('Google TTS error'); resolve({ok:false, source:'google'}); };
    audio.play().catch(err=>{ console.warn('Audio.play() rejected', err); resolve({ok:false, source:'google'}); });
  });
}

function getSpeakerSpec(nomeLinha){
  const inputDaniel = document.getElementById('nameDaniel').value.trim() || 'Daniel';
  const inputMaria  = document.getElementById('nameMaria').value.trim() || 'Maria';
  const inputRegina = document.getElementById('nameRegina').value.trim() || 'Regina';
  const nl = (nomeLinha||'').trim().toLowerCase();

  if(nl === inputDaniel.toLowerCase() || nl === 'daniel') {
    const v = voices.find(v => includesIgnoreCase(v.name, 'Microsoft Daniel')) || findPtVoice('Microsoft');
    return {tipo:'synth', voz:v, who:'Daniel'};
  }
  if(nl === inputMaria.toLowerCase() || nl === 'maria') {
    const v = voices.find(v => includesIgnoreCase(v.name, 'Microsoft Maria')) || findPtVoice('Microsoft');
    return {tipo:'synth', voz:v, who:'Maria'};
  }
  if(nl === inputRegina.toLowerCase() || nl === 'regina') {
    return {tipo:'google', who:'Regina'};
  }

  const fallback = findPtVoice();
  if(fallback) return {tipo:'synth', voz:fallback, who:'fallback'};
  return {tipo:'google', who:'fallback'};
}

async function speakPartsBySpeaker(nomeLinha, partes){
  const spec = getSpeakerSpec(nomeLinha);
  for(const p of partes){
    if(isPaused) await waitUntilResumed();

    let rate = 1, pitch = 1, volume = 1;

    // todas vozes um pouco mais rápidas
    rate *= 1.2;

    // ajuste de volume por personagem
    if(spec.who.toLowerCase() === 'regina') volume = 0.85;
    else volume = 1.0;

    const textoTrim = p.texto.trim();
    let efeitoAplicar = p.efeito;
    if(textoTrim.endsWith('!')) efeitoAplicar='exclamacao';
    if(textoTrim.endsWith('...')) efeitoAplicar='reticencias';

    if(efeitoAplicar==='negrito' || efeitoAplicar==='exclamacao'){
      rate *= 1.5; pitch *= 1.3; volume *= 1.1;
    }
    if(efeitoAplicar==='devagar' || efeitoAplicar==='reticencias'){
      if(spec.who.toLowerCase() === 'regina'){ rate *= 0.75; pitch *= 0.6; }
      else { rate *= 0.45; pitch *= 0.55; }
    }

    if(spec.tipo === 'synth' && spec.voz){
      const u = new SpeechSynthesisUtterance(p.texto);
      u.voice = spec.voz;
      u.lang = spec.voz.lang || 'pt-BR';
      u.rate = Math.min(2, Math.max(0.5, rate));
      u.pitch = Math.min(2, Math.max(0.1, pitch));
      u.volume = Math.min(1, Math.max(0, volume));
      let ended = false;
      u.onend = () => { ended = true; };
      synth.speak(u);
      await new Promise(resolve => {
        const checker = setInterval(() => { if(ended || !synth.speaking){ clearInterval(checker); resolve(); } }, 80);
      });
    } else {
      const res = await falarComGoogleTranslate(p.texto, rate, volume);
      if(!res.ok){
        const anySynth = findPtVoice();
        if(anySynth){
          const u = new SpeechSynthesisUtterance(p.texto);
          u.voice = anySynth;
          u.lang = anySynth.lang || 'pt-BR';
          u.rate = rate; u.pitch = pitch; u.volume = volume;
          let ended = false; u.onend = () => ended = true;
          synth.speak(u);
          await new Promise(resolve => {
            const checker = setInterval(()=>{ if(ended || !synth.speaking){ clearInterval(checker); resolve(); } },80);
          });
        }
      }
    }
  }
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function lerLinha(i){
  if(i<0 || i>=lines.length) return;
  const linha = lines[i].trim();
  const karaoke = document.getElementById('karaoke');
  karaoke.innerHTML = '';

  const match = linha.match(/^([^:]+):\s*(.+)$/);
  if(!match){
    karaoke.textContent = linha;
    await falarComGoogleTranslate(linha);
    return;
  }
  const nome = match[1].trim();
  const frase = match[2].trim();
  const partes = processarMarcacoes(frase);

  const displayName = nome;
  const cor = colors[displayName] || '#fff';
  let html = `<span class="name" style="color:${cor}">${escapeHtml(displayName)}:</span> `;
  partes.forEach(p => {
    if(p.efeito === 'negrito') html += `<strong>${escapeHtml(p.texto)}</strong>`;
    else if(p.efeito === 'devagar') html += `<em>${escapeHtml(p.texto)}</em>`;
    else html += escapeHtml(p.texto);
  });
  karaoke.innerHTML = html;

  await speakPartsBySpeaker(nome, partes);
}

function waitUntilResumed(){ return new Promise(resolve => { const intv = setInterval(() => { if(!isPaused){ clearInterval(intv); resolve(); } },100); }); }

async function startScript(){
  refreshVoices();
  await new Promise(r => setTimeout(r, 220));
  lines = document.getElementById('texto').value.split('\n').map(l => l.trim()).filter(l => l);
  currentIndex = 0; isPaused = false;
  for(currentIndex=0; currentIndex<lines.length; currentIndex++){
    await lerLinha(currentIndex);
    if(isPaused) await waitUntilResumed();
  }
}

function stopAll(){ try{ if(synth) synth.cancel(); }catch(e){} isPaused=false; }
function pauseSpeech(){ try{ if(synth) synth.pause(); }catch(e){} isPaused=true; }
function resumeSpeech(){ try{ if(synth) synth.resume(); }catch(e){} isPaused=false; }
async function nextLine(){ if(currentIndex < lines.length -1){ try{ if(synth) synth.cancel(); }catch(e){} currentIndex++; await lerLinha(currentIndex); } }
async function prevLine(){ if(currentIndex > 0){ try{ if(synth) synth.cancel(); }catch(e){} currentIndex--; await lerLinha(currentIndex); } }

function toggleImmersive(){ immersiveMode = !immersiveMode; document.body.classList.toggle('immersive', immersiveMode); }

document.addEventListener('keydown', (ev) => {
  if(ev.code === 'Space'){ ev.preventDefault(); if(isPaused) resumeSpeech(); else pauseSpeech(); }
  if(ev.key === 'ArrowRight') nextLine();
  if(ev.key === 'ArrowLeft') prevLine();
});

setTimeout(refreshVoices, 400);
</script>
</body>
</html>
