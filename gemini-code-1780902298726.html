<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TTS Lab — Stable Queue + Preloaded Kaori</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <style>
        html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
        body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
        textarea{width:90%;max-width:980px;height:140px;background:#121214;color:#fff;border:0;padding:10px;border-radius:4px;}
        .karaoke{width:90%;max-width:980px;background:#141417;padding:14px;border-radius:8px;min-height:120px;box-sizing:border-box;}
        button{background:#222;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;}
        button:hover{background:#333;}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .status{font-size:0.9rem;color:#aaa;}
    </style>

    <script type="module">
        import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

        // CONFIGURAÇÃO CRÍTICA PARA FUNCIONAR EM FILE:// (DESATIVA COISAS LOCAIS DO SANDBOX)
        env.allowLocalModels = false;

        /* ---------------- GLOBAL LOCK (CRITICAL FIX) ---------------- */
        let audioLock = Promise.resolve();
        function lock(fn){  
            audioLock = audioLock.then(fn);  
            return audioLock;
        }

        /* ---------------- AUDIO CONTEXT UNIFICADO ---------------- */
        let globalAudioCtx = null;
        function getAudioContext() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return globalAudioCtx;
        }

        /* ---------------- KAORI PRELOAD ---------------- */
        let kaoriPipeline = null;
        let kaoriReady = false;

        async function preloadKaori(){
            const statusEl = document.getElementById("status");
            statusEl.innerText = "Pré-carregando Kaori (IA)...";
            try {
                // Instancia o modelo correto para TTS em português
                kaoriPipeline = await pipeline("text-to-speech", "Xenova/mms-1b-por", {
                    quantized: true
                });
                
                // Warmup real (Gera um buffer vazio ou curto inicial para aquecer o WASM)
                await kaoriPipeline("ok");
                
                kaoriReady = true;
                statusEl.innerText = "Kaori pronta ✔";
                document.getElementById("btn-play").disabled = false;
            } catch(e) {
                console.error(e);
                statusEl.innerText = "Aviso: Kaori indisponível via arquivo local (CORS). Usando Fallbacks nativos.";
                // Não bloqueia o botão para o usuário poder usar as outras vozes se a IA falhar no ambiente local
                document.getElementById("btn-play").disabled = false; 
            }
        }
        window.addEventListener("DOMContentLoaded", preloadKaori);

        /* ---------------- KAORI SPEAK ---------------- */
        async function kaoriSpeak(text){
            if (!kaoriPipeline) {
                logger("Sistema", "Kaori não inicializada corretamente. Pulando...");
                return;
            }
            
            const out = await kaoriPipeline(text);
            const ctx = getAudioContext();
            
            // Força o AudioContext a acordar caso o Chrome o tenha suspendido
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }

            // CORREÇÃO: Aloca o tamanho real do áudio (out.audio.length) e não fixado no sampling_rate
            const buf = ctx.createBuffer(1, out.audio.length, out.sampling_rate);  
            buf.getChannelData(0).set(out.audio);

            const src = ctx.createBufferSource();  
            src.buffer = buf;
            src.connect(ctx.destination);
            
            return new Promise(r => {
                src.onended = () => {
                    src.disconnect();
                    r();
                };
                src.start(0);
            });
        }

        /* ---------------- VOICES NATIVAS ---------------- */
        let voices = [];
        function updateVoices() {
            voices = speechSynthesis.getVoices();
        }
        updateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = updateVoices;
        }

        function pickFemale(){  
            return voices.find(v=>/female|luciana|google|maria/i.test(v.name))    
                || voices.find(v=>v.lang?.includes("pt"))    
                || voices[0];
        }

        function pickMale(){  
            return voices.find(v=>/male|daniel|francis/i.test(v.name))    
                || voices.find(v=>v.lang?.includes("pt"))    
                || voices[0];
        }

        /* ---------------- SYNTH (LOCKED) ---------------- */
        function speakBrowser(text, voice){  
            return lock(() => new Promise(r => {    
                // Proteção do Chrome para limpar buffers nativos anteriores
                speechSynthesis.cancel(); 

                const u = new SpeechSynthesisUtterance(text);    
                if(voice) u.voice = voice;    
                u.lang = "pt-BR";

                // Fallback de tempo limite caso o Chrome esqueça de disparar o onend (Bug nativo clássico)
                const fallbackTimeout = setTimeout(() => { r(); }, (text.length * 80) + 3000);

                u.onend = () => { clearTimeout(fallbackTimeout); r(); };    
                u.onerror = () => { clearTimeout(fallbackTimeout); r(); };

                speechSynthesis.speak(u);  
            }));
        }

        /* ---------------- OTHER SERVICES ---------------- */
        function googleTTS(text){  
            return lock(() => new Promise(r => {    
                const a = new Audio(      
                    "https://translate.google.com/translate_tts?ie=UTF-8&q=" +      
                    encodeURIComponent(text) +      
                    "&tl=pt-BR&client=tw-ob"    
                );    
                a.onended = () => { r(); };    
                a.onerror = () => { r(); };
                a.play().catch(r);  
            }));
        }

        function rv(text){  
            return lock(() => new Promise(r => {    
                responsiveVoice.speak(text, "Brazilian Portuguese Female", {      
                    onend: r,
                    onerror: r
                });  
            }));
        }

        /* ---------------- ROUTER ---------------- */
        function speak(name, text){
            const n = name.toLowerCase();
            
            if(n.includes("kaori")){    
                return lock(async () => {      
                    // Se o pipeline falhou completamente (ex: falta de internet ou CORS estrito no file://)
                    if (!kaoriPipeline) {
                        // Faz fallback automático para voz feminina nativa se a IA falhar no boot local
                        const fallbackFemale = pickFemale();
                        const u = new SpeechSynthesisUtterance(text);
                        if(fallbackFemale) u.voice = fallbackFemale;
                        u.lang = "pt-BR";
                        await new Promise(res => {
                            u.onend = res;
                            u.onerror = res;
                            speechSynthesis.speak(u);
                        });
                        return;
                    }

                    while(!kaoriReady){        
                        await new Promise(r => setTimeout(r,50));      
                    }      
                    await kaoriSpeak(text);    
                });  
            }

            if(n==="ana") return rv(text);  
            if(n==="regina") return googleTTS(text);
            if(n==="daniel") return speakBrowser(text, pickMale());  
            
            return speakBrowser(text, pickFemale());
        }

        /* ---------------- FLOW ---------------- */
        function logger(name, text) {
            document.getElementById("karaoke").innerHTML = `<b>${name}:</b> ${text}`;
        }

        async function start(){
            document.getElementById("btn-play").disabled = true;
            
            // Inicializa/Acorda o Contexto de Áudio no clique do botão (Regra do Chrome)
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                await ctx.resume();
            }

            const lines = document.getElementById("texto").value.split("\n").filter(Boolean);
            
            for(const line of lines){
                const m = line.match(/^([^:]+):\s*(.*)$/);    
                if(!m) continue;
                
                const name = m[1].trim();    
                const text = m[2].trim();    
                
                logger(name, text);
                
                // Aguarda o Lock liberar para ir para a próxima linha da iteração
                await speak(name, text);  
                
                // Respiro de segurança milimétrico antiavalanche de áudio
                await new Promise(r => setTimeout(r, 200));
            }
            
            document.getElementById("btn-play").disabled = false;
        }
        
        // Exporta a função start para o escopo global de forma limpa usando ES Modules
        window.start = start;
    </script>
</head>
<body>
    <div class="status" id="status">Inicializando...</div>
    <textarea id="texto">Daniel: Eu não devo mais interromper Kaori.
Maria: Voz estável.
Regina: Google TTS sincronizado.
Ana: ResponsiveVoice ativo.
Kaori: Agora eu já estou pré-carregada no boot de forma sequencial.
Daniel: Agora está tudo em fila correta.</textarea>
    <div class="karaoke" id="karaoke"></div>
    <button id="btn-play" onclick="start()" disabled>▶ Play</button>
</body>
</html>
