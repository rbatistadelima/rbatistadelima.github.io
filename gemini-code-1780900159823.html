<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser TTS Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            border-left: 4px solid #64748b;
            font-size: 0.9rem;
            display: none;
        }

        .audio-player-container {
            margin-top: 2rem;
            display: none;
            border-top: 1px solid #334155;
            padding-top: 1.5rem;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
        }
    </style>
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        let ttsPipeline = null;
        
        const statusBox = document.getElementById('statusBox');
        const synthBtn = document.getElementById('synthBtn');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');

        function updateStatus(message, isError = false) {
            statusBox.style.display = 'block';
            statusBox.style.borderLeftColor = isError ? '#ef4444' : '#3b82f6';
            statusBox.innerText = message;
        }

        // Initialize the neural network structure inside the client's browser
        async function initEngine() {
            if (ttsPipeline) return;
            try {
                updateStatus("Downloading lightweight voice model layers to browser cache... (this takes a moment on first load)");
                synthBtn.disabled = true;
                
                // Using Xenova/speecht5_tts for client-side synthesis execution
                ttsPipeline = await pipeline('text-to-speech', 'Xenova/speecht5_tts');
                
                updateStatus("TTS Engine ready to run locally.");
                synthBtn.disabled = false;
            } catch (error) {
                updateStatus("Error initializing engine: " + error.message, true);
            }
        }

        async function generateSpeech() {
            const text = document.getElementById('textInput').value.trim();
            const speakerId = parseInt(document.getElementById('voiceSelect').value);

            if (!text) {
                updateStatus("Please enter some text to synthesize.", true);
                return;
            }

            try {
                synthBtn.disabled = true;
                updateStatus("Synthesizing audio matrices via WebAssembly...");

                // Speaker embeddings mapping library for localized multi-voice profiles
                const speaker_embeddings = `https://huggingface.co/datasets/Xenova/cmu-arctic-xvectors/resolve/main/cmu_us_${getSpeakerName(speakerId)}_arctic.bin`;

                // Execute forward pass through the model
                const output = await ttsPipeline(text, { speaker_embeddings });
                
                // Process raw output tensors into a playable browser audio blob
                const wavBlob = makeWavBlob(output.audio, output.sampling_rate);
                const audioUrl = URL.createObjectURL(wavBlob);
                
                audioPlayer.src = audioUrl;
                audioContainer.style.display = 'block';
                updateStatus("Generation complete! Audio synthesized locally.");
            } catch (error) {
                updateStatus("Synthesis failed: " + error.message, true);
            } finally {
                synthBtn.disabled = false;
            }
        }

        function getSpeakerName(id) {
            const profiles = { 1: 'slt', 2: 'clb', 3: 'bdl', 4: 'rms' };
            return profiles[id] || 'slt';
        }

        // Helper function to structuralize raw float data into a standard WAV audio container
        function makeWavBlob(audioData, sampleRate) {
            const buffer = new ArrayBuffer(44 + audioData.length * 2);
            const view = new DataView(buffer);
            
            // RIFF identifier
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + audioData.length * 2, true);
            writeString(view, 8, 'WAVE');
            // FMT sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // Linear PCM
            view.setUint16(22, 1, true); // Mono channel layout
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); // 16-bit depth
            // Data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, audioData.length * 2, true);
            
            // Write PCM audio samples
            let index = 44;
            for (let i = 0; i < audioData.length; i++) {
                let sample = Math.max(-1, Math.min(1, audioData[i]));
                view.setInt16(index, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                index += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Event hooks
        window.addEventListener('DOMContentLoaded', initEngine);
        synthBtn.addEventListener('click', generateSpeech);
    </script>
</head>
<body>

<div class="container">
    <h1>Custom TTS Engine</h1>
    <p class="subtitle">Edge execution text-to-speech engine running locally inside your browser architecture.</p>
    
    <div class="form-group">
        <label for="textInput">Text to Convert</label>
        <textarea id="textInput" placeholder="Type something here for the neural net to speak..."></textarea>
    </div>

    <div class="form-group">
        <label for="voiceSelect">Voice Variant Profile</label>
        <select id="voiceSelect">
            <option value="1">Female Profile A (US - Clear)</option>
            <option value="2">Female Profile B (US - Soft)</option>
            <option value="3">Male Profile A (US - Deep)</option>
            <option value="4">Male Profile B (US - Standard)</option>
        </select>
    </div>

    <button id="synthBtn" disabled>Loading Engine Layers...</button>

    <div id="statusBox" class="status-box"></div>

    <div id="audioContainer" class="audio-player-container">
        <label>Generated Audio Output</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

</body>
</html>
