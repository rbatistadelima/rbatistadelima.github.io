<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen 1 Pokémon Cry Synthesizer + Arpeggiation Editor</title>
    <style>
        :root {
            --gb-darkest: #0f380f;
            --gb-dark: #306230;
            --gb-light: #8bac0f;
            --gb-lightest: #9bbc0f;
            --pokedex-red: #dc0a2d;
            --pokedex-dark: #8b0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #121212; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .pokedex {
            background: var(--pokedex-red);
            border: 4px solid var(--pokedex-dark);
            border-radius: 15px;
            width: 100%; max-width: 900px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; gap: 15px;
        }

        .screen-container {
            background: #dcdcdc;
            border-radius: 10px 10px 10px 30px;
            padding: 15px;
            border: 3px solid #777;
        }

        .lcd-screen {
            background: var(--gb-lightest);
            border: 3px solid var(--gb-darkest);
            border-radius: 5px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .viz-box {
            height: 70px;
            background: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .status-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--gb-lightest); font-size: 11px; font-weight: bold; pointer-events: none;
        }

        .controls { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 8px; border: 2px solid var(--gb-darkest);
            background: var(--gb-light); color: var(--gb-darkest); font-weight: bold; outline: none;
        }
        .btn {
            background: var(--gb-dark); color: var(--gb-lightest);
            border: 2px solid var(--gb-darkest); padding: 8px 12px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn:hover { background: var(--gb-darkest); color: var(--gb-light); }

        /* Arpeggio / Note Editor Panel */
        .note-editor {
            background: var(--gb-light);
            border: 2px solid var(--gb-darkest);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--gb-darkest);
        }
        .note-slots {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: var(--gb-lightest);
            padding: 6px;
            border: 2px solid var(--gb-darkest);
        }
        .slot label {
            font-size: 9px;
            font-weight: bold;
            color: var(--gb-darkest);
        }
        .slot select {
            width: 100%;
            padding: 4px;
            border: 1px solid var(--gb-darkest);
            background: var(--gb-light);
            color: var(--gb-darkest);
            font-weight: bold;
            font-size: 10px;
            outline: none;
            cursor: pointer;
        }

        .grid {
            height: 300px; overflow-y: auto;
            border: 2px solid var(--gb-darkest); background: var(--gb-light);
            padding: 8px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background: var(--gb-dark); }

        .card {
            background: var(--gb-lightest); border: 2px solid var(--gb-darkest);
            padding: 6px; text-align: center; cursor: pointer; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card:hover, .card.active { background: var(--gb-dark); color: var(--gb-lightest); }
        .num { font-size: 9px; font-weight: bold; }
        .name { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
    </style>
</head>
<body>

<div class="pokedex">
    <div class="screen-container">
        <div class="lcd-screen">
            <div class="viz-box">
                <canvas id="canvas"></canvas>
                <div class="status-text" id="status">CLICK ANY POKÉMON TO PLAY</div>
            </div>

            <div class="controls">
                <input type="text" id="search" placeholder="SEARCH POKÉMON..." />
                <button class="btn" id="play-btn">PLAY</button>
                <button class="btn" id="rand-btn">RANDOM</button>
            </div>

            <!-- Note Sequence Editor (Up to 5 Notes / Transposition Steps) -->
            <div class="note-editor">
                <div class="editor-header">
                    <span>NOTE SEQUENCE / ARPEGGIATOR (UP TO 5 NOTES)</span>
                    <button class="btn" id="reset-notes-btn" style="padding: 2px 6px; font-size: 9px;">RESET TO ROOT</button>
                </div>
                <div class="note-slots" id="note-slots"></div>
            </div>

            <div class="grid" id="grid"></div>
        </div>
    </div>
</div>

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function buildNoteEditor() {
    slotsEl.innerHTML = '';
    for (let i = 0; i < 5; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        
        const label = document.createElement('label');
        label.textContent = `NOTE ${i + 1}`;
        
        const select = document.createElement('select');
        noteOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.val;
            option.textContent = opt.label;
            if (String(noteSequence[i]) === opt.val) {
                option.selected = true;
            }
            select.appendChild(option);
        });

        select.onchange = (e) => {
            noteSequence[i] = e.target.value === "none" ? "none" : parseInt(e.target.value, 10);
        };

        slot.appendChild(label);
        slot.appendChild(select);
        slotsEl.appendChild(slot);
    }
}

    gridEl.innerHTML = '';
    const items = pkmn.filter(p => p.n.toLowerCase().includes(filter.toLowerCase()) || p.id.toString() === filter);
    items.forEach(p => {
        const card = document.createElement('div');
        card.className = `card ${activePkmn.id === p.id ? 'active' : ''}`;
        card.innerHTML = `<div class="num">#${String(p.id).padStart(3, '0')}</div><div class="name">${p.n}</div>`;
        card.onclick = () => {
            activePkmn = p;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            playCrySequence(p);
        };
        gridEl.appendChild(card);
    });
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.connect(audioCtx.destination);
        
        const size = audioCtx.sampleRate * 2;
        noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for(let i=0; i<size; i++) data[i] = Math.random() * 2 - 1;

        drawViz();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    statusEl.style.display = 'none';
}

function playCrySequence(p) {
    initAudio();
    
    // Filter active notes from sequence
    const activeSteps = noteSequence.filter(st => st !== "none");
    if (activeSteps.length === 0) return;

    const t = BaseTemplates[p.b];
    const baseHz = 150 + (p.p * 2.5);
    const duration = Math.max(0.08, (p.l * 0.012));
    const startTime = audioCtx.currentTime + 0.01;

    activeSteps.forEach((semitones, idx) => {
        const stepTime = startTime + (idx * (duration * 0.85)); // slight overlap/arpeggio spacing
        const pitchRatio = Math.pow(2, semitones / 12);
        const noteHz = baseHz * pitchRatio;

        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.2, stepTime);
        master.gain.exponentialRampToValueAtTime(0.0001, stepTime + duration);
        master.connect(analyser);

        const osc = audioCtx.createOscillator();
        osc.type = t.wave;
        osc.frequency.setValueAtTime(noteHz, stepTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, noteHz + t.sweep), stepTime + duration);

        if(t.vibDepth > 0) {
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.setValueAtTime(t.vibRate, stepTime);
            lfoGain.gain.setValueAtTime(t.vibDepth, stepTime);
            lfo.connect(osc.frequency);
            lfo.start(stepTime);
            lfo.stop(stepTime + duration);
        }

        osc.connect(master);
        osc.start(stepTime);
        osc.stop(stepTime + duration);

        if(t.noise && noiseBuffer) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(noteHz * 1.8, stepTime);
            filter.Q.setValueAtTime(1.5, stepTime);

            const nGain = audioCtx.createGain();
            nGain.gain.setValueAtTime(0.1, stepTime);
            nGain.gain.exponentialRampToValueAtTime(0.0001, stepTime + duration);

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(master);

            noise.start(stepTime);
            noise.stop(stepTime + duration);
        }
    });
}

function drawViz() {
    requestAnimationFrame(drawViz);
    if (!analyser) return;
    const bufLen = analyser.frequencyBinCount;
    const arr = new Uint8Array(bufLen);
    analyser.getByteTimeDomainData(arr);

    ctx.fillStyle = '#0f380f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#9bbc0f';
    ctx.beginPath();

    const slice = canvas.width / bufLen;
    let x = 0;
    for(let i=0; i<bufLen; i++) {
        const v = arr[i] / 128.0;
        const y = v * (canvas.height / 2);
        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += slice;
    }
    ctx.stroke();
}

resetBtn.onclick = () => {
    noteSequence = [0, "none", "none", "none", "none"];
    buildNoteEditor();
};

searchEl.oninput = (e) => buildGrid(e.target.value);
playBtn.onclick = () => playCrySequence(activePkmn);
randBtn.onclick = () => {
    activePkmn = pkmn[Math.floor(Math.random() * pkmn.length)];
    buildGrid(searchEl.value);
    playCrySequence(activePkmn);
};

buildNoteEditor();
buildGrid();
</script>
