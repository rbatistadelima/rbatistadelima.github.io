<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous Group WebRTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
        }
        #app-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        /* Sidebar Panels */
        .sidebar {
            width: 200px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 12px;
            color: #475569;
        }
        .sidebar.right {
            border-right: none;
            border-left: 1px solid #e2e8f0;
        }
        .sidebar h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .sidebar ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar li {
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-all;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            flex-shrink: 0;
        }
        /* Main Chat Container */
        #chat-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 10px 14px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 11px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fafafa;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 9px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 10px 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 8px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
        /* Mobile responsive collapse for sidebars */
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- Left Sidebar: Services Working -->
    <div class="sidebar">
        <h3>Services Working</h3>
        <ul>
            <li><span class="status-dot"></span> PeerJS Signaling</li>
            <li><span class="status-dot"></span> WebRTC P2P Mesh</li>
            <li><span class="status-dot"></span> STUN Server</li>
            <li><span class="status-dot"></span> Local Storage Cache</li>
        </ul>
    </div>

    <!-- Main Chat Window -->
    <div id="chat-container">
        <div id="status-bar">
            <div class="status-row">
                <span id="status-text">Connecting...</span>
                <div id="identity-display">You: Loading...</div>
            </div>
            <div class="status-row" id="room-controls">
                <span>Room: <strong id="room-display">...</strong></span>
                <button onclick="newRoom()">New Room</button>
            </div>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Right Sidebar: Connected Clients -->
    <div class="sidebar right">
        <h3>Connected Clients</h3>
        <ul id="client-list">
            <li id="self-client-item"><span class="status-dot"></span> <span id="self-client-name">You (Loading)</span></li>
        </ul>
    </div>
</div>

<script>
    // Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    const myUniqueId = 'u_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('identity-display').textContent = `You: ${myName}`;
    document.getElementById('self-client-name').textContent = `${myName} (You)`;

    let peer = null;
    let isHub = false;
    const activeConnections = new Map(); // peerId -> { conn, name }
    const processedMessageIds = new Set();
    let reconnectTimer = null;

    const statusText = document.getElementById('status-text');
    const roomDisplay = document.getElementById('room-display');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const clientListEl = document.getElementById('client-list');

    const rtcConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    roomDisplay.textContent = roomName;

    function loadChatHistory() {
        const saved = localStorage.getItem('webrtc_' + roomName + '_history');
        if (saved) {
            try {
                JSON.parse(saved).forEach(item => {
                    if (item.msgId) processedMessageIds.add(item.msgId);
                    appendMessageToDOM(item.sender, item.text, item.time, item.type);
                });
            } catch(e) {}
        }
    }

    function saveMessageToStorage(msgId, sender, text, time, type) {
        try {
            const key = 'webrtc_' + roomName + '_history';
            const saved = localStorage.getItem(key);
            const history = saved ? JSON.parse(saved) : [];
            history.push({ msgId, sender, text, time, type });
            if (history.length > 150) history.shift();
            localStorage.setItem(key, JSON.stringify(history));
        } catch(e) {}
    }

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function updateClientListUI() {
        // Keep self entry
        clientListEl.innerHTML = `<li id="self-client-item"><span class="status-dot"></span> <span>${myName} (You)</span></li>`;
        
        // Add connected peers
        activeConnections.forEach(({ name }) => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="status-dot"></span> <span>${name || 'Peer'}</span>`;
            clientListEl.appendChild(li);
        });
    }

    function initPeer() {
        loadChatHistory();
        statusText.textContent = 'Connecting to room...';

        const hubId = `${roomName}_hub`;

        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }

        peer = new Peer(hubId, rtcConfig);

        const initTimeout = setTimeout(() => {
            if (peer && !peer.open && !isHub) {
                try { peer.destroy(); } catch(e) {}
                connectAsClient(hubId);
            }
        }, 3000);

        peer.on('open', () => {
            clearTimeout(initTimeout);
            isHub = true;
            statusText.textContent = 'Room active (Hub ready).';
            setupPeerListeners();
        });

        peer.on('error', (err) => {
            clearTimeout(initTimeout);
            if (err.type === 'unavailable-id' || err.type === 'invalid-id' || err.type === 'server-error') {
                peer.destroy();
                connectAsClient(hubId);
            } else {
                statusText.textContent = 'Connection error. Retrying...';
                scheduleReconnect();
            }
        });
    }

    function connectAsClient(hubId) {
        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }

        const randomSuffix = Math.random().toString(36).substring(2, 8) + Math.random().toString(36).substring(2, 6);
        const clientId = `${roomName.replace('room_', '')}_${randomSuffix}`;
        
        peer = new Peer(clientId, rtcConfig);

        peer.on('open', () => {
            isHub = false;
            statusText.textContent = 'Connected to room.';
            setupPeerListeners();
            const hubConn = peer.connect(hubId, { reliable: true });
            setupConnection(hubConn);
        });

        peer.on('error', (e) => {
            statusText.textContent = 'Retrying connection...';
            scheduleReconnect();
        });
    }

    function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            initPeer();
        }, 2500);
    }

    function setupPeerListeners() {
        peer.on('connection', (incomingConn) => {
            setupConnection(incomingConn);

            if (isHub) {
                setTimeout(() => {
                    const peerList = Array.from(activeConnections.keys());
                    activeConnections.forEach(({ conn }) => {
                        if (conn && conn.open) {
                            conn.send({ type: 'peer_list', peers: peerList });
                        }
                    });
                }, 500);
            }
        });
    }

    function setupConnection(connection) {
        const remoteId = connection.peer;

        connection.on('open', () => {
            activeConnections.set(remoteId, { conn: connection, name: "Peer" });
            statusText.textContent = `Connected peers: ${activeConnections.size}`;
            connection.send({ type: 'profile', id: myUniqueId, name: myName });
            updateClientListUI();
        });

        connection.on('data', (data) => {
            try {
                if (typeof data === 'object' && data !== null) {
                    if (data.type === 'profile') {
                        const p = activeConnections.get(remoteId);
                        if (p) {
                            p.name = data.name;
                            p.uid = data.id;
                            updateClientListUI();
                        }
                        return;
                    }
                    if (data.type === 'peer_list' && !isHub) {
                        data.peers.forEach(peerId => {
                            if (peerId !== peer.id && !activeConnections.has(peerId)) {
                                const newConn = peer.connect(peerId, { reliable: true });
                                setupConnection(newConn);
                            }
                        });
                        return;
                    }
                    if (data.type === 'chat_msg') {
                        if (data.uid === myUniqueId || processedMessageIds.has(data.msgId)) return;
                        
                        processedMessageIds.add(data.msgId);

                        const time = data.time || getTimeString();
                        appendMessageToDOM(data.sender, data.text, time, 'received');
                        saveMessageToStorage(data.msgId, data.sender, data.text, time, 'received');

                        if (isHub) {
                            activeConnections.forEach((val, id) => {
                                if (id !== remoteId && val.conn && val.conn.open) {
                                    val.conn.send(data);
                                }
                            });
                        }
                        return;
                    }
                }
            } catch(e) {}
        });

        connection.on('close', () => handleDisconnect(remoteId));
        connection.on('error', () => handleDisconnect(remoteId));
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
            const time = getTimeString();
            const msgId = 'm_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
            
            const payload = {
                type: 'chat_msg',
                msgId: msgId,
                uid: myUniqueId,
                sender: myName,
                text: text,
                time: time
            };

            processedMessageIds.add(msgId);

            activeConnections.forEach(({ conn }) => {
                if (conn && conn.open) {
                    conn.send(payload);
                }
            });

            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(msgId, myName, text, time, 'sent');
            messageInput.value = '';
            messageInput.focus();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function handleDisconnect(remoteId) {
        activeConnections.delete(remoteId);
        statusText.textContent = activeConnections.size > 0 ? `Connected peers: ${activeConnections.size}` : 'Waiting for peers...';
        updateClientListUI();
    }

    function newRoom() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="msg-header">
                <span>${sender}</span>
                <span class="msg-time">${time}</span>
            </div>
            <div>${text}</div>
        `;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.addEventListener('beforeunload', () => {
        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }
    });

    window.onload = initPeer;
</script>

</body>
</html>
