<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TSS Lab — Kaori Engine Primária + Fila Estável</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 16px;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
        }
        
        .status-bar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.85rem;
        }
        
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .led.ready { 
            background: #22c55e; 
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 2s infinite;
        }
        
        .led.loading { 
            background: #eab308; 
            animation: pulse 1s infinite;
        }
        
        .led.error { 
            background: #ef4444; 
        }
        
        .led.idle { 
            background: #64748b; 
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .progress-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a2a35;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        textarea {
            width: 100%;
            background: #121214;
            color: #fff;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .karaoke {
            background: #141417;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .karaoke b {
            color: #3b82f6;
        }
        
        button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .queue-info {
            background: #141417;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
        
        .cancel-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            margin-left: 10px;
        }
        
        .character-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .badge-kaori { background: #8b5cf6; }
        .badge-fallback { background: #64748b; }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .character-card {
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="led" id="kaoriLed"></div>
                <span>🎙️ Kaori (MMS Portuguese)</span>
            </div>
            <div class="status-indicator">
                <div class="led" id="fallbackLed"></div>
                <span>🔄 Fallback (Web Speech)</span>
            </div>
            <div class="status-indicator">
                <div class="led" id="queueLed"></div>
                <span>📋 Fila de Execução</span>
            </div>
        </div>

        <!-- Progresso de carregamento -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="margin-top: 8px; font-size: 0.85rem;" id="statusText">
                🔄 Inicializando Kaori...
            </div>
        </div>

        <!-- Input -->
        <textarea id="texto" rows="8">Kaori: Olá! Eu sou a Kaori, sua assistente de voz principal.
Daniel: E eu sou o Daniel, usando fallback quando necessário.
Kaori: Agora o sistema está estável e sem interrupções.
Maria: Todas as falas respeitam a fila de execução.
Kaori: Experimente o Play All para ver a mágica acontecendo!</textarea>

        <!-- Karaoke Display -->
        <div class="karaoke" id="karaoke">
            💬 Clique em Play para começar...
        </div>

        <!-- Botões de Controle -->
        <div style="display: flex; gap: 12px; justify-content: center;">
            <button onclick="window.ttsApp.play()" id="playBtn">▶ Play All (Sequencial)</button>
            <button onclick="window.ttsApp.cancel()" class="cancel-btn" id="cancelBtn">🛑 Cancelar Tudo</button>
        </div>

        <!-- Informações da Fila -->
        <div class="queue-info" id="queueInfo">
            📊 Nenhuma fala em execução
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.js"
            }
        }
    </script>

    <script type="module">
        import { pipeline } from '@huggingface/transformers';
        
        // ============================================
        // SINGLE ENGINE + LOCK GLOBAL ROBUSTO
        // ============================================
        
        class TTSManager {
            constructor() {
                this.audioLock = Promise.resolve();
                this.kaoriPipeline = null;
                this.kaoriReady = false;
                this.queue = [];
                this.isPlaying = false;
                this.currentLine = 0;
                this.audioContext = null;
                this.voices = [];
                
                this.init();
            }
            
            async init() {
                // Carrega vozes do sistema para fallback
                this.loadVoices();
                
                // Pré-carrega Kaori imediatamente
                await this.preloadKaori();
            }
            
            loadVoices() {
                if (typeof speechSynthesis !== 'undefined') {
                    this.voices = speechSynthesis.getVoices();
                    speechSynthesis.onvoiceschanged = () => {
                        this.voices = speechSynthesis.getVoices();
                        console.log(`✅ ${this.voices.length} vozes carregadas`);
                    };
                }
            }
            
            async preloadKaori() {
                const kaoriLed = document.getElementById('kaoriLed');
                const progressFill = document.getElementById('progressFill');
                const statusText = document.getElementById('statusText');
                
                try {
                    kaoriLed.className = 'led loading';
                    statusText.innerHTML = '📥 Baixando modelo MMS Portuguese...';
                    
                    // Carrega o pipeline TTS
                    this.kaoriPipeline = await pipeline(
                        'text-to-speech',
                        'Xenova/mms-tts-por',
                        {
                            progress_callback: (progress) => {
                                const percent = Math.round(progress.progress * 100);
                                progressFill.style.width = `${percent}%`;
                                if (progress.status === 'downloading') {
                                    statusText.innerHTML = `⬇️ Baixando: ${percent}%`;
                                } else if (progress.status === 'loading') {
                                    statusText.innerHTML = `🔄 Carregando modelo: ${percent}%`;
                                }
                            }
                        }
                    );
                    
                    // Warmup - reduz latência na primeira fala
                    statusText.innerHTML = '🔥 Aquecendo o modelo...';
                    await this.kaoriPipeline("Inicializando sistema de voz.");
                    
                    this.kaoriReady = true;
                    kaoriLed.className = 'led ready';
                    statusText.innerHTML = '✅ Kaori pronta para uso!';
                    
                    // Inicializa AudioContext (suspenso até primeira interação)
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    console.log('🎤 Kaori carregada com sucesso!');
                    
                } catch (error) {
                    console.error('❌ Erro ao carregar Kaori:', error);
                    kaoriLed.className = 'led error';
                    statusText.innerHTML = '⚠️ Erro no Kaori, usando fallback nativo';
                    this.kaoriReady = false;
                }
            }
            
            // Lock global - garantia de execução sequencial
            lock(fn) {
                this.audioLock = this.audioLock.then(fn).catch(err => {
                    console.error('Erro no lock:', err);
                    return Promise.resolve();
                });
                return this.audioLock;
            }
            
            async speakWithKaori(text) {
                if (!this.kaoriReady || !this.kaoriPipeline) {
                    throw new Error('Kaori não está pronta');
                }
                
                console.log(`🎤 Kaori gerando áudio: "${text.substring(0, 50)}..."`);
                
                // Gera áudio neural
                const output = await this.kaoriPipeline(text);
                
                // Resume AudioContext se necessário (primeira interação)
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                // Converte para buffer de áudio
                const audioBuffer = this.audioContext.createBuffer(
                    1, 
                    output.audio.length, 
                    output.sampling_rate
                );
                audioBuffer.copyToChannel(output.audio, 0);
                
                // Cria e toca fonte
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(this.audioContext.destination);
                source.start();
                
                return new Promise((resolve) => {
                    source.onended = () => {
                        console.log('✅ Kaori finalizou');
                        resolve();
                    };
                });
            }
            
            speakWithFallback(text, voiceType = 'female') {
                return new Promise((resolve) => {
                    if (typeof speechSynthesis === 'undefined') {
                        console.warn('Web Speech API não disponível');
                        resolve();
                        return;
                    }
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 0.95;
                    utterance.pitch = voiceType === 'female' ? 1.1 : 0.9;
                    
                    // Tenta encontrar voz apropriada
                    if (this.voices.length > 0) {
                        const voice = this.voices.find(v => 
                            voiceType === 'female' 
                                ? v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('maria')
                                : v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('daniel')
                        ) || this.voices.find(v => v.lang === 'pt-BR');
                        
                        if (voice) utterance.voice = voice;
                    }
                    
                    utterance.onend = () => resolve();
                    utterance.onerror = () => resolve();
                    
                    speechSynthesis.speak(utterance);
                });
            }
            
            // Método unificado com fallback automático
            speak(name, text) {
                return this.lock(async () => {
                    const nameLower = name.toLowerCase();
                    
                    // Atualiza karaoke display
                    this.updateKaraoke(name, text);
                    
                    // Prioridade máxima para Kaori
                    if (nameLower.includes('kaori') || nameLower === 'kaori') {
                        if (this.kaoriReady) {
                            await this.speakWithKaori(text);
                        } else {
                            console.warn('Kaori não disponível, usando fallback');
                            await this.speakWithFallback(text, 'female');
                        }
                    } 
                    // Daniel (voz masculina)
                    else if (nameLower.includes('daniel') || nameLower === 'daniel') {
                        await this.speakWithFallback(text, 'male');
                    }
                    // Maria/Ana (voz feminina)
                    else if (nameLower.includes('maria') || nameLower.includes('ana') || nameLower === 'maria') {
                        await this.speakWithFallback(text, 'female');
                    }
                    // Padrão: feminino
                    else {
                        await this.speakWithFallback(text, 'female');
                    }
                    
                    // Pequena pausa entre falas para respiro
                    await new Promise(r => setTimeout(r, 150));
                });
            }
            
            updateKaraoke(name, text) {
                const karaoke = document.getElementById('karaoke');
                karaoke.innerHTML = `<b>${name}:</b> ${text}`;
                
                // Adiciona badge indicando engine
                const isKaori = name.toLowerCase().includes('kaori');
                const badge = document.createElement('span');
                badge.className = `character-badge ${isKaori ? 'badge-kaori' : 'badge-fallback'}`;
                badge.textContent = isKaori ? '🎙️ Kaori' : '🔄 Fallback';
                karaoke.appendChild(badge);
            }
            
            updateQueueStatus(status, queueLength = 0) {
                const queueInfo = document.getElementById('queueInfo');
                const queueLed = document.getElementById('queueLed');
                
                if (status === 'playing') {
                    queueLed.className = 'led ready';
                    queueInfo.innerHTML = '🎵 Executando falas...';
                } else if (queueLength > 0) {
                    queueLed.className = 'led loading';
                    queueInfo.innerHTML = `⏳ ${queueLength} falas na fila aguardando...`;
                } else {
                    queueLed.className = 'led idle';
                    queueInfo.innerHTML = '✅ Sistema pronto para tocar';
                }
            }
            
            async play() {
                const playBtn = document.getElementById('playBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const textarea = document.getElementById('texto');
                
                playBtn.disabled = true;
                playBtn.textContent = '⏳ Executando...';
                cancelBtn.disabled = false;
                
                const lines = textarea.value.split('\n').filter(line => line.trim());
                const totalLines = lines.length;
                let currentIndex = 0;
                
                try {
                    for (const line of lines) {
                        const match = line.match(/^([^:]+):\s*(.*)$/);
                        if (!match) continue;
                        
                        const name = match[1].trim();
                        const text = match[2].trim();
                        
                        currentIndex++;
                        this.updateQueueStatus('playing', totalLines - currentIndex);
                        
                        await this.speak(name, text);
                    }
                    
                    this.updateKaraoke('✅ Concluído', 'Todas as falas foram executadas com sucesso!');
                    this.updateQueueStatus('idle', 0);
                    
                } catch (error) {
                    console.error('Erro na execução:', error);
                    this.updateKaraoke('❌ Erro', error.message);
                } finally {
                    playBtn.disabled = false;
                    playBtn.textContent = '▶ Play All (Sequencial)';
                    cancelBtn.disabled = true;
                }
            }
            
            cancel() {
                // Interrompe Web Speech
                if (typeof speechSynthesis !== 'undefined') {
                    speechSynthesis.cancel();
                }
                
                // Interrompe Web Audio
                if (this.audioContext && this.audioContext.state !== 'closed') {
                    // Não podemos fechar porque precisamos reusar, apenas paramos fontes ativas
                }
                
                // Limpa lock atual (forçando resolução)
                this.audioLock = Promise.resolve();
                
                this.updateKaraoke('🛑 Cancelado', 'Execução interrompida pelo usuário');
                this.updateQueueStatus('idle', 0);
                
                const playBtn = document.getElementById('playBtn');
                playBtn.disabled = false;
                playBtn.textContent = '▶ Play All (Sequencial)';
                
                console.log('Execução cancelada');
            }
        }
        
        // ============================================
        // INICIALIZAÇÃO GLOBAL
        // ============================================
        
        // Expõe app globalmente
        window.ttsApp = new TTSManager();
        
        // Habilita primeira interação para AudioContext
        document.body.addEventListener('click', () => {
            if (window.ttsApp.audioContext && window.ttsApp.audioContext.state === 'suspended') {
                window.ttsApp.audioContext.resume();
                console.log('🎵 AudioContext ativado');
            }
        }, { once: true });
        
        console.log('✅ Sistema TTS inicializado - Kaori como engine principal');
    </script>
</body>
</html>
