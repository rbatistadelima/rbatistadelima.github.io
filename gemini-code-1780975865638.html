<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Visual de Stories - Gramore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; /* Garante que não haverá scrolldown na tela */
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen flex flex-col justify-between p-4 gap-4">

    <!-- Top Header & Dropdown -->
    <header class="bg-gray-900 rounded-2xl px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 border border-gray-800 shrink-0 shadow-xl">
        <div>
            <h1 class="text-lg font-black text-white tracking-wide uppercase flex items-center gap-2">
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                Cronograma Volumétrico de Stories
            </h1>
            <p class="text-xs text-gray-400 mt-0.5">Eixo Vertical: Linha do Tempo (10h às 20h) • Eixo Horizontal: Densidade e Tipo de Mídia</p>
        </div>
        
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <select id="patternSelect" class="bg-gray-950 border border-gray-700 text-emerald-400 font-bold text-xs rounded-xl focus:ring-2 focus:ring-emerald-500 p-3 cursor-pointer transition-all w-full sm:w-72 shadow-inner">
                <option value="abertura">Padrão: Abertura Rápida (Foco Início/Sinal)</option>
                <option value="comercial">Padrão: Comercial (Picos de Venda)</option>
                <option value="continuo">Padrão: Contínuo (Linear de 1h em 1h)</option>
            </select>
        </div>
    </header>

    <!-- Main Workspace: Apenas o Gráfico Ocupando a Tela Cheia -->
    <main class="flex-grow bg-gray-900 rounded-2xl border border-gray-800 p-6 flex flex-col justify-center relative shadow-2xl overflow-hidden">
        <div class="absolute top-4 right-6 flex gap-4 text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-emerald-600 rounded-sm"></span> Vídeo / Captura</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-amber-500 rounded-sm"></span> Foto / Arte</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-blue-500 rounded-sm"></span> Tela Digital</div>
        </div>

        <!-- Área Real do Chart.js -->
        <div class="w-full h-full relative min-h-0">
            <canvas id="fullscreenChart"></canvas>
        </div>
    </main>

    <!-- Footer Fixo Sem Atrapalhar Layout -->
    <footer class="flex justify-between items-center text-[10px] text-gray-600 px-2 shrink-0 font-medium">
        <div>Estande #A2-003 • Rua A/2 • Distrito Anhembi</div>
        <div class="tracking-wider uppercase text-emerald-600 font-bold">Gramore • Cultive o que te faz bem</div>
    </footer>

    <!-- Lógica do Gráfico Invertido (Tempo Vertical) -->
    <script>
        const ctx = document.getElementById('fullscreenChart').getContext('2d');
        let chartInstance;

        // Configuração de dados das estratégias mapeadas horizontalmente
        const datasets = {
            abertura: {
                labels: ["20:00 - Fim do Dia", "19:30 - Depoimento", "18:45 - Equipe", "18:00 - Consultores", "16:45 - Plataforma", "15:30 - Catálogo", "14:15 - Estande", "13:00 - Produto", "10:30 - Convite Diretores", "10:15 - A Caminho", "10:00 - Começo"],
                volumes: [4, 7, 5, 8, 9, 6, 5, 8, 9, 9, 6], // Representação visual de impacto/densidade do conteúdo
                colors: ['#059669', '#059669', '#d97706', '#059669', '#2563eb', '#059669', '#d97706', '#059669', '#059669', '#059669', '#d97706'],
                tips: [
                    "Vídeo: Luzes do estande baixando e equipe acenando tchau.",
                    "Vídeo 15s: Entrevista rápida no celular com cliente que comprou.",
                    "Foto: Time Gramore unido e sorrindo no estande.",
                    "Bastidores: Mesas de negociação cheias com clientes.",
                    "Tela Gravada: Mão mexendo no aplicativo da Gramore na feira.",
                    "Vídeo Curto: Consultor folheando o catálogo físico/tablet.",
                    "Foto/Take: Foco nos laudos técnicos e controle de lote sobre a mesa.",
                    "Vídeo Macro: Close-up estético com foco nas texturas de grãos e temperos.",
                    "Vídeo: Diretor (Francisco ou Eric) falando direto do estande.",
                    "Vídeo POV: Caminhada rápida da entrada da feira até a Rua A/2.",
                    "Foto ou Arte: Equipe reunida com o estande limpo pronto para abrir."
                ]
            },
            comercial: {
                labels: ["20:00 - Fim do Dia", "19:30 - Depoimento", "19:00 - Equipe", "18:15 - Consultores", "17:30 - Plataforma", "17:00 - Catálogo", "14:30 - Estande", "13:15 - Produto", "12:30 - Convite Diretores", "12:00 - A Caminho", "10:00 - Começo"],
                volumes: [4, 6, 5, 8, 8, 7, 5, 8, 9, 8, 6],
                colors: ['#d97706', '#059669', '#d97706', '#059669', '#2563eb', '#059669', '#d97706', '#059669', '#059669', '#059669', '#d97706'],
                tips: [
                    "Foto: Métricas simbólicas do sucesso e metas batidas no dia.",
                    "Vídeo: Cliente segurando sacola institucional e elogiando o mix.",
                    "Foto: Integração corporativa do time no balcão principal.",
                    "Take Dinâmico: Consultores sorrindo e apertando mãos de parceiros.",
                    "Screenshot: Demonstração rápida da aba 'Meus Pedidos' do app.",
                    "Vídeo: Mostrando a espessura física e variedade do catálogo.",
                    "Foto: Selos de qualidade impressos e banners de destaque.",
                    "Vídeo Estético: Detalhe do derramamento de sementes e grãos.",
                    "Vídeo: Francisco Bilac detalhando soluções para novos negócios.",
                    "Vídeo Acelerado: Caminhada rápida cortando os corredores principais.",
                    "Arte: Contagem regressiva finalizada postada logo cedo."
                ]
            },
            continuo: {
                labels: ["20:00 - Fim do Dia", "19:00 - Depoimento", "18:00 - Equipe", "17:00 - Consultores", "16:00 - Plataforma", "15:00 - Catálogo", "14:00 - Estande", "13:00 - Produto", "12:00 - Convite Diretores", "11:00 - A Caminho", "10:00 - Começo"],
                volumes: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6], // Linear perfeito
                colors: ['#d97706', '#059669', '#059669', '#d97706', '#059669', '#d97706', '#059669', '#d97706', '#059669', '#059669', '#d97706'],
                tips: [
                    "Foto: Equipe dando tchau e organizando o espaço para o dia seguinte.",
                    "Vídeo: Cliente relatando agilidade e facilidade nas entregas diárias.",
                    "Vídeo Grupo: Cumprimento ou grito de guerra motivacional do time.",
                    "Foto: Consultor mostrando amostras físicas de temperos ao cliente.",
                    "Vídeo Curto: Navegação rápida no painel digital de faturamento do cliente.",
                    "Foto: Mix de temperos coloridos organizados em displays limpos.",
                    "Vídeo: Foco macro no selo de rastreabilidade impresso na embalagem.",
                    "Foto: Visão limpa e panorâmica das estantes de exposição.",
                    "Vídeo Diretor: Mensagem focada em quem busca abrir lojas de naturais.",
                    "Vídeo Corredor: Enquadramento tático da esquina da rua A/2.",
                    "Foto: Estande perfeitamente arrumado e brilhando antes do público entrar."
                ]
            }
        };

        function updateChart(pattern) {
            const selected = datasets[pattern];

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: selected.labels, // Tempo Vertical (Labels no eixo Y)
                    datasets: [{
                        data: selected.volumes, // Avanço Horizontal (Barras crescem para a direita)
                        backgroundColor: selected.colors,
                        borderRadius: 8,
                        borderWidth: 0,
                        barThickness: 'flex',
                        maxBarThickness: 32
                    }]
                },
                options: {
                    indexAxis: 'y', // Inverte o gráfico: Tempo vira Vertical, Dados horizontais
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1f2937',
                            titleColor: '#10b981',
                            bodyColor: '#f3f4f6',
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            padding: 12,
                            cornerRadius: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return " Roteiro: " + selected.tips[context.dataIndex];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1f2937' },
                            ticks: { display: false } // Remove números desnecessários para focar no design
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                color: '#f3f4f6',
                                font: { size: 11, weight: 'bold' }
                            }
                        }
                    }
                }
            });
        }

        // Dropdown Controle
        document.getElementById('patternSelect').addEventListener('change', (e) => {
            updateChart(e.target.value);
        });

        // Inicialização
        updateChart('abertura');
    </script>
</body>
</html>
