<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Detection Working Example</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      color: #0f0;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      border-radius: 12px;
      object-fit: cover;
    }
    #label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="label">Loading face model...</div>
  </div>

  <!-- Using CDNJS distribution of face-api.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const label = document.getElementById('label');
    const ctx = canvas.getContext('2d');

    // Hosted model weights with valid CORS headers
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/cbrandolino/cam-canvas@master/public/models';

    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
    ])
    .then(startVideo)
    .catch(err => {
      label.textContent = 'Error loading models: ' + err.message;
      console.error(err);
    });

    async function startVideo() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        label.textContent = 'Starting camera...';
      } catch (err) {
        label.textContent = 'Camera access denied or unsecure origin.';
        console.error(err);
      }
    }

    video.addEventListener('play', () => {
      let isDetecting = false;

      async function detect() {
        if (video.paused || video.ended) return;

        // Set dimensions match video frame
        const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
        canvas.width = displaySize.width;
        canvas.height = displaySize.height;

        try {
          const detections = await faceapi
            .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks();

          const resizedDetections = faceapi.resizeResults(detections, displaySize);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (resizedDetections.length === 0) {
            label.textContent = 'No face detected';
          } else {
            label.textContent = `Faces detected: ${resizedDetections.length}`;
            
            resizedDetections.forEach(det => {
              const box = det.detection.box;
              ctx.strokeStyle = '#0f0';
              ctx.lineWidth = 2;
              ctx.strokeRect(box.x, box.y, box.width, box.height);

              det.landmarks.positions.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#0f0';
                ctx.fill();
              });
            });
          }
        } catch (e) {
          console.error(e);
        }

        requestAnimationFrame(detect);
      }
      
      detect();
    });
  </script>
</body>
</html>
