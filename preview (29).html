<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ Stable TTS Queue — Kaori Fixed</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

/* =========================================================
   🔒 GLOBAL SERIAL LOCK (ABSOLUTE CORE FIX)
========================================================= */

let audioLock = Promise.resolve();

function lock(fn){
  audioLock = audioLock.then(fn, fn);
  return audioLock;
}

/* =========================================================
   🧠 KAORI PIPELINE (REAL FIXED VERSION)
========================================================= */

let kaoriPipeline = null;
let kaoriReady = false;
let kaoriWarmupDone = false;

async function preloadKaori(){

  document.getElementById("status").innerText =
    "Carregando Kaori (MMS TTS PT)...";

  kaoriPipeline = await pipeline(
    "text-to-speech",
    "Xenova/mms-tts-por"
  );

  // 🔥 real warmup (importantíssimo)
  try {
    await kaoriPipeline("olá");
  } catch(e){}

  kaoriReady = true;
  kaoriWarmupDone = true;

  document.getElementById("status").innerText =
    "Kaori pronta ✔";
}

window.addEventListener("DOMContentLoaded", preloadKaori);

/* =========================================================
   🔊 KAORI SPEAK (FIXED AUDIO PIPELINE)
========================================================= */

async function kaoriSpeak(text){

  const out = await kaoriPipeline(text);

  const ctx = new AudioContext();

  // resume obrigatório (Chrome fix)
  await ctx.resume();

  const buffer = ctx.createBuffer(
    1,
    out.audio.length,
    out.sampling_rate
  );

  buffer.copyToChannel(out.audio, 0);

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);

  return new Promise(resolve => {
    src.onended = () => {
      ctx.close();
      resolve();
    };
    src.start();
  });
}

/* =========================================================
   🎤 OTHER VOICES (LOCKED TOO)
========================================================= */

let voices = [];

speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

function pickMale(){
  return voices.find(v=>/male|daniel/i.test(v.name))
    || voices.find(v=>v.lang?.includes("pt"))
    || voices[0];
}

function pickFemale(){
  return voices.find(v=>/female|luciana|google/i.test(v.name))
    || voices.find(v=>v.lang?.includes("pt"))
    || voices[0];
}

function speakBrowser(text, voice){
  return lock(() => new Promise(r => {

    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = "pt-BR";

    u.onend = r;
    u.onerror = r;

    speechSynthesis.cancel(); // 🔥 remove overlap bug
    speechSynthesis.speak(u);
  }));
}

/* Google TTS */
function googleTTS(text){
  return lock(() => new Promise(r => {

    const a = new Audio(
      "https://translate.google.com/translate_tts?ie=UTF-8&q=" +
      encodeURIComponent(text) +
      "&tl=pt-BR&client=tw-ob"
    );

    a.onended = r;
    a.onerror = r;

    a.play().catch(r);
  }));
}

/* ResponsiveVoice */
function rv(text){
  return lock(() => new Promise(r => {
    responsiveVoice.speak(text, "Brazilian Portuguese Female", {
      onend: r
    });
  }));
}

/* =========================================================
   🎯 ROUTER (FIXED SEQUENTIAL GUARANTEE)
========================================================= */

function speak(name, text){

  const n = name.toLowerCase();

  if(n.includes("kaori")){
    return lock(async () => {
      while(!kaoriReady){
        await new Promise(r => setTimeout(r,50));
      }
      await kaoriSpeak(text);
    });
  }

  if(n === "ana") return rv(text);

  if(n === "regina") return googleTTS(text);

  if(n === "daniel") return speakBrowser(text, pickMale());

  return speakBrowser(text, pickFemale());
}

/* =========================================================
   🚀 FLOW ENGINE (STRICT SERIAL EXECUTION)
========================================================= */

async function start(){

  const lines = document.getElementById("texto")
    .value.split("\n")
    .map(l => l.trim())
    .filter(Boolean);

  for(const line of lines){

    const m = line.match(/^([^:]+):\s*(.*)$/);
    if(!m) continue;

    const name = m[1];
    const text = m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speak(name, text);
  }
}

window.start = start;

</script>

<style>
body{margin:0;padding:14px;background:#0f0f12;color:#fff;font-family:Arial}
textarea{width:100%;height:140px;background:#121214;color:#fff;border:0;padding:10px}
.karaoke{margin-top:10px;padding:12px;background:#141417;border-radius:8px}
button{margin-top:10px;padding:10px;border:0;border-radius:8px;cursor:pointer}
.status{color:#aaa;margin-bottom:10px}
</style>

</head>

<body>

<div class="status" id="status">Inicializando...</div>

<textarea id="texto">
Daniel: Eu não devo mais interromper Kaori.
Maria: Voz estável.
Regina: Google TTS sincronizado.
Ana: ResponsiveVoice ativo.
Kaori: Agora estou pré-carregada no boot.
Daniel: Agora tudo está em fila correta.
</textarea>

<div class="karaoke" id="karaoke"></div>

<button onclick="start()">▶ Play</button>

</body>
</html>
