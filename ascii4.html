<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinite Grid ASCII Text Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=JetBrains+Mono:wght@500&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e11;
            --surface-color: #16181d;
            --primary-color: #6366f1;
            --accent-color: #22c55e;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --cell-border: #262931;
            --cell-active: #312e81;
            --cell-size: 32px;
            --current-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            background-color: var(--surface-color);
            padding: 8px 12px;
            border-bottom: 1px solid var(--cell-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        h1 {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .controls-group {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
        }

        select, button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--cell-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
            white-space: nowrap;
        }

        button.btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            opacity: 0.8;
        }

        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
            cursor: grab;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .grid-world {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transform-origin: 0 0;
        }

        .cell {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            border-right: 1px solid var(--cell-border);
            border-bottom: 1px solid var(--cell-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: var(--current-font) !important;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            background-color: var(--surface-color);
        }

        .cell.active {
            background-color: var(--cell-active);
            box-shadow: inset 0 0 0 2px var(--primary-color);
            z-index: 2;
        }

        .cell.in-rect {
            background-color: rgba(99, 102, 241, 0.25);
        }

        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--cell-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--cell-border);
        }

        .suggestions-container {
            padding: 8px 12px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.75rem;
        }

        .suggestion-item {
            color: var(--accent-color);
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        #keyboard-interceptor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 30px;
            opacity: 0.01;
            z-index: 999;
            font-size: 16px;
            background: transparent;
            border: none;
            outline: none;
            pointer-events: auto;
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body onclick="keepFocus()">

    <header>
        <h1>GridCell</h1>
        <div class="controls-group">
            <select id="font-selector">
                <option value="'Courier New', Courier, monospace">Courier New</option>
                <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                <option value="'Fira Code', monospace">Fira Code</option>
                <option value="'Source Code Pro', monospace">Source Code Pro</option>
                <option value="ui-monospace, SFMono-Regular, monospace">iOS System Mono</option>
            </select>
            <button class="btn-primary" id="btn-copy">Copiar Retângulo</button>
            <button id="btn-clear">Limpar</button>
            <button id="btn-undo" disabled>Desfazer Limpeza</button>
        </div>
    </header>

    <div class="viewport" id="viewport">
        <div class="grid-world" id="grid-world"></div>
    </div>

    <footer>
        <div class="status-bar">
            <span id="pos-info">Pos: (0, 0)</span>
            <span id="bounds-info">Retângulo: 0x0</span>
        </div>
        <div class="suggestions-container" id="suggestions">
            <div class="suggestion-item">Toque no canvas para navegar. Digite em qualquer célula.</div>
        </div>
    </footer>

    <textarea id="keyboard-interceptor" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <div class="toast" id="toast">Texto copiado!</div>

    <script>
        const CELL_SIZE = 32;
        const gridData = new Map();
        const cellElements = new Map();
        let clearedBackup = null;

        let activeRow = 0;
        let activeCol = 0;

        let cameraX = window.innerWidth / 2 - CELL_SIZE / 2;
        let cameraY = window.innerHeight / 3 - CELL_SIZE / 2;

        const viewport = document.getElementById('viewport');
        const gridWorld = document.getElementById('grid-world');
        const interceptor = document.getElementById('keyboard-interceptor');
        const fontSelector = document.getElementById('font-selector');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const posInfo = document.getElementById('pos-info');
        const boundsInfo = document.getElementById('bounds-info');
        const suggestionsEl = document.getElementById('suggestions');
        const toastEl = document.getElementById('toast');

        function updateTransform() {
            gridWorld.style.transform = `translate3d(${cameraX}px, ${cameraY}px, 0)`;
        }
        updateTransform();

        function getKey(r, c) {
            return `${r},${c}`;
        }

        function ensureCellElement(r, c) {
            const key = getKey(r, c);
            if (cellElements.has(key)) return cellElements.get(key);

            const el = document.createElement('div');
            el.className = 'cell';
            el.style.left = `${c * CELL_SIZE}px`;
            el.style.top = `${r * CELL_SIZE}px`;
            el.dataset.row = r;
            el.dataset.col = c;
            
            gridWorld.appendChild(el);
            cellElements.set(key, el);
            return el;
        }

        function setCellChar(r, c, char) {
            const key = getKey(r, c);
            if (!char) {
                gridData.delete(key);
                if (cellElements.has(key)) {
                    cellElements.get(key).textContent = '';
                }
            } else {
                gridData.set(key, char);
                const el = ensureCellElement(r, c);
                el.textContent = char;
            }
            updateAnalysis();
        }

        function setActiveCell(r, c) {
            const oldKey = getKey(activeRow, activeCol);
            if (cellElements.has(oldKey)) {
                cellElements.get(oldKey).classList.remove('active');
            }

            activeRow = r;
            activeCol = c;

            const newEl = ensureCellElement(r, c);
            newEl.classList.add('active');

            posInfo.textContent = `Pos: (${activeCol}, ${activeRow})`;
        }

        function keepFocus() {
            if (document.activeElement !== interceptor) {
                interceptor.focus({ preventScroll: true });
            }
        }

        window.addEventListener('touchstart', () => {
            keepFocus();
        }, { passive: true });

        // --- SISTEMA DE DRAG / PAN DO CANVAS ---
        let isDragging = false;
        let startX = 0, startY = 0;
        let initialCamX = 0, initialCamY = 0;
        let hasDragged = false;

        function onPointerDown(e) {
            isDragging = true;
            hasDragged = false;
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            initialCamX = cameraX;
            initialCamY = cameraY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const dx = currentX - startX;
            const dy = currentY - startY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                hasDragged = true;
                cameraX = initialCamX + dx;
                cameraY = initialCamY + dy;
                updateTransform();
            }
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;

            if (!hasDragged && e.target) {
                const rect = gridWorld.getBoundingClientRect();
                const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

                if (clientX !== undefined && clientY !== undefined) {
                    const localX = clientX - rect.left;
                    const localY = clientY - rect.top;
                    const c = Math.floor(localX / CELL_SIZE);
                    const r = Math.floor(localY / CELL_SIZE);
                    setActiveCell(r, c);
                }
            }
            keepFocus();
        }

        viewport.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        viewport.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        // --- ENTRADA DE TECLADO ---
        interceptor.addEventListener('input', (e) => {
            const val = interceptor.value;
            if (val.length > 0) {
                const char = val[val.length - 1];
                setCellChar(activeRow, activeCol, char);
                setActiveCell(activeRow, activeCol + 1);
                interceptor.value = '';
            }
        });

        interceptor.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                const currentKey = getKey(activeRow, activeCol);
                if (gridData.has(currentKey)) {
                    setCellChar(activeRow, activeCol, '');
                } else {
                    setActiveCell(activeRow, activeCol - 1);
                    setCellChar(activeRow, activeCol, '');
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol - 1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setActiveCell(activeRow - 1, activeCol);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                setActiveCell(activeRow + 1, activeCol);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                setActiveCell(activeRow + 1, 0);
            }
        });

        function getBoundingRect() {
            if (gridData.size === 0) return null;

            let minR = Infinity, maxR = -Infinity;
            let minC = Infinity, maxC = -Infinity;

            for (const key of gridData.keys()) {
                const [r, c] = key.split(',').map(Number);
                if (r < minR) minR = r;
                if (r > maxR) maxR = r;
                if (c < minC) minC = c;
                if (c > maxC) maxC = c;
            }

            return { minR, maxR, minC, maxC };
        }

        function highlightRectBounds(rect) {
            cellElements.forEach(el => el.classList.remove('in-rect'));
            if (!rect) {
                boundsInfo.textContent = `Retângulo: 0x0`;
                return;
            }

            const width = rect.maxC - rect.minC + 1;
            const height = rect.maxR - rect.minR + 1;
            boundsInfo.textContent = `Retângulo: ${width}x${height}`;

            for (let r = rect.minR; r <= rect.maxR; r++) {
                for (let c = rect.minC; c <= rect.maxC; c++) {
                    const el = ensureCellElement(r, c);
                    el.classList.add('in-rect');
                }
            }
        }

        btnCopy.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = getBoundingRect();
            if (!rect) {
                showToast("Grid vazio!");
                keepFocus();
                return;
            }

            highlightRectBounds(rect);

            let resultLines = [];
            for (let r = rect.minR; r <= rect.maxR; r++) {
                let line = '';
                for (let c = rect.minC; c <= rect.maxC; c++) {
                    const char = gridData.get(getKey(r, c)) || ' ';
                    line += char;
                }
                resultLines.push(line);
            }

            const fullText = resultLines.join('\n');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(() => showToast("Retângulo copiado!"));
            } else {
                interceptor.value = fullText;
                interceptor.select();
                document.execCommand('copy');
                interceptor.value = '';
                showToast("Retângulo copiado!");
            }
            keepFocus();
        });

        btnClear.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gridData.size === 0) return;

            clearedBackup = new Map(gridData);
            btnUndo.disabled = false;

            gridData.clear();
            cellElements.forEach(el => el.textContent = '');
            highlightRectBounds(null);
            setActiveCell(0, 0);
            showToast("Grid limpo! (Opção de desfazer disponível)");
            keepFocus();
        });

        btnUndo.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!clearedBackup) return;

            gridData.clear();
            cellElements.forEach(el => el.textContent = '');

            clearedBackup.forEach((char, key) => {
                const [r, c] = key.split(',').map(Number);
                setCellChar(r, c, char);
            });

            clearedBackup = null;
            btnUndo.disabled = true;
            showToast("Limpeza desfeita!");
            keepFocus();
        });

        fontSelector.addEventListener('change', (e) => {
            e.stopPropagation();
            document.documentElement.style.setProperty('--current-font', e.target.value);
            keepFocus();
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }

        function updateAnalysis() {
            const rect = getBoundingRect();
            highlightRectBounds(rect);

            suggestionsEl.innerHTML = '';
            if (gridData.size === 0) {
                suggestionsEl.innerHTML = '<div class="suggestion-item">Toque no canvas para navegar. Digite em qualquer célula.</div>';
                return;
            }

            const count = gridData.size;
            let msg = `Caracteres ativos: ${count}.`;
            if (rect) {
                const w = rect.maxC - rect.minC + 1;
                const h = rect.maxR - rect.minR + 1;
                msg += ` Enquadrado em ${w}x${h} células.`;
            }

            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.textContent = msg;
            suggestionsEl.appendChild(div);
        }

        setActiveCell(0, 0);
        setTimeout(keepFocus, 200);
    </script>
</body>
</html>
