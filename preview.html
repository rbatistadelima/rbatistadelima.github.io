<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmony Studio</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#eee;font-family:system-ui}
.app{display:grid;grid-template-columns:280px 1fr 360px;height:100vh}
.panel{border-right:1px solid #333;padding:12px;overflow:auto}
.right{border-left:1px solid #333;border-right:none}
h2{margin:8px 0}
.row{display:flex;gap:6px;margin:6px 0}
input[type=color]{width:50px;height:36px}
button,select{background:#222;color:#fff;border:1px solid #444;padding:8px;border-radius:6px}
#palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.sw{border:1px solid #444;border-radius:8px;overflow:hidden}
.c{height:70px}
.t{font-size:11px;padding:4px;text-align:center;background:#1a1a1a}
.center{display:flex;align-items:center;justify-content:center}
canvas{max-width:95%;max-height:95%}
.topbar{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
<div class="panel">
<h2>Base Colors</h2>
<div id="colors"></div>
<button onclick="addColor()">+ Add</button>
<hr>
<h2>Harmony</h2>
<select id="mode" onchange="update()">
<option>Monochromatic</option>
<option>Shades</option>
<option>Tints</option>
<option>Tones</option>
<option>Analogous</option>
<option>Complementary</option>
<option>Split Complementary</option>
<option>Triadic</option>
<option>Tetradic</option>
<option>Square</option>
<option>Compound</option>
</select>
<hr>
<button onclick="exportPNG()">Save PNG</button>
</div>

<div class="center">
<canvas id="wheel" width="700" height="700"></canvas>
</div>

<div class="panel right">
<h2>Generated Palette</h2>
<div id="palette"></div>
</div>
</div>

<script>
function addColor(v="#DD2D44"){
 let d=document.createElement('div');
 d.className='row';
 d.innerHTML=`<input type=color value="${v}" onchange="update()"><button onclick="this.parentNode.remove();update()">✕</button>`;
 colors.appendChild(d);
 update();
}
const colors=document.getElementById('colors');
addColor('#DD2D44'); addColor('#2D994D');

function hexToRgb(h){h=h.slice(1);return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)}}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;
if(max==min){h=s=0}else{let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4}h*=60}return{h,s,l}}
function hslToRgb(h,s,l){let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
function hh(h,s,l){let r=hslToRgb((h+360)%360,s,l);return rgbToHex(r.r,r.g,r.b)}

let current=[];

function generate(){
 let out=[]; let mode=document.getElementById('mode').value;
 [...colors.querySelectorAll('input[type=color]')].forEach(i=>{
  let hsl=rgbToHsl(...Object.values(hexToRgb(i.value)));
  let A=[];
  switch(mode){
   case 'Monochromatic': A=[0,.2,.4,.6,.8].map(v=>hh(hsl.h,hsl.s,v)); break;
   case 'Shades': A=[1,.8,.6,.4,.2].map(v=>hh(hsl.h,hsl.s,hsl.l*v)); break;
   case 'Tints': A=[0,.1,.2,.3,.4].map(v=>hh(hsl.h,hsl.s,Math.min(1,hsl.l+v))); break;
   case 'Tones': A=[1,.8,.6,.4,.2].map(v=>hh(hsl.h,hsl.s*v,hsl.l)); break;
   case 'Analogous': [-30,-15,0,15,30].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Complementary': [0,180].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Split Complementary': [0,150,210].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Triadic': [0,120,240].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Tetradic': [0,60,180,240].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Square': [0,90,180,270].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
   case 'Compound': [0,30,180,210].forEach(a=>A.push(hh(hsl.h+a,hsl.s,hsl.l))); break;
  }
  out.push(...A);
 });
 return [...new Set(out)];
}

function drawWheel(cols){
 let c=document.getElementById('wheel'),x=c.getContext('2d');
 x.clearRect(0,0,c.width,c.height);
 let cx=350,cy=350,r=260;
 for(let h=0;h<360;h++){
  x.beginPath();x.strokeStyle=`hsl(${h} 100% 50%)`;x.lineWidth=28;
  x.arc(cx,cy,r,(h-1)*Math.PI/180,h*Math.PI/180);x.stroke();
 }
 cols.forEach(col=>{
  let hsl=rgbToHsl(...Object.values(hexToRgb(col)));
  let a=hsl.h*Math.PI/180;
  let px=cx+Math.cos(a)*(r-10), py=cy+Math.sin(a)*(r-10);
  x.beginPath();x.fillStyle=col;x.arc(px,py,10,0,Math.PI*2);x.fill();x.strokeStyle="#fff";x.stroke();
 });
}

function update(){
 current=generate();
 palette.innerHTML='';
 current.forEach(c=>{
  let d=document.createElement('div');
  d.className='sw';
  d.innerHTML=`<div class=c style="background:${c}"></div><div class=t>${c}</div>`;
  palette.appendChild(d);
 });
 drawWheel(current);
}

function exportPNG(){
 let cv=document.createElement('canvas');
 cv.width=1600; cv.height=900;
 let g=cv.getContext('2d');
 g.fillStyle='#111'; g.fillRect(0,0,1600,900);
 let w=1400/current.length;
 current.forEach((c,i)=>{
  g.fillStyle=c; g.fillRect(100+i*w,250,w,250);
  g.fillStyle='#fff'; g.font='20px sans-serif'; g.fillText(c,100+i*w+10,540);
 });
 g.font='48px sans-serif';
 g.fillText(document.getElementById('mode').value,80,120);
 let a=document.createElement('a');
 a.href=cv.toDataURL('image/png');
 a.download='palette.png';
 a.click();
}
update();
</script>
</body>
</html>
