<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous Group WebRTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- QRious QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
        }
        #app-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        /* Sidebar Panels */
        .sidebar {
            width: 240px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 12px;
            color: #475569;
            overflow-y: auto;
        }
        .sidebar.right {
            border-right: none;
            border-left: 1px solid #e2e8f0;
        }
        .sidebar h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .sidebar ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar li {
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-all;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            flex-shrink: 0;
        }
        /* Log Console */
        #debug-log {
            flex: 1;
            background: #0f172a;
            color: #38bdf8;
            font-family: monospace;
            font-size: 10px;
            padding: 8px;
            border-radius: 6px;
            overflow-y: auto;
            max-height: 250px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        /* Main Chat Container */
        #chat-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 10px 14px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 11px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fafafa;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 9px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 10px 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 6px 10px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
            padding: 8px 14px;
            font-size: 12px;
        }
        /* QR Code Modal */
        #qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .qr-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 280px;
            width: 100%;
        }
        .qr-card h3 {
            font-size: 13px;
            color: #1f2937;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #qr-url {
            font-size: 10px;
            color: #6b7280;
            word-break: break-all;
            background: #f3f4f6;
            padding: 6px;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- Left Sidebar: Services & Debug Log -->
    <div class="sidebar">
        <h3>Services Working</h3>
        <ul>
            <li><span class="status-dot"></span> PeerJS Signaling</li>
            <li><span class="status-dot"></span> WebRTC P2P Mesh</li>
            <li><span class="status-dot"></span> STUN Server</li>
            <li><span class="status-dot"></span> Local Storage Cache</li>
        </ul>
        <h3 style="margin-top: 10px;">Debug Log</h3>
        <div id="debug-log"></div>
    </div>

    <!-- Main Chat Window -->
    <div id="chat-container">
        <div id="status-bar">
            <div class="status-row">
                <span id="status-text">Connecting...</span>
                <div id="identity-display">You: Loading...</div>
            </div>
            <div class="status-row" id="room-controls">
                <span>Room: <strong id="room-display">...</strong></span>
                <div>
                    <button onclick="showQrModal()">QR</button>
                    <button onclick="newRoom()">New Room</button>
                </div>
            </div>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Right Sidebar: Connected Clients -->
    <div class="sidebar right">
        <h3>Connected Clients</h3>
        <ul id="client-list">
            <li id="self-client-item"><span class="status-dot"></span> <span id="self-client-name">You (Loading)</span></li>
        </ul>
    </div>
</div>

<!-- QR Code Modal Overlay -->
<div id="qr-modal" onclick="closeQrModal(event)">
    <div class="qr-card" onclick="event.stopPropagation()">
        <h3>Scan to Join Room</h3>
        <div style="display: flex; justify-content: center;">
            <canvas id="qr-canvas"></canvas>
        </div>
        <div id="qr-url"></div>
        <button onclick="closeQrModal()" style="background:#e5e7eb; color:#374151; padding: 8px;">Close</button>
    </div>
</div>

<script>
    const debugLogEl = document.getElementById('debug-log');
    function logMsg(text) {
        const timestamp = new Date().toLocaleTimeString();
        debugLogEl.textContent += `[${timestamp}] ${text}\n`;
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
        console.log(`[P2P Log] ${text}`);
    }

    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    const myUniqueId = 'u_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('identity-display').textContent = `You: ${myName}`;
    document.getElementById('self-client-name').textContent = `${myName} (You)`;

    let peer = null;
    let isHub = false;
    const activeConnections = new Map(); 
    const processedMessageIds = new Set();
    let reconnectTimer = null;
    let qrInstance = null;

    const statusText = document.getElementById('status-text');
    const roomDisplay = document.getElementById('room-display');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const clientListEl = document.getElementById('client-list');

    const rtcConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    function getRoom() {
        let hash = window.location.hash.substring(1);
        // Ensure short alphanumeric room ID without 'room_' prefix
        if (!hash || hash.length < 3 || hash.startsWith('room_')) {
            hash = Math.random().toString(36).substring(2, 7);
            window.location.hash = hash;
        }
        return hash;
    }

    let roomName = getRoom();
    roomDisplay.textContent = roomName;

    function loadChatHistory() {
        messagesContainer.innerHTML = '';
        const saved = localStorage.getItem('webrtc_' + roomName + '_history');
        if (saved) {
            try {
                JSON.parse(saved).forEach(item => {
                    if (item.msgId) processedMessageIds.add(item.msgId);
                    appendMessageToDOM(item.sender, item.text, item.time, item.type);
                });
            } catch(e) {}
        }
    }

    function saveMessageToStorage(msgId, sender, text, time, type) {
        try {
            const key = 'webrtc_' + roomName + '_history';
            const saved = localStorage.getItem(key);
            const history = saved ? JSON.parse(saved) : [];
            history.push({ msgId, sender, text, time, type });
            if (history.length > 150) history.shift();
            localStorage.setItem(key, JSON.stringify(history));
        } catch(e) {}
    }

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function updateClientListUI() {
        clientListEl.innerHTML = `<li id="self-client-item"><span class="status-dot"></span> <span>${myName} (You)</span></li>`;
        activeConnections.forEach(({ name }) => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="status-dot"></span> <span>${name || 'Peer'}</span>`;
            clientListEl.appendChild(li);
        });
    }

    function initPeer() {
        roomName = getRoom();
        roomDisplay.textContent = roomName;
        loadChatHistory();
        statusText.textContent = 'Connecting to room...';

        const hubId = `${roomName}_hub`;

        if (peer) {
            try { peer.destroy(); } catch(e) {}
            peer = null;
        }
        activeConnections.clear();
        updateClientListUI();

        logMsg(`Attempting to claim stable Hub ID: ${hubId}`);
        peer = new Peer(hubId, rtcConfig);

        const hubTimeout = setTimeout(() => {
            if (peer && !peer.open && !isHub) {
                logMsg(`Hub claim timeout. Switching to Client mode...`);
                try { peer.destroy(); } catch(e) {}
                connectAsClient(hubId);
            }
        }, 2000);

        peer.on('open', (id) => {
            clearTimeout(hubTimeout);
            isHub = true;
            logMsg(`Claimed Hub role successfully (${id})`);
            statusText.textContent = 'Room active (Hub ready).';
            setupPeerListeners();
        });

        peer.on('error', (err) => {
            clearTimeout(hubTimeout);
            logMsg(`Hub claim failed (${err.type}). Switching to Client mode...`);
            try { peer.destroy(); } catch(e) {}
            connectAsClient(hubId);
        });
    }

    function connectAsClient(hubId) {
        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }

        const clientId = `${roomName}_cl_${Math.random().toString(36).substring(2, 8)}`;
        logMsg(`Initializing Client ID: ${clientId}`);
        peer = new Peer(clientId, rtcConfig);

        peer.on('open', (id) => {
            isHub = false;
            logMsg(`Client active (${id}). Connecting to Hub ${hubId}...`);
            statusText.textContent = 'Connected to room.';
            setupPeerListeners();
            
            const hubConn = peer.connect(hubId, { reliable: true });
            setupConnection(hubConn);
        });

        peer.on('error', (err) => {
            logMsg(`Client error (${err.type}). Scheduling retry...`);
            statusText.textContent = 'Retrying connection...';
            scheduleReconnect();
        });
    }

    function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            initPeer();
        }, 2000);
    }

    function setupPeerListeners() {
        peer.on('connection', (incomingConn) => {
            logMsg(`Incoming connection from: ${incomingConn.peer}`);
            setupConnection(incomingConn);
            if (isHub) {
                setTimeout(broadcastPeerList, 300);
            }
        });
    }

    function broadcastPeerList() {
        const peerList = Array.from(activeConnections.keys());
        activeConnections.forEach(({ conn }) => {
            if (conn && conn.open) {
                conn.send({ type: 'peer_list', peers: peerList });
            }
        });
    }

    function setupConnection(connection) {
        const remoteId = connection.peer;

        if (activeConnections.has(remoteId)) {
            logMsg(`Already connected to ${remoteId}. Ignoring duplicate.`);
            return;
        }

        connection.on('open', () => {
            logMsg(`Data channel established with ${remoteId}`);
            activeConnections.set(remoteId, { conn: connection, name: "Peer", lastSeen: Date.now() });
            statusText.textContent = `Connected peers: ${activeConnections.size}`;
            connection.send({ type: 'profile', id: myUniqueId, name: myName });
            updateClientListUI();
        });

        connection.on('data', (data) => {
            try {
                if (typeof data === 'object' && data !== null) {
                    const p = activeConnections.get(remoteId);
                    if (p) p.lastSeen = Date.now();

                    if (data.type === 'profile') {
                        logMsg(`Profile update from ${remoteId}: ${data.name}`);
                        if (p) {
                            p.name = data.name;
                            p.uid = data.id;
                            updateClientListUI();
                        }
                        return;
                    }
                    if (data.type === 'ping') {
                        connection.send({ type: 'pong' });
                        return;
                    }
                    if (data.type === 'peer_list') {
                        data.peers.forEach(peerId => {
                            if (peerId !== peer.id && !activeConnections.has(peerId)) {
                                logMsg(`Mesh connecting to peer: ${peerId}`);
                                const newConn = peer.connect(peerId, { reliable: true });
                                setupConnection(newConn);
                            }
                        });
                        return;
                    }
                    if (data.type === 'chat_msg') {
                        if (data.uid === myUniqueId || processedMessageIds.has(data.msgId)) return;
                        processedMessageIds.add(data.msgId);
                        const time = data.time || getTimeString();
                        appendMessageToDOM(data.sender, data.text, time, 'received');
                        saveMessageToStorage(data.msgId, data.sender, data.text, time, 'received');

                        if (isHub) {
                            activeConnections.forEach((val, id) => {
                                if (id !== remoteId && val.conn && val.conn.open) {
                                    val.conn.send(data);
                                }
                            });
                        }
                        return;
                    }
                }
            } catch(e) {
                logMsg(`Data parsing error from ${remoteId}: ${e.message}`);
            }
        });

        connection.on('close', () => {
            logMsg(`Socket closed with ${remoteId}`);
            handleDisconnect(remoteId);
        });
        connection.on('error', (err) => {
            logMsg(`Socket error with ${remoteId}: ${err}`);
            handleDisconnect(remoteId);
        });
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
            const time = getTimeString();
            const msgId = 'm_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
            
            const payload = {
                type: 'chat_msg',
                msgId: msgId,
                uid: myUniqueId,
                sender: myName,
                text: text,
                time: time
            };

            processedMessageIds.add(msgId);

            activeConnections.forEach(({ conn }) => {
                if (conn && conn.open) {
                    conn.send(payload);
                }
            });

            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(msgId, myName, text, time, 'sent');
            messageInput.value = '';
            messageInput.focus();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function handleDisconnect(remoteId) {
        activeConnections.delete(remoteId);
        statusText.textContent = activeConnections.size > 0 ? `Connected peers: ${activeConnections.size}` : 'Waiting for peers...';
        updateClientListUI();
    }

    // Ping/pong heartbeat + clean reconnection trigger if a spoke client gets disconnected
    setInterval(() => {
        const now = Date.now();
        let changed = false;
        activeConnections.forEach(({ conn, lastSeen }, remoteId) => {
            if (now - lastSeen > 8000) {
                logMsg(`Heartbeat timeout for ${remoteId}. Closing connection.`);
                try { conn.close(); } catch(e) {}
                activeConnections.delete(remoteId);
                changed = true;
            } else if (conn && conn.open) {
                conn.send({ type: 'ping' });
            }
        });
        if (changed) {
            statusText.textContent = activeConnections.size > 0 ? `Connected peers: ${activeConnections.size}` : 'Waiting for peers...';
            updateClientListUI();
            if (isHub) broadcastPeerList();
        }

        if (!isHub && activeConnections.size === 0 && !statusText.textContent.includes('Connecting')) {
            logMsg(`Spoke disconnected from Hub. Re-initializing...`);
            statusText.textContent = 'Reconnecting...';
            setTimeout(initPeer, 1500);
        }
    }, 3000);

    function newRoom() {
        window.location.hash = Math.random().toString(36).substring(2, 7);
    }

    function showQrModal() {
        const modal = document.getElementById('qr-modal');
        modal.style.display = 'flex';
        const currentUrl = window.location.href;
        document.getElementById('qr-url').textContent = currentUrl;
        
        if (!qrInstance) {
            qrInstance = new QRious({
                element: document.getElementById('qr-canvas'),
                value: currentUrl,
                size: 160,
                background: 'white',
                foreground: 'black'
            });
        } else {
            qrInstance.value = currentUrl;
        }
    }

    function closeQrModal() {
        document.getElementById('qr-modal').style.display = 'none';
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="msg-header">
                <span>${sender}</span>
                <span class="msg-time">${time}</span>
            </div>
            <div>${text}</div>
        `;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.addEventListener('hashchange', () => {
        logMsg(`Browser navigation detected (hashchange). Switching room...`);
        initPeer();
    });

    window.addEventListener('beforeunload', () => {
        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }
    });

    window.onload = initPeer;
</script>

</body>
</html>
