<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII RPG Demo</title>
<style>
  body {
    margin: 0;
    font-family: "Courier New", monospace;
    background-color: #111;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .column {
    padding: 10px;
    overflow-y: auto;
  }
  #left { width: 20%; background-color: #222; }
  #middle { width: 60%; background-color: #111; }
  #right { width: 20%; background-color: #222; }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    cursor: pointer;
    font-family: monospace;
  }
  button:hover { background: #444; }
</style>
</head>
<body>

<!-- Left column: stats & inventory -->
<div id="left" class="column">
  <div id="statsPanel"></div>
</div>

<!-- Middle column: message log -->
<div id="middle" class="column">
  <div id="messageLog"></div>
</div>

<!-- Right column: options -->
<div id="right" class="column">
  <div id="optionsPanel"></div>
</div>

<script type="module">
  // --- Global object to hold loaded modules ---
  window.loaded = {};

  // List of module paths
  const modules = [
    "modules/utils.js",
    "modules/player.js",
    "modules/events.js",
    "modules/inventory.js",
    "modules/progress.js",
    "modules/save-system.js",
    "modules/ui.js",
    "modules/voice.js",
    "modules/areas.js",
    "modules/items.js",
    "modules/enemies.js"
  ];

  // Dynamically import modules
  for (const path of modules) {
    const name = path.split("/").pop().replace(".js","");
    window.loaded[name] = await import(`./${path}`);
    console.log(`Module loaded: ${name}`);
  }

  // --- Initialize UI ---
  loaded.ui.initUI();

  // --- Create player and refresh stats ---
  loaded.player.createPlayer("Rafael", "Warrior");
  loaded.ui.refreshAll(loaded.player.player);

  // --- Example message and event ---
  loaded.ui.addMessage("Welcome to ASCII RPG Demo!", "system");

  // Add an example item to inventory
  const sword = loaded.items.createItem("sword_iron");
  loaded.inventory.addItem(sword);
  loaded.ui.addMessage(`You received: ${sword.name}`, "system");

  // Set up example options
  loaded.ui.showMenu("Actions", [
    { label: "Attack", action: () => loaded.ui.addMessage("You swing your sword!") },
    { label: "Heal", action: () => { loaded.player.heal(10); loaded.ui.refreshAll(loaded.player.player); loaded.ui.addMessage("You healed 10 HP"); } },
    { label: "View Inventory", action: () => loaded.ui.addMessage("Inventory: " + loaded.inventory.items.map(i => i.name).join(", ")) }
  ]);

  // --- Animate text using voice module ---
  const logDiv = document.getElementById("messageLog");
  loaded.voice.animateText(logDiv, "Prepare for your ASCII adventure...\n", 30);
</script>

</body>
</html>
