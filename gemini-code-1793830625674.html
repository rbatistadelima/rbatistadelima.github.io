<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen 1 Pokémon Cry Synthesizer + Authentic Audio & Arpeggiator</title>
    <style>
        :root {
            --gb-darkest: #0f380f;
            --gb-dark: #306230;
            --gb-light: #8bac0f;
            --gb-lightest: #9bbc0f;
            --pokedex-red: #dc0a2d;
            --pokedex-dark: #8b0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #121212; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .pokedex {
            background: var(--pokedex-red);
            border: 4px solid var(--pokedex-dark);
            border-radius: 15px;
            width: 100%; max-width: 940px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; gap: 15px;
        }

        .screen-container {
            background: #dcdcdc;
            border-radius: 10px 10px 10px 30px;
            padding: 15px;
            border: 3px solid #777;
        }

        .lcd-screen {
            background: var(--gb-lightest);
            border: 3px solid var(--gb-darkest);
            border-radius: 5px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .viz-box {
            height: 60px;
            background: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .status-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--gb-lightest); font-size: 11px; font-weight: bold; pointer-events: none;
        }

        .controls { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 8px; border: 2px solid var(--gb-darkest);
            background: var(--gb-light); color: var(--gb-darkest); font-weight: bold; outline: none;
        }
        .btn {
            background: var(--gb-dark); color: var(--gb-lightest);
            border: 2px solid var(--gb-darkest); padding: 8px 12px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn:hover { background: var(--gb-darkest); color: var(--gb-light); }

        .note-editor {
            background: var(--gb-light);
            border: 2px solid var(--gb-darkest);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .scale-selector-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--gb-darkest);
            gap: 8px;
            flex-wrap: wrap;
        }

        .scale-selector-bar select, .scale-selector-bar input[type="range"] {
            padding: 4px;
            border: 2px solid var(--gb-darkest);
            background: var(--gb-lightest);
            color: var(--gb-darkest);
            font-weight: bold;
            font-size: 10px;
            outline: none;
            cursor: pointer;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .signal-slots-container {
            display: flex;
            gap: 6px;
            background: var(--gb-darkest);
            border: 2px solid var(--gb-dark);
            padding: 8px;
            overflow-x: auto;
            min-height: 140px;
            align-items: stretch;
        }

        .signal-slot {
            flex: 1;
            min-width: 50px;
            background: rgba(139, 172, 15, 0.15);
            border: 1px dashed var(--gb-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px;
            position: relative;
        }

        .signal-slot.active-playing {
            border-color: var(--gb-lightest);
            background: rgba(155, 188, 15, 0.4);
        }

        .slot-title {
            font-size: 8px;
            font-weight: bold;
            color: var(--gb-lightest);
        }

        .signal-meter-column {
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
            align-items: center;
            gap: 2px;
            flex: 1;
            width: 100%;
            padding: 4px 0;
            cursor: pointer;
        }

        .signal-bar {
            width: 80%;
            height: 6px;
            background: #204020;
            border: 1px solid var(--gb-darkest);
            transition: background 0.1s;
        }

        .signal-bar.filled {
            background: var(--gb-lightest);
            box-shadow: 0 0 3px var(--gb-lightest);
        }

        .signal-slot.muted .signal-bar {
            background: #182818;
            border-color: #204020;
            box-shadow: none;
        }

        .toggle-note-btn {
            width: 100%;
            padding: 3px;
            font-size: 7px;
            border: 1px solid var(--gb-darkest);
            background: var(--gb-dark);
            color: var(--gb-lightest);
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-note-btn.off {
            background: #333;
            color: #777;
        }

        .grid {
            height: 220px; overflow-y: auto;
            border: 2px solid var(--gb-darkest); background: var(--gb-light);
            padding: 8px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background: var(--gb-dark); }

        .card {
            background: var(--gb-lightest); border: 2px solid var(--gb-darkest);
            padding: 6px; text-align: center; cursor: pointer; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card:hover, .card.active { background: var(--gb-dark); color: var(--gb-lightest); }
        .num { font-size: 9px; font-weight: bold; }
        .name { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
    </style>
</head>

<div class="pokedex">

    pentatonic: { name: "Major Pentatonic", intervals: [-12,-7,-5,0,2,4,7,9,12] },
    minPenta:   { name: "Minor Pentatonic", intervals: [-12,-7,-5,0,3,5,7,10,12] },
    blues:      { name: "Blues Scale", intervals: [-12,-7,-5,0,3,5,6,7,10,12] },
    dorian:     { name: "Dorian Mode", intervals: [-12,-7,-5,0,2,3,5,7,9,10,12] },
    phrygian:   { name: "Phrygian Mode", intervals: [-12,-7,-5,0,1,3,5,7,8,10,12] },
    lydian:     { name: "Lydian Mode", intervals: [-12,-7,-5,0,2,4,6,7,9,11,12] },
    mixolydian: { name: "Mixolydian Mode", intervals: [-12,-7,-5,0,2,4,5,7,9,10,12] },
    locrian:    { name: "Locrian Mode", intervals: [-12,-7,-5,0,1,3,5,6,8,10,12] },
    wholeTone:  { name: "Whole Tone", intervals: [-12,-6,0,2,4,6,8,10,12] }
};

let currentScaleKey = 'major';
let noteCount = 4;
let noteState = [
    { active: true, scaleIndex: 3 },
    { active: true, scaleIndex: 4 },
    { active: true, scaleIndex: 6 },
    { active: true, scaleIndex: 7 },
    { active: true, scaleIndex: 8 },
    { active: true, scaleIndex: 9 },
    { active: false, scaleIndex: 3 },
    { active: false, scaleIndex: 3 }
];

let audioCtx = null;
let analyser = null;
let noiseBuffer = null;
let activePkmn = pkmn[0];
let debounceTimer = null;
let activeMasterGain = null;

const gridEl = document.getElementById('grid');
const searchEl = document.getElementById('search');
const playBtn = document.getElementById('play-btn');
const randBtn = document.getElementById('rand-btn');
const resetBtn = document.getElementById('reset-notes-btn');
const scaleSelectEl = document.getElementById('scale-select');
const noteCountRange = document.getElementById('note-count-range');
const countDisplay = document.getElementById('count-display');
const slotsEl = document.getElementById('signal-slots');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function populateScaleDropdown() {
    scaleSelectEl.innerHTML = '';
    Object.keys(Scales).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = Scales[key].name;
        if (key === currentScaleKey) opt.selected = true;
        scaleSelectEl.appendChild(opt);
    });
}

function triggerAutoPlay() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        playCrySequence(activePkmn);
    }, 150);
}

function renderSignalSlots() {
    slotsEl.innerHTML = '';
    const intervals = Scales[currentScaleKey].intervals;
    const totalBars = 8;

    for (let i = 0; i < noteCount; i++) {
        const state = noteState[i];
        const slot = document.createElement('div');
        slot.className = `signal-slot ${state.active ? '' : 'muted'}`;
        slot.id = `slot-${i}`;

        const title = document.createElement('div');
        title.className = 'slot-title';
        title.textContent = `N${i+1}`;

        const meterCol = document.createElement('div');
        meterCol.className = 'signal-meter-column';

        for (let b = totalBars - 1; b >= 0; b--) {
            const bar = document.createElement('div');
            bar.className = 'signal-bar';
            if (state.active && b <= state.scaleIndex) {
                bar.classList.add('filled');
            }
            meterCol.appendChild(bar);
        }

        meterCol.onclick = (e) => {
            const rect = meterCol.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const pct = 1 - (clickY / rect.height);
            let newIdx = Math.round(pct * (intervals.length - 1));
            newIdx = Math.max(0, Math.min(intervals.length - 1, newIdx));
            
            state.scaleIndex = newIdx;
            state.active = true;
            renderSignalSlots();
            triggerAutoPlay();
        };

        const toggleBtn = document.createElement('button');
        toggleBtn.className = `toggle-note-btn ${state.active ? '' : 'off'}`;
        toggleBtn.textContent = state.active ? 'ON' : 'OFF';
        toggleBtn.onclick = (e) => {
            e.stopPropagation();
            state.active = !state.active;
            renderSignalSlots();
            triggerAutoPlay();
        };

        slot.appendChild(title);
        slot.appendChild(meterCol);
        slot.appendChild(toggleBtn);
        slotsEl.appendChild(slot);
    }
}

function buildGrid(filter = '') {
    gridEl.innerHTML = '';
    const items = pkmn.filter(p => p.n.toLowerCase().includes(filter.toLowerCase()) || p.id.toString() === filter);
    items.forEach(p => {
        const card = document.createElement('div');
        card.className = `card ${activePkmn.id === p.id ? 'active' : ''}`;
        card.innerHTML = `<div class="num">#${String(p.id).padStart(3, '0')}</div><div class="name">${p.n}</div>`;
        card.onclick = () => {
            activePkmn = p;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            playCrySequence(p);
        };
        gridEl.appendChild(card);
    });
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.connect(audioCtx.destination);
        
        const size = audioCtx.sampleRate * 2;
        noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for(let i=0; i<size; i++) data[i] = Math.random() * 2 - 1;

        drawViz();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    statusEl.style.display = 'none';
}

function playCrySequence(p) {
    initAudio();

    if (activeMasterGain && audioCtx) {
        try {
            activeMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
            activeMasterGain.gain.setValueAtTime(activeMasterGain.gain.value, audioCtx.currentTime);
            activeMasterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.01);
        } catch(e) {}
    }

    const intervals = Scales[currentScaleKey].intervals;
    const activeNotes = [];
    for (let i = 0; i < noteCount; i++) {
        if (noteState[i].active) {
            activeNotes.push({ ...noteState[i], originalIndex: i });
        }
    }
    
    if (activeNotes.length === 0) return;

    const t = BaseTemplates[p.b];
    const baseHz = 150 + (p.p * 2.5);
    const duration = Math.max(0.08, (p.l * 0.012));
    const startTime = audioCtx.currentTime + 0.01;

    const cryMasterGain = audioCtx.createGain();
    cryMasterGain.gain.setValueAtTime(0.25, startTime);
    cryMasterGain.connect(analyser);
    activeMasterGain = cryMasterGain;

    const totalSequenceDuration = activeNotes.length * (duration * 0.85) + duration;
    cryMasterGain.gain.setValueAtTime(0.25, startTime + totalSequenceDuration - 0.02);
    cryMasterGain.gain.exponentialRampToValueAtTime(0.0001, startTime + totalSequenceDuration);

    activeNotes.forEach((note, stepIdx) => {
        const semitones = intervals[note.scaleIndex] !== undefined ? intervals[note.scaleIndex] : 0;
        const stepTime = startTime + (stepIdx * (duration * 0.85));
        const pitchRatio = Math.pow(2, semitones / 12);
        const noteHz = baseHz * pitchRatio;

        setTimeout(() => {
            const slotEl = document.getElementById(`slot-${note.originalIndex}`);
            if (slotEl) {
                slotEl.classList.add('active-playing');
                setTimeout(() => slotEl.classList.remove('active-playing'), duration * 850);
            }
        }, stepIdx * (duration * 850));

        const osc = audioCtx.createOscillator();
        osc.type = t.wave;
        osc.frequency.setValueAtTime(noteHz, stepTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, noteHz + t.sweep), stepTime + duration);

        if(t.vibDepth > 0) {
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.setValueAtTime(t.vibRate, stepTime);
            lfoGain.gain.setValueAtTime(t.vibDepth, stepTime);
            lfo.connect(osc.frequency);
            lfo.start(stepTime);
            lfo.stop(stepTime + duration);
        }

        osc.connect(cryMasterGain);
        osc.start(stepTime);
        osc.stop(stepTime + duration);

        if(t.noise && noiseBuffer) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(noteHz * 1.8, stepTime);
            filter.Q.setValueAtTime(1.5, stepTime);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.12, stepTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, stepTime + duration);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(cryMasterGain);

            noise.start(stepTime);
            noise.stop(stepTime + duration);
        }
    });
}

function drawViz() {
    requestAnimationFrame(drawViz);
    if (!analyser) return;
    const bufLen = analyser.frequencyBinCount;
    const arr = new Uint8Array(bufLen);
    analyser.getByteTimeDomainData(arr);

    ctx.fillStyle = '#0f380f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#9bbc0f';
    ctx.beginPath();

    const slice = canvas.width / bufLen;
    let x = 0;
    for(let i=0; i<bufLen; i++) {
        const v = arr[i] / 128.0;
        const y = v * (canvas.height / 2);
        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += slice;
    }
    ctx.stroke();
}

scaleSelectEl.onchange = (e) => {
    currentScaleKey = e.target.value;
    const intervals = Scales[currentScaleKey].intervals;
    noteState.forEach(st => {
        if (st.scaleIndex >= intervals.length) {
            st.scaleIndex = Math.floor(intervals.length / 2);
        }
    });
    renderSignalSlots();
    triggerAutoPlay();
};

noteCountRange.oninput = (e) => {
    noteCount = parseInt(e.target.value, 10);
    countDisplay.textContent = noteCount;
    renderSignalSlots();
    triggerAutoPlay();
};

resetBtn.onclick = () => {
    noteCount = 4;
    noteCountRange.value = 4;
    countDisplay.textContent = 4;
    noteState = [
        { active: true, scaleIndex: 3 },
        { active: true, scaleIndex: 4 },
        { active: true, scaleIndex: 6 },
        { active: true, scaleIndex: 7 },
        { active: false, scaleIndex: 3 },
        { active: false, scaleIndex: 3 },
        { active: false, scaleIndex: 3 },
        { active: false, scaleIndex: 3 }
    ];
    renderSignalSlots();
    triggerAutoPlay();
};

searchEl.oninput = (e) => buildGrid(e.target.value);
playBtn.onclick = () => playCrySequence(activePkmn);
randBtn.onclick = () => {
    activePkmn = pkmn[Math.floor(Math.random() * pkmn.length)];
    buildGrid(searchEl.value);
    playCrySequence(activePkmn);
};

populateScaleDropdown();
renderSignalSlots();
buildGrid();
</script>
</body>
</html>
