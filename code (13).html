<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>3D Text on Image — Fullscreen Paste</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
  #ui {
    position:fixed; top:10px; left:10px; z-index:10; background:rgba(0,0,0,.6);
    padding:10px; border-radius:10px; font-size:14px;
  }
  #ui input,#ui button{margin:4px 0;width:100%;}
  canvas { display:block; }
</style>
</head>
<body>
  <div id="ui">
    <label>Text: <input id="textInput" value="Hello 3D!"></label>
    <label>Depth: <input id="depth" type="range" min="0.1" max="2" step="0.1" value="0.5"></label>
    <label>Size: <input id="size" type="range" min="1" max="20" step="0.5" value="5"></label>
    <label>Color: <input id="color" type="color" value="#ff5500"></label>
    <button id="export">Export PNG</button>
    <small>💡 Paste image (Ctrl+V) or drag & drop it.</small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/geometries/TextGeometry.js"></script>

  <script>
  let scene, camera, renderer, controls, textMesh, font, bgMesh;
  const loader = new THREE.TextureLoader();

  init();
  animate();

  function init(){
    renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
    camera.position.set(0,0,50);
    controls = new THREE.OrbitControls(camera,renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(10,10,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x555555));

    new THREE.FontLoader().load(
      'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
      f => { font = f; createText(); }
    );

    document.getElementById('textInput').addEventListener('input',createText);
    document.getElementById('depth').addEventListener('input',createText);
    document.getElementById('size').addEventListener('input',createText);
    document.getElementById('color').addEventListener('input',()=>updateColor());
    document.getElementById('export').addEventListener('click',exportPNG);

    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
      resizeBackgroundPlane();
    });

    // paste and drop
    window.addEventListener('paste', handlePaste);
    window.addEventListener('dragover', e=>e.preventDefault());
    window.addEventListener('drop', e=>{
      e.preventDefault();
      if(e.dataTransfer.files.length>0){
        const file=e.dataTransfer.files[0];
        const r=new FileReader();
        r.onload=()=>setBackgroundImage(r.result);
        r.readAsDataURL(file);
      }
    });
  }

  function handlePaste(e){
    const items = e.clipboardData?.items;
    if(!items) return;
    for(const it of items){
      if(it.type.startsWith('image/')){
        const file = it.getAsFile();
        const reader = new FileReader();
        reader.onload = ()=> setBackgroundImage(reader.result);
        reader.readAsDataURL(file);
        return;
      }
    }
  }

  function setBackgroundImage(dataURL){
    loader.load(dataURL, tex=>{
      tex.colorSpace = THREE.SRGBColorSpace;
      const ratio = tex.image.width / tex.image.height;
      const height = 100;
      const width = height * ratio;
      const geo = new THREE.PlaneGeometry(width,height);
      const mat = new THREE.MeshBasicMaterial({ map: tex });
      if(bgMesh) { scene.remove(bgMesh); bgMesh.material.dispose(); bgMesh.geometry.dispose(); }
      bgMesh = new THREE.Mesh(geo,mat);
      bgMesh.position.z = -10;
      scene.add(bgMesh);
      resizeBackgroundPlane();
    });
  }

  function resizeBackgroundPlane(){
    if(!bgMesh || !bgMesh.material.map) return;
    const tex = bgMesh.material.map;
    const img = tex.image;
    const ratio = img.width / img.height;
    const viewH = 100;
    const viewW = viewH * ratio;
    bgMesh.scale.set(viewW/bgMesh.geometry.parameters.width, viewH/bgMesh.geometry.parameters.height, 1);
  }

  function createText(){
    if(!font) return;
    const text = document.getElementById('textInput').value;
    const depth = parseFloat(document.getElementById('depth').value);
    const size = parseFloat(document.getElementById('size').value);
    const color = document.getElementById('color').value;
    if(textMesh){ scene.remove(textMesh); textMesh.geometry.dispose(); textMesh.material.dispose(); }
    const geo = new THREE.TextGeometry(text,{
      font, size, height: depth, curveSegments: 8,
      bevelEnabled:true, bevelThickness:0.1, bevelSize:0.05
    });
    geo.center();
    const mat = new THREE.MeshStandardMaterial({ color });
    textMesh = new THREE.Mesh(geo,mat);
    scene.add(textMesh);
  }

  function updateColor(){
    if(textMesh) textMesh.material.color.set(document.getElementById('color').value);
  }

  function exportPNG(){
    const a=document.createElement('a');
    a.href=renderer.domElement.toDataURL('image/png');
    a.download='3d-text.png';
    a.click();
  }

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  </script>
</body>
</html>
