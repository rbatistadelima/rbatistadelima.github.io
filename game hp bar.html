<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Game Completo</title>
<style>
body { margin:0; overflow:hidden; background:#222; touch-action:none; font-family:Comic Sans MS, sans-serif; }
#game { position:relative; width:100vw; height:100vh; }

#player {
  position:absolute;
  font-size:3rem;
  user-select:none;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  text-shadow: 2px 2px 2px rgba(0,0,0,0.7);
}

#lifebar {
  position:absolute;
  top:-10px; 
  left:50%;
  width:50px; height:8px;
  background:#555;
  border:2px solid #fff;
  border-radius:4px;
  transform:translateX(-50%);
}
#lifeFill {
  position:absolute;
  top:0; left:0;
  height:100%;
  background:green;
  border-radius:2px;
}
#lifeText {
  position:absolute;
  top:-28px; 
  left:50%;
  font-size:1.5rem;
  font-weight:bold;
  color:black;
  text-shadow:-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  transform:translateX(-50%);
}

.bullet, .enemy, .explosion {
  position:absolute;
  font-size:3rem;
  user-select:none;
  pointer-events:none;
  text-shadow: 2px 2px 2px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
<div id="game">
  <div id="player">
    😀
    <div id="lifebar"><div id="lifeFill"></div></div>
    <div id="lifeText">100</div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const lifebar = document.getElementById('lifebar');
const lifeFill = document.getElementById('lifeFill');
const lifeText = document.getElementById('lifeText');
const game = document.getElementById('game');

let playerPos = {x: window.innerWidth/2, y: window.innerHeight/2};
let speed = 5;
let life = 100;

const bullets = [];
const enemies = [];
const explosions = [];

// --- Input ---
let keys = {};
window.addEventListener('keydown', e=>keys[e.key]=true);
window.addEventListener('keyup', e=>keys[e.key]=false);

let mouseDown=false, mousePos={x:0,y:0};
window.addEventListener('mousemove', e=>mousePos={x:e.clientX,y:e.clientY});
window.addEventListener('mousedown', ()=>mouseDown=true);
window.addEventListener('mouseup', ()=>mouseDown=false);

// --- Touch movement ---
let moveTouch=null, shootTouch=null;
window.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch'){
    if(e.clientX<window.innerWidth/2) moveTouch={x:e.clientX,y:e.clientY};
    else shootTouch={x:e.clientX,y:e.clientY};
  } else {
    if(e.clientX>=window.innerWidth/2) shootTouch={x:e.clientX,y:e.clientY};
  }
});
window.addEventListener('pointermove', e=>{
  if(e.pointerType==='touch'){
    if(moveTouch && e.clientX<window.innerWidth/2) moveTouch={x:e.clientX,y:e.clientY};
    if(shootTouch && e.clientX>=window.innerWidth/2) shootTouch={x:e.clientX,y:e.clientY};
  }
});
window.addEventListener('pointerup', e=>{ moveTouch=null; shootTouch=null; });

// --- Gamepad ---
let gamepadIndex=null;
window.addEventListener("gamepadconnected", e=>gamepadIndex=e.gamepad.index);

// --- Spawn bullet ---
function spawnBullet(x,y,dx,dy){
  const b = document.createElement('div');
  b.className='bullet';
  b.innerText='🔥';
  b.style.left = x + 'px';
  b.style.top = y + 'px';
  
  // rotaciona o fogo na direção do tiro
  let angle = Math.atan2(dy, dx);
  b.style.transform = `translate(-50%,-50%) rotate(${angle}rad)`;

  b.vx = dx;
  b.vy = dy;
  game.appendChild(b);
  bullets.push(b);
}

// --- Spawn enemy ---
function spawnEnemy(){
  const e = document.createElement('div');
  e.className='enemy';
  e.innerText='🕷';
  let corners = [
    {x:0,y:0},{x:window.innerWidth-30,y:0},
    {x:0,y:window.innerHeight-30},{x:window.innerWidth-30,y:window.innerHeight-30}
  ];
  let c = corners[Math.floor(Math.random()*corners.length)];
  e.x = c.x;
  e.y = c.y;
  e.style.left = e.x+'px';
  e.style.top = e.y+'px';
  game.appendChild(e);
  enemies.push(e);
}

// --- Spawn explosion ---
function spawnExplosion(x,y){
  const ex = document.createElement('div');
  ex.className='explosion';
  ex.innerText='💥';
  ex.style.left=x+'px';
  ex.style.top=y+'px';
  game.appendChild(ex);
  explosions.push({el:ex, timer:20});
}

// --- Update loop ---
let frameCount=0;
function update(){
  frameCount++;

  // --- Movement ---
  let dx=0, dy=0;
  if(keys['w']||keys['ArrowUp']) dy-=1;
  if(keys['s']||keys['ArrowDown']) dy+=1;
  if(keys['a']||keys['ArrowLeft']) dx-=1;
  if(keys['d']||keys['ArrowRight']) dx+=1;

  if(moveTouch){
    dx = moveTouch.x - playerPos.x;
    dy = moveTouch.y - playerPos.y;
    let len=Math.sqrt(dx*dx+dy*dy);
    if(len>1){ dx/=len; dy/=len; }
  }

  if(gamepadIndex!==null){
    const gp = navigator.getGamepads()[gamepadIndex];
    if(gp){ dx+=gp.axes[0]; dy+=gp.axes[1]; }
  }

  let len=Math.sqrt(dx*dx+dy*dy);
  if(len>1){ dx/=len; dy/=len; }

  playerPos.x += dx*speed;
  playerPos.y += dy*speed;

  playerPos.x=Math.max(25, Math.min(window.innerWidth-25, playerPos.x));
  playerPos.y=Math.max(25, Math.min(window.innerHeight-25, playerPos.y));
  player.style.left = playerPos.x+'px';
  player.style.top = playerPos.y+'px';

  // --- Shooting ---
  let sx=0, sy=0;
  let shooting=false;
  if(shootTouch){ sx=shootTouch.x-playerPos.x; sy=shootTouch.y-playerPos.y; shooting=true; }
  else if(mouseDown){ sx=mousePos.x-playerPos.x; sy=mousePos.y-playerPos.y; shooting=true; }

  if(shooting && frameCount%10===0){
    let len=Math.sqrt(sx*sx+sy*sy);
    if(len>0){ sx=sx/len*10; sy=sy/len*10; spawnBullet(playerPos.x, playerPos.y, sx, sy); }
  }

  // --- Update bullets ---
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    let x = parseFloat(b.style.left) + b.vx;
    let y = parseFloat(b.style.top) + b.vy;
    b.style.left = x + 'px';
    b.style.top = y + 'px';

    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      let ex = parseFloat(e.style.left), ey = parseFloat(e.style.top);
      if(Math.hypot(x-ex, y-ey)<25){
        spawnExplosion(ex, ey);
        game.removeChild(e);
        enemies.splice(j,1);
        game.removeChild(b);
        bullets.splice(i,1);
        break;
      }
    }

    if(x<0 || x>window.innerWidth || y<0 || y>window.innerHeight){
      game.removeChild(b);
      bullets.splice(i,1);
    }
  }

  // --- Update enemies ---
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    let ex=parseFloat(e.style.left), ey=parseFloat(e.style.top);
    let dx = playerPos.x - ex;
    let dy = playerPos.y - ey;
    let len=Math.sqrt(dx*dx+dy*dy);
    if(len>0){ dx/=len; dy/=len; }

    e.style.left = ex + dx*2 + 'px';
    e.style.top = ey + dy*2 + 'px';

    // rotaciona inimigo corretamente (90° adicionado)
    let angle=Math.atan2(dy,dx) + Math.PI/2;
    e.style.transform=`translate(-50%,-50%) rotate(${angle}rad)`;

    if(Math.hypot(ex-playerPos.x, ey-playerPos.y)<25){
      life -=10;
      life = Math.max(0, life);
      e.style.left = ex - dx*10 + 'px';
      e.style.top = ey - dy*10 + 'px';
    }
  }

  // --- Explosions ---
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].timer--;
    if(explosions[i].timer<=0){
      game.removeChild(explosions[i].el);
      explosions.splice(i,1);
    }
  }

  // --- Lifebar ---
  lifeFill.style.width = (life/100*100)+'%';
  lifeText.innerText = life;

  // --- Spawn enemies ---
  if(frameCount%120===0) spawnEnemy();

  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
