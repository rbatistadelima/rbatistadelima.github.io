<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Initializing...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findNextPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Composite Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    let strangerName = "Stranger";
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    let peer = null;
    let conn = null;
    let isConnected = false;
    let searchTimer = null;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    // --- LocalStorage History Handling ---
    function loadChatHistory() {
        const saved = localStorage.getItem('webrtc_chat_history');
        if (saved) {
            try {
                const history = JSON.parse(saved);
                history.forEach(item => {
                    appendMessageToDOM(item.sender, item.text, item.time, item.type);
                });
            } catch(e) {}
        }
    }

    function saveMessageToStorage(sender, text, time, type) {
        try {
            const saved = localStorage.getItem('webrtc_chat_history');
            const history = saved ? JSON.parse(saved) : [];
            history.push({ sender, text, time, type });
            if (history.length > 100) history.shift();
            localStorage.setItem('webrtc_chat_history', JSON.stringify(history));
        } catch(e) {}
    }

    function getTimeString() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initPeer() {
        if (peer) {
            try { peer.destroy(); } catch(e){}
        }

        isConnected = false;
        statusText.textContent = 'Connecting to network...';

        // Dynamic slot keying so visitors pair up automatically
        const roomSlot = Math.floor(Date.now() / 8000) % 5;
        const myPeerId = `gh-room-${roomSlot}-${Math.random().toString(36).substring(2, 6)}`;

        peer = new Peer(myPeerId, peerConfig);

        peer.on('open', () => {
            statusText.textContent = 'Searching for partner...';
            nextBtn.disabled = false;
            probePeerSlot(roomSlot);
        });

        peer.on('connection', (incomingConn) => {
            if (isConnected) {
                incomingConn.close();
                return;
            }
            setupConnection(incomingConn);
        });

        peer.on('error', (err) => {
            console.error("Peer error:", err);
            setTimeout(findNextPartner, 1500);
        });
    }

    function probePeerSlot(slot) {
        if (isConnected) return;

        let targetId = `gh-room-${slot}-${Math.random().toString(36).substring(2, 6)}`;
        const outbound = peer.connect(targetId, { reliable: true });

        let opened = false;
        outbound.on('open', () => {
            opened = true;
            setupConnection(outbound);
        });

        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            if (!opened && !isConnected) {
                statusText.textContent = 'Waiting for stranger to connect...';
            }
        }, 3000);
    }

    function setupConnection(connection) {
        if (isConnected) return;
        isConnected = true;
        conn = connection;

        if (searchTimer) clearTimeout(searchTimer);
        statusText.textContent = 'Connected!';
        appendSystemMessage('Connected to a stranger.');
        toggleInputs(true);

        // Exchange name
        conn.send({ type: 'name', name: myName });

        conn.on('data', (data) => {
            if (typeof data === 'object' && data.type === 'name') {
                strangerName = data.name;
                appendSystemMessage(`You are chatting with: ${strangerName}`);
            } else if (typeof data === 'string') {
                const time = getTimeString();
                appendMessageToDOM(strangerName, data, time, 'received');
                saveMessageToStorage(strangerName, data, time, 'received');
            }
        });

        conn.on('close', () => {
            handleDisconnect();
        });

        conn.on('error', () => {
            handleDisconnect();
        });
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && conn && conn.open) {
            conn.send(text);
            const time = getTimeString();
            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(myName, text, time, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(initPeer, 1500);
    }

    function findNextPartner() {
        cleanupConnection();
        initPeer();
    }

    function cleanupConnection() {
        isConnected = false;
        if (searchTimer) clearTimeout(searchTimer);
        if (conn) {
            try { conn.close(); } catch(e){}
            conn = null;
        }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;

        if (type === 'system') {
            div.textContent = text;
        } else {
            div.innerHTML = `
                <div class="msg-header">
                    <span>${sender}</span>
                    <span class="msg-time">${time}</span>
                </div>
                <div>${text}</div>
            `;
        }
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const time = getTimeString();
        appendMessageToDOM('System', text, time, 'system');
        saveMessageToStorage('System', text, time, 'system');
    }

    window.onload = () => {
        loadChatHistory();
        initPeer();
    };
</script>

</body>
</html>
