<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Phrase JS Vocal Studio</title>
    <style>
        :root {
            --primary: #39c5bb; /* Hatsune Miku Teal */
            --dark: #1f2326;
            --light: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: #2a2f35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border-top: 6px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
            font-weight: 600;
        }

        p.subtitle {
            text-align: center;
            color: #a0aab2;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"], select, input[type="range"] {
            width: 100%;
            background: #1f2326;
            border: 1px solid #404852;
            color: white;
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aab2;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #2eb0a7;
            box-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
        }

        .status-box {
            margin-top: 20px;
            padding: 12px;
            background: #1f2326;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            color: #7e8b96;
            border: 1px solid #404852;
        }

        .highlight {
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Clear Phrase Vocal Studio</h1>
    <p class="subtitle">Using hardware-accelerated speech pipelines to synthesize clean words and syllables.</p>

    <div class="input-group">
        <label for="phraseInput">Type Your Phrase Here</label>
        <input type="text" id="phraseInput" value="Hello, my name is Hatsune Miku and I am singing in JavaScript.">
    </div>

    <div class="sliders-grid">
        <div class="input-group">
            <div class="slider-label"><span>Vocal Pitch (Vocaloid Vibe)</span><span id="pitch-val">1.8</span></div>
            <input type="range" id="pitch" min="0.5" max="2" value="1.8" step="0.1">
        </div>
        <div class="input-group">
            <div class="slider-label"><span>Tempo Speed</span><span id="speed-val">1.1x</span></div>
            <input type="range" id="speed" min="0.5" max="2" value="1.1" step="0.1">
        </div>
    </div>

    <div class="input-group">
        <label for="accentSelect">Voice Dialect Accent</label>
        <select id="accentSelect">
            <option value="ja-JP">Japanese Accent (Forces cute phonetic cadence on English words)</option>
            <option value="en-US">Standard English (Native Speaker Clarity)</option>
        </select>
    </div>

    <button id="speakBtn">Speak Phrase Clearly</button>

    <div class="status-box" id="statusOutput">
        Ready. Press <span class="highlight">Speak Phrase Clearly</span> to process audio nodes.
    </div>
</div>

<script>
    const speakBtn = document.getElementById('speakBtn');
    const phraseInput = document.getElementById('phraseInput');
    const pitchSlider = document.getElementById('pitch');
    const speedSlider = document.getElementById('speed');
    const accentSelect = document.getElementById('accentSelect');
    
    const pitchVal = document.getElementById('pitch-val');
    const speedVal = document.getElementById('speed-val');
    const statusOutput = document.getElementById('statusOutput');

    // Live UI adjustments
    pitchSlider.addEventListener('input', (e) => pitchVal.innerText = e.target.value);
    speedSlider.addEventListener('input', (e) => speedVal.innerText = e.target.value + 'x');

    function executeSpeech() {
        // Cancel any audio currently in the buffer queues to prevent overlap bugs
        window.speechSynthesis.cancel();

        const textToSay = phraseInput.value.trim();
        if (textToSay === "") {
            statusOutput.innerHTML = "❌ Please enter a phrase first!";
            return;
        }

        // Initialize Native Speech API Envelope
        const utterance = new SpeechSynthesisUtterance(textToSay);

        // Map UI configuration vectors directly to runtime engine properties
        utterance.pitch = parseFloat(pitchSlider.value); // Range: 0.5 to 2
        utterance.rate = parseFloat(speedSlider.value);  // Range: 0.5 to 2
        utterance.lang = accentSelect.value;             // Dynamics Language Model Switcher

        // Event hooks to change text color during active playback status Windows
        utterance.onstart = () => {
            statusOutput.innerHTML = "🔊 Status: <span class='highlight'>Synthesizing stream... Speaking now.</span>";
        };

        utterance.onend = () => {
            statusOutput.innerHTML = "✅ Stream finished cleanly. System Idle.";
        };

        utterance.onerror = (e) => {
            statusOutput.innerHTML = "⚠️ Error playing back audio data pipeline.";
            console.error(e);
        };

        // Fire audio process execution loop
        window.speechSynthesis.speak(utterance);
    }

    speakBtn.addEventListener('click', executeSpeech);
</script>

</body>
</html>
