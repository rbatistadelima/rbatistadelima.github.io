<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ TTS Lab — NO INTERRUPTION FIX</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
body{
  margin:0;
  background:#0f0f12;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px;
  gap:12px;
}

textarea{
  width:90%;
  max-width:900px;
  height:140px;
  background:#121214;
  color:#fff;
  border:0;
  padding:10px;
}

.karaoke{
  width:90%;
  max-width:900px;
  background:#141417;
  padding:12px;
  border-radius:8px;
  min-height:120px;
}

button{
  background:#222;
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:8px;
}

.status{
  font-size:0.9rem;
  color:#aaa;
}
</style>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

/* =========================
   🔥 SINGLE RELIABLE ENGINE
========================= */

let kaori = null;
let ready = false;

/* HARD QUEUE (no Promise chaining bugs) */
let running = false;
const queue = [];

function pushJob(job){
  queue.push(job);
  runQueue();
}

async function runQueue(){

  if(running) return;
  running = true;

  while(queue.length > 0){
    const job = queue.shift();
    await job();
  }

  running = false;
}

/* =========================
   BOOT KAORI (PRELOAD)
========================= */

async function boot(){

  document.getElementById("status").innerText =
    "Carregando Kaori (IA única)...";

  kaori = await pipeline(
    "text-to-speech",
    "Xenova/mms-tts-por"
  );

  await kaori("warmup");

  ready = true;

  document.getElementById("status").innerText =
    "Kaori pronta ✔ (zero interrupção mode)";

  document.getElementById("playBtn").disabled = false;
}

window.addEventListener("DOMContentLoaded", boot);

/* =========================
   🎧 ONLY ONE AUDIO ENGINE
========================= */

function speak(text){

  return new Promise(resolve => {

    pushJob(async () => {

      if(!ready){
        while(!ready){
          await new Promise(r=>setTimeout(r,50));
        }
      }

      const out = await kaori(text);

      const ctx = new AudioContext();
      const buf = ctx.createBuffer(1,out.sampling_rate,out.sampling_rate);
      buf.copyToChannel(out.audio,0);

      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);

      src.start();

      await new Promise(r=>{
        src.onended = r;
      });

      resolve();
    });
  });
}

/* =========================
   ▶ PLAY
========================= */

async function start(){

  const lines = document.getElementById("texto")
    .value.split("\n")
    .filter(Boolean);

  for(const l of lines){

    const m = l.match(/^([^:]+):\s*(.*)$/);
    if(!m) continue;

    const name = m[1];
    const text = m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speak(text);
  }
}

window.start = start;

</script>
</head>

<body>

<div class="status" id="status">Inicializando...</div>

<textarea id="texto">
Daniel: Agora nada pode interromper.
Maria: Nem Google TTS.
Regina: Nem speechSynthesis.
Ana: Nem ResponsiveVoice.
Kaori: Agora existe só um motor.
Daniel: E finalmente funciona.
</textarea>

<div class="karaoke" id="karaoke"></div>

<button id="playBtn" disabled onclick="start()">▶ Play</button>

</body>
</html>
