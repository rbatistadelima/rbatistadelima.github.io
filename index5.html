<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle ASCII RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="column column-left">
            <h2>Player Stats</h2>
            <div id="stats-panel">Loading player stats...</div>
            <h2>Inventory</h2>
            <div id="inventory-panel">Loading inventory...</div>
        </div>
        
        <div class="column column-center">
            <h2>Game Log</h2>
            <div id="game-log">Initializing game log...</div>
        </div>
        
        <div class="column column-right">
            <h2>Actions</h2>
            <div id="actions-panel">Loading actions...</div>
            <h2>Progress</h2>
            <div id="progress-panel">Loading progress...</div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
