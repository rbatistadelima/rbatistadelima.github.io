<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Text on Image</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
    #ui {
      position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.6);
      padding: 10px; border-radius: 10px; font-size: 14px;
    }
    #ui input, #ui select { margin: 4px 0; width: 100%; }
    #bgInput { display: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="loadBg">Upload Image</button>
    <input type="file" id="bgInput" accept="image/*" />
    <label>Text: <input id="textInput" value="Hello 3D!"></label>
    <label>Depth: <input id="depth" type="range" min="0.1" max="2" step="0.1" value="0.5"></label>
    <label>Size: <input id="size" type="range" min="1" max="20" step="0.5" value="5"></label>
    <label>Color: <input id="color" type="color" value="#ff5500"></label>
    <button id="export">Export PNG</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/geometries/TextGeometry.js"></script>
  <script>
    let scene, camera, renderer, controls;
    let textMesh, font;
    let bgTexture = null;

    init();
    animate();

    function init() {
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 30);
      controls = new THREE.OrbitControls(camera, renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 7);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      const loader = new THREE.FontLoader();
      loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', f => {
        font = f;
        createText();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('textInput').addEventListener('input', createText);
      document.getElementById('depth').addEventListener('input', createText);
      document.getElementById('size').addEventListener('input', createText);
      document.getElementById('color').addEventListener('input', updateColor);

      document.getElementById('loadBg').addEventListener('click', () => document.getElementById('bgInput').click());
      document.getElementById('bgInput').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const loader = new THREE.TextureLoader();
        loader.load(url, tex => {
          bgTexture = tex;
          scene.background = tex;
        });
      });

      document.getElementById('export').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = '3d-text.png';
        link.href = renderer.domElement.toDataURL('image/png');
        link.click();
      });
    }

    function createText() {
      if (!font) return;
      const text = document.getElementById('textInput').value;
      const depth = parseFloat(document.getElementById('depth').value);
      const size = parseFloat(document.getElementById('size').value);
      const color = document.getElementById('color').value;

      if (textMesh) scene.remove(textMesh);

      const geometry = new THREE.TextGeometry(text, {
        font: font,
        size: size,
        height: depth,
        curveSegments: 8,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.05
      });
      geometry.center();

      const material = new THREE.MeshStandardMaterial({ color });
      textMesh = new THREE.Mesh(geometry, material);
      scene.add(textMesh);
    }

    function updateColor() {
      if (textMesh) textMesh.material.color.set(document.getElementById('color').value);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
