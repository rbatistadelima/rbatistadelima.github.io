<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Cloud Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 3px 6px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 11px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 9px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div class="status-row">
            <span id="status-text">Initializing storage...</span>
            <div id="identity-display">You: Loading...</div>
        </div>
        <div class="status-row" id="room-controls">
            <span>Room: <strong id="room-display">...</strong></span>
            <button onclick="newRoom()">New Room</button>
        </div>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message and press Enter..." onkeypress="handleKeyPress(event)" autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Composite Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    const myUid = 'u_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    document.getElementById('room-display').textContent = roomName;

    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const statusText = document.getElementById('status-text');

    // Using a reliable JSON proxy endpoint that avoids browser CORS restrictions completely
    const API_ENDPOINT = `https://api.allorigins.win/get?url=` + encodeURIComponent(`https://json.extendsclass.com/bin/chatlog_${roomName}`);

    let lastKnownMessages = [];
    let isFetching = false;

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function fetchCloudLog() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch(API_ENDPOINT, { cache: 'no-store' });
            if (response.ok) {
                const wrapper = await response.json();
                if (wrapper && wrapper.contents) {
                    const data = JSON.parse(wrapper.contents);
                    if (Array.isArray(data) && JSON.stringify(data) !== JSON.stringify(lastKnownMessages)) {
                        lastKnownMessages = data;
                        renderChatHistory(data);
                    }
                }
            }
        } catch(e) {
            // Fallback to local storage if offline
            const cached = localStorage.getItem('local_fallback_' + roomName);
            if (cached && lastKnownMessages.length === 0) {
                lastKnownMessages = JSON.parse(cached);
                renderChatHistory(lastKnownMessages);
            }
        } finally {
            isFetching = false;
            statusText.textContent = `Online - Room: ${roomName}`;
        }
    }

    async function postMessageToCloud(text) {
        const time = getTimeString();
        const newMsg = { sender: myName, uid: myUid, text: text, time: time };
        
        lastKnownMessages.push(newMsg);
        if (lastKnownMessages.length > 100) lastKnownMessages.shift();

        renderChatHistory(lastKnownMessages);
        localStorage.setItem('local_fallback_' + roomName, JSON.stringify(lastKnownMessages));
        messageInput.value = '';
        messageInput.focus();

        try {
            // Update cloud bin via direct PUT request with CORS proxy
            await fetch(`https://corsproxy.io/?` + encodeURIComponent(`https://json.extendsclass.com/bin/chatlog_${roomName}`), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(lastKnownMessages)
            });
        } catch(err) {
            statusText.textContent = "Saved Locally (Cloud sync queued)";
        }
    }

    function renderChatHistory(messages) {
        const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 60;
        messagesContainer.innerHTML = '';

        messages.forEach(msg => {
            const div = document.createElement('div');
            const isSelf = msg.uid === myUid;
            div.className = `message ${isSelf ? 'sent' : 'received'}`;
            div.innerHTML = `
                <div class="msg-header">
                    <span>${msg.sender}</span>
                    <span class="msg-time">${msg.time}</span>
                </div>
                <div>${msg.text}</div>
            `;
            messagesContainer.appendChild(div);
        });

        if (isAtBottom || messages.length <= 5) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
            postMessageToCloud(text);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function newRoom() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    }

    window.onload = () => {
        fetchCloudLog();
        // Poll every 3 seconds to pull live updates from other users/tabs automatically
        setInterval(fetchCloudLog, 3000);
    };
</script>

</body>
</html>
