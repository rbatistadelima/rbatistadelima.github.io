<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviço de TTS em Português</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981; /* Verde esmeralda */
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
            resize: vertical;
            height: 120px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            border-left: 4px solid #64748b;
            font-size: 0.9rem;
            display: none;
            line-height: 1.4;
        }

        .audio-player-container {
            margin-top: 2rem;
            display: none;
            border-top: 1px solid #334155;
            padding-top: 1.5rem;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
        }
    </style>
    
    <!-- Importa o motor de IA Transformers.js direto do CDN -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        let ttsPipeline = null;
        
        const statusBox = document.getElementById('statusBox');
        const synthBtn = document.getElementById('synthBtn');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');

        function atualizarStatus(mensagem, erro = false) {
            statusBox.style.display = 'block';
            statusBox.style.borderLeftColor = erro ? '#ef4444' : '#10b981';
            statusBox.innerText = mensagem;
        }

        // Inicializa o modelo de IA dentro do navegador do usuário
        async function inicializarMotor() {
            if (ttsPipeline) return;
            try {
                atualizarStatus("Baixando o modelo de voz em português... (Isso pode levar um tempinho no primeiro acesso)");
                synthBtn.disabled = true;
                
                // Carrega o modelo MMS (Massively Multilingual Speech) da Meta para Português
                ttsPipeline = await pipeline('text-to-speech', 'Xenova/mms-tts-por');
                
                atualizarStatus("Motor de TTS pronto! A IA já está rodando localmente no seu PC.");
                synthBtn.disabled = false;
                synthBtn.innerText = "Converter Texto em Voz";
            } catch (error) {
                atualizarStatus("Erro ao iniciar o motor: " + error.message, true);
            }
        }

        async function gerarVoz() {
            const texto = document.getElementById('textInput').value.trim();

            if (!texto) {
                atualizarStatus("Por favor, digite algum texto para conversão.", true);
                return;
            }

            try {
                synthBtn.disabled = true;
                atualizarStatus("A IA está processando o texto e gerando as ondas de áudio...");

                // Executa a síntese de voz (Inferência)
                const resultado = await ttsPipeline(texto);
                
                // Transforma as matrizes numéricas geradas pela IA em um arquivo executável .WAV
                const wavBlob = criarArquivoWav(resultado.audio, resultado.sampling_rate);
                const audioUrl = URL.createObjectURL(wavBlob);
                
                audioPlayer.src = audioUrl;
                audioContainer.style.display = 'block';
                atualizarStatus("Sucesso! Áudio gerado totalmente no seu navegador.");
            } catch (error) {
                atualizarStatus("Falha na geração: " + error.message, true);
            } finally {
                synthBtn.disabled = false;
            }
        }

        // Estrutura os dados puros (PCM floats) no container padrão de um arquivo WAV
        function criarArquivoWav(dadosAudio, taxaAostragem) {
            const buffer = new ArrayBuffer(44 + dadosAudio.length * 2);
            const view = new DataView(buffer);
            
            // Cabeçalho RIFF
            escreverString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dadosAudio.length * 2, true);
            escreverString(view, 8, 'WAVE');
            
            // Sub-bloco FMT (Formato)
            escreverString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM Linear
            view.setUint16(22, 1, true); // Canal Mono
            view.setUint32(24, taxaAostragem, true);
            view.setUint32(28, taxaAostragem * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); // 16 bits de profundidade
            
            // Sub-bloco DATA
            escreverString(view, 36, 'data');
            view.setUint32(40, dadosAudio.length * 2, true);
            
            // Grava as amostras de áudio convertendo de Float para Int16
            let index = 44;
            for (let i = 0; i < dadosAudio.length; i++) {
                let amostra = Math.max(-1, Math.min(1, dadosAudio[i]));
                view.setInt16(index, amostra < 0 ? amostra * 0x8000 : amostra * 0x7FFF, true);
                index += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function escreverString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Eventos de gatilho
        window.addEventListener('DOMContentLoaded', inicializarMotor);
        synthBtn.addEventListener('click', gerarVoz);
    </script>
</head>
<body>

<div class="container">
    <h1>Serviço de TTS Local</h1>
    <p class="subtitle">Sintetizador de voz em Português rodando direto na sua máquina através de WebAssembly.</p>
    
    <div class="form-group">
        <label for="textInput">Texto para converter</label>
        <textarea id="textInput" placeholder="Digite o texto aqui para a inteligência artificial falar..."></textarea>
    </div>

    <button id="synthBtn" disabled>Carregando Inteligência Artificial...</button>

    <div id="statusBox" class="status-box"></div>

    <div id="audioContainer" class="audio-player-container">
        <label>Áudio Gerado</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

</body>
</html>
