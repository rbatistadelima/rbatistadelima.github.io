<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixelate Dither App</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: white;
        font-family: sans-serif;
        user-select: none;
    }
    #container {
        display: flex;
        height: 100%;
    }
    #left {
        width: 300px;
        padding: 10px;
        background: #222;
        box-sizing: border-box;
    }
    #canvasWrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 100%;
    }
    input[type=range] {
        width: 100%;
    }
    .disabledArrows:focus {
        pointer-events: all;
    }
</style>
</head>
<body>

<div id="container">
    <div id="left">
        <input id="file" type="file" accept="image/*"><br><br>

        <label>Brightness</label>
        <input id="brightness" type="range" min="-200" max="200" value="0"><br>

        <label>Contrast</label>
        <input id="contrast" type="range" min="-200" max="200" value="0"><br>

        <label>Saturation</label>
        <input id="saturation" type="range" min="-200" max="200" value="0"><br><br>

        <div>Max Colors: <span id="colLabel"></span></div>
        <div>Dither: <span id="ditherLabel"></span></div>
    </div>

    <div id="canvasWrapper">
        <canvas id="cv"></canvas>
    </div>
</div>

<script>
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let original = null;

const maxColorsList = [2,4,8,16,32,64,128,256];
let maxIndex = 3;
let maxColors = maxColorsList[maxIndex];

const ditherMethods = [
    "none",
    "floyd",
    "jarvis",
    "sierra",
    "atkinson"
];
let ditherIndex = 0;

document.getElementById("colLabel").textContent = maxColors;
document.getElementById("ditherLabel").textContent = ditherMethods[ditherIndex];

document.getElementById("file").onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
        cv.width = img.width;
        cv.height = img.height;
        cx.drawImage(img, 0, 0);
        original = cx.getImageData(0, 0, cv.width, cv.height);
        applyAll();
    };
    img.src = URL.createObjectURL(f);
};

function applyAll() {
    if (!original) return;
    let img = new ImageData(
        new Uint8ClampedArray(original.data),
        original.width,
        original.height
    );

    applyBrightnessContrastSaturation(img);
    pixelateAndDither(img);

    cx.putImageData(img, 0, 0);
}

function applyBrightnessContrastSaturation(img) {
    const B = +document.getElementById("brightness").value;
    const C = +document.getElementById("contrast").value / 100 + 1;
    const S = +document.getElementById("saturation").value / 100;

    for (let i = 0; i < img.data.length; i += 4) {
        let r = img.data[i];
        let g = img.data[i+1];
        let b = img.data[i+2];

        r += B; g += B; b += B;

        r = (r-128)*C + 128;
        g = (g-128)*C + 128;
        b = (b-128)*C + 128;

        const avg = (r + g + b) / 3;
        r = avg + (r - avg) * (1 + S);
        g = avg + (g - avg) * (1 + S);
        b = avg + (b - avg) * (1 + S);

        img.data[i]   = clamp(r);
        img.data[i+1] = clamp(g);
        img.data[i+2] = clamp(b);
    }
}

function clamp(v){ return Math.max(0, Math.min(255, v)); }

function pixelateAndDither(img) {
    let palette = buildPalette(maxColors);

    if (ditherMethods[ditherIndex] === "none") {
        for (let i=0;i<img.data.length;i+=4){
            const p = findNearest(img.data[i], img.data[i+1], img.data[i+2], palette);
            img.data[i] = p[0];
            img.data[i+1] = p[1];
            img.data[i+2] = p[2];
        }
        return;
    }

    // error diffusion
    const w = img.width;
    const h = img.height;

    const err = new Array(w*h*3).fill(0);

    for (let y=0;y<h;y++){
        for (let x=0;x<w;x++){
            const idx = (y*w+x)*4;
            let r = img.data[idx]   + err[(y*w+x)*3+0];
            let g = img.data[idx+1] + err[(y*w+x)*3+1];
            let b = img.data[idx+2] + err[(y*w+x)*3+2];

            const p = findNearest(r,g,b,palette);

            img.data[idx] = p[0];
            img.data[idx+1] = p[1];
            img.data[idx+2] = p[2];

            const dr = r - p[0];
            const dg = g - p[1];
            const db = b - p[2];

            diffuse(x,y,dr,dg,db,err,w,h,ditherMethods[ditherIndex]);
        }
    }
}

function buildPalette(n){
    let pal=[];
    for(let i=0;i<n;i++){
        const v = Math.round(i*(255/(n-1)));
        pal.push([v,v,v]);
    }
    return pal;
}

function findNearest(r,g,b,pal){
    let best=0;
    let bd=1e12;
    for(let i=0;i<pal.length;i++){
        const dr=r-pal[i][0];
        const dg=g-pal[i][1];
        const db=b-pal[i][2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bd){ bd=d; best=i; }
    }
    return pal[best];
}

function diffuse(x,y,dr,dg,db,err,w,h,type){
    const push = (xx,yy,f)=>{
        if(xx>=0&&yy>=0&&xx<w&&yy<h){
            let i=(yy*w+xx)*3;
            err[i]+=dr*f;
            err[i+1]+=dg*f;
            err[i+2]+=db*f;
        }
    };

    if(type === "floyd"){
        push(x+1,y,7/16);
        push(x-1,y+1,3/16);
        push(x,y+1,5/16);
        push(x+1,y+1,1/16);
    }
    else if(type === "jarvis"){
        const mat = [
            [1,0,7],[1,1,5],[1,2,3],
            [2,0,5],[2,1,3],[2,2,1]
        ];
        mat.forEach(m=>push(x+m[1],y+m[0],m[2]/48));
    }
    else if(type === "sierra"){
        const mat = [
            [1,0,5],[1,1,4],[1,2,3],
            [2,0,2],[2,1,1]
        ];
        mat.forEach(m=>push(x+m[1],y+m[0],m[2]/32));
    }
    else if(type === "atkinson"){
        const mat = [
            [0,1,1],[0,2,1],
            [1,-1,1],[1,0,1],[1,1,1],
            [2,0,1]
        ];
        mat.forEach(m=>push(x+m[1],y+m[0],m[2]/8));
    }
}

// sliders update
["brightness","contrast","saturation"].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener("input", ()=>applyAll());
});

// keyboard
document.addEventListener("keydown", e => {
    let focused = document.activeElement;
    if (focused.tagName === "INPUT" && focused.type === "range") return;

    if (e.key === "ArrowRight"){
        maxIndex = (maxIndex+1) % maxColorsList.length;
        maxColors = maxColorsList[maxIndex];
        document.getElementById("colLabel").textContent=maxColors;
        applyAll();
    }
    if (e.key === "ArrowLeft"){
        maxIndex = (maxIndex-1+maxColorsList.length) % maxColorsList.length;
        maxColors = maxColorsList[maxIndex];
        document.getElementById("colLabel").textContent=maxColors;
        applyAll();
    }
    if (e.key === "ArrowUp"){
        ditherIndex = (ditherIndex+1) % ditherMethods.length;
        document.getElementById("ditherLabel").textContent=ditherMethods[ditherIndex];
        applyAll();
    }
    if (e.key === "ArrowDown"){
        ditherIndex = (ditherIndex-1+ditherMethods.length) % ditherMethods.length;
        document.getElementById("ditherLabel").textContent=ditherMethods[ditherIndex];
        applyAll();
    }
});
</script>

</body>
</html>
