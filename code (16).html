<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transparent 3D Text Renderer</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #bg {
    position: absolute;
    inset: 0;
    object-fit: cover;
    z-index: 0;
  }
  canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  #controls {
    z-index: 2;
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 8px;
    border-radius: 10px;
  }
  button, input {
    background: #fff2;
    color: white;
    border: 1px solid #fff3;
    border-radius: 5px;
    padding: 4px 8px;
  }
</style>
</head>
<body>
  <input type="file" id="bgUpload" accept="image/*" style="z-index:2; position:absolute; top:10px; right:10px;" />
  <div id="controls">
    <button id="exportBtn">Export Image</button>
    <input id="textInput" value="Hello 3D!" />
  </div>
  <img id="bg" />
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/controls/OrbitControls.js";
    import { TransformControls } from "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/controls/TransformControls.js";
    import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/loaders/FontLoader.js";
    import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/geometries/TextGeometry.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 10);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

    let textMesh, transformControl;
    const fontLoader = new FontLoader();
    fontLoader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {
      const geometry = new TextGeometry("Hello 3D!", {
        font,
        size: 1,
        height: 0.3,
        bevelEnabled: true,
        bevelSize: 0.02,
        bevelThickness: 0.02,
      });
      const material = new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.5, roughness: 0.4 });
      textMesh = new THREE.Mesh(geometry, material);
      textMesh.position.set(-2, 0, 0);
      scene.add(textMesh);

      transformControl = new TransformControls(camera, renderer.domElement);
      transformControl.attach(textMesh);
      scene.add(transformControl);

      transformControl.addEventListener("dragging-changed", (e) => {
        orbit.enabled = !e.value;
      });
    });

    const bg = document.getElementById("bg");
    document.getElementById("bgUpload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) bg.src = URL.createObjectURL(file);
    });

    document.getElementById("textInput").addEventListener("change", (e) => {
      if (!textMesh) return;
      const newText = e.target.value || "3D Text";
      fontLoader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {
        const geo = new TextGeometry(newText, { font, size: 1, height: 0.3, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02 });
        textMesh.geometry.dispose();
        textMesh.geometry = geo;
      });
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = renderer.domElement.width;
      tempCanvas.height = renderer.domElement.height;
      const ctx = tempCanvas.getContext("2d");

      if (bg.src) ctx.drawImage(bg, 0, 0, tempCanvas.width, tempCanvas.height);
      ctx.drawImage(renderer.domElement, 0, 0);
      const link = document.createElement("a");
      link.download = "3d_text_export.png";
      link.href = tempCanvas.toDataURL("image/png");
      link.click();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      orbit.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
