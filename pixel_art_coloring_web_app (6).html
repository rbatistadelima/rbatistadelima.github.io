<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coloring Book Timelapse – Real Scribble Strokes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    canvas {
      image-rendering: pixelated;
      border: 2px solid #444;
      background: #fff;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <h2>🖍️ Coloring Book Timelapse (Scribble Strokes)</h2>

  <input type="file" id="upload" accept="image/*" />

  <canvas id="canvas"></canvas>

  <div class="controls">
    <label>Speed <input type="range" id="speed" min="1" max="10" value="2" /></label>
    <label>Brush <input type="range" id="brush" min="1" max="4" value="2" /></label>
    <button id="play">Play</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const upload = document.getElementById('upload');
    const playBtn = document.getElementById('play');
    const resetBtn = document.getElementById('reset');
    const speedInput = document.getElementById('speed');
    const brushInput = document.getElementById('brush');

    let original, lineart;
    let regions = [];
    let regionIndex = 0;
    let strokeIndex = 0;
    let animId;

    upload.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);
        original = ctx.getImageData(0, 0, canvas.width, canvas.height);

        lineart = makeLineArt(original);
        regions = extractRegions(original, lineart).map(r => ({
          ...r,
          strokes: buildScribbleStrokes(r.pixels)
        }));

        regionIndex = 0;
        strokeIndex = 0;
        ctx.putImageData(lineart, 0, 0);
      };
      img.src = URL.createObjectURL(file);
    });

    playBtn.onclick = () => {
      if (!regions.length) return;
      cancelAnimationFrame(animId);
      animate();
    };

    resetBtn.onclick = () => {
      cancelAnimationFrame(animId);
      ctx.putImageData(lineart, 0, 0);
      regionIndex = 0;
      strokeIndex = 0;
    };

    function animate() {
      const steps = Number(speedInput.value);

      for (let s = 0; s < steps; s++) {
        if (regionIndex >= regions.length) return;

        const region = regions[regionIndex];
        const stroke = region.strokes[strokeIndex++];

        ctx.strokeStyle = `rgb(${region.color[0]},${region.color[1]},${region.color[2]})`;
        ctx.lineWidth = brushInput.value;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();

        if (strokeIndex >= region.strokes.length) {
          regionIndex++;
          strokeIndex = 0;
        }
      }

      animId = requestAnimationFrame(animate);
    }

    function makeLineArt(imgData) {
      const out = new ImageData(imgData.width, imgData.height);
      const d = imgData.data;
      const o = out.data;

      for (let i = 0; i < d.length; i += 4) {
        const lum = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (d[i + 3] > 0 && lum < 60) {
          o[i] = o[i + 1] = o[i + 2] = 0;
          o[i + 3] = 255;
        } else {
          o[i] = o[i + 1] = o[i + 2] = 255;
          o[i + 3] = 255;
        }
      }
      return out;
    }

    function extractRegions(source, lineart) {
      const w = source.width;
      const h = source.height;
      const s = source.data;
      const l = lineart.data;
      const visited = new Uint8Array(w * h);
      const regions = [];
      const isOutline = i => l[i] === 0 && l[i + 1] === 0 && l[i + 2] === 0;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;
          if (visited[idx] || isOutline(i)) continue;

          const stack = [[x, y]];
          const pixels = [];
          visited[idx] = 1;
          const color = [s[i], s[i + 1], s[i + 2]];

          while (stack.length) {
            const [cx, cy] = stack.pop();
            pixels.push({ x: cx, y: cy });
            for (const [nx, ny] of [[1,0],[-1,0],[0,1],[0,-1]].map(d => [cx + d[0], cy + d[1]])) {
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              const nIdx = ny * w + nx;
              const ni = nIdx * 4;
              if (visited[nIdx] || isOutline(ni)) continue;
              visited[nIdx] = 1;
              stack.push([nx, ny]);
            }
          }

          regions.push({ pixels, color });
        }
      }
      return regions;
    }

    function buildScribbleStrokes(pixels) {
      const strokes = [];
      const used = new Set();
      const maxStroke = 8;

      for (let i = 0; i < pixels.length; i++) {
        if (used.has(i)) continue;
        const stroke = [];
        let idx = i;

        for (let s = 0; s < maxStroke; s++) {
          used.add(idx);
          stroke.push(pixels[idx]);
          idx = (idx + Math.floor(Math.random() * 5)) % pixels.length;
        }
        strokes.push(stroke);
      }
      return strokes;
    }
  </script>
</body>
</html>
