<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CodePen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1e1e1e;color:#d4d4d4;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{background:#252526;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;}
.title-group{display:flex;align-items:center;gap:15px;min-width:0;flex:1;margin-right:20px;}
#bookmarklet-link{background:#333;color:#9cdcfe;border:1px dashed #555;padding:4px 10px;border-radius:4px;font-size:0.8rem;text-decoration:none;cursor:grab;display:inline-flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap;flex-shrink:0;}
#bookmarklet-link:active{cursor:grabbing;}
#bookmarklet-link:hover{border-color:#0e639c;background:#2a2d2e;}
.code-size{font-size:0.8rem;color:#888;font-family:monospace;white-space:nowrap;flex-shrink:0;}
.data-uri-display{font-size:0.75rem;color:#ce9178;font-family:monospace;background:#1e1e1e;padding:4px 8px;border-radius:4px;border:1px solid #333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;cursor:pointer;}
.data-uri-display:focus{outline:1px solid #0e639c;}
button{background:#0e639c;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:0.9rem;white-space:nowrap;flex-shrink:0;}
button:hover{background:#1177bb;}
button.secondary{background:#3c3c3c;}
button.secondary:hover{background:#505050;}
.workspace{display:flex;flex:1;height:calc(100vh - 49px);overflow:hidden;}
.pane{flex:0 0 50%;max-width:50%;display:flex;flex-direction:column;height:100%;position:relative;}
.pane-header{background:#2d2d2d;padding:6px 15px;font-size:0.8rem;text-transform:uppercase;color:#9cdcfe;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;}
.editor-container{flex:1;overflow:hidden;}
.CodeMirror{height:100%!important;font-family:monospace;font-size:14px;line-height:1.5;}
.resizer{width:5px;background:#252526;cursor:col-resize;flex-shrink:0;}
.resizer:hover{background:#0e639c;}
#preview-frame{flex:1;border:none;background:#fff;width:100%;height:100%;}
.status{font-size:0.75rem;color:#888;}
</style>
</head>
<body>
<header>
<div class="title-group">
<a id="bookmarklet-link" href="#" title="Drag this to your bookmarks bar">🔗 Data URI Bookmarklet</a>
<span class="code-size" id="code-size-display">0 bytes</span>
<input type="text" class="data-uri-display" id="data-uri-input" readonly title="Click to select Data URI" onclick="this.select()">
</div>
<div style="display:flex;gap:10px;flex-shrink:0;">
<button class="secondary" onclick="openInNewTab()">Open in New Tab</button>
<button class="secondary" onclick="clearCode()">Clear</button>
<button onclick="downloadCode()">Download</button>
</div>
</header>
<div class="workspace" id="workspace">
<div class="pane" id="editor-pane" style="flex:0 0 50%;max-width:50%;">
<div class="pane-header"><span>HTML + CSS + JS Code</span><span class="status" id="save-status">Saved</span></div>
<div class="editor-container"><textarea id="code-editor"></textarea></div>
</div>
<div class="resizer" id="resizer"></div>
<div class="pane" id="preview-pane" style="flex:1;max-width:none;">
<div class="pane-header"><span>Live Output</span></div>
<iframe id="preview-frame"></iframe>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script>
const editor=CodeMirror.fromTextArea(document.getElementById('code-editor'),{mode:'htmlmixed',theme:'dracula',lineNumbers:true,autoCloseTags:true,autoCloseBrackets:true,matchBrackets:true,indentUnit:4,tabSize:4,lineWrapping:true});
const saved=localStorage.getItem('minipen_code');
editor.setValue(saved!==null?saved:'');
const pf=document.getElementById('preview-frame'), st=document.getElementById('save-status'), bookmarklet=document.getElementById('bookmarklet-link'), codeSizeDisplay=document.getElementById('code-size-display'), dataUriInput=document.getElementById('data-uri-input');
let t, currentDataUri='';

function formatBytes(bytes, decimals = 2) {
    if (bytes === 0) return '0 bytes';
    const k = 1024;
    const dm = decimals < 0 ? 0 : decimals;
    const sizes = ['bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

function updatePreview(){
const code=editor.getValue();
currentDataUri='data:text/html;charset=utf-8,'+encodeURIComponent(code);
bookmarklet.href=currentDataUri;
dataUriInput.value=currentDataUri;

const byteSize = new Blob([code]).size;
codeSizeDisplay.textContent = formatBytes(byteSize);

const b=new Blob([code],{type:'text/html'});
if(pf.src)URL.revokeObjectURL(pf.src);
pf.src=URL.createObjectURL(b);
}

editor.on('change',()=>{
localStorage.setItem('minipen_code',editor.getValue());
st.textContent='Saving...';
clearTimeout(t);
t=setTimeout(()=>{updatePreview();st.textContent='Saved';},300);
});

updatePreview();

function openInNewTab(){
if(!currentDataUri) return;
const blob = new Blob([editor.getValue()], {type: 'text/html;charset=utf-8'});
const url = URL.createObjectURL(blob);
window.open(url, '_blank');
}

function clearCode(){if(confirm('Clear all?'))editor.setValue('');}

function downloadCode(){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/html;charset=utf-8'}));
a.download='index.html';a.click();URL.revokeObjectURL(a.href);
}

const resizer=document.getElementById('resizer'),ws=document.getElementById('workspace'),ep=document.getElementById('editor-pane'),pp=document.getElementById('preview-pane');
let resizing=false;
resizer.onmousedown=()=>resizing=true;
window.onmousemove=(e)=>{
if(!resizing)return;
const rect=ws.getBoundingClientRect();
let p=((e.clientX-rect.left)/rect.width)*100;
if(p<15)p=15;if(p>85)p=85;
ep.style.flex=`0 0 ${p}%`;
ep.style.maxWidth=`${p}%`;
pp.style.flex=`1`;
pp.style.maxWidth=`none`;
};
window.onmouseup=()=>{if(resizing){resizing=false;editor.refresh();}};
</script>
</body>
</html>
