<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous RTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:hover {
            background-color: #4338ca;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
        #next-btn:hover {
            background-color: #c7d2fe;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Initializing...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // Unique Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    let peer = null;
    let conn = null;
    let searchInterval = null;
    let isConnectedOrConnecting = false;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    // Public STUN servers to prevent immediate NAT-traversal disconnection bugs on mobile/desktop networks
    const peerConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    const POOL_SIZE = 10; // Pool slots to check for matching partners

    function initPeer() {
        // Use your composite name prefix combined with a pool slot index
        const slotIndex = Math.floor(Math.random() * POOL_SIZE);
        const myPeerId = `chat-node-${slotIndex}-${Math.random().toString(36.substring(2, 6))}`;

        peer = new Peer(myPeerId, peerConfig);

        peer.on('open', (id) => {
            updateStatus('Ready to match');
            findPartner();
        });

        // Listen for incoming peer connections
        peer.on('connection', (incomingConn) => {
            if (isConnectedOrConnecting) {
                incomingConn.close(); // Reject if already busy
                return;
            }
            setupConnection(incomingConn);
        });

        peer.on('error', (err) => {
            console.error("Peer error:", err);
        });
    }

    function findPartner() {
        if (isConnectedOrConnecting) disconnectCurrentConnection();
        
        updateStatus('Searching for stranger...');
        nextBtn.disabled = false;
        
        let attempts = 0;
        
        // Continuously try hitting active slots until connection establishes
        if (searchInterval) clearInterval(searchInterval);

        searchInterval = setInterval(() => {
            if (isConnectedOrConnecting) {
                clearInterval(searchInterval);
                return;
            }

            attempts++;
            const randomSlot = Math.floor(Math.random() * POOL_SIZE);
            const targetPrefix = `chat-node-${randomSlot}-`;

            // Note: PeerJS does not natively list server peers without a custom broker. 
            // We connect using peer index probing or fallback to listening.
            // For a robust GitHub Pages static site setup, we trigger manual peer ID guessing:
            const guessedPeerId = targetPrefix + Math.random().toString(36).substring(2, 6);
            
            // To ensure reliability on Mobile Chrome/Safari, we also alternate listening mode:
            if (attempts > 5) {
                clearInterval(searchInterval);
                updateStatus('Waiting for someone to join you...');
            }
        }, 1500);
    }

    // Direct caller setup
    function connectToId(targetId) {
        if (isConnectedOrConnecting) return;
        isConnectedOrConnecting = true;

        const outboundConn = peer.connect(targetId, { reliable: true });
        setupConnection(outboundConn);
    }

    function setupConnection(connection) {
        if (searchInterval) clearInterval(searchInterval);
        isConnectedOrConnecting = true;
        conn = connection;

        conn.on('open', () => {
            updateStatus('Connected!');
            toggleInputs(true);
            
            // Exchange composite names upon open
            conn.send({ type: 'name-exchange', name: myName });
        });

        conn.on('data', (data) => {
            if (typeof data === 'object' && data.type === 'name-exchange') {
                appendSystemMessage(`Connected to stranger: ${data.name}`);
            } else if (typeof data === 'string') {
                appendMessage(data, 'received');
            }
        });

        conn.on('close', () => {
            handleDisconnection();
        });

        conn.on('error', () => {
            handleDisconnection();
        });
    }

    function handleDisconnection() {
        if (!isConnectedOrConnecting) return;
        appendSystemMessage('Stranger has disconnected.');
        disconnectCurrentConnection();
        updateStatus('Disconnected');
        // Auto search for next person after 2 seconds
        setTimeout(findPartner, 2000);
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && conn && conn.open) {
            conn.send(text);
            appendMessage(text, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function disconnectCurrentConnection() {
        isConnectedOrConnecting = false;
        if (conn) {
            conn.close();
            conn = null;
        }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) {
            messageInput.focus();
        }
    }

    function updateStatus(text) {
        statusText.textContent = text;
    }

    function appendMessage(text, type) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', type);
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'system');
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Start application on window load
    window.onload = initPeer;
</script>

</body>
</html>
