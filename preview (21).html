<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>🎙️ TTS Lab — Single Engine Fix</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
body{margin:0;background:#0f0f12;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
textarea{width:90%;max-width:900px;height:140px;background:#121214;color:#fff;border:0;padding:10px}
.karaoke{width:90%;max-width:900px;background:#141417;padding:12px;border-radius:8px;min-height:120px}
button{background:#222;color:#fff;border:0;padding:10px 14px;border-radius:8px}
.status{color:#aaa;font-size:0.9rem}
</style>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

/* =========================
   🔥 SINGLE AUDIO ENGINE
========================= */

let kaori = null;
let ready = false;
let playing = false;

async function boot(){
  document.getElementById("status").innerText =
    "Carregando motor Kaori (único engine)...";

  kaori = await pipeline("text-to-speech","Xenova/mms-tts-por");

  await kaori("warmup");

  ready = true;

  document.getElementById("status").innerText =
    "Kaori pronta ✔ (engine único ativo)";

  document.getElementById("playBtn").disabled = false;
}

window.addEventListener("DOMContentLoaded", boot);

/* =========================
   🎧 ONLY ONE PLAYER
========================= */

async function speak(text){

  if(!ready) return;

  const out = await kaori(text);

  const ctx = new AudioContext();
  const buf = ctx.createBuffer(1,out.sampling_rate,out.sampling_rate);
  buf.copyToChannel(out.audio,0);

  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);

  return new Promise(r=>{
    src.onended = r;
    src.start();
  });
}

/* =========================
   ▶ SEQUENTIAL PLAYER
========================= */

async function start(){

  if(playing) return;
  playing = true;

  const lines = document.getElementById("texto")
    .value.split("\n").filter(Boolean);

  for(const line of lines){

    const m = line.match(/^([^:]+):\s*(.*)$/);
    if(!m) continue;

    const name = m[1];
    const text = m[2];

    document.getElementById("karaoke").innerHTML =
      `<b>${name}:</b> ${text}`;

    await speak(text);
  }

  playing = false;
}

window.start = start;

</script>
</head>

<body>

<div class="status" id="status">Inicializando...</div>

<textarea id="texto">
Daniel: Agora nada mais quebra.
Maria: Tudo está unificado.
Kaori: Eu sou o único motor ativo.
Regina: Eu não posso mais interromper.
Ana: Nem eu.
Daniel: Agora sim é estável.
</textarea>

<div class="karaoke" id="karaoke"></div>

<button id="playBtn" disabled onclick="start()">▶ Play</button>

</body>
</html>
