<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Initializing...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findNextPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    let peer = null;
    let conn = null;
    let isConnected = false;
    let searchAttempt = 0;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    // PeerJS configuration with public STUN servers for network/mobile traversal
    const peerOptions = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    function initPeer() {
        if (peer) {
            try { peer.destroy(); } catch(e) {}
        }

        isConnected = false;
        statusText.textContent = 'Connecting to network...';
        nextBtn.disabled = true;

        // Generate a rolling lobby token so users opening at staggered times still intersect
        const timeWindow = Math.floor(Date.now() / 15000); // 15-second rotation window
        const randomToken = Math.random().toString(36).substring(2, 6);
        const myPeerId = `gh-chat-${timeWindow}-${randomToken}`;

        peer = new Peer(myPeerId, peerOptions);

        peer.on('open', (id) => {
            statusText.textContent = 'Searching for partner...';
            nextBtn.disabled = false;
            searchForPeers(timeWindow);
        });

        peer.on('connection', (incomingConn) => {
            if (isConnected) {
                incomingConn.close();
                return;
            }
            setupConnection(incomingConn);
        });

        peer.on('error', (err) => {
            console.error("Peer error:", err);
            setTimeout(findNextPartner, 2000);
        });
    }

    function searchForPeers(timeWindow) {
        if (isConnected) return;

        searchAttempt++;
        // Try connecting to a peer in the current or previous time window slot
        const targetWindow = searchAttempt % 2 === 0 ? timeWindow - 1 : timeWindow;
        const targetId = `gh-chat-${targetWindow}-`;

        // Since PeerJS doesn't list all active room IDs directly without a custom server,
        // we probe a generated sequence or wait as a host node.
        if (searchAttempt > 4) {
            statusText.textContent = 'Waiting for someone to join...';
            return; // Switch to listening mode
        }

        const guessedPeerId = targetId + Math.random().toString(36).substring(2, 6);
        const outboundConn = peer.connect(guessedPeerId, { reliable: true });

        let opened = false;
        outboundConn.on('open', () => {
            opened = true;
            setupConnection(outboundConn);
        });

        setTimeout(() => {
            if (!opened && !isConnected) {
                searchForPeers(timeWindow);
            }
        }, 1500);
    }

    function setupConnection(connection) {
        if (isConnected) {
            connection.close();
            return;
        }
        isConnected = true;
        conn = connection;

        statusText.textContent = 'Connected!';
        appendSystemMessage('Connected to a stranger.');
        toggleInputs(true);

        // Send name immediately upon connection
        conn.send({ type: 'name', name: myName });

        conn.on('data', (data) => {
            if (typeof data === 'object' && data.type === 'name') {
                appendSystemMessage(`You are chatting with: ${data.name}`);
            } else if (typeof data === 'string') {
                appendMessage(data, 'received');
            }
        });

        conn.on('close', () => {
            handleDisconnect();
        });

        conn.on('error', () => {
            handleDisconnect();
        });
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && conn && conn.open) {
            conn.send(text);
            appendMessage(text, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(initPeer, 1500);
    }

    function findNextPartner() {
        cleanupConnection();
        initPeer();
    }

    function cleanupConnection() {
        isConnected = false;
        if (conn) {
            try { conn.close(); } catch(e){}
            conn = null;
        }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.onload = initPeer;
</script>

</body>
</html>
