<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinite Grid ASCII Text Editor - Monochrome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=JetBrains+Mono:wght@500&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --surface-color: #000000;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #ffffff;
            --cell-border: #333333;
            --cell-active-bg: #ffffff;
            --cell-active-text: #000000;
            --cell-select-bg: rgba(255, 255, 255, 0.25);
        }

        :root[data-theme="light"] {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #777777;
            --border-color: #000000;
            --cell-border: #dddddd;
            --cell-active-bg: #000000;
            --cell-active-text: #ffffff;
            --cell-select-bg: rgba(0, 0, 0, 0.15);
        }

        :root {
            --base-cell-width: 14px;
            --base-cell-height: 20px;
            --current-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        h1 {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls-group {
            display: flex;
            gap: 4px;
            align-items: center;
            overflow-x: auto;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 6px;
            border-radius: 0px;
            font-size: 0.7rem;
            outline: none;
            white-space: nowrap;
            cursor: pointer;
            font-family: monospace;
            text-transform: uppercase;
            text-align: center;
        }

        button.btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            font-weight: 700;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
            cursor: grab;
        }

        .viewport:active {
            cursor: grabbing;
        }

        .grid-world {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transform-origin: 0 0;
        }

        .cell {
            position: absolute;
            width: var(--base-cell-width);
            height: var(--base-cell-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 20px;
            font-weight: 500;
            font-family: var(--current-font);
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
            background-color: transparent;
            box-sizing: border-box;
            border-right: none;
            border-bottom: none;
        }

        /* Border rendered ONLY when cell explicitly contains data */
        .cell.has-char {
            border-right: 1px dotted var(--cell-border);
            border-bottom: 1px dotted var(--cell-border);
        }

        .cell.active {
            background-color: var(--cell-active-bg) !important;
            color: var(--cell-active-text) !important;
            border-right: none !important;
            border-bottom: none !important;
            z-index: 3;
        }

        .cell.in-selection {
            background-color: var(--cell-select-bg) !important;
            border-right: 1px dotted var(--cell-border) !important;
            border-bottom: 1px dotted var(--cell-border) !important;
        }

        .zoom-controls-floating {
            position: fixed;
            bottom: 24px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 150;
        }

        .zoom-controls-floating button {
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        #keyboard-interceptor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 30px;
            opacity: 0.01;
            z-index: 999;
            font-size: 16px;
            background: transparent;
            border: none;
            outline: none;
            pointer-events: auto;
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 6px 16px;
            border-radius: 0px;
            font-size: 0.8rem;
            font-family: monospace;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 100;
            text-transform: uppercase;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body onclick="keepFocus()">

    <header>
        <h1>GridCell</h1>
        <div class="controls-group">
            <button id="btn-select" title="Selecionar Área">Sel</button>
            <button class="btn-primary" id="btn-copy">Cop</button>
            <button id="btn-paste">Col</button>
            <button id="btn-theme" title="Tema">Tem</button>
            <button id="btn-font" title="Fonte">Fon</button>
            <button id="btn-clear">Lim</button>
            <button id="btn-undo" disabled>Desf</button>
        </div>
    </header>

    <div class="viewport" id="viewport">
        <div class="grid-world" id="grid-world"></div>
    </div>

    <div class="zoom-controls-floating">
        <button id="btn-zoom-in" title="Aumentar Zoom">+</button>
        <button id="btn-zoom-out" title="Reduzir Zoom">-</button>
    </div>

    <textarea id="keyboard-interceptor" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <div class="toast" id="toast">Texto copiado!</div>

    <script>
        const BASE_CELL_WIDTH = 14;
        const BASE_CELL_HEIGHT = 20;
        
        const ZOOM_LEVELS = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
        let currentZoomIndex = 2;

        const gridData = new Map();
        const cellElements = new Map();
        let clearedBackup = null;

        const fonts = [
            { name: "Courier", value: "'Courier New', Courier, monospace" },
            { name: "JetBrains", value: "'JetBrains Mono', monospace" },
            { name: "Fira Code", value: "'Fira Code', monospace" },
            { name: "Source Code", value: "'Source Code Pro', monospace" },
            { name: "Menlo", value: "Menlo, Monaco, monospace" },
            { name: "SF Mono", value: "ui-monospace, SFMono-Regular, monospace" }
        ];
        let currentFontIndex = 0;

        let activeRow = 0;
        let activeCol = 0;

        let isSelecting = false;
        let selStartRow = null;
        let selStartCol = null;
        let selEndRow = null;
        let selEndCol = null;

        const effectiveCellWidth = BASE_CELL_WIDTH * ZOOM_LEVELS[currentZoomIndex];
        let cameraX = Math.round((window.innerWidth - effectiveCellWidth) / 2);
        let cameraY = Math.round((window.innerHeight / 3) / BASE_CELL_HEIGHT) * BASE_CELL_HEIGHT;

        const viewport = document.getElementById('viewport');
        const gridWorld = document.getElementById('grid-world');
        const interceptor = document.getElementById('keyboard-interceptor');
        const btnFont = document.getElementById('btn-font');
        const btnTheme = document.getElementById('btn-theme');
        const btnCopy = document.getElementById('btn-copy');
        const btnPaste = document.getElementById('btn-paste');
        const btnSelect = document.getElementById('btn-select');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const toastEl = document.getElementById('toast');

        function updateTransform() {
            const scale = ZOOM_LEVELS[currentZoomIndex];
            const effWidth = BASE_CELL_WIDTH * scale;
            
            cameraX = Math.round(cameraX / effWidth) * effWidth;
            cameraY = Math.round(cameraY / BASE_CELL_HEIGHT) * BASE_CELL_HEIGHT;

            gridWorld.style.transform = `translate3d(${cameraX}px, ${cameraY}px, 0) scale(${scale})`;
        }
        updateTransform();

        function getKey(r, c) {
            return `${r},${c}`;
        }

        function ensureCellElement(r, c) {
            const key = getKey(r, c);
            if (cellElements.has(key)) return cellElements.get(key);

            const el = document.createElement('div');
            el.className = 'cell';
            el.style.left = `${c * BASE_CELL_WIDTH}px`;
            el.style.top = `${r * BASE_CELL_HEIGHT}px`;
            el.style.fontFamily = fonts[currentFontIndex].value;
            el.dataset.row = r;
            el.dataset.col = c;

            const char = gridData.get(key);
            if (char) {
                el.textContent = char;
                el.classList.add('has-char');
            }
            
            if (isCellSelected(r, c)) {
                el.classList.add('in-selection');
            }

            gridWorld.appendChild(el);
            cellElements.set(key, el);
            return el;
        }

        function cleanCellElement(r, c) {
            const key = getKey(r, c);
            if (r === activeRow && c === activeCol) return;
            if (isCellSelected(r, c)) return;
            
            if (!gridData.has(key) && cellElements.has(key)) {
                const el = cellElements.get(key);
                el.remove();
                cellElements.delete(key);
            }
        }

        function isCellSelected(r, c) {
            if (selStartRow === null || selEndRow === null) return false;
            const minR = Math.min(selStartRow, selEndRow);
            const maxR = Math.max(selStartRow, selEndRow);
            const minC = Math.min(selStartCol, selEndCol);
            const maxC = Math.max(selStartCol, selEndCol);
            return r >= minR && r <= maxR && c >= minC && c <= maxC;
        }

        function updateSelectionHighlight() {
            if (selStartRow !== null && selEndRow !== null) {
                const minR = Math.min(selStartRow, selEndRow);
                const maxR = Math.max(selStartRow, selEndRow);
                const minC = Math.min(selStartCol, selEndCol);
                const maxC = Math.max(selStartCol, selEndCol);

                for (let r = minR; r <= maxR; r++) {
                    for (let c = minC; c <= maxC; c++) {
                        ensureCellElement(r, c);
                    }
                }
            }

            cellElements.forEach((el, key) => {
                const [r, c] = key.split(',').map(Number);
                if (isCellSelected(r, c)) {
                    el.classList.add('in-selection');
                } else {
                    el.classList.remove('in-selection');
                    cleanCellElement(r, c);
                }
            });
        }

        function clearSelection() {
            selStartRow = null;
            selStartCol = null;
            selEndRow = null;
            selEndCol = null;
            isSelecting = false;
            btnSelect.style.borderColor = 'var(--border-color)';
            btnSelect.style.backgroundColor = 'var(--bg-color)';
            btnSelect.style.color = 'var(--text-color)';
            updateSelectionHighlight();
        }

        // Shifts character sequence rightwards when inserting
        function insertCharWithPush(r, c, char) {
            let currentCol = c;
            let currentChar = char;
            
            while (currentChar !== '') {
                const key = getKey(r, currentCol);
                const nextChar = gridData.get(key) || '';
                
                if (currentChar) {
                    gridData.set(key, currentChar);
                    const el = ensureCellElement(r, currentCol);
                    el.textContent = currentChar;
                    el.classList.add('has-char');
                } else {
                    gridData.delete(key);
                    if (cellElements.has(key)) {
                        const el = cellElements.get(key);
                        el.textContent = '';
                        el.classList.remove('has-char');
                    }
                    cleanCellElement(r, currentCol);
                }
                
                currentChar = nextChar;
                currentCol++;
                if (currentCol > c + 200) break;
            }
        }

        function setCellChar(r, c, char) {
            const key = getKey(r, c);
            if (!char) {
                gridData.delete(key);
                if (cellElements.has(key)) {
                    const el = cellElements.get(key);
                    el.textContent = '';
                    el.classList.remove('has-char');
                }
                cleanCellElement(r, c);
            } else {
                gridData.set(key, char);
                const el = ensureCellElement(r, c);
                el.textContent = char;
                el.classList.add('has-char');
            }
        }

        function setActiveCell(r, c) {
            const oldR = activeRow;
            const oldC = activeCol;
            const oldKey = getKey(oldR, oldC);
            
            if (cellElements.has(oldKey)) {
                cellElements.get(oldKey).classList.remove('active');
            }

            activeRow = r;
            activeCol = c;

            cleanCellElement(oldR, oldC);

            const newEl = ensureCellElement(r, c);
            newEl.classList.add('active');
        }

        function keepFocus() {
            if (document.activeElement !== interceptor) {
                interceptor.focus({ preventScroll: true });
            }
        }

        window.addEventListener('touchstart', () => {
            keepFocus();
        }, { passive: true });

        let isDragging = false;
        let startX = 0, startY = 0;
        let initialCamX = 0, initialCamY = 0;
        let hasDragged = false;

        function onPointerDown(e) {
            isDragging = true;
            hasDragged = false;
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            initialCamX = cameraX;
            initialCamY = cameraY;

            if (isSelecting) {
                const rect = gridWorld.getBoundingClientRect();
                const scale = ZOOM_LEVELS[currentZoomIndex];
                const localX = (startX - rect.left) / scale;
                const localY = (startY - rect.top) / scale;
                selStartCol = Math.floor(localX / BASE_CELL_WIDTH);
                selStartRow = Math.floor(localY / BASE_CELL_HEIGHT);
                selEndCol = selStartCol;
                selEndRow = selStartRow;
                updateSelectionHighlight();
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const dx = currentX - startX;
            const dy = currentY - startY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                hasDragged = true;
                if (isSelecting) {
                    const rect = gridWorld.getBoundingClientRect();
                    const scale = ZOOM_LEVELS[currentZoomIndex];
                    const localX = (currentX - rect.left) / scale;
                    const localY = (currentY - rect.top) / scale;
                    selEndCol = Math.floor(localX / BASE_CELL_WIDTH);
                    selEndRow = Math.floor(localY / BASE_CELL_HEIGHT);
                    updateSelectionHighlight();
                } else {
                    cameraX = initialCamX + dx;
                    cameraY = initialCamY + dy;
                    updateTransform();
                }
            }
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;

            if (!hasDragged && e.target && !isSelecting) {
                const rect = gridWorld.getBoundingClientRect();
                const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

                if (clientX !== undefined && clientY !== undefined) {
                    const scale = ZOOM_LEVELS[currentZoomIndex];
                    const localX = (clientX - rect.left) / scale;
                    const localY = (clientY - rect.top) / scale;
                    const c = Math.floor(localX / BASE_CELL_WIDTH);
                    const r = Math.floor(localY / BASE_CELL_HEIGHT);
                    setActiveCell(r, c);
                }
            }
            updateTransform();
            keepFocus();
        }

        viewport.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        viewport.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        interceptor.addEventListener('input', (e) => {
            const val = interceptor.value;
            if (val.length > 0) {
                const char = val[val.length - 1];
                if (char === ' ') {
                    // Space key: insert-push text rightwards, cursor stays at original cell
                    insertCharWithPush(activeRow, activeCol, ' ');
                    setActiveCell(activeRow, activeCol);
                } else {
                    // Standard character typing: insert-push text rightwards, cursor advances
                    insertCharWithPush(activeRow, activeCol, char);
                    setActiveCell(activeRow, activeCol + 1);
                }
                interceptor.value = '';
            }
        });

        interceptor.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                const currentKey = getKey(activeRow, activeCol);
                if (gridData.has(currentKey)) {
                    setCellChar(activeRow, activeCol, '');
                } else {
                    setActiveCell(activeRow, activeCol - 1);
                    setCellChar(activeRow, activeCol, '');
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol - 1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                setActiveCell(activeRow, activeCol + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setActiveCell(activeRow - 1, activeCol);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                setActiveCell(activeRow + 1, activeCol);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                setActiveCell(activeRow + 1, 0);
            }
        });

        btnSelect.addEventListener('click', (e) => {
            e.stopPropagation();
            isSelecting = !isSelecting;
            if (isSelecting) {
                btnSelect.style.borderColor = 'var(--text-color)';
                btnSelect.style.backgroundColor = 'var(--text-color)';
                btnSelect.style.color = 'var(--bg-color)';
                showToast("Modo seleção ativado");
            } else {
                clearSelection();
                showToast("Seleção limpa");
            }
            keepFocus();
        });

        btnCopy.addEventListener('click', (e) => {
            e.stopPropagation();
            let minR, maxR, minC, maxC;

            if (selStartRow !== null && selEndRow !== null) {
                minR = Math.min(selStartRow, selEndRow);
                maxR = Math.max(selStartRow, selEndRow);
                minC = Math.min(selStartCol, selEndCol);
                maxC = Math.max(selStartCol, selEndCol);
            } else {
                if (gridData.size === 0) {
                    showToast("Grid vazio!");
                    keepFocus();
                    return;
                }
                minR = Infinity; maxR = -Infinity;
                minC = Infinity; maxC = -Infinity;
                for (const key of gridData.keys()) {
                    const [r, c] = key.split(',').map(Number);
                    if (r < minR) minR = r;
                    if (r > maxR) maxR = r;
                    if (c < minC) minC = c;
                    if (c > maxC) maxC = c;
                }
            }

            let resultLines = [];
            for (let r = minR; r <= maxR; r++) {
                let line = '';
                for (let c = minC; c <= maxC; c++) {
                    const char = gridData.get(getKey(r, c)) || ' ';
                    line += char;
                }
                resultLines.push(line);
            }

            const fullText = resultLines.join('\n');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullText).then(() => showToast("Copiado!"));
            } else {
                interceptor.value = fullText;
                interceptor.select();
                document.execCommand('copy');
                interceptor.value = '';
                showToast("Copiado!");
            }
            clearSelection();
            keepFocus();
        });

        btnPaste.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                let text = "";
                if (navigator.clipboard && navigator.clipboard.readText) {
                    text = await navigator.clipboard.readText();
                } else {
                    interceptor.value = "";
                    interceptor.focus();
                    document.execCommand('paste');
                    text = interceptor.value;
                    interceptor.value = "";
                }

                if (!text) {
                    showToast("Clipboard vazio!");
                    keepFocus();
                    return;
                }

                const lines = text.split(/\r?\n/);
                let startR = activeRow;
                let startC = activeCol;

                if (selStartRow !== null && selEndRow !== null) {
                    startR = Math.min(selStartRow, selEndRow);
                    startC = Math.min(selStartCol, selEndCol);
                }

                lines.forEach((line, rIdx) => {
                    const targetR = startR + rIdx;
                    for (let cIdx = 0; cIdx < line.length; cIdx++) {
                        const char = line[cIdx];
                        const targetC = startC + cIdx;
                        setCellChar(targetR, targetC, char);
                    }
                });

                showToast("Colado!");
                clearSelection();
            } catch (err) {
                showToast("Erro ao colar");
            }
            keepFocus();
        });

        btnClear.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gridData.size === 0) return;

            clearedBackup = new Map(gridData);
            btnUndo.disabled = false;

            gridData.clear();
            
            cellElements.forEach((el, key) => {
                if (key !== getKey(activeRow, activeCol)) {
                    el.remove();
                } else {
                    el.textContent = '';
                    el.classList.remove('has-char');
                }
            });
            cellElements.clear();
            
            setActiveCell(0, 0);
            clearSelection();
            showToast("Limpo!");
            keepFocus();
        });

        btnUndo.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!clearedBackup) return;

            gridData.clear();
            cellElements.forEach((el, key) => {
                if (key !== getKey(activeRow, activeCol)) {
                    el.remove();
                } else {
                    el.textContent = '';
                    el.classList.remove('has-char');
                }
            });
            cellElements.clear();

            clearedBackup.forEach((char, key) => {
                const [r, c] = key.split(',').map(Number);
                setCellChar(r, c, char);
            });

            clearedBackup = null;
            btnUndo.disabled = true;
            showToast("Restaurado!");
            keepFocus();
        });

        btnFont.addEventListener('click', (e) => {
            e.stopPropagation();
            currentFontIndex = (currentFontIndex + 1) % fonts.length;
            const newFont = fonts[currentFontIndex];
            
            document.documentElement.style.setProperty('--current-font', newFont.value);
            cellElements.forEach(el => {
                el.style.fontFamily = newFont.value;
            });
            showToast(newFont.name);
            keepFocus();
        });

        btnTheme.addEventListener('click', (e) => {
            e.stopPropagation();
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            keepFocus();
        });

        btnZoomIn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentZoomIndex < ZOOM_LEVELS.length - 1) {
                currentZoomIndex++;
                updateTransform();
                showToast(`${Math.round(ZOOM_LEVELS[currentZoomIndex] * 100)}%`);
            }
            keepFocus();
        });

        btnZoomOut.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentZoomIndex > 0) {
                currentZoomIndex--;
                updateTransform();
                showToast(`${Math.round(ZOOM_LEVELS[currentZoomIndex] * 100)}%`);
            }
            keepFocus();
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1200);
        }

        setActiveCell(0, 0);
        setTimeout(keepFocus, 200);
    </script>
</body>
</html>
