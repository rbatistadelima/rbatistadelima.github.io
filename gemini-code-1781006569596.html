<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5sortable@0.13.0/dist/html5sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #111827; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #059669; border-radius: 4px; }
        .sortable-placeholder {
            background: rgba(16, 185, 129, 0.05);
            border: 2px dashed #10b981;
            border-radius: 8px;
            height: 44px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen flex flex-col justify-between p-4 gap-3 select-none">

    <header class="bg-gray-900 rounded-xl px-5 py-3 flex flex-col xl:flex-row justify-between items-center gap-4 border border-gray-800 shrink-0 shadow-lg">
        <div class="w-full xl:w-auto">
            <h1 class="text-base font-black text-white tracking-wide uppercase flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                Cronograma
            </h1>
        </div>
        
        <div class="flex flex-wrap items-center gap-4 w-full xl:w-auto justify-end">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Padrao:</span>
                <select id="patternSelect" class="bg-gray-950 border border-gray-700 text-emerald-400 font-bold text-xs rounded-xl focus:ring-2 focus:ring-emerald-500 p-2 cursor-pointer min-w-[240px] shadow-inner">
                    <optgroup label="Padroes do Sistema">
                        <option value="instagram">Algoritmo Instagram (Picos)</option>
                        <option value="abertura">Abertura Rapida (Foco Inicial)</option>
                        <option value="continuo">Distribuicao Linear (1h em 1h)</option>
                    </optgroup>
                    <optgroup label="Meus Padroes Salvos" id="localPatternsGroup">
                        </optgroup>
                </select>
                <button id="deletePatternBtn" class="hidden bg-red-950 border border-red-800 text-red-400 hover:bg-red-900 px-2 py-1.5 text-xs font-bold rounded-lg transition-colors">
                    Excluir
                </button>
            </div>

            <div class="h-6 w-[1px] bg-gray-800 hidden sm:block"></div>

            <div class="flex items-center gap-2">
                <input type="text" id="newPatternName" placeholder="Nome do padrao..." class="bg-gray-950 border border-gray-700 rounded-xl px-3 py-1.5 text-xs font-semibold text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-44">
                <button id="savePatternBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-2 rounded-xl transition-colors shadow-md">
                    Salvar Local
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow grid grid-cols-12 gap-3 min-h-0">
        
        <section class="col-span-8 bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col relative shadow-xl overflow-hidden">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Frequencia de Publicacao (Mais Alto = Menor Intervalo)</span>
            </div>
            <div class="flex-grow relative w-full h-full min-h-0">
                <canvas id="syncLineChart"></canvas>
            </div>
        </section>

        <section class="col-span-4 bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col shadow-xl overflow-hidden">
            
            <div class="flex justify-between items-center pb-2 border-b border-gray-800 shrink-0">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Intervalos</span>
                <button id="exportTextBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-bold text-[10px] px-2.5 py-1 rounded-lg transition-colors cursor-pointer">
                    Exportar Texto
                </button>
            </div>
            
            <div id="tableContainer" class="flex-grow overflow-y-auto custom-scroll mt-2 pr-1 space-y-1">
                </div>

            <div class="bg-gray-950 border border-gray-800 rounded-xl p-2 mt-3 flex items-center gap-2 shrink-0">
                <input type="text" id="newMediaTitle" placeholder="Novo item..." class="bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs font-medium text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 flex-grow">
                <button id="addMediaBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs px-3 py-1.5 rounded-lg transition-colors shadow-md shrink-0">
                    Adicionar
                </button>
            </div>
        </section>

    </main>

    <footer class="h-1 shrink-0"></footer>

    <script>
        const ctx = document.getElementById('syncLineChart').getContext('2d');
        let chartInstance;

        // Horários de 15 em 15 minutos mapeados para minutos absolutos desde as 10:00
        const timeSlots = [
            "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45",
            "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45",
            "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45",
            "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45",
            "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00"
        ];

        function timeToMinutes(slotIdx) {
            return slotIdx * 15;
        }

        let masterVideosData = {
            "vid_0": { title: "Abertura do Dia" },
            "vid_1": { title: "Midia de Contexto" },
            "vid_2": { title: "Chamada Principal" },
            "vid_3": { title: "Apresentacao de Produto" },
            "vid_4": { title: "Detalhes Tecnicos" },
            "vid_5": { title: "Acao Institucional" },
            "vid_6": { title: "Acesso a Plataforma" },
            "vid_7": { title: "Interacao com Publico" },
            "vid_8": { title: "Bastidores da Operacao" },
            "vid_9": { title: "Prova Social" },
            "vid_10": { title: "Encerramento" }
        };

        const basePatterns = {
            instagram: [["vid_0",0], ["vid_1",4], ["vid_2",8], ["vid_3",12], ["vid_4",16], ["vid_5",20], ["vid_6",24], ["vid_7",28], ["vid_8",32], ["vid_9",36], ["vid_10",40]],
            abertura:  [["vid_0",0], ["vid_1",1], ["vid_2",2], ["vid_3",12], ["vid_4",17], ["vid_5",22], ["vid_6",27], ["vid_7",32], ["vid_8",35], ["vid_9",38], ["vid_10",40]],
            continuo:  [["vid_0",0], ["vid_1",4], ["vid_2",8], ["vid_3",12], ["vid_4",16], ["vid_5",20], ["vid_6",24], ["vid_7",28], ["vid_8",32], ["vid_9",36], ["vid_10",40]]
        };

        let currentSequenceState = [];

        function getLocalPatterns() {
            const saved = localStorage.getItem('clean_drag_patterns');
            return saved ? JSON.parse(saved) : {};
        }

        function saveLocalPatterns(patterns) {
            localStorage.setItem('clean_drag_patterns', JSON.stringify(patterns));
        }

        function updateSelectDropdownOptions() {
            const localGroup = document.getElementById('localPatternsGroup');
            localGroup.innerHTML = '';
            const customPatterns = getLocalPatterns();
            Object.keys(customPatterns).forEach(key => {
                const option = document.createElement('option');
                option.value = `custom_${key}`;
                option.textContent = `${key}`;
                localGroup.appendChild(option);
            });
        }

        function syncStateToUrl() {
            const params = new URLSearchParams();
            const currentPattern = document.getElementById('patternSelect').value;
            params.set('pattern', currentPattern);
            params.set('m_data', btoa(encodeURIComponent(JSON.stringify(masterVideosData))));

            currentSequenceState.forEach((item, i) => {
                params.set(`id${i}`, item[0]);
                params.set(`t${i}`, item[1]);
            });

            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
            const deleteBtn = document.getElementById('deletePatternBtn');
            currentPattern.startsWith('custom_') ? deleteBtn.classList.remove('hidden') : deleteBtn.classList.add('hidden');
        }

        function parseUrlOrStorageState() {
            const params = new URLSearchParams(window.location.search);
            const pattern = params.get('pattern') || 'instagram';
            
            const mDataParam = params.get('m_data');
            if (mDataParam) {
                try { masterVideosData = JSON.parse(decodeURIComponent(atob(mDataParam))); } catch(e){}
            }

            let constructedSequence = [];
            let i = 0;
            while(params.get(`id${i}`) !== null) {
                const idVal = params.get(`id${i}`);
                const timeVal = params.get(`t${i}`);
                if (masterVideosData[idVal]) {
                    constructedSequence.push([idVal, parseInt(timeVal, 10)]);
                }
                i++;
            }

            if (constructedSequence.length > 0) {
                return { pattern, data: constructedSequence };
            }

            if (pattern.startsWith('custom_')) {
                const customKey = pattern.replace('custom_', '');
                const customPatterns = getLocalPatterns();
                if (customPatterns[customKey]) return { pattern, data: JSON.parse(JSON.stringify(customPatterns[customKey])) };
            }

            return { pattern: 'instagram', data: JSON.parse(JSON.stringify(basePatterns['instagram'])) };
        }

        function formatIntervalText(minutes) {
            if (minutes <= 0 || isNaN(minutes)) return "Fim";
            if (minutes < 60) return `+${minutes} min`;
            const hrs = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins > 0 ? `+${hrs}h ${mins}m` : `+${hrs}h`;
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '';

            currentSequenceState.forEach((item, index) => {
                const mediaId = item[0];
                const currentTimeSlotIdx = item[1];
                const staticData = masterVideosData[mediaId];

                // Cálculo do intervalo dinâmico até o próximo item
                let intervalMinutes = 0;
                if (index < currentSequenceState.length - 1) {
                    const nextTimeSlotIdx = currentSequenceState[index + 1][1];
                    intervalMinutes = timeToMinutes(nextTimeSlotIdx) - timeToMinutes(currentTimeSlotIdx);
                }

                const row = document.createElement('div');
                row.className = "sortable-row flex flex-col py-2 px-3 bg-gray-900/40 border border-gray-800/60 rounded-xl gap-2 transition-colors hover:border-gray-700";
                row.setAttribute('data-id', mediaId);

                let selectOptions = '';
                timeSlots.forEach((time, slotIdx) => {
                    selectOptions += `<option value="${slotIdx}" ${slotIdx === currentTimeSlotIdx ? 'selected' : ''}>${time}</option>`;
                });

                row.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-grow max-w-[70%]">
                            <div class="cursor-grab text-gray-600 hover:text-emerald-400 font-mono text-xs select-none">☰</div>
                            <input type="text" data-id="${mediaId}" class="media-title-input bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 focus:outline-none text-xs font-bold text-gray-200 py-0.5 w-full rounded" value="${staticData.title}">
                        </div>
                        <button data-id="${mediaId}" class="delete-item-btn text-gray-600 hover:text-red-400 p-0.5 transition-colors text-[10px]" title="Remover">
                            Remover
                        </button>
                    </div>
                    <div class="flex items-center justify-between border-t border-gray-800/50 pt-1.5 mt-0.5">
                        <select data-index="${index}" class="time-table-select bg-gray-950 border border-gray-800 text-gray-300 font-medium text-[11px] rounded-md px-1.5 py-0.5 cursor-pointer focus:outline-none">
                            ${selectOptions}
                        </select>
                        <span class="text-[10px] font-mono font-bold ${intervalMinutes < 0 ? 'text-red-400' : 'text-emerald-500'} bg-gray-950/80 px-2 py-0.5 rounded-md border border-gray-800/60">
                            ${index === currentSequenceState.length - 1 ? 'Final' : formatIntervalText(intervalMinutes)}
                        </span>
                    </div>
                `;
                container.appendChild(row);
            });

            // Listeners da tabela
            document.querySelectorAll('.media-title-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    masterVideosData[id].title = e.target.value;
                    renderChart();
                    syncStateToUrl();
                });
            });

            document.querySelectorAll('.delete-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idToDelete = e.target.getAttribute('data-id');
                    currentSequenceState = currentSequenceState.filter(item => item[0] !== idToDelete);
                    renderChart();
                    renderTable();
                    syncStateToUrl();
                });
            });

            document.querySelectorAll('.time-table-select').forEach(el => {
                el.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    const newVal = parseInt(e.target.value, 10);
                    currentSequenceState[idx][1] = newVal;
                    renderChart();
                    renderTable();
                    syncStateToUrl();
                });
            });

            if(currentSequenceState.length > 0) {
                sortable('#tableContainer', {
                    items: '.sortable-row',
                    placeholderClass: 'sortable-placeholder'
                })[0].addEventListener('sortupdate', function() {
                    const rows = container.querySelectorAll('.sortable-row');
                    const newSequence = [];
                    rows.forEach((row) => {
                        const id = row.getAttribute('data-id');
                        const currentItem = currentSequenceState.find(d => d[0] === id);
                        newSequence.push([id, currentItem[1]]);
                    });
                    currentSequenceState = newSequence;
                    renderChart();
                    renderTable();
                    syncStateToUrl();
                });
            }
        }

        function renderChart() {
            if (chartInstance) chartInstance.destroy();

            // Mapeamento matemático invertido: Intervalo menor = Ponto mais alto
            const maxIntervalLimit = 240; // 4 horas base de teto máximo de escala
            
            const chartData = currentSequenceState.map((item, index) => {
                if (index === currentSequenceState.length - 1) return 30; // Valor base neutro para o último item
                
                const currentMinutes = timeToMinutes(item[1]);
                const nextMinutes = timeToMinutes(currentSequenceState[index + 1][1]);
                const interval = nextMinutes - currentMinutes;

                // Evita valores negativos no gráfico se houver colisão de horários incorreta na ordenação
                if (interval <= 0) return maxIntervalLimit; 

                // INVERSÃO: Subtrai o intervalo real do teto. Ex: se for 15m vira 225 (Alto). Se for 120m vira 120 (Baixo).
                return Math.max(10, maxIntervalLimit - interval);
            });

            const dynamicLabels = currentSequenceState.map((item, index) => {
                return `${index + 1}. ${masterVideosData[item[0]]?.title || ''} (${timeSlots[item[1]]})`;
            });

            // Criação da linha média constante (Distribuição Igualitária exata no meio)
            const middleLineArray = new Array(currentSequenceState.length).fill(maxIntervalLimit / 2);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dynamicLabels,
                    datasets: [
                        {
                            // Curva de Intervalos Invertida
                            data: chartData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.02)',
                            borderWidth: 3,
                            tension: 0.2,
                            pointBackgroundColor: '#059669',
                            pointBorderColor: '#34d399',
                            pointBorderWidth: 2,
                            pointRadius: 5,
                            fill: true,
                            order: 1
                        },
                        {
                            // Linha do Meio de Intervalos Distribuídos Igualmente
                            data: middleLineArray,
                            borderColor: 'rgba(156, 163, 175, 0.25)',
                            borderWidth: 2,
                            borderDash: [6, 6],
                            pointRadius: 0,
                            fill: false,
                            order: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#111827',
                            titleColor: '#34d399',
                            bodyColor: '#e5e7eb',
                            titleFont: { size: 11, weight: 'bold' },
                            padding: 8,
                            cornerRadius: 6,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    const idx = context[0].dataIndex;
                                    if(context[0].datasetIndex === 1) return "Linha de Referência Estável";
                                    
                                    if (idx === currentSequenceState.length - 1) return `${masterVideosData[currentSequenceState[idx][0]].title} (Encerramento do fluxo)`;
                                    
                                    const currMin = timeToMinutes(currentSequenceState[idx][1]);
                                    const nextMin = timeToMinutes(currentSequenceState[idx + 1][1]);
                                    return `${masterVideosData[currentSequenceState[idx][0]].title}\nEspera até o próximo: ${formatIntervalText(nextMin - currMin)}`;
                                },
                                label: function() { return ""; }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            grid: { color: '#1f2937' }, 
                            ticks: { color: '#9ca3af', font: { size: 10 } } 
                        },
                        y: {
                            grid: { color: '#1f2937' },
                            min: 0,
                            max: maxIntervalLimit,
                            ticks: {
                                color: '#6b7280',
                                font: { size: 9 },
                                stepSize: 60,
                                callback: function(value) {
                                    if (value === maxIntervalLimit) return "Alta Frequência (15m)";
                                    if (value === maxIntervalLimit / 2) return "Estável";
                                    if (value === 0) return "Baixa Frequência (+4h)";
                                    return "";
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- Eventos Globais ---
        document.getElementById('exportTextBtn').addEventListener('click', () => {
            if (currentSequenceState.length === 0) return alert('Nao ha itens para exportar.');
            const textLines = currentSequenceState.map((item, index) => {
                const title = masterVideosData[item[0]].title;
                const time = timeSlots[item[1]];
                let intervalStr = "";
                if (index < currentSequenceState.length - 1) {
                    const diff = timeToMinutes(currentSequenceState[index+1][1]) - timeToMinutes(item[1]);
                    intervalStr = ` (${formatIntervalText(diff)})`;
                }
                return `${index + 1}. ${time} - ${title}${intervalStr}`;
            });
            navigator.clipboard.writeText(textLines.join('\n')).then(() => {
                alert('Cronograma copiado!');
            });
        });

        document.getElementById('addMediaBtn').addEventListener('click', () => {
            const titleInput = document.getElementById('newMediaTitle');
            const title = titleInput.value.trim();
            if (!title) return alert('Informe um titulo.');

            const uniqueId = 'vid_' + Date.now();
            masterVideosData[uniqueId] = { title };
            
            // Coloca o novo item por padrão no último horário registrado ou no 0
            const lastTime = currentSequenceState.length > 0 ? currentSequenceState[currentSequenceState.length - 1][1] : 0;
            currentSequenceState.push([uniqueId, lastTime]);
            titleInput.value = '';

            renderChart();
            renderTable();
            syncStateToUrl();
        });

        document.getElementById('savePatternBtn').addEventListener('click', () => {
            const input = document.getElementById('newPatternName');
            const name = input.value.trim();
            if (!name) return alert('Nome invalido.');

            const customPatterns = getLocalPatterns();
            customPatterns[name] = currentSequenceState;
            saveLocalPatterns(customPatterns);
            
            updateSelectDropdownOptions();
            document.getElementById('patternSelect').value = `custom_${name}`;
            input.value = '';
            syncStateToUrl();
        });

        document.getElementById('deletePatternBtn').addEventListener('click', () => {
            const selector = document.getElementById('patternSelect');
            const currentPattern = selector.value;
            if (!currentPattern.startsWith('custom_')) return;
            const customKey = currentPattern.replace('custom_', '');
            if (confirm(`Excluir padrao "${customKey}"?`)) {
                const customPatterns = getLocalPatterns();
                delete customPatterns[customKey];
                saveLocalPatterns(customPatterns);
                updateSelectDropdownOptions();
                selector.value = 'instagram';
                currentSequenceState = JSON.parse(JSON.stringify(basePatterns['instagram']));
                renderChart();
                renderTable();
                syncStateToUrl();
            }
        });

        document.getElementById('patternSelect').addEventListener('change', (e) => {
            const selected = e.target.value;
            if (selected.startsWith('custom_')) {
                const customKey = selected.replace('custom_', '');
                const customPatterns = getLocalPatterns();
                if (customPatterns[customKey]) currentSequenceState = JSON.parse(JSON.stringify(customPatterns[customKey]));
            } else {
                currentSequenceState = JSON.parse(JSON.stringify(basePatterns[selected]));
            }
            renderChart();
            renderTable();
            syncStateToUrl();
        });

        // --- Inicialização ---
        updateSelectDropdownOptions();
        const initialState = parseUrlOrStorageState();
        document.getElementById('patternSelect').value = initialState.pattern;
        currentSequenceState = initialState.data;

        renderChart();
        renderTable();
        syncStateToUrl();
    </script>
</body>
</html>
