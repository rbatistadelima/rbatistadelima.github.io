<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NES Pixel Art Converter</title>
<style>
body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: monospace;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

#ui {
    width: 320px;
    padding: 12px;
    background: #1b1b1b;
    box-sizing: border-box;
    overflow-y: auto;
}

canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    flex: 1;
}

label {
    display: block;
    margin-top: 10px;
}

input, select, textarea {
    width: 100%;
    margin-top: 4px;
}
</style>
</head>
<body>

<div id="ui">
<h3>NES Pixel Converter</h3>

<label>Pixel Size
<input id="pixelSize" type="range" min="1" max="20" value="4">
</label>

<label>Color Reduction Level
<input id="colorReduction" type="range" min="0" max="6" value="0">
</label>

<label>X Offset
<input id="offsetX" type="range" min="-200" max="200" value="0">
</label>

<label>Y Offset
<input id="offsetY" type="range" min="-200" max="200" value="0">
</label>

<label>Palette
<select id="palette">
<option value="nesBright">NES Bright</option>
<option value="nesClassic">NES Classic</option>
<option value="gameboy">GameBoy</option>
<option value="arcade">Arcade RGB</option>
<option value="custom">Custom</option>
</select>
</label>

<label>Custom Palette (one RGB per line)
<textarea id="customPalette" rows="6">255,0,0
0,255,0
0,0,255
255,255,255
0,0,0</textarea>
</label>

<label>Dithering
<select id="dither">
<option value="none">None</option>
<option value="fs">Floyd-Steinberg</option>
<option value="ordered">Ordered 4x4</option>
<option value="hybrid">NES Hybrid</option>
</select>
</label>

<small>Paste image (Ctrl+V)</small>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
ctx.imageSmoothingEnabled = false;

let offscreen = document.createElement("canvas");
let offctx = offscreen.getContext("2d", { willReadFrequently: true });

let imgData = null;

const UI = {
    pixelSize: document.getElementById("pixelSize"),
    colorReduction: document.getElementById("colorReduction"),
    offsetX: document.getElementById("offsetX"),
    offsetY: document.getElementById("offsetY"),
    palette: document.getElementById("palette"),
    customPalette: document.getElementById("customPalette"),
    dither: document.getElementById("dither"),
};

function setSize(w, h) {
    canvas.width = w;
    canvas.height = h;
}

function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
}

/* =========================
   PALETTES
========================= */
const PALETTES = {
    nesBright: [
        [124, 124, 124],[0,0,252],[0,0,188],[68,40,188],
        [148,0,132],[168,0,32],[168,16,0],[136,20,0],
        [80,48,0],[0,120,0],[0,104,0],[0,88,0],
        [0,64,88],[0,0,0],[188,188,188],[255,255,255]
    ],
    nesClassic: [
        [84,84,84],[0,30,116],[8,16,144],[48,0,136],
        [68,0,100],[92,0,48],[84,4,0],[60,24,0],
        [32,42,0],[8,58,0],[0,64,0],[0,60,60],
        [0,0,0],[152,150,152],[236,238,236],[255,255,255]
    ],
    gameboy: [
        [15,56,15],[48,98,48],[139,172,15],[155,188,15]
    ],
    arcade: [
        [255,0,60],[0,255,180],[80,120,255],[255,220,0],
        [255,80,255],[0,255,80],[255,140,0],[255,255,255],
        [0,0,0]
    ]
};

function parseCustomPalette() {
    return UI.customPalette.value
        .split("\n")
        .map(l => l.split(",").map(Number))
        .filter(p => p.length === 3);
}

function getPalette() {
    if (UI.palette.value === "custom") return parseCustomPalette();
    return PALETTES[UI.palette.value];
}

/* =========================
   COLOR DISTANCE
========================= */
function dist(a,b){
    return (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
}

function nearestColor(c, palette){
    let best = palette[0], bestD = Infinity;
    for (let p of palette){
        let d = dist(c,p);
        if (d < bestD){ bestD = d; best = p; }
    }
    return best;
}

/* =========================
   IMAGE PASTE
========================= */
window.addEventListener("paste", e => {
    const file = [...e.clipboardData.items]
        .find(i => i.type.includes("image"));

    if (!file) return;

    const img = new Image();
    img.onload = () => {
        offscreen.width = img.width;
        offscreen.height = img.height;
        offctx.drawImage(img,0,0);
        setSize(img.width, img.height);
        render();
    };

    img.src = URL.createObjectURL(file.getAsFile());
});

/* =========================
   PIPELINE
========================= */
function samplePixelData() {
    if (!offscreen.width) return null;

    const pixelSize = +UI.pixelSize.value;
    const ox = +UI.offsetX.value;
    const oy = +UI.offsetY.value;

    const w = offscreen.width;
    const h = offscreen.height;

    const img = offctx.getImageData(0,0,w,h).data;

    let sampled = [];

    for (let y=0; y<h; y+=pixelSize){
        for (let x=0; x<w; x+=pixelSize){

            let sx = clamp(x + ox, 0, w-1);
            let sy = clamp(y + oy, 0, h-1);

            let idx = (sy*w + sx)*4;

            sampled.push([
                img[idx],
                img[idx+1],
                img[idx+2]
            ]);
        }
    }

    return { sampled, gridW: Math.ceil(w/pixelSize), gridH: Math.ceil(h/pixelSize) };
}

/* =========================
   COLOR REDUCTION (GEOMETRIC)
========================= */
function reduceColors(colors){
    let level = +UI.colorReduction.value;
    if (level === 0) return colors;

    let freq = new Map();

    for (let c of colors){
        let k = c.join(",");
        freq.set(k,(freq.get(k)||0)+1);
    }

    let sorted = [...freq.entries()]
        .sort((a,b)=>b[1]-a[1])
        .map(e=>e[0].split(",").map(Number));

    let targetSize = Math.max(2, Math.floor(sorted.length / Math.pow(2, level)));

    let reduced = sorted.slice(0,targetSize);

    return colors.map(c => nearestColor(c,reduced));
}

/* =========================
   DITHERING
========================= */
function orderedThreshold(x,y){
    const bayer = [
        [0,8,2,10],
        [12,4,14,6],
        [3,11,1,9],
        [15,7,13,5]
    ];
    return bayer[y%4][x%4] / 16;
}

function applyDither(pixels, w, h, palette){
    const mode = UI.dither.value;
    let out = pixels.map(p => [...p]);

    if (mode === "none") {
        return out.map(p => nearestColor(p,palette));
    }

    if (mode === "ordered") {
        return out.map((p,i)=>{
            let x = i % w;
            let y = Math.floor(i / w);
            let t = orderedThreshold(x,y);
            let c = p.map(v => v + (t*32 - 16));
            return nearestColor(c,palette);
        });
    }

    if (mode === "fs" || mode === "hybrid") {
        let arr = out.map(p=>p.slice());

        for (let y=0;y<h;y++){
            for (let x=0;x<w;x++){
                let i = y*w+x;
                let old = arr[i];
                let newC = nearestColor(old,palette);

                let err = [
                    old[0]-newC[0],
                    old[1]-newC[1],
                    old[2]-newC[2]
                ];

                arr[i] = newC;

                let spread = (mode==="hybrid") ? 0.5 : 1;

                function add(ix,iy,f){
                    if (ix<0||iy<0||ix>=w||iy>=h) return;
                    let j = iy*w+ix;
                    arr[j][0]+=err[0]*f*spread;
                    arr[j][1]+=err[1]*f*spread;
                    arr[j][2]+=err[2]*f*spread;
                }

                add(x+1,y,7/16);
                add(x-1,y+1,3/16);
                add(x,y+1,5/16);
                add(x+1,y+1,1/16);
            }
        }

        return arr.map(p=>nearestColor(p,palette));
    }

    return pixels;
}

/* =========================
   RENDER
========================= */
function render(){
    if (!offscreen.width) return;

    const { sampled, gridW, gridH } = samplePixelData();
    const reduced = reduceColors(sampled);

    const palette = getPalette();
    const final = applyDither(reduced, gridW, gridH, palette);

    const pixelSize = +UI.pixelSize.value;

    setSize(offscreen.width, offscreen.height);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    let i = 0;

    for (let y=0;y<gridH;y++){
        for (let x=0;x<gridW;x++){
            let c = final[i++];

            ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.fillRect(
                x*pixelSize,
                y*pixelSize,
                pixelSize,
                pixelSize
            );
        }
    }
}

/* =========================
   LIVE UPDATE
========================= */
document.querySelectorAll("input,select,textarea")
.forEach(el => el.addEventListener("input", render));
</script>

</body>
</html>
