<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <!-- MQTT Library for Signaling over WebSockets -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Connecting to network...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="nextStranger()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Unique Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;
    const myId = 'user_' + Math.random().toString(36).substring(2, 9);

    let mqttClient = null;
    let pc = null;
    let dataChannel = null;
    let targetId = null;
    let isConnected = false;
    let searchInterval = null;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
        ]
    };

    const TOPIC_GLOBAL = 'github-pages-webrtc-chat-v1/global';
    const TOPIC_SIGNAL = 'github-pages-webrtc-chat-v1/signal/' + myId;

    function initSignaling() {
        statusText.textContent = 'Connecting to signaling broker...';
        
        // Connect to public MQTT WebSocket broker
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
            clientId: 'mqtt_' + myId,
            clean: true
        });

        mqttClient.on('connect', () => {
            statusText.textContent = 'Connected to network. Searching...';
            mqttClient.subscribe(TOPIC_SIGNAL, (err) => {
                if (!err) startMatchmaking();
            });
        });

        mqttClient.on('message', async (topic, payload) => {
            try {
                const msg = JSON.parse(payload.toString());
                if (msg.sender === myId || isConnected) return;

                // Matchmaking broadcast received
                if (topic === TOPIC_GLOBAL && msg.type === 'search' && !targetId) {
                    targetId = msg.sender;
                    if (searchInterval) clearInterval(searchInterval);

                    // Deterministic rule: higher ID is the caller (offerer)
                    if (myId > targetId) {
                        statusText.textContent = 'Connecting to stranger...';
                        startCall();
                    } else {
                        statusText.textContent = 'Waiting for stranger to connect...';
                        mqttClient.publish(TOPIC_SIGNAL, JSON.stringify({ type: 'ack', sender: myId, target: targetId }));
                    }
                }

                // Personal signal received
                if (topic === TOPIC_SIGNAL) {
                    if (msg.type === 'ack' && !targetId) {
                        targetId = msg.sender;
                        if (searchInterval) clearInterval(searchInterval);
                        statusText.textContent = 'Connecting to stranger...';
                        startCall();
                    }

                    if (!pc) createPeerConnection();

                    if (msg.type === 'offer') {
                        targetId = msg.sender;
                        if (searchInterval) clearInterval(searchInterval);
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        mqttClient.publish('github-pages-webrtc-chat-v1/signal/' + targetId, JSON.stringify({ type: 'answer', answer, sender: myId }));
                    } else if (msg.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
                    } else if (msg.type === 'candidate' && msg.candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } catch (e) {
                            console.error('ICE candidate error', e);
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT error:', err);
            statusText.textContent = 'Signaling error. Retrying...';
        });
    }

    function startMatchmaking() {
        if (isConnected) return;
        cleanupConnection();
        statusText.textContent = 'Searching for partner...';
        nextBtn.disabled = false;

        mqttClient.subscribe(TOPIC_GLOBAL);
        broadcastSearch();

        if (searchInterval) clearInterval(searchInterval);
        searchInterval = setInterval(() => {
            if (!isConnected && !targetId) {
                broadcastSearch();
            }
        }, 2000);
    }

    function broadcastSearch() {
        if (mqttClient && mqttClient.connected && !isConnected && !targetId) {
            mqttClient.publish(TOPIC_GLOBAL, JSON.stringify({ type: 'search', sender: myId }));
        }
    }

    function createPeerConnection() {
        if (pc) return;
        pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (event) => {
            if (event.candidate && targetId) {
                mqttClient.publish('github-pages-webrtc-chat-v1/signal/' + targetId, JSON.stringify({ type: 'candidate', candidate: event.candidate, sender: myId }));
            }
        };

        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannel();
        };
    }

    async function startCall() {
        if (searchInterval) clearInterval(searchInterval);
        createPeerConnection();
        dataChannel = pc.createDataChannel('chat');
        setupDataChannel();

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            mqttClient.publish('github-pages-webrtc-chat-v1/signal/' + targetId, JSON.stringify({ type: 'offer', offer, sender: myId }));
        } catch (err) {
            console.error('Offer error:', err);
        }
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            if (searchInterval) clearInterval(searchInterval);
            isConnected = true;
            statusText.textContent = 'Connected!';
            appendSystemMessage('Connected to a stranger.');
            toggleInputs(true);
            
            // Exchange names
            dataChannel.send(JSON.stringify({ type: 'name', name: myName }));
        };

        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'name') {
                    appendSystemMessage(`You are chatting with: ${data.name}`);
                }
            } catch {
                appendMessage(event.data, 'received');
            }
        };

        dataChannel.onclose = () => {
            handleDisconnect();
        };
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(text);
            appendMessage(text, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(startMatchmaking, 1500);
    }

    function nextStranger() {
        cleanupConnection();
        startMatchmaking();
    }

    function cleanupConnection() {
        isConnected = false;
        targetId = null;
        if (searchInterval) clearInterval(searchInterval);
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (pc) { pc.close(); pc = null; }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.onload = initSignaling;
</script>

</body>
</html>
