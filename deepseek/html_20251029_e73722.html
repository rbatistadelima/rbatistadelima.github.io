<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Text Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .scene-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #scene {
            width: 100%;
            height: 100%;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-3d {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-container {
            position: relative;
            display: inline-block;
            margin: 0 20px;
            transform-style: preserve-3d;
        }

        .letter-face {
            position: absolute;
            backface-visibility: hidden;
            font-weight: bold;
            text-align: center;
            color: #ff8a00;
            font-size: 100px;
            transform: translateZ(20px);
        }

        .letter-side {
            position: absolute;
            font-weight: bold;
            text-align: center;
            font-size: 100px;
            transform-origin: 0 0;
        }

        .controls {
            width: 350px;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff8a00;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff8a00;
            cursor: pointer;
        }

        .value-display {
            display: inline-block;
            width: 50px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 5px;
            margin-left: 10px;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            transform: scale(1.2);
            box-shadow: 0 0 10px white;
        }

        /* 3D Handlers */
        .handler-container {
            position: absolute;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .axis-handler {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
            pointer-events: all;
            user-select: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .axis-handler:hover {
            transform: scale(1.2);
        }

        .x-handler {
            background: rgba(255, 50, 50, 0.8);
            color: white;
            transform: translateX(120px);
        }

        .y-handler {
            background: rgba(50, 255, 50, 0.8);
            color: white;
            transform: translateY(-120px);
        }

        .z-handler {
            background: rgba(50, 50, 255, 0.8);
            color: white;
            transform: translateZ(120px) rotateX(90deg);
        }

        .axis-line {
            position: absolute;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.3);
            transform-origin: center bottom;
        }

        .x-line {
            background: rgba(255, 50, 50, 0.5);
            transform: rotateZ(90deg) translateY(-120px);
        }

        .y-line {
            background: rgba(50, 255, 50, 0.5);
            transform: translateY(-120px);
        }

        .z-line {
            background: rgba(50, 50, 255, 0.5);
            transform: rotateX(90deg) translateY(-120px);
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            
            .controls {
                width: 100%;
                height: 300px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .scene-container {
                height: calc(100vh - 300px);
            }
            
            .letter-container {
                margin: 0 15px;
            }
            
            .letter-face, .letter-side {
                font-size: 70px;
            }
            
            .handler-container {
                transform: scale(0.8);
            }
        }

        @media (max-width: 600px) {
            .letter-container {
                margin: 0 10px;
            }
            
            .letter-face, .letter-side {
                font-size: 50px;
            }
            
            .handler-container {
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>
    <div class="scene-container">
        <div id="scene">
            <div class="text-3d" id="text3d">
                <!-- 3D text will be generated here -->
            </div>
            
            <!-- 3D Handlers -->
            <div class="handler-container" id="handlerContainer">
                <div class="axis-line x-line"></div>
                <div class="axis-line y-line"></div>
                <div class="axis-line z-line"></div>
                
                <div class="axis-handler x-handler" id="xHandler">X</div>
                <div class="axis-handler y-handler" id="yHandler">Y</div>
                <div class="axis-handler z-handler" id="zHandler">Z</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <h2>Text Content</h2>
            <input type="text" id="textInput" value="3D TEXT" placeholder="Enter your text here">
        </div>

        <div class="control-group">
            <h2>3D Properties</h2>
            <label for="depthSlider">Depth: <span id="depthValue" class="value-display">30</span>px</label>
            <input type="range" id="depthSlider" min="10" max="100" value="30">

            <label for="letterSpacing">Letter Spacing: <span id="spacingValue" class="value-display">20</span>px</label>
            <input type="range" id="letterSpacing" min="5" max="40" value="20">
        </div>

        <div class="control-group">
            <h2>Color</h2>
            <div class="color-picker">
                <div class="color-option active" style="background: linear-gradient(135deg, #ff8a00, #da1b60);" data-front="#ff8a00" data-side="#da1b60"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00c6ff, #0072ff);" data-front="#00c6ff" data-side="#0072ff"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #00ff88, #00c850);" data-front="#00ff88" data-side="#00c850"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #ff0080, #b3005e);" data-front="#ff0080" data-side="#b3005e"></div>
                <div class="color-option" style="background: linear-gradient(135deg, #8a2be2, #5a1bb0);" data-front="#8a2be2" data-side="#5a1bb0"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const textInput = document.getElementById('textInput');
        const text3d = document.getElementById('text3d');
        const depthSlider = document.getElementById('depthSlider');
        const depthValue = document.getElementById('depthValue');
        const letterSpacing = document.getElementById('letterSpacing');
        const spacingValue = document.getElementById('spacingValue');
        const colorOptions = document.querySelectorAll('.color-option');
        
        // 3D Handlers
        const handlerContainer = document.getElementById('handlerContainer');
        const xHandler = document.getElementById('xHandler');
        const yHandler = document.getElementById('yHandler');
        const zHandler = document.getElementById('zHandler');

        // State variables
        let rotation = { x: 15, y: -15, z: 0 };
        let isDragging = false;
        let currentAxis = null;
        let startX, startY;

        // Initialize 3D text
        function init3DText() {
            update3DText();
            updateTextTransform();
            updateHandlerTransform();
        }

        // Update text content
        textInput.addEventListener('input', function() {
            update3DText();
        });

        // Update depth
        depthSlider.addEventListener('input', function() {
            const depth = this.value;
            depthValue.textContent = depth;
            update3DText();
        });

        // Update letter spacing
        letterSpacing.addEventListener('input', function() {
            const spacing = this.value;
            spacingValue.textContent = spacing;
            update3DText();
        });

        // Color selection
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                colorOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                update3DText();
            });
        });

        // Update 3D text geometry
        function update3DText() {
            const text = textInput.value || '3D TEXT';
            const depth = depthSlider.value;
            const spacing = letterSpacing.value;
            const activeColorOption = document.querySelector('.color-option.active');
            const frontColor = activeColorOption.getAttribute('data-front');
            const sideColor = activeColorOption.getAttribute('data-side');
            
            // Clear existing text
            text3d.innerHTML = '';
            
            // Create letters with proper spacing
            for (let i = 0; i < text.length; i++) {
                const letter = text[i];
                
                // Skip spaces
                if (letter === ' ') {
                    const space = document.createElement('div');
                    space.style.display = 'inline-block';
                    space.style.width = `${spacing * 2}px`;
                    text3d.appendChild(space);
                    continue;
                }
                
                const letterContainer = document.createElement('div');
                letterContainer.classList.add('letter-container');
                letterContainer.style.margin = `0 ${spacing}px`;
                
                // Create front face
                const frontFace = document.createElement('div');
                frontFace.classList.add('letter-face');
                frontFace.textContent = letter;
                frontFace.style.color = frontColor;
                frontFace.style.background = `linear-gradient(135deg, ${frontColor}, ${adjustColor(frontColor, -20)})`;
                frontFace.style.backgroundClip = 'text';
                frontFace.style.webkitBackgroundClip = 'text';
                frontFace.style.webkitTextFillColor = 'transparent';
                
                letterContainer.appendChild(frontFace);
                
                // Create side faces
                for (let j = 0; j < depth; j++) {
                    const sideFace = document.createElement('div');
                    sideFace.classList.add('letter-side');
                    sideFace.textContent = letter;
                    sideFace.style.color = adjustColor(sideColor, -j * 0.5);
                    sideFace.style.transform = `translateZ(${j - depth/2}px)`;
                    sideFace.style.background = `linear-gradient(135deg, ${adjustColor(sideColor, -j * 0.5)}, ${adjustColor(sideColor, -j * 0.5 - 10)})`;
                    sideFace.style.backgroundClip = 'text';
                    sideFace.style.webkitBackgroundClip = 'text';
                    sideFace.style.webkitTextFillColor = 'transparent';
                    
                    letterContainer.appendChild(sideFace);
                }
                
                text3d.appendChild(letterContainer);
            }
            
            updateTextTransform();
        }

        // Update text transform based on rotation state
        function updateTextTransform() {
            text3d.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) rotateZ(${rotation.z}deg)`;
            updateHandlerTransform();
        }

        // Update handler transform to match text rotation
        function updateHandlerTransform() {
            handlerContainer.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) rotateZ(${rotation.z}deg)`;
        }

        // Helper function to adjust color brightness
        function adjustColor(color, amount) {
            if (color.startsWith('#')) {
                color = color.replace(/^#/, '');
                if (color.length === 3) {
                    color = color[0] + color[0] + color[1] + color[1] + color[2] + color[2];
                }
                
                let r = parseInt(color.substr(0, 2), 16);
                let g = parseInt(color.substr(2, 2), 16);
                let b = parseInt(color.substr(4, 2), 16);
                
                r = Math.max(0, Math.min(255, r + amount));
                g = Math.max(0, Math.min(255, g + amount));
                b = Math.max(0, Math.min(255, b + amount));
                
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
            }
            
            return color;
        }

        // Handler mouse events
        function setupHandlerEvents() {
            [xHandler, yHandler, zHandler].forEach(handler => {
                handler.addEventListener('mousedown', startDrag);
                handler.addEventListener('touchstart', startDrag);
            });
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            currentAxis = e.target.id.replace('Handler', '').toUpperCase();
            
            if (e.type === 'mousedown') {
                startX = e.clientX;
                startY = e.clientY;
            } else {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        }

        function drag(e) {
            if (!isDragging) return;
            
            e.preventDefault();
            let currentX, currentY;
            
            if (e.type === 'mousemove') {
                currentX = e.clientX;
                currentY = e.clientY;
            } else {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            }
            
            const deltaX = currentX - startX;
            const deltaY = currentY - startY;
            
            // Adjust rotation based on axis and mouse movement
            switch(currentAxis) {
                case 'X':
                    rotation.x += deltaY * 0.5;
                    break;
                case 'Y':
                    rotation.y += deltaX * 0.5;
                    break;
                case 'Z':
                    rotation.z += deltaX * 0.5;
                    break;
            }
            
            // Update start position for next movement
            startX = currentX;
            startY = currentY;
            
            updateTextTransform();
        }

        function stopDrag() {
            isDragging = false;
            currentAxis = null;
        }

        // Initialize
        init3DText();
        setupHandlerEvents();
    </script>
</body>
</html>
