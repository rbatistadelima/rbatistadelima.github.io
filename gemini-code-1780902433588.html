<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TTS Lab — Fila Estável com Kaori API</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <style>
        html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
        body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
        textarea{width:90%;max-width:980px;height:140px;background:#121214;color:#fff;border:0;padding:10px;border-radius:4px;}
        .karaoke{width:90%;max-width:980px;background:#141417;padding:14px;border-radius:8px;min-height:120px;box-sizing:border-box;}
        button{background:#222;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;}
        button:hover{background:#333;}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .status{font-size:0.9rem;color:#aaa;}
    </style>

    <script>
        /* ---------------- GLOBAL LOCK ---------------- */
        let audioLock = Promise.resolve();
        function lock(fn){  
            audioLock = audioLock.then(fn);  
            return audioLock;
        }

        /* ---------------- AUDIO CONTEXT UNIFICADO ---------------- */
        let globalAudioCtx = null;
        function getAudioContext() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return globalAudioCtx;
        }

        /* ---------------- DIAGNÓSTICO INICIAL ---------------- */
        function initSystem(){
            document.getElementById("status").innerText = "Motores de áudio prontos ✔";
            document.getElementById("btn-play").disabled = false;
        }
        window.addEventListener("DOMContentLoaded", initSystem);

        /* ---------------- KAORI SPEAK (API/STREAM FIX) ---------------- */
        // Se a sua API da Kaori exigir um método POST, ajuste o fetch abaixo conforme a sua documentação.
        function kaoriSpeak(text) {
            return lock(() => new Promise(async (resolve) => {
                try {
                    // SUBSTITUA PELA URL REAL DA SUA API DA KAORI
                    // Exemplo genérico de rota de API que retorna o áudio direto ou JSON:
                    const apiUrl = `https://api.exemplo.com/kaori/tts?text=${encodeURIComponent(text)}`;
                    
                    const ctx = getAudioContext();
                    if (ctx.state === 'suspended') await ctx.resume();

                    // Busca o arquivo de áudio gerado pela API externa
                    const response = await fetch(apiUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    
                    // Decodifica o áudio recebido para dentro do pipeline do Web Audio API
                    ctx.decodeAudioData(arrayBuffer, (audioBuffer) => {
                        const src = ctx.createBufferSource();
                        src.buffer = audioBuffer;
                        src.connect(ctx.destination);
                        
                        src.onended = () => {
                            src.disconnect();
                            resolve(); // Libera a fila apenas quando o áudio físico terminar
                        };
                        src.start(0);
                    }, (err) => {
                        console.error("Erro ao decodificar áudio da Kaori:", err);
                        resolve(); // Evita travar a fila se o áudio vier corrompido
                    });

                } catch (error) {
                    console.error("Falha na requisição da API Kaori:", error);
                    // Fallback imediato se a API falhar ou der erro de CORS no modo file://
                    logger("Sistema", "Kaori offline/CORS. Usando fallback nativo...");
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = "pt-BR";
                    u.onend = resolve;
                    u.onerror = resolve;
                    speechSynthesis.speak(u);
                }
            }));
        }

        /* ---------------- VOICES NATIVAS ---------------- */
        let voices = [];
        function updateVoices() { voices = speechSynthesis.getVoices(); }
        updateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = updateVoices;
        }

        function pickFemale(){  
            return voices.find(v=>/female|luciana|google|maria/i.test(v.name)) || voices.find(v=>v.lang?.includes("pt")) || voices[0];
        }

        function pickMale(){  
            return voices.find(v=>/male|daniel|francis/i.test(v.name)) || voices.find(v=>v.lang?.includes("pt")) || voices[0];
        }

        /* ---------------- SYNTH NATIVO (LOCKED) ---------------- */
        function speakBrowser(text, voice){  
            return lock(() => new Promise(r => {    
                speechSynthesis.cancel(); // Previne travamentos residuais do Chrome

                const u = new SpeechSynthesisUtterance(text);    
                if(voice) u.voice = voice;    
                u.lang = "pt-BR";

                const fallbackTimeout = setTimeout(() => { r(); }, (text.length * 80) + 3000);

                u.onend = () => { clearTimeout(fallbackTimeout); r(); };    
                u.onerror = () => { clearTimeout(fallbackTimeout); r(); };

                speechSynthesis.speak(u);  
            }));
        }

        /* ---------------- OTHER SERVICES ---------------- */
        function googleTTS(text){  
            return lock(() => new Promise(r => {    
                const a = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=pt-BR&client=tw-ob");    
                a.onended = r;    
                a.onerror = r;
                a.play().catch(r);  
            }));
        }

        function rv(text){  
            return lock(() => new Promise(r => {    
                responsiveVoice.speak(text, "Brazilian Portuguese Female", { onend: r, onerror: r });  
            }));
        }

        /* ---------------- ROUTER ---------------- */
        function speak(name, text){
            const n = name.toLowerCase();
            
            if(n.includes("kaori")) return kaoriSpeak(text);  
            if(n==="ana") return rv(text);  
            if(n==="regina") return googleTTS(text);
            if(n==="daniel") return speakBrowser(text, pickMale());  
            
            return speakBrowser(text, pickFemale());
        }

        /* ---------------- FLOW ---------------- */
        function logger(name, text) {
            document.getElementById("karaoke").innerHTML = `<b>${name}:</b> ${text}`;
        }

        async function start(){
            document.getElementById("btn-play").disabled = true;
            
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') await ctx.resume();

            const lines = document.getElementById("texto").value.split("\n").filter(Boolean);
            
            for(const line of lines){
                const m = line.match(/^([^:]+):\s*(.*)$/);    
                if(!m) continue;
                
                const name = m[1].trim();    
                const text = m[2].trim();    
                
                logger(name, text);
                await speak(name, text);  
                
                await new Promise(r => setTimeout(r, 200)); // Respiro entre canais
            }
            
            document.getElementById("btn-play").disabled = false;
        }
        
        window.start = start;
    </script>
</head>
<body>
    <div class="status" id="status">Inicializando...</div>
    <textarea id="texto">Daniel: Eu não devo mais interromper Kaori.
Maria: Voz estável.
Regina: Google TTS sincronizado.
Ana: ResponsiveVoice ativo.
Kaori: Agora eu sou chamada via API de áudio e sigo a fila perfeitamente.
Daniel: Agora está tudo em fila correta.</textarea>
    <div class="karaoke" id="karaoke"></div>
    <button id="btn-play" onclick="start()" disabled>▶ Play</button>
</body>
</html>
