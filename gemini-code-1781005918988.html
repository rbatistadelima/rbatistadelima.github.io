<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz Dinâmica Proporcional de Mídias</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plugin DragData para Chart.js (Arrastar Eixo Y) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-dragdata@2.2.4/dist/chartjs-plugin-dragdata.min.js"></script>
    <!-- HTML5 Sortable para arrastar linhas da tabela -->
    <script src="https://cdn.jsdelivr.net/npm/html5sortable@0.13.0/dist/html5sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #111827; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #059669; border-radius: 4px; }
        .sortable-placeholder {
            background: rgba(16, 185, 129, 0.05);
            border: 2px dashed #10b981;
            border-radius: 8px;
            height: 52px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen flex flex-col justify-between p-4 gap-3 select-none">

    <!-- Header Fixo -->
    <header class="bg-gray-900 rounded-xl px-5 py-3 flex flex-col xl:flex-row justify-between items-center gap-4 border border-gray-800 shrink-0 shadow-lg">
        <div class="w-full xl:w-auto">
            <h1 class="text-base font-black text-white tracking-wide uppercase flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                Matriz de Sincronismo Temporal
            </h1>
        </div>
        
        <div class="flex flex-wrap items-center gap-4 w-full xl:w-auto justify-end">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Padrão:</span>
                <select id="patternSelect" class="bg-gray-950 border border-gray-700 text-emerald-400 font-bold text-xs rounded-xl focus:ring-2 focus:ring-emerald-500 p-2 cursor-pointer min-w-[240px] shadow-inner">
                    <optgroup label="Padrões do Sistema">
                        <option value="instagram">🔥 Algoritmo Instagram (Picos)</option>
                        <option value="abertura">✨ Abertura Rápida (Foco Inicial)</option>
                        <option value="continuo">🕒 Distribuição Linear (1h em 1h)</option>
                    </optgroup>
                    <optgroup label="Meus Padrões Salvos" id="localPatternsGroup">
                        <!-- Inseridos via JS -->
                    </optgroup>
                </select>
                <button id="deletePatternBtn" class="hidden bg-red-950 border border-red-800 text-red-400 hover:bg-red-900 px-2 py-1.5 text-xs font-bold rounded-lg transition-colors">
                    Excluir
                </button>
            </div>

            <div class="h-6 w-[1px] bg-gray-800 hidden sm:block"></div>

            <div class="flex items-center gap-2">
                <input type="text" id="newPatternName" placeholder="Nome do padrão..." class="bg-gray-950 border border-gray-700 rounded-xl px-3 py-1.5 text-xs font-semibold text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 w-44">
                <button id="savePatternBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-2 rounded-xl transition-colors shadow-md">
                    💾 Salvar Local
                </button>
            </div>
        </div>
    </header>

    <!-- Workspace -->
    <main class="flex-grow grid grid-cols-12 gap-3 min-h-0">
        
        <!-- Bloco do Gráfico Dinâmico (Esquerda) -->
        <section class="col-span-5 bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col relative shadow-xl overflow-hidden">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 block">Visualização Proporcional</span>
            <div class="flex-grow relative w-full h-full min-h-0">
                <canvas id="syncLineChart"></canvas>
            </div>
        </section>

        <!-- Bloco da Tabela Reordenável e Gerenciável (Direita) -->
        <section class="col-span-7 bg-gray-900 rounded-xl border border-gray-800 p-4 flex flex-col shadow-xl overflow-hidden">
            
            <!-- Inserção de Novo Item -->
            <div class="bg-gray-950 border border-gray-800 rounded-xl p-2.5 mb-3 flex items-center gap-2 shrink-0">
                <input type="text" id="newMediaTitle" placeholder="Título do novo item..." class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs font-medium text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 flex-grow">
                <input type="text" id="newMediaTip" placeholder="Descrição curta (opcional)..." class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs font-medium text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 w-1/3">
                <button id="addMediaBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs px-4 py-2 rounded-lg transition-colors shadow-md shrink-0">
                    ＋ Adicionar
                </button>
            </div>

            <div class="flex justify-between items-center pb-2 border-b border-gray-800 shrink-0">
                <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">Sequência Cronológica</span>
                <span class="text-[9px] text-gray-500 uppercase font-mono">Sincronização em tempo real</span>
            </div>
            
            <!-- Listagem Reordenável -->
            <div id="tableContainer" class="flex-grow overflow-y-auto custom-scroll mt-2 pr-1 space-y-1">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </section>

    </main>

    <!-- Footer Fixo -->
    <footer class="flex justify-between items-center text-[10px] text-gray-600 px-1 shrink-0 font-medium">
        <div>Painel de Controle Operacional</div>
        <div class="tracking-wider uppercase text-emerald-600 font-bold">Gerenciador de Cronograma</div>
    </footer>

    <script>
        const ctx = document.getElementById('syncLineChart').getContext('2d');
        let chartInstance;

        const timeSlots = [
            "10:00", "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45",
            "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45",
            "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45",
            "16:00", "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45",
            "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:45", "20:00"
        ];

        // Mapeamento dinâmico unificado em memória ram
        let masterVideosData = {
            "vid_0": { title: "Abertura do Dia", tip: "Conteúdo focado na introdução do cronograma diário." },
            "vid_1": { title: "Mídia de Contexto", tip: "Vídeo ou imagem situacional de contextualização." },
            "vid_2": { title: "Chamada Principal", tip: "Direcionamento estratégico focado em conversão ou engajamento." },
            "vid_3": { title: "Apresentação de Produto", tip: "Exibição em close-up do item ou serviço em foco." },
            "vid_4": { title: "Detalhes Técnicos", tip: "Demonstração de especificações, laudos ou validações." },
            "vid_5": { title: "Ação Institucional", tip: "Conteúdo focado na presença de mercado ou autoridade." },
            "vid_6": { title: "Acesso à Plataforma", tip: "Demonstração de usabilidade de sistemas ou aplicativos." },
            "vid_7": { title: "Interação com Público", tip: "Abordagem dinâmica focada no relacionamento direto." },
            "vid_8": { title: "Bastidores da Operação", tip: "Exibição do fluxo interno e equipe operacional." },
            "vid_9": { title: "Prova Social", tip: "Depoimento, feedback ou validação externa de terceiros." },
            "vid_10": { title: "Encerramento", tip: "Conclusão das atividades diárias e fechamento de fluxo." }
        };

        const basePatterns = {
            instagram: [["vid_0",0], ["vid_1",4], ["vid_2",8], ["vid_3",12], ["vid_4",16], ["vid_5",20], ["vid_6",24], ["vid_7",28], ["vid_8",32], ["vid_9",36], ["vid_10",40]],
            abertura:  [["vid_0",0], ["vid_1",1], ["vid_2",2], ["vid_3",12], ["vid_4",17], ["vid_5",22], ["vid_6",27], ["vid_7",32], ["vid_8",35], ["vid_9",38], ["vid_10",40]],
            continuo:  [["vid_0",0], ["vid_1",4], ["vid_2",8], ["vid_3",12], ["vid_4",16], ["vid_5",20], ["vid_6",24], ["vid_7",28], ["vid_8",32], ["vid_9",36], ["vid_10",40]]
        };

        let currentSequenceState = [];

        function getLocalPatterns() {
            const saved = localStorage.getItem('clean_drag_patterns');
            return saved ? JSON.parse(saved) : {};
        }

        function saveLocalPatterns(patterns) {
            localStorage.setItem('clean_drag_patterns', JSON.stringify(patterns));
        }

        function updateSelectDropdownOptions() {
            const localGroup = document.getElementById('localPatternsGroup');
            localGroup.innerHTML = '';
            const customPatterns = getLocalPatterns();
            Object.keys(customPatterns).forEach(key => {
                const option = document.createElement('option');
                option.value = `custom_${key}`;
                option.textContent = `📋 ${key}`;
                localGroup.appendChild(option);
            });
        }

        function syncStateToUrl() {
            const params = new URLSearchParams();
            const currentPattern = document.getElementById('patternSelect').value;
            params.set('pattern', currentPattern);
            
            // Salva mapeamento mestre atual na URL para evitar quebra ao deletar/adicionar e recarregar
            params.set('m_data', btoa(encodeURIComponent(JSON.stringify(masterVideosData))));

            currentSequenceState.forEach((item, i) => {
                params.set(`id${i}`, item[0]);
                params.set(`t${i}`, item[1]);
            });

            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
            
            const deleteBtn = document.getElementById('deletePatternBtn');
            currentPattern.startsWith('custom_') ? deleteBtn.classList.remove('hidden') : deleteBtn.classList.add('hidden');
        }

        function parseUrlOrStorageState() {
            const params = new URLSearchParams(window.location.search);
            const pattern = params.get('pattern') || 'instagram';
            
            const mDataParam = params.get('m_data');
            if (mDataParam) {
                try { masterVideosData = JSON.parse(decodeURIComponent(atob(mDataParam))); } catch(e){}
            }

            let constructedSequence = [];
            let i = 0;
            while(params.get(`id${i}`) !== null) {
                const idVal = params.get(`id${i}`);
                const timeVal = params.get(`t${i}`);
                if (masterVideosData[idVal]) {
                    constructedSequence.push([idVal, parseInt(timeVal, 10)]);
                }
                i++;
            }

            if (constructedSequence.length > 0) {
                return { pattern, data: constructedSequence };
            }

            if (pattern.startsWith('custom_')) {
                const customKey = pattern.replace('custom_', '');
                const customPatterns = getLocalPatterns();
                if (customPatterns[customKey]) return { pattern, data: JSON.parse(JSON.stringify(customPatterns[customKey])) };
            }

            return { pattern: 'instagram', data: JSON.parse(JSON.stringify(basePatterns['instagram'])) };
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '';

            currentSequenceState.forEach((item, index) => {
                const mediaId = item[0];
                const currentTimeSlotIdx = item[1];
                const staticData = masterVideosData[mediaId];

                const row = document.createElement('div');
                row.className = "sortable-row flex items-center justify-between py-2 px-3 bg-gray-900/40 border border-gray-800/60 rounded-xl gap-3 transition-colors hover:border-gray-700";
                row.setAttribute('data-id', mediaId);

                let selectOptions = '';
                timeSlots.forEach((time, slotIdx) => {
                    selectOptions += `<option value="${slotIdx}" ${slotIdx === currentTimeSlotIdx ? 'selected' : ''}>${time}</option>`;
                });

                row.innerHTML = `
                    <div class="flex items-center gap-3 flex-grow max-w-[65%]">
                        <div class="cursor-grab text-gray-600 hover:text-emerald-400 font-mono text-base tracking-tighter select-none px-1">☰</div>
                        <div class="truncate">
                            <span class="text-xs font-black text-white mr-1">${index + 1}.</span>
                            <span class="text-xs font-bold text-gray-200">${staticData.title}</span>
                            <p class="text-[10px] text-gray-400 truncate mt-0.5">${staticData.tip || 'Sem descrição'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <select data-index="${index}" class="time-table-select bg-gray-950 border border-gray-700 text-emerald-400 font-bold text-xs rounded-lg px-2 py-1.5 focus:ring-1 focus:ring-emerald-500 cursor-pointer">
                            ${selectOptions}
                        </select>
                        <button data-id="${mediaId}" class="delete-item-btn text-gray-600 hover:text-red-400 p-1 transition-colors rounded-md" title="Remover item">
                            🗑
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });

            // Handlers de exclusão de linhas
            document.querySelectorAll('.delete-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idToDelete = e.target.getAttribute('data-id');
                    currentSequenceState = currentSequenceState.filter(item => item[0] !== idToDelete);
                    renderChart();
                    renderTable();
                    syncStateToUrl();
                });
            });

            // Handlers de alteração de horas por select
            document.querySelectorAll('.time-table-select').forEach(el => {
                el.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    const newVal = parseInt(e.target.value, 10);
                    
                    currentSequenceState[idx][1] = newVal;
                    chartInstance.data.datasets[0].data = currentSequenceState.map(d => d[1]);
                    chartInstance.update();
                    syncStateToUrl();
                });
            });

            // Remapeamento físico por Drag & Drop
            if(currentSequenceState.length > 0) {
                sortable('#tableContainer', {
                    items: '.sortable-row',
                    placeholderClass: 'sortable-placeholder'
                })[0].addEventListener('sortupdate', function() {
                    const rows = container.querySelectorAll('.sortable-row');
                    const newSequence = [];
                    
                    rows.forEach((row) => {
                        const id = row.getAttribute('data-id');
                        const currentItem = currentSequenceState.find(d => d[0] === id);
                        newSequence.push([id, currentItem[1]]);
                    });

                    currentSequenceState = newSequence;
                    
                    renderChart();
                    renderTable();
                    syncStateToUrl();
                });
            }
        }

        function renderChart() {
            if (chartInstance) chartInstance.destroy();

            const dynamicLabels = currentSequenceState.map((item, index) => {
                return `${index + 1}. ${masterVideosData[item[0]]?.title || ''}`;
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dynamicLabels,
                    datasets: [{
                        data: currentSequenceState.map(d => d[1]),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.02)',
                        borderWidth: 3,
                        tension: 0.1,
                        pointBackgroundColor: '#059669',
                        pointBorderColor: '#34d399',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 10,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        dragData: {
                            round: 0,
                            onDrag: (e, datasetIndex, index, value) => {
                                if (value < 0 || value >= timeSlots.length) return false;
                            },
                            onDragEnd: (e, datasetIndex, index, value) => {
                                currentSequenceState[index][1] = value;
                                renderTable();
                                syncStateToUrl();
                            }
                        },
                        tooltip: {
                            backgroundColor: '#111827',
                            titleColor: '#34d399',
                            bodyColor: '#e5e7eb',
                            titleFont: { size: 12, weight: 'bold' },
                            bodyFont: { size: 11 },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    const itemIdx = context[0].dataIndex;
                                    const stateItem = currentSequenceState[itemIdx];
                                    return `${itemIdx + 1}. ${masterVideosData[stateItem[0]].title} • às ${timeSlots[context[0].parsed.y]}`;
                                },
                                label: function(context) {
                                    const stateItem = currentSequenceState[context.dataIndex];
                                    return "Foco: " + masterVideosData[stateItem[0]].tip;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: '#1f2937' }, ticks: { display: false } },
                        y: {
                            grid: { color: '#1f2937' },
                            min: 0,
                            max: timeSlots.length - 1,
                            ticks: {
                                color: '#9ca3af',
                                font: { size: 11, weight: 'bold' },
                                stepSize: 4,
                                callback: function(value) { return timeSlots[value]; }
                            }
                        }
                    }
                }
            });
        }

        // --- Adicionar Item Novo Fluxo ---
        document.getElementById('addMediaBtn').addEventListener('click', () => {
            const titleInput = document.getElementById('newMediaTitle');
            const tipInput = document.getElementById('newMediaTip');
            
            const title = titleInput.value.trim();
            const tip = tipInput.value.trim();

            if (!title) return alert('Por favor, informe pelo menos um título para a nova mídia.');

            const uniqueId = 'vid_' + Date.now();
            masterVideosData[uniqueId] = { title, tip };
            
            // Adiciona ao estado final na primeira faixa de tempo padrão (10:00)
            currentSequenceState.push([uniqueId, 0]);

            titleInput.value = '';
            tipInput.value = '';

            renderChart();
            renderTable();
            syncStateToUrl();
        });

        // --- Handlers de Controle de Templates ---
        document.getElementById('savePatternBtn').addEventListener('click', () => {
            const input = document.getElementById('newPatternName');
            const name = input.value.trim();
            if (!name) return alert('Digite um nome válido.');

            const customPatterns = getLocalPatterns();
            customPatterns[name] = currentSequenceState;
            saveLocalPatterns(customPatterns);
            
            updateSelectDropdownOptions();
            document.getElementById('patternSelect').value = `custom_${name}`;
            input.value = '';
            syncStateToUrl();
            alert(`Padrão "${name}" salvo com sucesso!`);
        });

        document.getElementById('deletePatternBtn').addEventListener('click', () => {
            const selector = document.getElementById('patternSelect');
            const currentPattern = selector.value;
            if (!currentPattern.startsWith('custom_')) return;
            
            const customKey = currentPattern.replace('custom_', '');
            if (confirm(`Deseja excluir o padrão "${customKey}"?`)) {
                const customPatterns = getLocalPatterns();
                delete customPatterns[customKey];
                saveLocalPatterns(customPatterns);
                
                updateSelectDropdownOptions();
                selector.value = 'instagram';
                currentSequenceState = JSON.parse(JSON.stringify(basePatterns['instagram']));
                renderChart();
                renderTable();
                syncStateToUrl();
            }
        });

        const patternSelector = document.getElementById('patternSelect');
        patternSelector.addEventListener('change', (e) => {
            const selected = e.target.value;
            if (selected.startsWith('custom_')) {
                const customKey = selected.replace('custom_', '');
                const customPatterns = getLocalPatterns();
                if (customPatterns[customKey]) currentSequenceState = JSON.parse(JSON.stringify(customPatterns[customKey]));
            } else {
                currentSequenceState = JSON.parse(JSON.stringify(basePatterns[selected]));
            }
            renderChart();
            renderTable();
            syncStateToUrl();
        });

        // --- Inicialização ---
        updateSelectDropdownOptions();
        const initialState = parseUrlOrStorageState();
        patternSelector.value = initialState.pattern;
        currentSequenceState = initialState.data;

        renderChart();
        renderTable();
        syncStateToUrl();
    </script>
</body>
</html>
