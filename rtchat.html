<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Group Chat (Nostr Relays)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }
        #room-controls {
            display: flex;
            gap: 6px;
            font-size: 12px;
            align-items: center;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #4f46e5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        button:hover {
            background-color: #f3f4f6;
        }
        #send-btn {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div class="status-row">
            <span id="status-text">Connecting to Nostr network...</span>
            <div id="identity-display">You: Loading...</div>
        </div>
        <div class="status-row" id="room-controls">
            <span>Room: <strong id="room-display">...</strong></span>
            <button onclick="newRoom()">New Room</button>
        </div>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message and press Enter..." onkeypress="handleKeyPress(event)" autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script type="module">
    import { schnorr } from 'https://cdn.jsdelivr.net/npm/@noble/curves@1.2.0/secp256k1.js';

    // 1. Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    function getRoom() {
        let hash = window.location.hash.substring(1);
        if (!hash.startsWith('room_')) {
            hash = 'room_' + Math.random().toString(36).substring(2, 8);
            window.location.hash = hash;
        }
        return hash;
    }

    const roomName = getRoom();
    document.getElementById('room-display').textContent = roomName;

    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const statusText = document.getElementById('status-text');

    const seenEventIds = new Set();
    const relayUrls = [
        "wss://relay.damus.io",
        "wss://nos.lol",
        "wss://relay.primal.net"
    ];
    const sockets = [];
    let connectedRelays = 0;

    // Generate valid Schnorr keypair for Nostr protocol (NIP-01)
    const privKeyBytes = schnorr.utils.randomPrivateKey();
    const pubKeyBytes = schnorr.getPublicKey(privKeyBytes);
    const privKeyHex = Array.from(privKeyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
    const pubKeyHex = Array.from(pubKeyBytes).map(b => b.toString(16).padStart(2, '0')).join('');

    function getTimeString(timestampSec) {
        const date = timestampSec ? new Date(timestampSec * 1000) : new Date();
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function sha256Hex(str) {
        const buf = new TextEncoder().encode(str);
        const hashBuf = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function createSignedEvent(content) {
        const createdAt = Math.floor(Date.now() / 1000);
        const tags = [["t", roomName], ["name", myName]];
        const kind = 1;

        const serialized = JSON.stringify([0, pubKeyHex, createdAt, kind, tags, content]);
        const idHex = await sha256Hex(serialized);

        const sigBytes = schnorr.sign(idHex, privKeyBytes);
        const sigHex = Array.from(sigBytes).map(b => b.toString(16).padStart(2, '0')).join('');

        return {
            id: idHex,
            pubkey: pubKeyHex,
            created_at: createdAt,
            kind,
            tags,
            content,
            sig: sigHex
        };
    }

    function initRelays() {
        relayUrls.forEach(url => {
            try {
                const ws = new WebSocket(url);

                ws.onopen = () => {
                    connectedRelays++;
                    statusText.textContent = `Online (${connectedRelays} Relays Synced)`;
                    
                    const subId = "sub_" + Math.random().toString(36).substring(2, 8);
                    const filter = {
                        kinds: [1],
                        "#t": [roomName],
                        limit: 100
                    };
                    ws.send(JSON.stringify(["REQ", subId, filter]));
                };

                ws.onmessage = (evt) => {
                    try {
                        const data = JSON.parse(evt.data);
                        if (data[0] === "EVENT" && data[2]) {
                            handleIncomingEvent(data[2]);
                        }
                    } catch(e) {}
                };

                ws.onclose = () => {
                    connectedRelays = Math.max(0, connectedRelays - 1);
                    if (connectedRelays === 0) statusText.textContent = 'Reconnecting relays...';
                };

                sockets.push(ws);
            } catch(e) {}
        });
    }

    function handleIncomingEvent(event) {
        if (seenEventIds.has(event.id)) return;
        seenEventIds.add(event.id);

        let sender = "Anonymous";
        const nameTag = event.tags.find(t => t[0] === "name");
        if (nameTag && nameTag[1]) {
            sender = nameTag[1];
        } else {
            sender = "User_" + event.pubkey.substring(0, 4);
        }

        const isSelf = event.pubkey === pubKeyHex;
        const time = getTimeString(event.created_at);

        appendMessageToDOM(sender, event.content, time, isSelf ? 'sent' : 'received');
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const signedEvt = await createSignedEvent(text);
        
        let broadcasted = false;
        sockets.forEach(ws => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(["EVENT", signedEvt]));
                broadcasted = true;
            }
        });

        if (broadcasted) {
            handleIncomingEvent(signedEvt);
            messageInput.value = '';
            messageInput.focus();
        } else {
            alert("Still connecting to network. Try again in a moment.");
        }
    }

    window.sendMessage = sendMessage;
    window.handleKeyPress = function(e) {
        if (e.key === 'Enter') sendMessage();
    };

    window.newRoom = function() {
        window.location.hash = 'room_' + Math.random().toString(36).substring(2, 8);
        location.reload();
    };

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="msg-header">
                <span>${sender}</span>
                <span class="msg-time">${time}</span>
            </div>
            <div>${text}</div>
        `;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.onload = initRelays;
</script>

</body>
</html>
