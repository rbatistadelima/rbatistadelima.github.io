</style><script role="script" id="twine-user-script" type="text/twine-javascript">setup.move = function () {
	var elem  = document.getElementById("progressbar");
	var width = 1;
	var id    = setInterval(frame, 100);

	function frame() {
		if (width >= 100) {
			clearInterval(id);
		}
		else {
			width++;
			elem.style.width = width + '%';
		}
	}
};
