<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TTS Lab — 100% WebAssembly + Fila Estrita</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <style>
        html,body{margin:0;height:100%;background:#0f0f12;color:#fff;font-family:Arial}
        body{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
        textarea{width:90%;max-width:980px;height:140px;background:#121214;color:#fff;border:0;padding:10px;border-radius:4px;resize:vertical;font-family:monospace;}
        .karaoke{width:90%;max-width:980px;background:#141417;padding:14px;border-radius:8px;min-height:120px;box-sizing:border-box;}
        button{background:#007bff;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1rem;}
        button:hover{background:#0056b3;}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .status{font-size:0.9rem;color:#d97706;font-weight:bold;}
    </style>

    <script type="module">
        import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";

        // --- ARQUITETURA DE SEGURANÇA PARA FILE:// (BYPASS DE SANDBOX) ---
        env.allowLocalModels = false; // Bloqueia caminhos relativos locais que acionam erro de CORS no Chrome
        env.useBrowserCache = true;   // Força o armazenamento do modelo no IndexedDB do usuário (Warmup definitivo no 2º boot)

        /* ---------------- SEMÁFORO GLOBAL DE ÁUDIO ---------------- */
        let audioTimelineLock = Promise.resolve();
        function queueScheduler(fn) {
            audioTimelineLock = audioTimelineLock.then(fn);
            return audioTimelineLock;
        }

        /* ---------------- GERENCIADOR DE DRIVERS ---------------- */
        let audioContextInstance = null;
        function getAudioContext() {
            if (!audioContextInstance) {
                audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContextInstance;
        }

        /* ---------------- ENGINE 1: KAORI (WEBASSEMBLY) ---------------- */
        let kaoriPipeline = null;
        let isKaoriReady = false;

        async function bootKaoriWasm() {
            const statusIndicator = document.getElementById("status");
            statusIndicator.innerText = "Carregando Kaori WebAssembly... (Aguarde o download inicial)";
            
            try {
                // Instanciação direta do pipeline de redes neurais do MMS em Português
                kaoriPipeline = await pipeline("text-to-speech", "Xenova/mms-1b-por", {
                    quantized: true // Reduz o tamanho de download e alocação de memória no compilador WASM do Chrome
                });

                // Executa um Warmup obrigatório com buffer vazio para compilar as funções do WebAssembly na RAM
                await kaoriPipeline("warmup");

                isKaoriReady = true;
                statusIndicator.innerText = "Sistema Inicializado com Sucesso ✔ (Pronto para Execução)";
                statusIndicator.style.color = "#28a745";
                document.getElementById("btn-play").disabled = false;
            } catch (error) {
                console.error(error);
                statusIndicator.innerText = "Falha Crítica de Rede: Não foi possível estruturar o WebAssembly offline.";
                statusIndicator.style.color = "#dc3545";
            }
        }
        window.addEventListener("DOMContentLoaded", bootKaoriWasm);

        async function executeKaoriSpeech(text) {
            // Processa a inferência da rede neural direto na CPU/WebAssembly do navegador
            const rawAudioOutput = await kaoriPipeline(text);
            const ctx = getAudioContext();

            if (ctx.state === 'suspended') {
                await ctx.resume();
            }

            return new Promise((resolve) => {
                // Aloca dinamicamente o tamanho exato da Array Float32Array gerada pelo modelo da Kaori
                const audioBuffer = ctx.createBuffer(1, rawAudioOutput.audio.length, rawAudioOutput.sampling_rate);
                audioBuffer.getChannelData(0).set(rawAudioOutput.audio);

                const sourceNode = ctx.createBufferSource();
                sourceNode.buffer = audioBuffer;
                sourceNode.connect(ctx.destination);

                // Liberação estrita: Próximo elemento do loop só executa ao fim do pulso físico de áudio
                sourceNode.onended = () => {
                    sourceNode.disconnect();
                    resolve();
                };

                logger("Kaori", text);
                sourceNode.start(0);
            });
        }

        /* ---------------- ENGINE 2: DANIEL (SPEECH SYNTHESIS) ---------------- */
        let systemVoices = [];
        function populateVoices() {
            if (typeof speechSynthesis !== 'undefined') {
                systemVoices = speechSynthesis.getVoices();
            }
        }
        populateVoices();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function executeDanielSpeech(text) {
            return new Promise((resolve) => {
                if (typeof speechSynthesis === 'undefined') return resolve();

                // Interrompe qualquer ruído fantasma residual do sistema operacional
                speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "pt-BR";

                if (systemVoices.length > 0) {
                    utterance.voice = systemVoices.find(v => /male|daniel|francis/i.test(v.name)) 
                                      || systemVoices.find(v => v.lang.includes("pt")) 
                                      || systemVoices[0];
                }

                // Mecanismo de escape (Anti-hang do Chrome): Força a fila a andar se o onend nativo engasgar
                const timeoutWatchdog = setTimeout(() => { resolve(); }, (text.length * 85) + 2000);

                utterance.onend = () => { clearTimeout(timeoutWatchdog); resolve(); };
                utterance.onerror = () => { clearTimeout(timeoutWatchdog); resolve(); };

                speechSynthesis.speak(utterance);
            });
        }

        /* ---------------- CENTRAL ROUTER & SCHEDULER ---------------- */
        function processSpeaker(name, text) {
            const targetName = name.toLowerCase();

            // Encapsula o switch de canais de áudio dentro do semáforo sequencial imutável
            return queueScheduler(async () => {
                if (targetName.includes("kaori")) {
                    // Bloqueia a execução se o usuário clicar antes do término da compilação do WASM
                    while (!isKaoriReady) {
                        await new Promise(r => setTimeout(r, 100));
                    }
                    await executeKaoriSpeech(text);
                } else {
                    await executeDanielSpeech(text);
                }
            });
        }

        /* ---------------- DIAGRAMAÇÃO DO FLUXO LOCAL ---------------- */
        function logger(name, text) {
            document.getElementById("karaoke").innerHTML = `<b>${name}:</b> ${text}`;
        }

        async function startEnginePipeline(){
            document.getElementById("btn-play").disabled = true;
            
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                await ctx.resume();
            }

            const inputLines = document.getElementById("texto").value.split("\n").filter(Boolean);
            
            for(const rawLine of inputLines){
                const matchPattern = rawLine.match(/^([^:]+):\s*(.*)$/);    
                if(!matchPattern) continue;
                
                const characterName = matchPattern[1].trim();    
                const spokenText = matchPattern[2].trim();    
                
                logger(characterName, "Sintetizando faixa...");
                
                // Aguarda de forma síncrona o esvaziamento da Promise da linha de áudio anterior
                await processSpeaker(characterName, spokenText);  
                
                // Janela de atraso (200ms) para amortecer estática de hardware entre trocas de motores
                await new Promise(r => setTimeout(r, 200));
            }
            
            document.getElementById("btn-play").disabled = false;
        }
        
        // Expõe a função para o escopo global do HTML clássico
        window.startEnginePipeline = startEnginePipeline;
    </script>
</head>
<body>
    <div class="status" id="status">Inicializando barramento WebAssembly...</div>
    <textarea id="texto">Daniel: Eu sou o Daniel e rodo através do sintetizador nativo do navegador.
Kaori: E eu sou a Kaori, processada inteiramente via inteligência artificial com WebAssembly local.
Daniel: Perceba que mesmo alternando motores diferentes, nossa sincronia de tempo é perfeita.
Kaori: Exatamente. Fila de execução restrita e estável.</textarea>
    <div class="karaoke" id="karaoke"></div>
    <button id="btn-play" onclick="startEnginePipeline()" disabled>▶ Play</button>
</body>
</html>
