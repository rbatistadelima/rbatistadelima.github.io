<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Vozes TTS Português</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent: #6366f1; /* Indigo */
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            background-color: #0b0f19;
            border-left: 4px solid #475569;
            font-size: 0.9rem;
            display: none;
            line-height: 1.4;
        }

        .audio-player-container {
            margin-top: 2rem;
            display: none;
            border-top: 1px solid #2d3748;
            padding-top: 1.5rem;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
        }
    </style>
    
    <!-- Carrega a pipeline de Transformers atualizada para modelos multi-speaker -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        let ttsPipeline = null;
        
        const statusBox = document.getElementById('statusBox');
        const synthBtn = document.getElementById('synthBtn');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');

        function atualizarStatus(mensagem, erro = false) {
            statusBox.style.display = 'block';
            statusBox.style.borderLeftColor = erro ? '#ef4444' : '#6366f1';
            statusBox.innerText = mensaje;
        }

        async function inicializarMotor() {
            if (ttsPipeline) return;
            try {
                atualizarStatus("Baixando banco de dados de vozes em português (VITS)...");
                synthBtn.disabled = true;
                
                // Usando o modelo VITS multi-speaker treinado com vozes em português
                ttsPipeline = await pipeline('text-to-speech', 'Xenova/vits-pbr');
                
                atualizarStatus("Motor Multi-Vozes pronto!");
                synthBtn.disabled = false;
                synthBtn.innerText = "Sintetizar Voz Selecionada";
            } catch (error) {
                atualizarStatus("Erro ao iniciar banco de vozes: " + error.message, true);
            }
        }

        async function gerarVoz() {
            const texto = document.getElementById('textInput').value.trim();
            // Captura o ID numérico da voz escolhida no HTML
            const speakerId = parseInt(document.getElementById('voiceSelect').value);

            if (!texto) {
                atualizarStatus("Por favor, digite um texto para o teste.", true);
                return;
            }

            try {
                synthBtn.disabled = true;
                atualizarStatus("Processando entonação e fonemas da voz selecionada...");

                // Passamos o speaker_id para a IA saber qual perfil de voz carregar na matriz de áudio
                const resultado = await ttsPipeline(texto, {
                    generate_kwargs: {
                        speaker_id: speakerId
                    }
                });
                
                const wavBlob = criarArquivoWav(resultado.audio, resultado.sampling_rate);
                const audioUrl = URL.createObjectURL(wavBlob);
                
                audioPlayer.src = audioUrl;
                audioContainer.style.display = 'block';
                atualizarStatus("Áudio processado com sucesso!");
            } catch (error) {
                atualizarStatus("Falha na geração: " + error.message, true);
            } finally {
                synthBtn.disabled = false;
            }
        }

        function criarArquivoWav(dadosAudio, taxaAostragem) {
            const buffer = new ArrayBuffer(44 + dadosAudio.length * 2);
            const view = new DataView(buffer);
            escreverString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dadosAudio.length * 2, true);
            escreverString(view, 8, 'WAVE');
            escreverString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, taxaAostragem, true);
            view.setUint32(28, taxaAostragem * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            escreverString(view, 36, 'data');
            view.setUint32(40, dadosAudio.length * 2, true);
            
            let index = 44;
            for (let i = 0; i < dadosAudio.length; i++) {
                let amostra = Math.max(-1, Math.min(1, dadosAudio[i]));
                view.setInt16(index, amostra < 0 ? amostra * 0x8000 : amostra * 0x7FFF, true);
                index += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function escribirString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        window.addEventListener('DOMContentLoaded', inicializarMotor);
        synthBtn.addEventListener('click', gerarVoz);
    </script>
</head>
<body>

<div class="container">
    <h1>Estúdio de Vozes Português</h1>
    <p class="subtitle">Alterne entre diferentes perfis de voz integrados localmente no WebAssembly.</p>
    
    <div class="form-group">
        <label for="voiceSelect">Escolha o Perfil de Voz</label>
        <select id="voiceSelect">
            <option value="0">Perfil 1 - Masculino (Padrão)</option>
            <option value="1">Perfil 2 - Feminino (Suave)</option>
            <option value="2">Perfil 3 - Masculino (Grave)</option>
            <option value="3">Perfil 4 - Feminino (Firme)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="textInput">Texto para conversão</label>
        <textarea id="textInput" placeholder="Escreva o roteiro aqui..."></textarea>
    </div>

    <button id="synthBtn" disabled>Carregando Banco Multi-Vozes...</button>

    <div id="statusBox" class="status-box"></div>

    <div id="audioContainer" class="audio-player-container">
        <label>Resultado do Áudio</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

</body>
</html>
