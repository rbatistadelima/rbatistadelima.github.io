<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Text Web Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .text-display {
            flex: 1;
            min-width: 300px;
            height: 400px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            padding: 20px;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .control-group {
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
        }

        .value-display {
            display: inline-block;
            width: 50px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 5px;
            margin-left: 10px;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            transform: scale(1.2);
            box-shadow: 0 0 10px white;
        }

        button {
            background: linear-gradient(to right, #ff8a00, #da1b60);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .preset-buttons button {
            margin-top: 0;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .text-display, .controls {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>3D Text Web Application</h1>
        <p class="subtitle">Create stunning 3D text effects with real-time customization</p>
    </header>

    <div class="container">
        <div class="text-display" id="textDisplay">
            <!-- 3D Text will be rendered here -->
            <h1 id="displayText" style="
                font-size: 60px;
                color: #ff8a00;
                text-shadow: 
                    5px 5px 0px #da1b60,
                    10px 10px 0px rgba(0, 0, 0, 0.2);
                transform: rotateX(20deg) rotateY(-10deg);
                transition: all 0.5s ease;
            ">3D TEXT</h1>
        </div>

        <div class="controls">
            <div class="control-group">
                <h2>Text Content</h2>
                <input type="text" id="textInput" value="3D TEXT" placeholder="Enter your text here">
            </div>

            <div class="control-group">
                <h2>3D Effect Controls</h2>
                <label for="depthSlider">Depth: <span id="depthValue" class="value-display">5</span>px</label>
                <input type="range" id="depthSlider" min="0" max="20" value="5">

                <label for="rotateXSlider">Rotate X: <span id="rotateXValue" class="value-display">20</span>°</label>
                <input type="range" id="rotateXSlider" min="-60" max="60" value="20">

                <label for="rotateYSlider">Rotate Y: <span id="rotateYValue" class="value-display">-10</span>°</label>
                <input type="range" id="rotateYSlider" min="-60" max="60" value="-10">
            </div>

            <div class="control-group">
                <h2>Color Options</h2>
                <div class="color-picker">
                    <div class="color-option active" style="background-color: #ff8a00;" data-color="#ff8a00"></div>
                    <div class="color-option" style="background-color: #00c6ff;" data-color="#00c6ff"></div>
                    <div class="color-option" style="background-color: #00ff88;" data-color="#00ff88"></div>
                    <div class="color-option" style="background-color: #ff0080;" data-color="#ff0080"></div>
                    <div class="color-option" style="background-color: #8a2be2;" data-color="#8a2be2"></div>
                </div>
            </div>

            <div class="control-group">
                <h2>Preset Styles</h2>
                <div class="preset-buttons">
                    <button id="preset1">Deep Shadow</button>
                    <button id="preset2">Neon Glow</button>
                    <button id="preset3">Metallic</button>
                    <button id="preset4">Reset</button>
                </div>
            </div>

            <button id="animateBtn">Animate Text</button>
        </div>
    </div>

    <footer>
        <p>Created with CSS 3D Transformations & JavaScript | 3D Text Web App</p>
    </footer>

    <script>
        // DOM Elements
        const textInput = document.getElementById('textInput');
        const displayText = document.getElementById('displayText');
        const depthSlider = document.getElementById('depthSlider');
        const depthValue = document.getElementById('depthValue');
        const rotateXSlider = document.getElementById('rotateXSlider');
        const rotateXValue = document.getElementById('rotateXValue');
        const rotateYSlider = document.getElementById('rotateYSlider');
        const rotateYValue = document.getElementById('rotateYValue');
        const colorOptions = document.querySelectorAll('.color-option');
        const preset1 = document.getElementById('preset1');
        const preset2 = document.getElementById('preset2');
        const preset3 = document.getElementById('preset3');
        const preset4 = document.getElementById('preset4');
        const animateBtn = document.getElementById('animateBtn');

        // Update text content
        textInput.addEventListener('input', function() {
            displayText.textContent = this.value || '3D TEXT';
        });

        // Update depth
        depthSlider.addEventListener('input', function() {
            const depth = this.value;
            depthValue.textContent = depth;
            updateTextStyle();
        });

        // Update rotation X
        rotateXSlider.addEventListener('input', function() {
            const rotateX = this.value;
            rotateXValue.textContent = rotateX;
            updateTextStyle();
        });

        // Update rotation Y
        rotateYSlider.addEventListener('input', function() {
            const rotateY = this.value;
            rotateYValue.textContent = rotateY;
            updateTextStyle();
        });

        // Color selection
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                colorOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                updateTextStyle();
            });
        });

        // Update text style based on controls
        function updateTextStyle() {
            const depth = depthSlider.value;
            const rotateX = rotateXSlider.value;
            const rotateY = rotateYSlider.value;
            const activeColor = document.querySelector('.color-option.active').getAttribute('data-color');
            
            displayText.style.textShadow = `
                ${depth}px ${depth}px 0px ${adjustColor(activeColor, -40)},
                ${depth * 2}px ${depth * 2}px 0px rgba(0, 0, 0, 0.2)
            `;
            
            displayText.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            displayText.style.color = activeColor;
        }

        // Helper function to adjust color brightness
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => 
                ('0' + Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2)
            );
        }

        // Preset styles
        preset1.addEventListener('click', function() {
            depthSlider.value = 8;
            depthValue.textContent = '8';
            rotateXSlider.value = 15;
            rotateXValue.textContent = '15';
            rotateYSlider.value = -5;
            rotateYValue.textContent = '-5';
            updateTextStyle();
        });

        preset2.addEventListener('click', function() {
            depthSlider.value = 3;
            depthValue.textContent = '3';
            rotateXSlider.value = 5;
            rotateXValue.textContent = '5';
            rotateYSlider.value = 5;
            rotateYValue.textContent = '5';
            
            displayText.style.textShadow = `
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px ${displayText.style.color},
                0 0 20px ${displayText.style.color}
            `;
        });

        preset3.addEventListener('click', function() {
            depthSlider.value = 10;
            depthValue.textContent = '10';
            rotateXSlider.value = 25;
            rotateXValue.textContent = '25';
            rotateYSlider.value = -15;
            rotateYValue.textContent = '-15';
            
            displayText.style.textShadow = `
                1px 1px 1px #919191,
                1px 2px 1px #919191,
                1px 3px 1px #919191,
                1px 4px 1px #919191,
                1px 5px 1px #919191,
                1px 6px 1px #919191,
                1px 7px 1px #919191,
                1px 8px 1px #919191,
                1px 9px 1px #919191,
                1px 10px 1px #919191,
                1px 18px 6px rgba(16,16,16,0.4),
                1px 22px 10px rgba(16,16,16,0.2),
                1px 25px 35px rgba(16,16,16,0.2),
                1px 30px 60px rgba(16,16,16,0.4)
            `;
        });

        preset4.addEventListener('click', function() {
            depthSlider.value = 5;
            depthValue.textContent = '5';
            rotateXSlider.value = 20;
            rotateXValue.textContent = '20';
            rotateYSlider.value = -10;
            rotateYValue.textContent = '-10';
            updateTextStyle();
        });

        // Animation
        animateBtn.addEventListener('click', function() {
            displayText.style.animation = 'none';
            setTimeout(() => {
                displayText.style.animation = 'pulse 2s infinite';
            }, 10);
        });

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: rotateX(${rotateXSlider.value}deg) rotateY(${rotateYSlider.value}deg) scale(1); }
                50% { transform: rotateX(${rotateXSlider.value}deg) rotateY(${rotateYSlider.value}deg) scale(1.1); }
                100% { transform: rotateX(${rotateXSlider.value}deg) rotateY(${rotateYSlider.value}deg) scale(1); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
