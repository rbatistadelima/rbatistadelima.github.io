<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer Avançado com Capítulos Coloridos</title>
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #0d1117;
  color: #e6edf3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
}
h1 { margin: 0; }
input, button {
  padding: 0.5rem;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
}
button {
  background: #00e0ff;
  color: #000;
  cursor: pointer;
}
button:hover { background: #33f0ff; }
#chapterList {
  background: #161b22;
  border-radius: 8px;
  padding: 0.5rem 1rem;
  width: 360px;
  max-height: 250px;
  overflow-y: auto;
}
.chapterItem {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 5px;
  padding: 5px;
  border-radius: 5px;
  cursor: grab;
}
.timer {
  display: flex;
  gap: 2rem;
  font-size: 1.5rem;
}
.chapter {
  font-size: 1.2rem;
  color: #00e0ff;
}
#progressBar {
  position: relative;
  width: 340px;
  height: 30px;
  background: #1a1f29;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 0 10px #000 inset;
}
.segment {
  position: absolute;
  top: 0;
  height: 100%;
  color: #fff;
  font-size: 0.7rem;
  text-align: center;
  line-height: 30px;
  white-space: nowrap;
  overflow: hidden;
  transition: all 0.3s ease;
}
.fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: linear-gradient(90deg,#00e0ff,#00ffaa);
  box-shadow: 0 0 8px #00e0ff;
  transition: width 0.3s linear;
  z-index: 2;
}
#chapterProgressContainer {
  width: 300px;
  height: 10px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
}
#chapterProgress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#ffaa00,#ff5500);
  transition: width 0.3s linear;
}
.editableInput { width: 60%; }
#totalTime,#remainingTime,#endTime {
  color: #00e0ff;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>⏳ Timer Avançado</h1>

<div>
  <input type="text" id="chapterNameInput" placeholder="Nome do capítulo">
  <input type="number" id="chapterDurationInput" placeholder="Duração (min)" min="0.1" step="0.1">
  <button id="addChapterBtn">➕ Adicionar</button>
</div>

<div id="chapterList"></div>
<div id="totalTime">Tempo total: 0 min</div>
<div id="remainingTime">Tempo restante: 0 min</div>
<div id="endTime">Fim estimado: --:--</div>

<div>
  <button id="prevChapterBtn">⏮️ Anterior</button>
  <button id="startBtn">▶️ Iniciar</button>
  <button id="pauseBtn">⏸️ Pausar</button>
  <button id="nextChapterBtn">⏭️ Próximo</button>
  <button id="resetBtn">♻️ Resetar</button>
</div>

<div class="chapter" id="chapterName">Aguardando início...</div>

<div class="timer">
  <div>↑ <span id="countUp">00:00</span></div>
  <div>↓ <span id="countDown">00:00</span></div>
</div>

<div id="progressBar"></div>
<div id="chapterProgressContainer"><div id="chapterProgress"></div></div>

<script>
const COLORS = ["#00e0ff","#ff0077","#00ff77","#ffaa00","#aa00ff","#ff4444","#44ff44"];
const chapterList = document.getElementById('chapterList');
const totalTimeDisplay = document.getElementById('totalTime');
const remainingTimeDisplay = document.getElementById('remainingTime');
const endTimeDisplay = document.getElementById('endTime');
const progressBar = document.getElementById('progressBar');
const progress = document.createElement('div');
progress.className = 'fill';
progressBar.appendChild(progress);
const chapterProgress = document.getElementById('chapterProgress');

const bellStart = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const bellEnd = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

let chapters = JSON.parse(localStorage.getItem("chapters") || "[]");
let timerState = JSON.parse(localStorage.getItem("timerState") || "null");
let interval;

if(Notification.permission!=="granted") Notification.requestPermission();

function notifyChapter(title, body){
  if(Notification.permission==="granted")
    new Notification(title,{body,icon:"https://cdn-icons-png.flaticon.com/512/786/786453.png"});
}

function formatTime(sec){
  const m=Math.floor(sec/60); const s=sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function getCurrentChapterIndex(totalElapsed){
  let sum=0; for(let i=0;i<chapters.length;i++){ sum+=chapters[i].durationSec; if(totalElapsed<sum) return i; }
  return chapters.length-1;
}

function getChapterElapsed(totalElapsed,index){
  let prev=0; for(let i=0;i<index;i++) prev+=chapters[i].durationSec;
  return totalElapsed-prev;
}

function saveChapters(){
  localStorage.setItem("chapters",JSON.stringify(chapters));
  renderChapters();
}

document.getElementById('addChapterBtn').onclick=()=>{
  const name=document.getElementById('chapterNameInput').value.trim()||`Capítulo ${chapters.length+1}`;
  const durationMin=parseFloat(document.getElementById('chapterDurationInput').value);
  if(!durationMin||durationMin<=0) return alert("Informe duração válida!");
  const durationSec=Math.round(durationMin*60);
  chapters.push({name,durationMin,durationSec});
  saveChapters();
};

function renderChapters(){
  chapterList.innerHTML="";
  progressBar.innerHTML="";
  progressBar.appendChild(progress);
  let totalSec=chapters.reduce((a,c)=>a+c.durationSec,0);

  chapters.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="chapterItem";
    div.style.background=COLORS[i%COLORS.length];
    div.draggable=true;

    const inputName=document.createElement("input");
    inputName.value=c.name;
    inputName.className="editableInput";
    inputName.onchange=(e)=>{chapters[i].name=e.target.value; saveChapters();}

    const inputTime=document.createElement("input");
    inputTime.type="number"; inputTime.value=c.durationMin; inputTime.step="0.1"; inputTime.min="0.1";
    inputTime.onchange=(e)=>{chapters[i].durationMin=parseFloat(e.target.value); chapters[i].durationSec=Math.round(parseFloat(e.target.value)*60); saveChapters();}

    div.appendChild(inputName);
    div.appendChild(inputTime);
    chapterList.appendChild(div);

    div.addEventListener('dragstart', e=>{e.dataTransfer.setData("text/plain",i);});
    div.addEventListener('dragover', e=>{e.preventDefault();});
    div.addEventListener('drop', e=>{
      const fromIndex=parseInt(e.dataTransfer.getData("text/plain"));
      const [moved]=chapters.splice(fromIndex,1);
      chapters.splice(i,0,moved);
      saveChapters();
    });

    const cumulative=chapters.slice(0,i).reduce((s,ch)=>s+ch.durationSec,0);
    const seg=document.createElement("div");
    seg.className="segment";
    seg.dataset.index=i;
    seg.style.left=(cumulative/totalSec*100)+"%";
    seg.style.width=(c.durationSec/totalSec*100)+"%";
    seg.style.background=COLORS[i%COLORS.length];
    seg.textContent=c.name;
    progressBar.appendChild(seg);
  });

  totalTimeDisplay.textContent=`Tempo total: ${(totalSec/60).toFixed(1)} min`;
}

function updateProgressBars(totalElapsed){
  const totalDuration=chapters.reduce((a,c)=>a+c.durationSec,0);
  const currentIndex=getCurrentChapterIndex(totalElapsed);
  const current=chapters[currentIndex];
  const chapterElapsed=getChapterElapsed(totalElapsed,currentIndex);

  chapterProgress.style.width=((chapterElapsed/current.durationSec)*100)+"%";

  progressBar.querySelectorAll(".segment").forEach((seg)=>{
    const i=parseInt(seg.dataset.index);
    const ch=chapters[i];
    let cumulative=chapters.slice(0,i).reduce((s,ch)=>s+ch.durationSec,0);
    const segEnd=cumulative+ch.durationSec;
    let filled=0;
    if(totalElapsed>=segEnd) seg.style.opacity="1";
    else if(totalElapsed>cumulative) seg.style.opacity="0.7";
    else seg.style.opacity="0.3";
  });
}

function startTimer(){
  if(chapters.length===0) return alert("Adicione capítulos!");
  clearInterval(interval);

  if(!timerState) timerState={running:true,startTime:Date.now(),totalElapsed:0};
  if(!timerState.startTime) timerState.startTime=Date.now();
  if(!timerState.totalElapsed) timerState.totalElapsed=0;

  timerState.running=true;
  localStorage.setItem("timerState",JSON.stringify(timerState));

  interval=setInterval(()=>{
    const now=Date.now();
    const elapsed=Math.floor((now-timerState.startTime)/1000)+timerState.totalElapsed;
    const totalDuration=chapters.reduce((a,c)=>a+c.durationSec,0);
    const totalElapsed=Math.min(elapsed,totalDuration);
    const currentIndex=getCurrentChapterIndex(totalElapsed);
    const current=chapters[currentIndex];
    const chapterElapsed=getChapterElapsed(totalElapsed,currentIndex);
    const remaining=current.durationSec-chapterElapsed;
    const remainingTotal=totalDuration-totalElapsed;

    document.getElementById('countUp').textContent=formatTime(chapterElapsed);
    document.getElementById('countDown').textContent=formatTime(remaining);
    document.getElementById('chapterName').textContent=current.name;
    remainingTimeDisplay.textContent=`Tempo restante: ${(remainingTotal/60).toFixed(1)} min`;

    updateProgressBars(totalElapsed);

    localStorage.setItem("timerState",JSON.stringify({running:true,startTime:timerState.startTime,totalElapsed}));

    if(chapterElapsed===0 && totalElapsed>0){bellStart.play();notifyChapter("Capítulo iniciado",`"${current.name}" começou.`);}
    if(totalElapsed>=totalDuration){
      clearInterval(interval);
      bellEnd.play();
      document.getElementById('chapterName').textContent="✅ Fim";
      notifyChapter("Timer concluído","Todos os capítulos finalizados!");
      localStorage.removeItem("timerState");
    }
  },1000);
}

function pauseTimer(){
  if(!timerState||!timerState.running) return;
  clearInterval(interval);
  const now=Date.now();
  const elapsed=Math.floor((now-timerState.startTime)/1000)+timerState.totalElapsed;
  timerState={running:false,totalElapsed:elapsed};
  localStorage.setItem("timerState",JSON.stringify(timerState));
}

function resetTimer(){
  clearInterval(interval);
  timerState=null;
  localStorage.removeItem("timerState");
  document.getElementById('chapterName').textContent="Aguardando início...";
  document.getElementById('countUp').textContent="00:00";
  document.getElementById('countDown').textContent="00:00";
  chapterProgress.style.width="0%";
  remainingTimeDisplay.textContent="Tempo restante: 0 min";
  endTimeDisplay.textContent="Fim estimado: --:--";
  renderChapters();
}

function goToChapter(index){
  if(chapters.length===0) return;
  index=Math.max(0,Math.min(index,chapters.length-1));
  let elapsed=0;
  for(let i=0;i<index;i++) elapsed+=chapters[i].durationSec;
  timerState={running:true,startTime:Date.now(),totalElapsed:elapsed};
  localStorage.setItem("timerState",JSON.stringify(timerState));
  startTimer();
}

document.getElementById('prevChapterBtn').onclick=()=>{if(timerState) goToChapter(getCurrentChapterIndex(timerState.totalElapsed)-1);};
document.getElementById('nextChapterBtn').onclick=()=>{if(timerState) goToChapter(getCurrentChapterIndex(timerState.totalElapsed)+1);};
document.getElementById('startBtn').onclick=startTimer;
document.getElementById('pauseBtn').onclick=pauseTimer;
document.getElementById('resetBtn').onclick=resetTimer;

window.onload=()=>{
  if(chapters.length>0) renderChapters();
  if(timerState?.running) startTimer();
};
</script>
</body>
</html>
