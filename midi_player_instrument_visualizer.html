<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>MIDI Instrument Visualizer</title> <style> *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#eee;font-family:Arial,sans-serif} body{display:flex;flex-direction:column} #top{ height:52px; flex:none; display:flex; align-items:center; gap:8px; padding:7px 10px; background:#181a1f; border-bottom:1px solid #303238; } button,input,select{ background:#22252b; color:#eee; border:1px solid #3b3e45; border-radius:5px; padding:7px 10px; } button{cursor:pointer} button:hover{background:#2b2e35} button:active{background:#343840} #file{width:190px} #instrument{ min-width:160px; font-weight:bold; } #status{ margin-left:auto; color:#9da3ad; font-size:13px; white-space:nowrap; } #main{ flex:1; min-height:0; display:flex; position:relative; } #keyboard{ width:74px; flex:none; background:#15171b; border-right:1px solid #33363d; position:relative; overflow:hidden; } .key{ position:absolute; left:0; width:100%; height:20px; border-bottom:1px solid #303238; font-size:9px; padding-left:5px; display:flex; align-items:center; color:#8f949d; } .key.white{background:#202228} .key.black{ background:#0d0e11; color:#bbb; width:64%; z-index:2; border-radius:0 3px 3px 0; } #viewport{ flex:1; min-width:0; min-height:0; overflow:auto; position:relative; background:#0e0f12; } #stage{ position:relative; min-width:1600px; min-height:1600px; } #grid{ position:absolute; inset:0; background-image: linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px), linear-gradient(to right,rgba(255,255,255,.055) 1px,transparent 1px); background-size:100% 20px,80px 100%; } #measure{ position:absolute; left:0; top:0; height:28px; right:0; pointer-events:none; background:#15171b; border-bottom:1px solid #303238; z-index:20; } .beat{ position:absolute; top:0; height:28px; padding:7px 4px; color:#777d87; font-size:10px; border-left:1px solid #44474e; } #notes{ position:absolute; left:0; top:28px; right:0; bottom:0; } .note{ position:absolute; height:15px; min-width:8px; border-radius:3px; cursor:grab; user-select:none; touch-action:none; box-shadow:0 1px 2px #0008; border:1px solid rgba(255,255,255,.18); transition:filter .08s; } .note:hover{filter:brightness(1.2)} .note.dragging{ cursor:grabbing; filter:brightness(1.35); z-index:1000; } .note .label{ position:absolute; left:4px; top:0; height:100%; display:flex; align-items:center; font-size:9px; color:#fff; text-shadow:0 1px 2px #000; pointer-events:none; white-space:nowrap; overflow:hidden; } .note.instrument-drums{ border-radius:50%; height:16px; } .note.instrument-bass{ border-radius:2px 8px 8px 2px; } .note.instrument-piano{ border-radius:2px; } .note.instrument-guitar{ transform:skewX(-7deg); } .note.instrument-brass{ border-radius:8px 2px 2px 8px; } .note.instrument-strings{ border-radius:8px; } .note.instrument-lead{ clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8% 50%); } #cursor{ position:absolute; top:28px; bottom:0; width:2px; background:#fff; box-shadow:0 0 5px #fff; z-index:500; pointer-events:none; display:none; } #bottom{ height:44px; flex:none; background:#181a1f; border-top:1px solid #303238; display:flex; align-items:center; gap:8px; padding:6px 10px; } #time{ width:130px; color:#aaa; font:12px monospace; } #zoom{ width:120px; } #help{ margin-left:auto; font-size:11px; color:#777d87; } #empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#777d87; pointer-events:none; font-size:14px; } .hidden{display:none!important} </style> </head> <body> <div id="top"> <input id="file" type="file" accept=".mid,.midi"> <button id="demo">Demo</button> <button id="play">▶ Play</button> <button id="stop">■ Stop</button> <select id="instrument"> <option value="auto">Auto instrument</option> <option value="piano">Piano</option> <option value="bass">Bass</option> <option value="guitar">Guitar</option> <option value="strings">Strings</option> <option value="brass">Brass</option> <option value="lead">Lead</option> <option value="drums">Drums</option> </select> <span id="status">Open a MIDI file</span> </div> <div id="main"> <div id="keyboard"></div> <div id="viewport"> <div id="stage"> <div id="grid"></div> <div id="measure"></div> <div id="notes"></div> <div id="cursor"></div> <div id="empty"> Load a MIDI file or press Demo </div> </div> </div> </div> <div id="bottom"> <span id="time">00:00.000</span> <label>Zoom</label> <input id="zoom" type="range" min="30" max="240" value="80"> <span id="help"> Drag notes • horizontal = time • vertical = pitch • wheel = scroll </span> </div> <script> "use strict"; /* ============================================================ MIDI VISUALIZER ============================================================ */ const fileInput = document.getElementById("file"); const demoBtn = document.getElementById("demo"); const playBtn = document.getElementById("play"); const stopBtn = document.getElementById("stop"); const instrumentSelect = document.getElementById("instrument"); const statusEl = document.getElementById("status"); const notesEl = document.getElementById("notes"); const stage = document.getElementById("stage"); const measureEl = document.getElementById("measure"); const keyboard = document.getElementById("keyboard"); const emptyEl = document.getElementById("empty"); const cursor = document.getElementById("cursor"); const timeEl = document.getElementById("time"); const zoomInput = document.getElementById("zoom"); let midi = { ppq:480, tempo:500000, notes:[], duration:8 }; let pixelsPerBeat = 80; let playing = false; let playStart = 0; let pausedTime = 0; let animationFrame = null; let audioCtx = null; let activeOscillators = []; const MIN_NOTE = 36; const MAX_NOTE = 96; const ROW_H = 20; const NOTE_H = 15; /* ------------------------------------------------------------ Piano keyboard ------------------------------------------------------------ */ const noteNames = [ "C","C#","D","D#","E","F", "F#","G","G#","A","A#","B" ]; function makeKeyboard(){ keyboard.innerHTML = ""; for(let n=MIN_NOTE;n<=MAX_NOTE;n++){ const y=(MAX_NOTE-n)*ROW_H; const k=document.createElement("div"); const black=noteNames[n%12].includes("#"); k.className="key "+(black?"black":"white"); k.style.top=y+"px"; k.textContent=noteNames[n%12]+(Math.floor(n/12)-1); keyboard.appendChild(k); } keyboard.style.height=((MAX_NOTE-MIN_NOTE+1)*ROW_H)+"px"; } makeKeyboard(); /* ------------------------------------------------------------ MIDI parser ------------------------------------------------------------ */ function readU16(d,p){ return (d[p]<<8)|d[p+1]; } function readU32(d,p){ return ((d[p]<<24)>>>0) | (d[p+1]<<16) | (d[p+2]<<8) | d[p+3]; } function readVar(d,state){ let value=0; let b; do{ b=d[state.p++]; value=(value<<7)|(b&127); }while(b&128); return value; } function ascii(d,p,n){ return String.fromCharCode(...d.slice(p,p+n)); } function parseMIDI(buffer){ const d=new Uint8Array(buffer); if(ascii(d,0,4)!=="MThd"){ throw new Error("Not a MIDI file"); } const headerLength=readU32(d,4); const format=readU16(d,8); const tracks=readU16(d,10); const division=readU16(d,12); let ppq=division&0x7fff; if(!ppq){ ppq=480; } let pos=8+headerLength; const all=[]; let tempo=500000; const channels={}; for(let t=0;t<tracks;t++){ if(ascii(d,pos,4)!=="MTrk") break; const len=readU32(d,pos+4); const end=pos+8+len; let p=pos+8; let tick=0; let running=0; const active={}; while(p<end){ const state={p}; const delta=readVar(d,state); p=state.p; tick+=delta; let status=d[p]; if(status<0x80){ status=running; }else{ p++; running=status; } if(status===0xff){ const type=d[p++]; const st={p}; const length=readVar(d,st); p=st.p; if(type===0x51 && length===3){ tempo=(d[p]<<16)|(d[p+1]<<8)|d[p+2]; } p+=length; continue; } if(status===0xf0 || status===0xf7){ const st={p}; const length=readVar(d,st); p=st.p+length; continue; } const command=status&0xf0; const channel=status&15; if(command===0x80 || command===0x90){ const note=d[p++]; const velocity=d[p++]; const key=channel+"_"+note; if(command===0x90 && velocity>0){ active[key]={ tick, note, velocity, channel, track:t }; if(!channels[channel]){ channels[channel]=[]; } }else{ if(active[key]){ const start=active[key]; all.push({ start:start.tick, end:Math.max(tick,start.tick+1), pitch:start.note, velocity:start.velocity, channel:start.channel, track:start.track, program:channels[channel]?.program||0 }); delete active[key]; } } }else if(command===0xc0){ const program=d[p++]; channels[channel]={program}; }else if(command===0xa0 || command===0xb0 || command===0xe0){ p+=2; }else if(command===0xd0){ p++; }else{ break; } } pos=end; } let maxTick=0; for(const n of all){ maxTick=Math.max(maxTick,n.end); } const secondsPerTick=(tempo/1000000)/ppq; for(const n of all){ n.startSec=n.start*secondsPerTick; n.endSec=n.end*secondsPerTick; } midi={ ppq, tempo, notes:all, duration:maxTick*secondsPerTick }; return midi; } /* ------------------------------------------------------------ Instrument classification ------------------------------------------------------------ */ function instrumentFromProgram(program){ if(program>=0 && program<=7) return "piano"; if(program>=24 && program<=31) return "guitar"; if(program>=32 && program<=39) return "bass"; if(program>=40 && program<=51) return "strings"; if(program>=56 && program<=63) return "brass"; if(program>=80 && program<=87) return "lead"; return "piano"; } function detectInstrument(){ if(instrumentSelect.value!=="auto"){ return instrumentSelect.value; } if(!midi.notes.length){ return "piano"; } const counts={}; for(const n of midi.notes){ const i=instrumentFromProgram(n.program); counts[i]=(counts[i]||0)+1; } return Object.keys(counts) .sort((a,b)=>counts[b]-counts[a])[0]||"piano"; } /* ------------------------------------------------------------ Colors ------------------------------------------------------------ */ function instrumentColor(type){ const colors={ piano:"#4d7cff", bass:"#8b5cf6", guitar:"#e08a35", strings:"#37b77b", brass:"#d5a928", lead:"#e85d9e", drums:"#888e98" }; return colors[type]||colors.piano; } /* ------------------------------------------------------------ Rendering ------------------------------------------------------------ */ function render(){ notesEl.innerHTML=""; measureEl.innerHTML=""; if(!midi.notes.length){ emptyEl.classList.remove("hidden"); return; } emptyEl.classList.add("hidden"); const instrument=detectInstrument(); const duration=Math.max(8,midi.duration+2); const width=Math.max( 1600, duration/(midi.tempo/1000000/midi.ppq)*pixelsPerBeat ); const height=(MAX_NOTE-MIN_NOTE+1)*ROW_H; stage.style.width=width+"px"; stage.style.height=(height+28)+"px"; /* grid */ document.getElementById("grid").style.backgroundSize = "100% "+ROW_H+"px,"+ pixelsPerBeat+"px 100%"; /* beat labels */ const beats=Math.ceil( midi.duration/(midi.tempo/1000000) ); for(let b=0;b<=beats;b++){ const x=b*pixelsPerBeat; const el=document.createElement("div"); el.className="beat"; el.style.left=x+"px"; el.style.width=pixelsPerBeat+"px"; el.textContent=""+(b+1); measureEl.appendChild(el); } /* Sort so overlapping notes don't obscure everything */ const sorted=[...midi.notes].sort((a,b)=>{ if(a.pitch!==b.pitch) return b.pitch-a.pitch; return a.start-b.start; }); /* Lane packing: Notes occupying the same pitch and overlapping in time receive tiny visual offsets. This avoids the classic MIDI-editor "wall of overlapping rectangles". */ const lanes={}; for(const n of sorted){ const pitch=n.pitch; if(!lanes[pitch]){ lanes[pitch]=[]; } let lane=0; while(true){ const previous=lanes[pitch][lane]; if(!previous || previous<=n.start){ lanes[pitch][lane]=n.end; break; } lane++; } n.lane=lane; } const maxLane=2; for(const n of sorted){ const x=n.startSec/(midi.tempo/1000000)*pixelsPerBeat; const w=Math.max( 8, (n.endSec-n.startSec)/ (midi.tempo/1000000)* pixelsPerBeat ); const pitch=Math.max( MIN_NOTE, Math.min(MAX_NOTE,n.pitch) ); let y=(MAX_NOTE-pitch)*ROW_H; /* Only use a small lane offset. This keeps notes recognizable as pitches rather than creating a dense staircase. */ if(n.lane>0){ y-=Math.min(n.lane,maxLane)*4; } const el=document.createElement("div"); el.className="note instrument-"+instrument; el.style.left=x+"px"; el.style.top=y+"px"; el.style.width=w+"px"; el.style.background=instrumentColor(instrument); el.dataset.index=midi.notes.indexOf(n); const label=document.createElement("span"); label.className="label"; if(w>42){ label.textContent= noteNames[n.pitch%12]+ (Math.floor(n.pitch/12)-1); } el.appendChild(label); setupDrag(el,n,x,y); notesEl.appendChild(el); } statusEl.textContent= midi.notes.length+ " notes • "+ duration.toFixed(1)+ " sec • "+ instrument; } /* ------------------------------------------------------------ Dragging ------------------------------------------------------------ */ function setupDrag(el,n,startX,startY){ let pointerId=null; let originX=0; let originY=0; let originalStart=n.startSec; let originalPitch=n.pitch; el.addEventListener("pointerdown",e=>{ e.preventDefault(); pointerId=e.pointerId; el.setPointerCapture(pointerId); el.classList.add("dragging"); originX=e.clientX; originY=e.clientY; originalStart=n.startSec; originalPitch=n.pitch; }); el.addEventListener("pointermove",e=>{ if(pointerId===null) return; const dx=e.clientX-originX; const dy=e.clientY-originY; const secondsPerPixel= (midi.tempo/1000000)/pixelsPerBeat; const newStart=Math.max( 0, originalStart+dx*secondsPerPixel ); /* Snap to approximately 1/16 note. */ const beatSeconds=midi.tempo/1000000; const grid=beatSeconds/4; n.startSec= Math.round(newStart/grid)*grid; const pitchDelta= Math.round(-dy/ROW_H); n.pitch=Math.max( MIN_NOTE, Math.min( MAX_NOTE, originalPitch+pitchDelta ) ); render(); }); el.addEventListener("pointerup",e=>{ if(pointerId===null) return; pointerId=null; el.classList.remove("dragging"); }); el.addEventListener("pointercancel",()=>{ pointerId=null; el.classList.remove("dragging"); }); } /* ------------------------------------------------------------ MIDI file loading ------------------------------------------------------------ */ fileInput.addEventListener("change",async()=>{ const file=fileInput.files[0]; if(!file) return; try{ const buffer=await file.arrayBuffer(); parseMIDI(buffer); pausedTime=0; render(); statusEl.textContent= file.name+" • "+ midi.notes.length+" notes"; }catch(err){ console.error(err); statusEl.textContent= "Could not read MIDI file"; } }); /* ------------------------------------------------------------ Demo MIDI ------------------------------------------------------------ */ function createDemo(){ const notes=[]; const melody=[ [60,0,.45], [64,.5,.45], [67,1,.45], [72,1.5,.8], [71,2.5,.45], [67,3,.45], [64,3.5,.45], [60,4,.8], [62,5,.45], [65,5.5,.45], [69,6,.45], [74,6.5,.8], [72,7.5,.45], [69,8,.45], [65,8.5,.45], [62,9,.8] ]; for(const [pitch,start,duration] of melody){ notes.push({ start:start*480, end:(start+duration)*480, pitch, velocity:100, channel:0, track:0, program:0, startSec:start*.625, endSec:(start+duration)*.625 }); } midi={ ppq:480, tempo:625000, notes, duration:10 }; render(); } demoBtn.addEventListener("click",createDemo); /* ------------------------------------------------------------ Playback ------------------------------------------------------------ */ function getAudio(){ if(!audioCtx){ audioCtx= new (window.AudioContext|| window.webkitAudioContext)(); } return audioCtx; } function midiFreq(note){ return 440*Math.pow(2,(note-69)/12); } function stopSound(){ for(const o of activeOscillators){ try{ o.osc.stop(); }catch(e){} } activeOscillators=[]; } function playNote(note,duration){ const ctx=getAudio(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); const type=detectInstrument(); if(type==="bass"){ osc.type="sawtooth"; }else if(type==="strings"){ osc.type="triangle"; }else if(type==="lead"){ osc.type="square"; }else{ osc.type="sine"; } osc.frequency.value=midiFreq(note.pitch); gain.gain.setValueAtTime(0.0001,ctx.currentTime); gain.gain.exponentialRampToValueAtTime( Math.max(.02,note.velocity/127*.15), ctx.currentTime+.015 ); gain.gain.exponentialRampToValueAtTime( .0001, ctx.currentTime+Math.max(.05,duration) ); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+Math.max(.05,duration)+.03); activeOscillators.push({ osc }); } function startPlayback(){ if(!midi.notes.length) return; stopPlayback(); const ctx=getAudio(); if(ctx.state==="suspended"){ ctx.resume(); } playing=true; playStart= performance.now()- pausedTime*1000; cursor.style.display="block"; const played=new Set(); function frame(now){ if(!playing) return; const elapsed= (now-playStart)/1000; pausedTime=elapsed; cursor.style.left= (elapsed/(midi.tempo/1000000)* pixelsPerBeat)+"px"; timeEl.textContent= formatTime(elapsed); for(let i=0;i<midi.notes.length;i++){ const n=midi.notes[i]; if( !played.has(i) && elapsed>=n.startSec ){ playNote( n, Math.max(.05,n.endSec-n.startSec) ); played.add(i); } } if(elapsed>=midi.duration){ stopPlayback(); pausedTime=0; return; } animationFrame= requestAnimationFrame(frame); } animationFrame= requestAnimationFrame(frame); } function stopPlayback(){ playing=false; if(animationFrame){ cancelAnimationFrame(animationFrame); animationFrame=null; } stopSound(); cursor.style.display="none"; timeEl.textContent= formatTime(pausedTime); } playBtn.addEventListener("click",startPlayback); stopBtn.addEventListener("click",()=>{ stopPlayback(); pausedTime=0; timeEl.textContent="00:00.000"; }); /* ------------------------------------------------------------ Time ------------------------------------------------------------ */ function formatTime(seconds){ seconds=Math.max(0,seconds); const m=Math.floor(seconds/60); const s=Math.floor(seconds%60); const ms=Math.floor((seconds%1)*1000); return String(m).padStart(2,"0")+":"+ String(s).padStart(2,"0")+"."+ String(ms).padStart(3,"0"); } /* ------------------------------------------------------------ Zoom ------------------------------------------------------------ */ zoomInput.addEventListener("input",()=>{ pixelsPerBeat=Number(zoomInput.value); render(); }); /* ------------------------------------------------------------ Instrument override ------------------------------------------------------------ */ instrumentSelect.addEventListener("change",render); /* ------------------------------------------------------------ Keyboard shortcuts ------------------------------------------------------------ */ document.addEventListener("keydown",e=>{ if( e.target.tagName==="INPUT" || e.target.tagName==="SELECT" ){ return; } if(e.code==="Space"){ e.preventDefault(); if(playing){ stopPlayback(); }else{ startPlayback(); } } if(e.key==="Home"){ pausedTime=0; viewport.scrollLeft=0; cursor.style.left="0px"; timeEl.textContent="00:00.000"; } }); </script> </body> </html>
