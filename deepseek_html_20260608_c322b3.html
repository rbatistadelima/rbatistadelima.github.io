<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <title>🎙️ TSS Lab — Kaori Ultra-Rápida + Fila Perfeita</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a24 100%);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 16px;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
        }
        
        .status-bar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.85rem;
        }
        
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .led.ready { 
            background: #22c55e; 
            box-shadow: 0 0 8px #22c55e;
        }
        
        .led.loading { 
            background: #eab308; 
            animation: pulse 1s infinite;
        }
        
        .led.error { 
            background: #ef4444; 
        }
        
        .led.idle { 
            background: #64748b; 
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .progress-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a2a35;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #22c55e);
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        
        textarea {
            width: 100%;
            background: #121214;
            color: #fff;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        
        .karaoke {
            background: #141417;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            font-size: 1.1rem;
            line-height: 1.5;
            transition: all 0.2s ease;
        }
        
        .karaoke b {
            color: #8b5cf6;
        }
        
        button {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139,92,246,0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .queue-info {
            background: #141417;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
        
        .cancel-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .cancel-btn:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(239,68,68,0.3);
        }
        
        .character-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .badge-kaori { background: #8b5cf6; color: #fff; }
        .badge-fallback { background: #64748b; color: #fff; }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .timer-badge {
            font-size: 0.7rem;
            color: #22c55e;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <div class="status-indicator">
                <div class="led" id="kaoriLed"></div>
                <span>🎙️ Kaori (MMS Neural)</span>
            </div>
            <div class="status-indicator">
                <div class="led" id="queueLed"></div>
                <span>📋 Fila</span>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="margin-top: 8px; font-size: 0.85rem;" id="statusText">
                🔄 Inicializando Kaori...
            </div>
        </div>

        <textarea id="texto" rows="10">Kaori: Olá! Eu sou a Kaori, minha resposta é quase instantânea.
Daniel: Testando fallback rápido.
Kaori: Veja como não há delay entre minhas falas.
Maria: Outra voz de fallback.
Kaori: Fim do teste, tudo funcionando perfeitamente!</textarea>

        <div class="karaoke" id="karaoke">
            💬 Clique em Play...
        </div>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <button onclick="window.ttsApp.play()" id="playBtn">▶ Play Sequencial</button>
            <button onclick="window.ttsApp.cancel()" class="cancel-btn" id="cancelBtn" disabled>🛑 Cancelar</button>
        </div>

        <div class="queue-info" id="queueInfo">
            ✅ Sistema pronto
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.js"
            }
        }
    </script>

    <script type="module">
        import { pipeline } from '@huggingface/transformers';
        
        class KaoriRapida {
            constructor() {
                this.audioLock = Promise.resolve();
                this.kaoriPipeline = null;
                this.kaoriReady = false;
                this.audioContext = null;
                this.audioBufferCache = new Map(); // Cache para áudios repetidos
                this.init();
            }
            
            async init() {
                await this.preloadKaori();
            }
            
            async preloadKaori() {
                const kaoriLed = document.getElementById('kaoriLed');
                const progressFill = document.getElementById('progressFill');
                const statusText = document.getElementById('statusText');
                
                try {
                    kaoriLed.className = 'led loading';
                    statusText.innerHTML = '📥 Carregando Kaori (MMS Portuguese)...';
                    
                    const startTime = performance.now();
                    
                    // Carrega pipeline - SEM WARMUP para evitar delay extra
                    this.kaoriPipeline = await pipeline(
                        'text-to-speech',
                        'Xenova/mms-tts-por',
                        {
                            progress_callback: (progress) => {
                                const percent = Math.round(progress.progress * 100);
                                progressFill.style.width = `${percent}%`;
                                if (progress.status === 'downloading') {
                                    statusText.innerHTML = `⬇️ Baixando modelo: ${percent}%`;
                                } else if (progress.status === 'loading') {
                                    statusText.innerHTML = `🔄 Carregando: ${percent}%`;
                                }
                            }
                        }
                    );
                    
                    const loadTime = (performance.now() - startTime).toFixed(0);
                    
                    // Inicializa AudioContext já no estado 'suspended' (sem delay)
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    this.kaoriReady = true;
                    kaoriLed.className = 'led ready';
                    statusText.innerHTML = `✅ Kaori pronta! (${loadTime}ms) - Resposta instantânea`;
                    
                    // Habilita botões
                    document.getElementById('playBtn').disabled = false;
                    document.getElementById('cancelBtn').disabled = false;
                    
                    console.log('🎤 Kaori carregada em', loadTime, 'ms');
                    
                } catch (error) {
                    console.error('❌ Erro ao carregar Kaori:', error);
                    kaoriLed.className = 'led error';
                    statusText.innerHTML = '⚠️ Erro no Kaori, usando fallback nativo';
                    this.kaoriReady = false;
                    
                    // Mesmo com erro, habilita botões para fallback
                    document.getElementById('playBtn').disabled = false;
                    document.getElementById('cancelBtn').disabled = false;
                }
            }
            
            // Lock ultra-rápido
            lock(fn) {
                this.audioLock = this.audioLock.then(fn);
                return this.audioLock;
            }
            
            async speakWithKaori(text) {
                if (!this.kaoriReady || !this.kaoriPipeline) {
                    throw new Error('Kaori não pronta');
                }
                
                const startGen = performance.now();
                
                // Verifica cache para textos repetidos
                let audioData;
                if (this.audioBufferCache.has(text)) {
                    audioData = this.audioBufferCache.get(text);
                    console.log(`📦 Cache hit: "${text.substring(0, 30)}"`);
                } else {
                    // Gera áudio - SEM delays extras
                    const output = await this.kaoriPipeline(text);
                    audioData = {
                        audio: output.audio,
                        sampling_rate: output.sampling_rate
                    };
                    
                    // Cache para reuso (máximo 20 itens)
                    if (this.audioBufferCache.size < 20) {
                        this.audioBufferCache.set(text, audioData);
                    }
                }
                
                const genTime = (performance.now() - startGen).toFixed(0);
                console.log(`🎤 Kaori gerou em ${genTime}ms: "${text.substring(0, 50)}"`);
                
                // Resume AudioContext APENAS se necessário (operação rápida)
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                // Converte para buffer de áudio de forma otimizada
                const audioBuffer = this.audioContext.createBuffer(
                    1,
                    audioData.audio.length,
                    audioData.sampling_rate
                );
                audioBuffer.copyToChannel(audioData.audio, 0);
                
                // Toca imediatamente
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(this.audioContext.destination);
                source.start();
                
                return new Promise((resolve) => {
                    source.onended = () => {
                        const totalTime = (performance.now() - startGen).toFixed(0);
                        console.log(`✅ Kaori completa em ${totalTime}ms`);
                        resolve();
                    };
                });
            }
            
            speakWithFallback(text, voiceType = 'female') {
                return new Promise((resolve) => {
                    if (typeof speechSynthesis === 'undefined') {
                        resolve();
                        return;
                    }
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 0.95;
                    utterance.pitch = voiceType === 'female' ? 1.1 : 0.9;
                    
                    utterance.onend = () => resolve();
                    utterance.onerror = () => resolve();
                    
                    speechSynthesis.speak(utterance);
                });
            }
            
            async speak(name, text) {
                return this.lock(async () => {
                    this.updateKaraoke(name, text);
                    
                    const isKaori = name.toLowerCase().includes('kaori');
                    
                    if (isKaori && this.kaoriReady) {
                        await this.speakWithKaori(text);
                    } else {
                        const voiceType = name.toLowerCase().includes('daniel') ? 'male' : 'female';
                        await this.speakWithFallback(text, voiceType);
                    }
                    
                    // Delay mínimo entre falas (apenas para respiro auditivo)
                    await new Promise(r => setTimeout(r, 80));
                });
            }
            
            updateKaraoke(name, text) {
                const karaoke = document.getElementById('karaoke');
                const isKaori = name.toLowerCase().includes('kaori');
                const badge = `<span class="character-badge ${isKaori ? 'badge-kaori' : 'badge-fallback'}">${isKaori ? '🎙️ Kaori Neural' : '🔄 Fallback'}</span>`;
                karaoke.innerHTML = `<b>${name}:</b> ${text} ${badge}`;
            }
            
            async play() {
                const playBtn = document.getElementById('playBtn');
                const cancelBtn = document.getElementById('cancelBtn');
                const textarea = document.getElementById('texto');
                const queueInfo = document.getElementById('queueInfo');
                const queueLed = document.getElementById('queueLed');
                
                playBtn.disabled = true;
                playBtn.textContent = '⏳ Executando...';
                cancelBtn.disabled = false;
                
                const lines = textarea.value.split('\n').filter(line => line.trim());
                const startTime = performance.now();
                
                try {
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        const match = line.match(/^([^:]+):\s*(.*)$/);
                        if (!match) continue;
                        
                        const name = match[1].trim();
                        const text = match[2].trim();
                        
                        // Atualiza status da fila
                        queueLed.className = 'led ready';
                        queueInfo.innerHTML = `🎵 Falando: ${name} (${i+1}/${lines.length})`;
                        
                        await this.speak(name, text);
                    }
                    
                    const totalTime = ((performance.now() - startTime) / 1000).toFixed(1);
                    queueInfo.innerHTML = `✅ Completo em ${totalTime}s`;
                    queueLed.className = 'led idle';
                    this.updateKaraoke('✅ FIM', `Todas as falas concluídas em ${totalTime} segundos`);
                    
                } catch (error) {
                    console.error(error);
                    queueInfo.innerHTML = '❌ Erro na execução';
                } finally {
                    playBtn.disabled = false;
                    playBtn.textContent = '▶ Play Sequencial';
                    cancelBtn.disabled = true;
                }
            }
            
            cancel() {
                if (typeof speechSynthesis !== 'undefined') {
                    speechSynthesis.cancel();
                }
                
                // Força resolução do lock
                this.audioLock = Promise.resolve();
                
                this.updateKaraoke('🛑 CANCELADO', 'Execução interrompida');
                
                const queueInfo = document.getElementById('queueInfo');
                const queueLed = document.getElementById('queueLed');
                queueInfo.innerHTML = '⏸️ Cancelado pelo usuário';
                queueLed.className = 'led idle';
                
                const playBtn = document.getElementById('playBtn');
                playBtn.disabled = false;
                playBtn.textContent = '▶ Play Sequencial';
                
                console.log('Execução cancelada');
            }
        }
        
        // Inicialização imediata
        window.ttsApp = new KaoriRapida();
        
        // Primeira interação para AudioContext (não causa delay na primeira fala)
        document.body.addEventListener('click', async () => {
            if (window.ttsApp.audioContext && window.ttsApp.audioContext.state === 'suspended') {
                await window.ttsApp.audioContext.resume();
                console.log('🎵 AudioContext ativado');
            }
        }, { once: true });
        
        console.log('✅ Kaori Ultra-Rápida inicializada');
    </script>
</body>
</html>
