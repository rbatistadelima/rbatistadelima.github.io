<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Face + Hands Tracking</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{
    position:absolute;
    inset:0;
}
#status{
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
    color:white;
    background:rgba(0,0,0,.7);
    padding:10px;
    font-family:Arial;
}
</style>
</head>
<body>

<div id="status">Starting...</div>
<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const video = document.createElement("video");
video.autoplay = true;
video.playsInline = true;

let latestFace = null;
let latestHands = [];

function drawPoint(x,y,r,color){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
}

const faceMesh = new FaceMesh({
    locateFile:(file)=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
});

faceMesh.onResults(results=>{
    latestFace = results.multiFaceLandmarks || null;
});

const hands = new Hands({
    locateFile:(file)=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands:2,
    modelComplexity:0,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
});

hands.onResults(results=>{
    latestHands = results.multiHandLandmarks || [];
});

async function render(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();

    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(latestFace){

        for(const face of latestFace){

            for(const p of face){

                drawPoint(
                    p.x * canvas.width,
                    p.y * canvas.height,
                    1.5,
                    "#00ff88"
                );
            }
        }
    }

    for(const hand of latestHands){

        for(const p of hand){

            drawPoint(
                p.x * canvas.width,
                p.y * canvas.height,
                5,
                "#ff9900"
            );
        }

        for(let i=0;i<21;i++){

            const p = hand[i];

            ctx.fillStyle="white";
            ctx.font="12px Arial";
            ctx.fillText(
                i,
                p.x*canvas.width+8,
                p.y*canvas.height
            );
        }
    }

    ctx.restore();

    let text = "";

    if(latestFace && latestFace.length){

        const nose = latestFace[0][1];

        text +=
        "Face detected\n" +
        "Nose: " +
        nose.x.toFixed(3) +
        ", " +
        nose.y.toFixed(3) +
        "\n";
    }

    text += "\nHands: " + latestHands.length;

    statusEl.textContent = text;

    requestAnimationFrame(render);
}

navigator.mediaDevices.getUserMedia({
    video:{
        width:1280,
        height:720
    }
})
.then(async stream=>{

    video.srcObject = stream;

    await video.play();

    async function process(){

        await faceMesh.send({image:video});
        await hands.send({image:video});

        requestAnimationFrame(process);
    }

    process();
    render();

})
.catch(err=>{
    statusEl.textContent = err.message;
});

</script>
</body>
</html>
