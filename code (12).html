<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Debug Image Input</title>
<style>
  body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
  img { max-width:300px; display:block; margin-top:10px; border:2px solid #0f0; }
  #log { white-space:pre-wrap; }
</style>
</head>
<body>
<h2>🧪 Debug Image Paste / Drag</h2>
<p>Try:  
 - Paste an image (Ctrl+V)  
 - Drag & drop an image file here  
 - Click to upload</p>
<input type="file" id="fileInput" accept="image/*" />
<pre id="log">Waiting for image...</pre>
<img id="preview" />

<script>
const log = m => document.getElementById('log').textContent += "\n" + m;
const preview = document.getElementById('preview');
const fileInput = document.getElementById('fileInput');

fileInput.onchange = e => {
  const f = e.target.files[0];
  if (f) handleFile(f, 'upload');
};

window.addEventListener('paste', e => {
  log('PASTE event');
  const items = e.clipboardData?.items;
  if (!items) return log('No clipboardData.items found.');
  for (const it of items) {
    log(`Item: ${it.kind}, ${it.type}`);
    if (it.type.startsWith('image/')) {
      const file = it.getAsFile();
      handleFile(file, 'paste');
      return;
    }
  }
  log('No image item detected.');
});

window.addEventListener('drop', e => {
  e.preventDefault();
  log('DROP event');
  if (e.dataTransfer.files.length) {
    handleFile(e.dataTransfer.files[0], 'drop');
  } else {
    log('No file in drop.');
  }
});
window.addEventListener('dragover', e => e.preventDefault());

function handleFile(file, src) {
  if (!file) return log('handleFile: no file');
  log(`${src.toUpperCase()} got file: ${file.name}, type=${file.type}, size=${file.size} bytes`);
  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    log('Preview set.');
  };
  reader.onerror = err => log('FileReader error: ' + err);
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
