<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Connecting...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findNextPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    let strangerName = "Stranger";
    document.getElementById('identity-display').textContent = `You: ${myName}`;
    const myId = 'user_' + Math.random().toString(36).substring(2, 9);

    let ws = null;
    let pc = null;
    let dataChannel = null;
    let targetId = null;
    let isConnected = false;
    let searchTimer = null;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
        ]
    };

    // --- LocalStorage History Handling ---
    function loadChatHistory() {
        const saved = localStorage.getItem('webrtc_chat_history');
        if (saved) {
            try {
                const history = JSON.parse(saved);
                history.forEach(item => {
                    appendMessageToDOM(item.sender, item.text, item.time, item.type);
                });
            } catch(e) {
                console.error("Failed to load storage", e);
            }
        }
    }

    function saveMessageToStorage(sender, text, time, type) {
        try {
            const saved = localStorage.getItem('webrtc_chat_history');
            const history = saved ? JSON.parse(saved) : [];
            history.push({ sender, text, time, type });
            // Keep last 100 messages max
            if (history.length > 100) history.shift();
            localStorage.setItem('webrtc_chat_history', JSON.stringify(history));
        } catch(e) {
            console.error("Failed to save storage", e);
        }
    }

    function getTimeString() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initSignaling() {
        statusText.textContent = 'Connecting to signaling network...';
        ws = new WebSocket('wss://socketsbay.com/wss/v2/2/demo/');

        ws.onopen = () => {
            startSearching();
        };

        ws.onmessage = async (event) => {
            try {
                const rawData = event.data instanceof Blob ? await event.data.text() : event.data;
                const msg = JSON.parse(rawData);

                if (!msg || msg.sender === myId || isConnected) return;

                if (msg.type === 'ping' && !targetId) {
                    targetId = msg.sender;
                    if (searchTimer) clearInterval(searchTimer);

                    if (myId > targetId) {
                        statusText.textContent = 'Connecting to stranger...';
                        startCall();
                    } else {
                        statusText.textContent = 'Waiting for connection...';
                        ws.send(JSON.stringify({ type: 'ready', target: targetId, sender: myId }));
                    }
                }

                if (msg.type === 'ready' && msg.target === myId && !targetId) {
                    targetId = msg.sender;
                    if (searchTimer) clearInterval(searchTimer);
                    statusText.textContent = 'Connecting to stranger...';
                    startCall();
                }

                if (msg.target === myId) {
                    if (!pc) createPeerConnection();

                    if (msg.type === 'offer') {
                        targetId = msg.sender;
                        if (searchTimer) clearInterval(searchTimer);
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify({ type: 'answer', answer, target: targetId, sender: myId }));
                    } else if (msg.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
                    } else if (msg.type === 'candidate' && msg.candidate) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } catch (e) {}
                    }
                }
            } catch (err) {}
        };

        ws.onclose = () => {
            statusText.textContent = 'Reconnecting to network...';
            setTimeout(initSignaling, 3000);
        };
    }

    function startSearching() {
        if (isConnected) return;
        cleanupConnection();
        statusText.textContent = 'Searching for partner...';
        nextBtn.disabled = false;

        broadcastPing();
        if (searchTimer) clearInterval(searchTimer);
        searchTimer = setInterval(() => {
            if (!isConnected && !targetId) {
                broadcastPing();
            }
        }, 1500);
    }

    function broadcastPing() {
        if (ws && ws.readyState === WebSocket.OPEN && !isConnected && !targetId) {
            ws.send(JSON.stringify({ type: 'ping', sender: myId }));
        }
    }

    function createPeerConnection() {
        if (pc) return;
        pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (event) => {
            if (event.candidate && targetId) {
                ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate, target: targetId, sender: myId }));
            }
        };

        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannel();
        };
    }

    async function startCall() {
        if (searchTimer) clearInterval(searchTimer);
        createPeerConnection();
        dataChannel = pc.createDataChannel('chat');
        setupDataChannel();

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', offer, target: targetId, sender: myId }));
        } catch (err) {}
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            if (searchTimer) clearInterval(searchTimer);
            isConnected = true;
            statusText.textContent = 'Connected!';
            appendSystemMessage('Connected to a stranger.');
            toggleInputs(true);
            
            dataChannel.send(JSON.stringify({ type: 'name', name: myName }));
        };

        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'name') {
                    strangerName = data.name;
                    appendSystemMessage(`You are chatting with: ${strangerName}`);
                } else {
                    const time = getTimeString();
                    appendMessageToDOM(strangerName, event.data, time, 'received');
                    saveMessageToStorage(strangerName, event.data, time, 'received');
                }
            } catch {
                const time = getTimeString();
                appendMessageToDOM(strangerName, event.data, time, 'received');
                saveMessageToStorage(strangerName, event.data, time, 'received');
            }
        };

        dataChannel.onclose = () => {
            handleDisconnect();
        };
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(text);
            const time = getTimeString();
            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(myName, text, time, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(startSearching, 1500);
    }

    function findNextPartner() {
        cleanupConnection();
        startSearching();
    }

    function cleanupConnection() {
        isConnected = false;
        targetId = null;
        if (searchTimer) clearInterval(searchTimer);
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (pc) { pc.close(); pc = null; }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;

        if (type === 'system') {
            div.textContent = text;
        } else {
            div.innerHTML = `
                <div class="msg-header">
                    <span>${sender}</span>
                    <span class="msg-time">${time}</span>
                </div>
                <div>${text}</div>
            `;
        }
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const time = getTimeString();
        appendMessageToDOM('System', text, time, 'system');
        saveMessageToStorage('System', text, time, 'system');
    }

    window.onload = () => {
        loadChatHistory();
        initSignaling();
    };
</script>

</body>
</html>
