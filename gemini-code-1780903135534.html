<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Vocal Synth Studio</title>
    <style>
        :root {
            --primary: #39c5bb; /* Hatsune Miku Teal */
            --dark: #1f2326;
            --light: #f4f6f9;
            --accent: #e51c60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #2a2f35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border-top: 6px solid var(--primary);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: #a0aab2;
            margin-bottom: 30px;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .control-panel { grid-template-columns: 1fr; }
        }

        .panel-block {
            background: #333940;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #404852;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

        textarea, select, input[type="range"] {
            width: 100%;
            background: #1f2326;
            border: 1px solid #404852;
            color: white;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
            font-family: monospace;
            font-size: 16px;
        }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group div {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aab2;
            margin-bottom: 4px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #2eb0a7;
            box-shadow: 0 0 15px rgba(57, 197, 187, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .visualizer-box {
            height: 80px;
            background: #1f2326;
            border-radius: 8px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid #404852;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: var(--primary);
            margin: 0 2px;
            border-radius: 2px;
            transition: height 0.1s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Web-Vocaloid JS Sandbox</h1>
    <p class="subtitle">A client-side Web Audio synthesis playground replicating retro electronic singing styles.</p>

    <div class="control-panel">
        <div class="panel-block">
            <div class="slider-group">
                <label for="lyrics">Lyrics / Notes Sequence</label>
                <textarea id="lyrics">Do Re Mi Fa Sol La Si Do</textarea>
                <small style="color:#7e8b96; font-size:11px;">Space-separated words dictate note triggers.</small>
            </div>

            <div class="slider-group">
                <label for="basePitch">Base Scale / Key Start</label>
                <select id="basePitch">
                    <option value="261.63">C4 (Default)</option>
                    <option value="293.66">D4</option>
                    <option value="329.63">E4</option>
                    <option value="349.23">F4</option>
                    <option value="392.00">G4</option>
                    <option value="440.00">A4 (High Tuning)</option>
                </select>
            </div>
        </div>

        <div class="panel-block">
            <div class="slider-group">
                <div><span>Vibrato Depth</span><span id="vib-val">50%</span></div>
                <input type="range" id="vibrato" min="0" max="100" value="50">
            </div>

            <div class="slider-group">
                <div><span>Portamento (Pitch Glide)</span><span id="glide-val">40ms</span></div>
                <input type="range" id="glide" min="0" max="200" value="40">
            </div>

            <div class="slider-group">
                <div><span>Timbre Filter (Formant Simulation)</span><span id="formant-val">Nasal / Bright</span></div>
                <input type="range" id="formant" min="500" max="3000" value="1800">
            </div>
        </div>
    </div>

    <button id="playBtn">Synthesize & Play</button>

    <div class="visualizer-box" id="visualizer">
        <span style="color:#57626c;" id="vis-text">Idle - Press Play to Start Audio Context</span>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // UI Elements
    const playBtn = document.getElementById('playBtn');
    const lyricsInput = document.getElementById('lyrics');
    const basePitchSelect = document.getElementById('basePitch');
    const vibratoSlider = document.getElementById('vibrato');
    const glideSlider = document.getElementById('glide');
    const formantSlider = document.getElementById('formant');
    
    const vibVal = document.getElementById('vib-val');
    const glideVal = document.getElementById('glide-val');
    const formantVal = document.getElementById('formant-val');
    const visText = document.getElementById('vis-text');
    const visualizer = document.getElementById('visualizer');

    // Live slider updates
    vibratoSlider.addEventListener('input', (e) => vibVal.innerText = e.target.value + '%');
    glideSlider.addEventListener('input', (e) => glideVal.innerText = e.target.value + 'ms');
    formantSlider.addEventListener('input', (e) => formantVal.innerText = e.target.value + ' Hz');

    // Setup dummy visualizer elements
    for(let i=0; i<25; i++) {
        let bar = document.createElement('div');
        bar.className = 'bar';
        visualizer.appendChild(bar);
    }
    const bars = document.querySelectorAll('.bar');

    // Simple Major Scale step intervals
    const scaleIntervals = [0, 2, 4, 5, 7, 9, 11, 12];

    function midiNoteToFreq(note) {
        return 440 * Math.pow(2, (note - 69) / 12);
    }

    function baseFreqToMidi(freq) {
        return Math.round(12 * Math.log2(freq / 440) + 69);
    }

    // Interactive Core Audio Synthesizer Engine
    function playVocalSequence() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        visText.style.display = 'none';
        const words = lyricsInput.value.split(/\s+/).filter(w => w.length > 0);
        if(words.length === 0) return;

        const baseFreq = parseFloat(basePitchSelect.value);
        const baseMidi = baseFreqToMidi(baseFreq);
        
        let startTime = audioCtx.currentTime + 0.1;
        const noteDuration = 0.4; // 400ms per syllable
        const glideTime = parseFloat(glideSlider.value) / 1000;
        const vibratoAmount = parseFloat(vibratoSlider.value) / 10;
        const formantFreq = parseFloat(formantSlider.value);

        let lastFreq = baseFreq;

        words.forEach((word, index) => {
            // Determine note pitch depending on position in sequence (loops over major scale)
            const scaleStep = scaleIntervals[index % scaleIntervals.length];
            const targetFreq = midiNoteToFreq(baseMidi + scaleStep);

            // 1. Primary Synth Oscillator (Vocal cords)
            const osc = audioCtx.createOscillator();
            // Sawtooth gives that signature rich buzz needed for vocal formants
            osc.type = 'sawtooth'; 
            
            // 2. Pitch Glide Effect Node (Portamento)
            osc.frequency.setValueAtTime(lastFreq, startTime);
            osc.frequency.exponentialRampToValueAtTime(targetFreq, startTime + glideTime);
            
            // 3. Vibrato Modulation Engine (LFO)
            if(vibratoAmount > 0) {
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.value = 6.5; // Classic human/vocaloid vibrato speed (6.5 Hz)
                lfoGain.gain.value = vibratoAmount;
                
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(startTime + 0.1);
                lfo.stop(startTime + noteDuration);
            }

            // 4. Formant Bandpass Filter (Simulates mouth/nasal cavity shape)
            const formantFilter = audioCtx.createBiquadFilter();
            formantFilter.type = 'bandpass';
            formantFilter.Q.value = 4.0; // Sharpness of the vowel characteristics
            formantFilter.frequency.setValueAtTime(formantFreq, startTime);

            // 5. Output Amplitude Envelope
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, startTime);
            // Fast attack for robotic articulation
            gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.02); 
            // Smooth decay/release at end of syllable
            gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + noteDuration);

            // Routing Graph
            osc.connect(formantFilter);
            formantFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Playback timing loops
            osc.start(startTime);
            osc.stop(startTime + noteDuration);

            // Trigger visual graphic feedback synchronized to note windows
            setTimeout(() => {
                animateVisualizer();
            }, (startTime - audioCtx.currentTime) * 1000);

            // Advance timing tracking pointers
            startTime += noteDuration + 0.05; // Adds small organic breath spaces
            lastFreq = targetFreq;
        });

        // Cleanup interface animations when complete
        setTimeout(() => {
            bars.forEach(b => b.style.height = '10px');
            visText.style.display = 'block';
            visText.innerText = "Sequence Complete!";
        }, (startTime - audioCtx.currentTime) * 1000);
    }

    function animateVisualizer() {
        bars.forEach(bar => {
            const activeHeight = Math.floor(Math.random() * 55) + 15;
            bar.style.height = activeHeight + 'px';
        });
    }

    playBtn.addEventListener('click', playVocalSequence);
</script>
</body>
</html>
