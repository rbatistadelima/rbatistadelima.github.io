<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Video Subtitle Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .progress-bar-fill {
            transition: width 0.3s ease;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">Local Video Subtitle Generator</h1>
            <p class="text-slate-500">Transcribe videos automatically with timestamps and export .srt subtitles.</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div>
                <label for="videoFile" class="block text-sm font-semibold text-slate-700 mb-1.5">Select Video File</label>
                <input type="file" id="videoFile" accept="video/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors border border-slate-200 rounded-xl p-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <button id="processBtn" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                    <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="btnText">Extract & Transcribe Video</span>
                </button>
            </div>

            <div id="progressContainer" class="hidden space-y-2 pt-2">
                <div class="flex justify-between text-sm font-medium text-slate-600">
                    <span id="statusText">Initializing model...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden border border-slate-200">
                    <div id="progressBar" class="bg-blue-600 h-3 rounded-full progress-bar-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="resultsCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📝</span>
                    <div>
                        <h3 class="font-bold text-slate-800">Transcription Result</h3>
                        <p class="text-xs text-slate-500" id="detectedLangInfo">Detected Language: Analyzing...</p>
                    </div>
                </div>
                <div>
                    <button id="exportSrtBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl shadow-sm transition-colors flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        Download .srt
                    </button>
                </div>
            </div>

            <div class="p-6">
                <div id="transcriptionOutput" class="max-h-96 overflow-y-auto space-y-3 pr-2 border border-slate-100 rounded-xl p-4 bg-slate-50/50 text-slate-700 leading-relaxed">
                    <!-- Segment transcript populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        const MODEL_NAME = 'Xenova/whisper-base';

        const fileInput = document.getElementById('videoFile');
        const processBtn = document.getElementById('processBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const progressText = document.getElementById('progressText');
        const resultsCard = document.getElementById('resultsCard');
        const detectedLangInfo = document.getElementById('detectedLangInfo');
        const exportSrtBtn = document.getElementById('exportSrtBtn');
        const transcriptionOutput = document.getElementById('transcriptionOutput');

        let modelProgress = {};
        let currentChunks = [];

        function updateProgress(info) {
            progressContainer.classList.remove('hidden');
            if (info.status === 'init') {
                modelProgress[info.file] = 0;
            } else if (info.status === 'progress') {
                modelProgress[info.file] = info.progress;
                const files = Object.keys(modelProgress);
                const avgProgress = files.reduce((acc, file) => acc + modelProgress[file], 0) / files.length;
                progressBar.style.width = `${avgProgress}%`;
                progressText.innerText = `${Math.round(avgProgress)}%`;
                statusText.innerText = `Downloading model weights... (${files.length} files)`;
            } else if (info.status === 'done') {
                modelProgress[info.file] = 100;
            }
        }

        function setStatus(message, showSpinner = true) {
            statusText.innerText = message;
            if (showSpinner) {
                btnSpinner.classList.remove('hidden');
            } else {
                btnSpinner.classList.add('hidden');
            }
        }

        async function extractAudio(file) {
            setStatus('Extracting audio from video file...', true);
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            const offlineCtx = new OfflineAudioContext(1, audioBuffer.duration * 16000, 16000);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();
            
            const resampledBuffer = await offlineCtx.startRendering();
            return resampledBuffer.getChannelData(0);
        }

        function formatTimestamp(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function formatTimeSRT(seconds) {
            if (isNaN(seconds)) seconds = 0;
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
        }

        function renderTranscription(chunks) {
            transcriptionOutput.innerHTML = '';
            
            if (!chunks || chunks.length === 0) {
                transcriptionOutput.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">No speech detected.</p>';
                return;
            }

            chunks.forEach((chunk) => {
                const start = chunk.timestamp ? chunk.timestamp[0] : 0;
                const end = chunk.timestamp && chunk.timestamp[1] ? chunk.timestamp[1] : start + 1;
                const text = chunk.text ? chunk.text.trim() : '';
                
                if (!text) return;

                const item = document.createElement('div');
                item.className = 'p-3 bg-white border border-slate-200/80 rounded-xl hover:border-blue-300 transition-colors shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-2';
                item.innerHTML = `
                    <p class="text-sm text-slate-800 font-normal">${escapeHtml(text)}</p>
                    <span class="text-xs font-mono text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg self-start sm:self-auto">${formatTimestamp(start)} → ${formatTimestamp(end)}</span>
                `;
                transcriptionOutput.appendChild(item);
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        processBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];

            if (!file) {
                statusText.innerText = 'Please select a video file first.';
                progressContainer.classList.remove('hidden');
                progressBar.style.width = '100%';
                progressBar.className = 'bg-amber-500 h-3 rounded-full progress-bar-fill';
                return;
            }

            processBtn.disabled = true;
            btnText.innerText = 'Processing...';
            progressContainer.classList.remove('hidden');
            progressBar.className = 'bg-blue-600 h-3 rounded-full progress-bar-fill';
            progressBar.style.width = '0%';
            progressText.innerText = '0%';
            resultsCard.classList.add('hidden');
            modelProgress = {};

            try {
                const audioData = await extractAudio(file);

                setStatus(`Loading ${MODEL_NAME} model...`, true);
                const transcriber = await pipeline('automatic-speech-recognition', MODEL_NAME, {
                    progress_callback: updateProgress
                });

                setStatus('Transcribing audio & detecting language...', true);
                await new Promise(resolve => setTimeout(resolve, 50));

                const result = await transcriber(audioData, {
                    return_timestamps: true,
                    chunk_length_s: 30,
                    stride_length_s: 5
                });

                currentChunks = result.chunks || [];
                
                if (currentChunks.length === 0 && result.text) {
                    currentChunks = [{ text: result.text, timestamp: [0, audioData.length / 16000] }];
                }

                detectedLangInfo.innerText = `Auto-Detected Language: ${result.language || 'Detected'} | Segments: ${currentChunks.length}`;
                renderTranscription(currentChunks);
                resultsCard.classList.remove('hidden');
                
                setStatus('Transcription complete!', false);
                progressBar.style.width = '100%';
                progressText.innerText = '100%';

            } catch (error) {
                console.error(error);
                setStatus('Error during transcription.', false);
                progressBar.className = 'bg-rose-600 h-3 rounded-full progress-bar-fill';
            } finally {
                processBtn.disabled = false;
                btnText.innerText = 'Extract & Transcribe Video';
            }
        });

        exportSrtBtn.addEventListener('click', () => {
            if (!currentChunks || currentChunks.length === 0) return;
            
            let srtContent = '';
            currentChunks.forEach((chunk, index) => {
                const startTime = chunk.timestamp ? chunk.timestamp[0] : 0;
                const endTime = chunk.timestamp && chunk.timestamp[1] ? chunk.timestamp[1] : startTime + 1;
                const text = chunk.text ? chunk.text.trim() : '';
                
                if (text) {
                    srtContent += `${index + 1}\n${formatTimeSRT(startTime)} --> ${formatTimeSRT(endTime)}\n${text}\n\n`;
                }
            });

            const blob = new Blob([srtContent], { type: 'text/srt;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'subtitles.srt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
