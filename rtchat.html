<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous WebRTC Chat</title>
    <!-- ScaleDrone WebRTC Signaling SDK -->
    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f9fc;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 700px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-bar {
            padding: 14px 16px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #identity-display {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message.system {
            align-self: center;
            background-color: #e5e7eb;
            color: #4b5563;
            font-size: 12px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #4f46e5;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e4e6eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }
        .msg-header {
            font-size: 11px;
            font-weight: bold;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .msg-time {
            font-weight: normal;
            font-size: 10px;
            opacity: 0.7;
        }
        #input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            background: #ffffff;
        }
        #message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        #message-input:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 10px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #next-btn {
            background-color: #e0e7ff;
            color: #4f46e5;
            padding: 6px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="status-bar">
        <div>
            <div id="status-text">Connecting...</div>
            <div id="identity-display">You: Loading...</div>
        </div>
        <button id="next-btn" onclick="findNextPartner()" disabled>Next Stranger</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
    // Public free channel key for ScaleDrone signaling
    const CHANNEL_ID = 'yiS12C5iAgNWIWgm';

    // 1. Composite Animal Name Generator
    const adjectives = ["Cyber", "Neon", "Quantum", "Cosmic", "Solar", "Astral", "Turbo", "Pixel", "Stellar", "Hyper", "Alpha", "Shadow"];
    const animals = ["Panda", "Fox", "Koala", "Tiger", "Falcon", "Wolf", "Badger", "Otter", "Panther", "Lynx", "Eagle", "Raven"];
    
    function generateCompositeName() {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const ani = animals[Math.floor(Math.random() * animals.length)];
        const num = Math.floor(Math.random() * 900) + 100;
        return `${adj}${ani}_${num}`;
    }

    const myName = generateCompositeName();
    let strangerName = "Stranger";
    document.getElementById('identity-display').textContent = `You: ${myName}`;

    let drone = null;
    let room = null;
    let pc = null;
    let dataChannel = null;
    let isConnected = false;

    const statusText = document.getElementById('status-text');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const nextBtn = document.getElementById('next-btn');

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:global.stun.twilio.com:3478' }
        ]
    };

    // --- LocalStorage History Handling ---
    function loadChatHistory() {
        const saved = localStorage.getItem('webrtc_chat_history');
        if (saved) {
            try {
                const history = JSON.parse(saved);
                history.forEach(item => {
                    appendMessageToDOM(item.sender, item.text, item.time, item.type);
                });
            } catch(e) {}
        }
    }

    function saveMessageToStorage(sender, text, time, type) {
        try {
            const saved = localStorage.getItem('webrtc_chat_history');
            const history = saved ? JSON.parse(saved) : [];
            history.push({ sender, text, time, type });
            if (history.length > 100) history.shift();
            localStorage.setItem('webrtc_chat_history', JSON.stringify(history));
        } catch(e) {}
    }

    function getTimeString() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function initSignaling() {
        statusText.textContent = 'Connecting to signaling network...';
        
        drone = new ScaleDrone(CHANNEL_ID);

        drone.on('open', (error) => {
            if (error) return console.error(error);

            // Join lobby room
            const roomName = 'observable-lobby-room';
            room = drone.subscribe(roomName);

            room.on('open', (error) => {
                if (error) console.error(error);
                statusText.textContent = 'Searching for partner...';
                nextBtn.disabled = false;
            });

            room.on('members', (members) => {
                // If 2 members in the room, host initiates the call
                const isOfferer = members.length === 2;
                startWebRTC(isOfferer);
            });
        });
    }

    function startWebRTC(isOfferer) {
        pc = new RTCPeerConnection(rtcConfig);

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                sendMessageToSignaling({ candidate: event.candidate });
            }
        };

        if (isOfferer) {
            pc.onnegotiationneeded = async () => {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendMessageToSignaling({ sdp: pc.localDescription });
            };
            dataChannel = pc.createDataChannel('chat');
            setupDataChannel();
        } else {
            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };
        }

        // Listen for incoming signaling data from ScaleDrone
        room.on('data', async (message, member) => {
            if (member.id === drone.clientId) return;

            if (message.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
                if (pc.remoteDescription.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendMessageToSignaling({ sdp: pc.localDescription });
                }
            } else if (message.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
                } catch(e) {}
            }
        });
    }

    function sendMessageToSignaling(message) {
        drone.publish({
            room: 'observable-lobby-room',
            message: message
        });
    }

    function setupDataChannel() {
        dataChannel.onopen = () => {
            isConnected = true;
            statusText.textContent = 'Connected!';
            appendSystemMessage('Connected to a stranger.');
            toggleInputs(true);

            // Send composite animal name
            dataChannel.send(JSON.stringify({ type: 'name', name: myName }));
        };

        dataChannel.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'name') {
                    strangerName = data.name;
                    appendSystemMessage(`You are chatting with: ${strangerName}`);
                } else {
                    const time = getTimeString();
                    appendMessageToDOM(strangerName, event.data, time, 'received');
                    saveMessageToStorage(strangerName, event.data, time, 'received');
                }
            } catch {
                const time = getTimeString();
                appendMessageToDOM(strangerName, event.data, time, 'received');
                saveMessageToStorage(strangerName, event.data, time, 'received');
            }
        };

        dataChannel.onclose = () => {
            handleDisconnect();
        };
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(text);
            const time = getTimeString();
            appendMessageToDOM(myName, text, time, 'sent');
            saveMessageToStorage(myName, text, time, 'sent');
            messageInput.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function handleDisconnect() {
        if (!isConnected) return;
        isConnected = false;
        appendSystemMessage('Stranger disconnected.');
        cleanupConnection();
        statusText.textContent = 'Searching for next partner...';
        setTimeout(initSignaling, 1500);
    }

    function findNextPartner() {
        cleanupConnection();
        initSignaling();
    }

    function cleanupConnection() {
        isConnected = false;
        if (dataChannel) { try { dataChannel.close(); } catch(e){} dataChannel = null; }
        if (pc) { try { pc.close(); } catch(e){} pc = null; }
        if (drone) { try { drone.close(); } catch(e){} drone = null; }
        toggleInputs(false);
    }

    function toggleInputs(enabled) {
        messageInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
        nextBtn.disabled = false;
        if (enabled) messageInput.focus();
    }

    function appendMessageToDOM(sender, text, time, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;

        if (type === 'system') {
            div.textContent = text;
        } else {
            div.innerHTML = `
                <div class="msg-header">
                    <span>${sender}</span>
                    <span class="msg-time">${time}</span>
                </div>
                <div>${text}</div>
            `;
        }
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendSystemMessage(text) {
        const time = getTimeString();
        appendMessageToDOM('System', text, time, 'system');
        saveMessageToStorage('System', text, time, 'system');
    }

    window.onload = () => {
        loadChatHistory();
        initSignaling();
    };
</script>

</body>
</html>
