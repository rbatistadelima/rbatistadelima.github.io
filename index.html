
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project index</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 40px;
    background: #f4f4f4;
    color: #222;
    font-family: Arial, sans-serif;
}

h1 {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 30px;
    text-transform: lowercase;
}

#fileList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    padding: 0;
    margin: 0;
    list-style: none;
}

.project {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 12px #0000000d;
    display: flex;
    flex-direction: column;
}

.preview {
    height: 190px;
    background: #e8e8e8;
    overflow: hidden;
}

.preview iframe {
    width: 200%;
    height: 200%;
    border: 0;
    transform: scale(.5);
    transform-origin: top left;
    pointer-events: none;
}

.project-info {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.project h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 10px;
    text-transform: lowercase;
}

.project p {
    font-size: 13px;
    line-height: 1.6;
    color: #777;
    margin: 0 0 18px;
    flex: 1;
}

.project a {
    display: inline-block;
    align-self: flex-start;
    background: #222;
    color: white;
    padding: 9px 15px;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
}

.project a:hover { background: #555; }

.status {
    color: #888;
    font-size: 14px;
}

@media(max-width:600px) {
    body { padding: 20px; }
    #fileList { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<h1>project index</h1>

<ul id="fileList">
    <li class="status">loading projects...</li>
</ul>

<script>
const USERNAME = 'rbatistadelima';
const REPO = 'rbatistadelima.github.io';

// AI configuration
const AI_MODEL = 'openai';
const AI_ENDPOINT = 'https://text.pollinations.ai/';

function formatFileName(name) {
    return name
        .replace(/\.html$/i, '')
        .replace(/[-_]/g, ' ')
        .toLowerCase();
}

async function getHtmlFiles() {
    const api =
        `https://api.github.com/repos/${USERNAME}/${REPO}/contents/`;

    const response = await fetch(api);

    if (!response.ok) {
        throw new Error('Could not access GitHub repository');
    }

    const files = await response.json();

    return files.filter(file =>
        file.type === 'file' &&
        file.name.toLowerCase().endsWith('.html') &&
        file.name.toLowerCase() !== 'index.html'
    );
}

// Generate an AI description from actual project source code.
async function generateAIDescription(html, filename) {
    // Limit source size to avoid unnecessarily large requests.
    const source = html.slice(0, 14000);

    const prompt = `
You are analyzing a web development portfolio.

Analyze the following HTML source code and describe what
the project actually does.

Filename: ${filename}

Source code:
${source}

Instructions:
- Write in English.
- Use lowercase only.
- Write 1 to 2 concise sentences.
- Explain the actual functionality and purpose.
- Mention interesting features or interactions.
- Describe it naturally, like a portfolio project.
- Do not describe the code itself.
- Do not invent features that are not present.
- Do not mention that you are an AI.
- Return ONLY the description.
`;

    const url = AI_ENDPOINT + encodeURIComponent(prompt) +
        '?model=' + encodeURIComponent(AI_MODEL);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error('AI description request failed');
    }

    const result = await response.text();

    return result
        .replace(/<[^>]*>/g, '')
        .replace(/^["'\s]+|["'\s]+$/g, '')
        .trim()
        .toLowerCase();
}

async function getDescription(file) {
    const fallback =
        `an interactive web project: ${formatFileName(file.name)}.`;

    try {
        const response = await fetch(file.name);

        if (!response.ok) throw new Error('Could not load project');

        const html = await response.text();

        const description = await generateAIDescription(
            html,
            file.name
        );

        return description || fallback;

    } catch (error) {
        console.warn('AI description unavailable:', file.name, error);
        return fallback;
    }
}

async function createProjectCard(file) {
    const title = formatFileName(file.name);

    const li = document.createElement('li');
    li.className = 'project';

    const preview = document.createElement('div');
    preview.className = 'preview';

    const iframe = document.createElement('iframe');
    iframe.src = file.name;
    iframe.loading = 'lazy';
    iframe.title = title + ' preview';

    preview.appendChild(iframe);

    const info = document.createElement('div');
    info.className = 'project-info';

    const heading = document.createElement('h2');
    heading.textContent = title;

    const description = document.createElement('p');
    description.textContent = 'ai is analyzing this project...';

    const link = document.createElement('a');
    link.href = file.name;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'open project';

    info.append(heading, description, link);
    li.append(preview, info);

    getDescription(file).then(text => {
        description.textContent = text;
    });

    return li;
}

async function displayFileList() {
    const fileList = document.getElementById('fileList');

    try {
        const files = await getHtmlFiles();

        fileList.innerHTML = '';

        if (!files.length) {
            fileList.innerHTML =
                '<li class="status">no html files found.</li>';
            return;
        }

        const cards = await Promise.all(
            files.map(file => createProjectCard(file))
        );

        cards.forEach(card => fileList.appendChild(card));

    } catch (error) {
        console.error(error);

        fileList.innerHTML =
            '<li class="status">could not load projects.</li>';
    }
}

document.addEventListener('DOMContentLoaded', displayFileList);
</script>

</body>
</html>
