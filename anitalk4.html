<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animalese Chiptune Synthesizer</title>
    <style>
        :root {
            --bg-color: #121319;
            --panel-bg: #1c1f2b;
            --accent-green: #00ffcc;
            --accent-yellow: #ffdd57;
            --accent-pink: #ff4081;
            --accent-blue: #00bbf9;
            --text-main: #f0f4f8;
            --text-dim: #7f8c8d;
            --border-color: #2c3245;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .header {
            grid-column: span 2;
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--accent-green);
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .stage-section {
            grid-column: span 2;
            background: #090a0f;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 90px;
            background: #030406;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        canvas#avatarCanvas {
            width: 70px;
            height: 70px;
            image-rendering: pixelated;
        }

        canvas#scopeCanvas {
            flex-grow: 1;
            height: 70px;
            margin-left: 10px;
        }

        .dialogue-box {
            background: #232736;
            border: 2px solid var(--accent-yellow);
            border-radius: 6px;
            padding: 10px;
            min-height: 60px;
            font-size: 1rem;
            line-height: 1.4;
            color: #fff;
            position: relative;
            word-break: break-word;
        }

        .input-section {
            grid-column: span 2;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #0b0d13;
            border: 2px solid var(--border-color);
            color: var(--accent-green);
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            user-select: auto;
            -webkit-user-select: auto;
        }

        button.btn {
            background: var(--accent-green);
            color: #111;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .panel {
            background: #161822;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent-yellow);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-green);
        }

        select {
            background: #0b0d13;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .btn-preset {
            background: #232736;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn-preset.active {
            border-color: var(--accent-green);
            background: #112a24;
            color: var(--accent-green);
        }

        /* iOS Sound Warning & Unlock Overlay */
        #audioUnlockNotice {
            grid-column: span 2;
            background: #ff4081;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                grid-template-columns: 1fr;
            }
            .header, .stage-section, .input-section, #audioUnlockNotice {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Animalese Chiptune Synth</h1>
        <p>iOS WebKit Compatible Engine</p>
    </div>

    <div id="audioUnlockNotice">
        ⚠️ iOS NOTICE: Make sure your Silent Switch on the side of your iPhone is switched OFF!
    </div>

    <div class="stage-section">
        <div class="visualizer-container">
            <canvas id="avatarCanvas" width="70" height="70"></canvas>
            <canvas id="scopeCanvas" width="280" height="70"></canvas>
        </div>
        <div class="dialogue-box" id="dialogueBox">Tap SPEAK to start audio synth!</div>
    </div>

    <div class="input-section">
        <input type="text" id="textInput" value="Hello! Audio test for iPhone." placeholder="Type here..." maxlength="120">
        <button class="btn" id="speakBtn">SPEAK</button>
    </div>

    <div class="panel">
        <div class="panel-title">Voice Personalities</div>
        <div class="control-group">
            <label>Presets</label>
            <div class="preset-grid">
                <button class="btn-preset active" data-preset="peppy">Peppy</button>
                <button class="btn-preset" data-preset="lazy">Lazy</button>
                <button class="btn-preset" data-preset="grumpy">Grumpy</button>
                <button class="btn-preset" data-preset="smug">Smug</button>
                <button class="btn-preset" data-preset="robot">Robot</button>
                <button class="btn-preset" data-preset="alien">Alien</button>
            </div>
        </div>
        <div class="control-group">
            <label>Pitch Variance <span id="varianceVal">0.6</span></label>
            <input type="range" id="pitchVariance" min="0" max="1" step="0.05" value="0.6">
        </div>
        <div class="control-group">
            <label>Vibrato Depth <span id="vibratoVal">0.2</span></label>
            <input type="range" id="vibrato" min="0" max="1" step="0.05" value="0.2">
        </div>
        <div class="control-group">
            <label>Staccato / Cutoff <span id="staccatoVal">80%</span></label>
            <input type="range" id="staccato" min="0.2" max="1.0" step="0.05" value="0.8">
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Synth Settings</div>
        <div class="control-group">
            <label>Waveform</label>
            <select id="waveform">
                <option value="square" selected>Square (Classic 8-Bit)</option>
                <option value="sawtooth">Sawtooth (Buzzy)</option>
                <option value="triangle">Triangle (Soft NES)</option>
                <option value="sine">Sine (Pure Tone)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Base Pitch <span id="pitchVal">1.6x</span></label>
            <input type="range" id="pitch" min="0.4" max="2.5" step="0.05" value="1.6">
        </div>
        <div class="control-group">
            <label>Letter Speed <span id="speedVal">60ms</span></label>
            <input type="range" id="speed" min="30" max="200" step="5" value="60">
        </div>
        <div class="control-group">
            <label>Bitcrush Distortion <span id="crushVal">Off</span></label>
            <input type="range" id="bitcrush" min="0" max="8" step="1" value="0">
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    let mainGain = null;
    let analyser = null;

    // Direct iOS Unlocking helper executed on raw touchstart
    function unlockAudioContext() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
            
            mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0.8, audioCtx.currentTime); // High volume for iPhone speaker

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            mainGain.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        // Play silent sound buffer directly inside user event
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
    }

    // Attach unlock handlers across touch and click
    window.addEventListener('touchstart', unlockAudioContext, { once: true });
    window.addEventListener('click', unlockAudioContext, { once: true });

    // Character Pitch Map
    const charPitchMap = {};
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    for (let i = 0; i < alphabet.length; i++) {
        charPitchMap[alphabet[i]] = Math.pow(2, (i - 13) / 24);
    }

    // UI Controls
    const textInput = document.getElementById('textInput');
    const speakBtn = document.getElementById('speakBtn');
    const dialogueBox = document.getElementById('dialogueBox');
    
    const waveformInput = document.getElementById('waveform');
    const pitchInput = document.getElementById('pitch');
    const speedInput = document.getElementById('speed');
    const bitcrushInput = document.getElementById('bitcrush');
    const pitchVarianceInput = document.getElementById('pitchVariance');
    const vibratoInput = document.getElementById('vibrato');
    const staccatoInput = document.getElementById('staccato');

    const pitchVal = document.getElementById('pitchVal');
    const speedVal = document.getElementById('speedVal');
    const crushVal = document.getElementById('crushVal');
    const varianceVal = document.getElementById('varianceVal');
    const vibratoVal = document.getElementById('vibratoVal');
    const staccatoVal = document.getElementById('staccatoVal');

    pitchInput.oninput = () => pitchVal.innerText = `${pitchInput.value}x`;
    speedInput.oninput = () => speedVal.innerText = `${speedInput.value}ms`;
    bitcrushInput.oninput = () => crushVal.innerText = bitcrushInput.value == 0 ? 'Off' : `${bitcrushInput.value} Bit`;
    pitchVarianceInput.oninput = () => varianceVal.innerText = pitchVarianceInput.value;
    vibratoInput.oninput = () => vibratoVal.innerText = vibratoInput.value;
    staccatoInput.oninput = () => staccatoVal.innerText = `${Math.round(staccatoInput.value * 100)}%`;

    const presets = {
        peppy:  { wave: 'square', pitch: 1.6, speed: 60, crush: 0, variance: 0.6, vibrato: 0.2, staccato: 0.8 },
        lazy:   { wave: 'triangle', pitch: 0.7, speed: 120, crush: 0, variance: 0.2, vibrato: 0.1, staccato: 0.9 },
        grumpy: { wave: 'sawtooth', pitch: 0.5, speed: 90, crush: 3, variance: 0.1, vibrato: 0.0, staccato: 0.5 },
        smug:   { wave: 'sine', pitch: 1.1, speed: 85, crush: 0, variance: 0.4, vibrato: 0.5, staccato: 0.7 },
        robot:  { wave: 'square', pitch: 0.9, speed: 70, crush: 6, variance: 0.0, vibrato: 0.0, staccato: 0.4 },
        alien:  { wave: 'sawtooth', pitch: 2.1, speed: 40, crush: 4, variance: 0.9, vibrato: 0.8, staccato: 0.6 }
    };

    const presetButtons = document.querySelectorAll('.btn-preset');
    presetButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            presetButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const p = presets[e.target.dataset.preset];
            if (!p) return;
            
            waveformInput.value = p.wave;
            pitchInput.value = p.pitch; pitchVal.innerText = `${p.pitch}x`;
            speedInput.value = p.speed; speedVal.innerText = `${p.speed}ms`;
            bitcrushInput.value = p.crush; crushVal.innerText = p.crush == 0 ? 'Off' : `${p.crush} Bit`;
            pitchVarianceInput.value = p.variance; varianceVal.innerText = p.variance;
            vibratoInput.value = p.vibrato; vibratoVal.innerText = p.vibrato;
            staccatoInput.value = p.staccato; staccatoVal.innerText = `${Math.round(p.staccato * 100)}%`;
        });
    });

    function playSynthNote(freq, duration, type, crushBits, vibratoDepth) {
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        if (vibratoDepth > 0) {
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfo.frequency.value = 14;
            lfoGain.gain.value = freq * 0.08 * vibratoDepth;
            lfo.connect(osc.frequency);
            lfo.start(now);
            lfo.stop(now + duration);
        }

        // WebKit Fixed Envelope (Linear ramps avoid WebKit zero-exponential crashes)
        noteGain.gain.setValueAtTime(0.001, now);
        noteGain.gain.linearRampToValueAtTime(0.9, now + 0.005);
        noteGain.gain.linearRampToValueAtTime(0.001, now + duration);

        let lastNode = osc;
        if (crushBits > 0) {
            const waveShaper = audioCtx.createWaveShaper();
            const step = Math.pow(2, 8 - crushBits);
            const curve = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                let x = (i / 128) - 1;
                curve[i] = Math.round(x * step) / step;
            }
            waveShaper.curve = curve;
            osc.connect(waveShaper);
            lastNode = waveShaper;
        }

        lastNode.connect(noteGain);
        noteGain.connect(mainGain);

        osc.start(now);
        osc.stop(now + duration);
    }

    let isSpeaking = false;

    async function speakText() {
        unlockAudioContext();

        if (isSpeaking) return;

        const text = textInput.value.trim();
        if (!text) return;

        isSpeaking = true;
        dialogueBox.innerText = "";
        
        const basePitch = parseFloat(pitchInput.value) * 440;
        const charDuration = parseInt(speedInput.value) / 1000;
        const staccatoFactor = parseFloat(staccatoInput.value);
        const toneDuration = charDuration * staccatoFactor;
        const variance = parseFloat(pitchVarianceInput.value);
        const wave = waveformInput.value;
        const crush = parseInt(bitcrushInput.value);
        const vibrato = parseFloat(vibratoInput.value);

        for (let i = 0; i < text.length; i++) {
            const char = text[i].toLowerCase();
            dialogueBox.innerText += text[i];

            triggerMouthMovement();

            if (/[a-z]/.test(char)) {
                const charMult = charPitchMap[char] || 1.0;
                const randomOffset = (Math.random() - 0.5) * variance;
                const freq = basePitch * (charMult + randomOffset);

                playSynthNote(freq, toneDuration, wave, crush, vibrato);
            } else if (/[0-9]/.test(char)) {
                const freq = basePitch * (0.8 + (parseInt(char) * 0.1));
                playSynthNote(freq, toneDuration, wave, crush, vibrato);
            } else if (['?', '!', '.'].includes(char)) {
                await new Promise(r => setTimeout(r, charDuration * 1000 * 2));
            }

            await new Promise(r => setTimeout(r, charDuration * 1000));
        }

        isSpeaking = false;
    }

    speakBtn.addEventListener('click', speakText);
    speakBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        speakText();
    });

    // Avatar Drawing
    const avatarCanvas = document.getElementById('avatarCanvas');
    const aCtx = avatarCanvas.getContext('2d');
    let mouthOpen = false;

    function drawAvatar() {
        aCtx.clearRect(0, 0, 70, 70);

        aCtx.fillStyle = '#00ffcc';
        aCtx.fillRect(14, 18, 42, 42);
        
        aCtx.fillRect(10, 10, 14, 14);
        aCtx.fillRect(46, 10, 14, 14);
        aCtx.fillStyle = '#ff4081';
        aCtx.fillRect(14, 14, 6, 6);
        aCtx.fillRect(50, 14, 6, 6);

        aCtx.fillStyle = '#0b0d13';
        aCtx.fillRect(21, 28, 7, 10);
        aCtx.fillRect(42, 28, 7, 10);
        
        aCtx.fillStyle = '#ffffff';
        aCtx.fillRect(21, 28, 3, 3);
        aCtx.fillRect(42, 28, 3, 3);

        aCtx.fillStyle = '#ff4081';
        aCtx.fillRect(33, 40, 4, 4);

        aCtx.fillStyle = '#0b0d13';
        if (mouthOpen) {
            aCtx.fillRect(29, 46, 12, 8);
            aCtx.fillStyle = '#ff4081';
            aCtx.fillRect(31, 50, 8, 3);
        } else {
            aCtx.fillRect(29, 46, 12, 3);
        }
    }

    function triggerMouthMovement() {
        mouthOpen = true;
        drawAvatar();
        setTimeout(() => {
            mouthOpen = false;
            drawAvatar();
        }, parseInt(speedInput.value) * 0.7);
    }

    drawAvatar();

    // Scope Visualizer
    const scopeCanvas = document.getElementById('scopeCanvas');
    const sCtx = scopeCanvas.getContext('2d');

    function drawScope() {
        requestAnimationFrame(drawScope);

        sCtx.fillStyle = '#030406';
        sCtx.fillRect(0, 0, scopeCanvas.width, scopeCanvas.height);

        if (!analyser) return;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteTimeDomainData(dataArray);

        sCtx.lineWidth = 2;
        sCtx.strokeStyle = '#00ffcc';
        sCtx.beginPath();

        const sliceWidth = scopeCanvas.width * 1.0 / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = v * scopeCanvas.height / 2;

            if (i === 0) {
                sCtx.moveTo(x, y);
            } else {
                sCtx.lineTo(x, y);
            }

            x += sliceWidth;
        }

        sCtx.lineTo(scopeCanvas.width, scopeCanvas.height / 2);
        sCtx.stroke();
    }

    drawScope();
</script>
</body>
</html>
